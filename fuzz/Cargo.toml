[package]
name = "cargo-allow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
allow-core = { path = "../crates/allow-core" }
allow-files = { path = "../crates/allow-files" }
allow-match = { path = "../crates/allow-match" }
allow-policy = { path = "../crates/allow-policy" }
allow-rust = { path = "../crates/allow-rust" }
libfuzzer-sys = "0.4"

[[bin]]
name = "policy_roundtrip"
path = "fuzz_targets/policy_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_glob"
path = "fuzz_targets/path_glob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rust_scan"
path = "fuzz_targets/rust_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "finding_match"
path = "fuzz_targets/finding_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_classification"
path = "fuzz_targets/file_classification.rs"
test = false
doc = false
bench = false
