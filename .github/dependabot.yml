# Dependabot configuration for cargo-allow (#1898).
# Keeps Rust dependencies and GitHub Actions up to date.
# Combined with cargo-deny (#1897), this ensures advisories are caught
# and patched automatically.

version: 2

updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      # Group patch-level updates together to reduce PR noise.
      patch-updates:
        update-types:
          - "patch"

  # GitHub Actions versions (keep SHA-pinned actions current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
