# Dependabot configuration for cargo-allow (#1898).
# Keeps Rust dependencies and GitHub Actions up to date.
# Combined with cargo-deny (#1897), this ensures advisories are caught
# and patched automatically.

version: 2

updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      # Group patch-level updates together to reduce PR noise.
      patch-updates:
        update-types:
          - "patch"

  # GitHub Actions versions (keep SHA-pinned actions current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    ignore:
      # `dtolnay/rust-toolchain@<version>` selects a Rust toolchain; the tag is
      # not a dependency version to keep current. The MSRV job pins it to
      # Cargo.toml `rust-version` on purpose, so an automated bump would prove a
      # different Rust version than the workspace claims while CI stayed green.
      # Raising the MSRV is a deliberate, documented change: update
      # `rust-version`, the pin, the cache key, and the release-workflow MSRV
      # together (scripts/check-msrv-consistency.sh enforces this).
      - dependency-name: "dtolnay/rust-toolchain"
