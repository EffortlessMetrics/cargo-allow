name: Apply issue 4277 policy receipts

on:
  push:
    branches:
      - fix/4277-floor-pin-settlement

permissions:
  contents: write

concurrency:
  group: issue-4277-policy-apply
  cancel-in-progress: false

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(ci): apply issue 4277 policy receipts'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/4277-floor-pin-settlement
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: Plan and apply exact policy entries
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-4277-policy-apply.yml
          mkdir -p target/cargo-allow/4277 .allow/revisions
          cat > .allow/revisions/4277-floor-pin-settlement.toml <<'EOF'
          schema_version = 1
          # Issue #4277 owns three exact non-Rust additions: the fixed-point
          # direct-floor producer, its deterministic regression suite, and this
          # revision record. core/deps reviewed each path, reason, evidence set,
          # classification, and lifecycle date. No matcher, occurrence limit,
          # existing exception, dependency floor, or release authority is broadened.
          EOF
          git add .allow/revisions/4277-floor-pin-settlement.toml

          cargo run -p cargo-allow --locked -- why \
            --kind non-rust \
            --path scripts/floor_pin_settlement.py \
            --line 1 \
            --plan target/cargo-allow/4277/producer-plan.json
          cargo run -p cargo-allow --locked -- add \
            --from-plan target/cargo-allow/4277/producer-plan.json \
            --update \
            --id allow-4277-floor-settlement \
            --owner core/deps \
            --classification direct_floor_producer \
            --reason 'Deterministic fixed-point settlement constructs and verifies one simultaneous direct-floor Cargo.lock while preserving incompatible rows as bounded failures.' \
            --review-after 2026-12-14 \
            --evidence issue:4277 \
            --evidence doc:docs/ci/direct-floor-proof.md \
            --evidence test:scripts/test_floor_pin_settlement.py \
            --summary-format json \
            --summary-output target/cargo-allow/4277/producer-add.json

          cargo run -p cargo-allow --locked -- why \
            --kind non-rust \
            --path scripts/test_floor_pin_settlement.py \
            --line 1 \
            --plan target/cargo-allow/4277/test-plan.json
          cargo run -p cargo-allow --locked -- add \
            --from-plan target/cargo-allow/4277/test-plan.json \
            --update \
            --id allow-4277-floor-settlement-test \
            --owner core/deps \
            --classification direct_floor_fixture \
            --reason 'Deterministic fixtures exercise retry after sibling settlement, input-order invariance, incompatible-set termination, and movement of an earlier floor.' \
            --review-after 2026-12-14 \
            --evidence issue:4277 \
            --evidence doc:docs/ci/direct-floor-proof.md \
            --evidence test:scripts/test_floor_pin_settlement.py \
            --summary-format json \
            --summary-output target/cargo-allow/4277/test-add.json

          cargo run -p cargo-allow --locked -- why \
            --kind non-rust \
            --path .allow/revisions/4277-floor-pin-settlement.toml \
            --line 1 \
            --plan target/cargo-allow/4277/revision-plan.json
          cargo run -p cargo-allow --locked -- add \
            --from-plan target/cargo-allow/4277/revision-plan.json \
            --update \
            --id allow-4277-floor-settlement-revision \
            --owner core/deps \
            --classification ledger_change_note \
            --reason 'Exact transition record for the three path-bounded policy entries reviewed under issue #4277.' \
            --review-after 2026-12-14 \
            --evidence issue:4277 \
            --evidence doc:docs/how-to/manage-an-exception.md \
            --evidence test:scripts/test_floor_pin_settlement.py \
            --summary-format json \
            --summary-output target/cargo-allow/4277/revision-add.json
      - name: Bind exact policy transition fingerprints
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo run -p cargo-allow --locked -- diff \
            --base origin/main \
            --require-change-note \
            --write-change-note-template target/cargo-allow/4277/change-note-template.toml \
            --format json \
            --output target/cargo-allow/4277/diff-before-note.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'expected missing-note diff to remain non-clean before binding fingerprints' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          note = Path('.allow/revisions/4277-floor-pin-settlement.toml')
          template = Path('target/cargo-allow/4277/change-note-template.toml')
          text = template.read_text(encoding='utf-8')
          marker = '[[records]]'
          if marker not in text:
              raise SystemExit('generated change-note template contains no records')
          records = marker + text.split(marker, 1)[1]
          records = '\n'.join(
              line for line in records.splitlines()
              if not line.lstrip().startswith('# TODO')
          ).rstrip() + '\n'
          note.write_text(
              'schema_version = 1\n'
              '# Issue #4277 owns three exact non-Rust additions: the fixed-point\n'
              '# direct-floor producer, its deterministic regression suite, and this\n'
              '# revision record. core/deps reviewed each path, reason, evidence set,\n'
              '# classification, and lifecycle date. No matcher, occurrence limit,\n'
              '# existing exception, dependency floor, or release authority is broadened.\n\n'
              + records,
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Validate the repaired exact branch
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p cargo-allow --locked -- check \
            --mode no-new \
            --format markdown \
            --receipt target/cargo-allow/4277/check.receipt.json \
            --output target/cargo-allow/4277/check.md
          cargo run -p cargo-allow --locked -- diff \
            --base origin/main \
            --require-change-note \
            --format json \
            --receipt target/cargo-allow/4277/diff.receipt.json \
            --output target/cargo-allow/4277/diff.json
          python3 scripts/test_floor_pin_settlement.py
          bash scripts/test-proof-direct-floors-protocol.sh
          git diff --check
          test ! -e .github/workflows/issue-4277-policy-apply.yml
      - name: Commit exact policy receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/issue-4277-policy-apply.yml \
            policy/allow.toml \
            .allow/revisions/4277-floor-pin-settlement.toml
          git diff --cached --check
          git commit -m 'fix(policy): receipt floor settlement scripts (#4277)'
          git push origin HEAD:fix/4277-floor-pin-settlement
