name: one-shot-format-2224

on:
  push:
    branches:
      - agent/exact-rust-test-subjects-2224

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/exact-rust-test-subjects-2224
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and remove this one-shot workflow
        run: |
          cargo fmt --all
          git rm .github/workflows/one-shot-format-2224.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(rust): apply rustfmt"
          git push origin HEAD:agent/exact-rust-test-subjects-2224
