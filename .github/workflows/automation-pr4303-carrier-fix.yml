name: Refresh PR 4303 residual carrier

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-carrier-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[fix-carrier-4303]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh source-bound guard and remove this carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/automation-pr4303-residual-repair.yml')
          text = path.read_text(encoding='utf-8')
          old = '          test "$(git rev-parse HEAD^)" = "a7ca49f33c13e012ebca3bd2938218a949e8f683"\n'
          new = '          git merge-base --is-ancestor 068bd52978b36feb658a208ccf526f6d24032ffc HEAD\n'
          if text.count(old) != 1:
              raise SystemExit('expected stale parent guard exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/automation-pr4303-carrier-fix.yml
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add .github/workflows/automation-pr4303-residual-repair.yml
          git commit -m "ci(repair): rebind #3940 residual carrier [repair-4303-residual]"
          git push origin HEAD:release/3940-operation-authority-v1
