name: PR 4303 final format and focused proof

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-final-format-proof
  cancel-in-progress: false

jobs:
  proof:
    if: contains(github.event.head_commit.message, '[final-format-proof-4303]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and repair generated syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "95f12e864745204c44f6239254d5fde781ae1a72"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          authority = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          replace_once(
              authority,
              "pub fn append_release_operation_event_v1(pub fn append_release_operation_event_v1(",
              "pub fn append_release_operation_event_v1(",
          )
          replace_once(
              authority,
              "pub fn evaluate_release_operation_v1(pub fn evaluate_release_operation_v1(",
              "pub fn evaluate_release_operation_v1(",
          )
          tests = "crates/cargo-allow/tests/release_operation_authority.rs"
          replace_once(
              tests,
              "#[test]\nfn release_operation_identity_is_semantic_and_lineage_bound()#[test]\n",
              "#[test]\n",
          )
          PY

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format, prove, and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/automation-pr4303-final-format-proof.yml
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): repair and prove canonical operation authority (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
