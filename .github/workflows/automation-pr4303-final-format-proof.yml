name: PR 4303 final format and focused proof

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-final-format-proof
  cancel-in-progress: false

jobs:
  proof:
    if: contains(github.event.head_commit.message, '[final-format-proof-4303]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and apply bounded authority repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "027ec7b23992e5285d30cb70a34509546b548b87"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker missing: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker missing: {end!r}")
              p.write_text(
                  text[:start_index] + replacement + text[end_index:],
                  encoding="utf-8",
                  newline="\n",
              )

          authority = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          replace_once(
              authority,
              "pub fn append_release_operation_event_v1(pub fn append_release_operation_event_v1(",
              "pub fn append_release_operation_event_v1(",
          )
          replace_once(
              authority,
              "pub fn evaluate_release_operation_v1(pub fn evaluate_release_operation_v1(",
              "pub fn evaluate_release_operation_v1(",
          )

          tests = "crates/cargo-allow/tests/release_operation_authority.rs"
          replace_once(
              tests,
              "#[test]\nfn release_operation_identity_is_semantic_and_lineage_bound()#[test]\n",
              "#[test]\n",
          )
          replace_once(
              tests,
              "#[test]\nfn release_operation_authority_renderings_validate_against_schema()#[test]\nfn release_operation_authority_renderings_validate_against_schema()#[test]\n",
              "#[test]\n",
          )

          # The predecessor must be the same frozen release subject. A recovery
          # authorization may differ, but it cannot replace the frozen bytes,
          # denominators, topology, workflow inventory, or live-control subject.
          marker = "pub fn build_release_operation_identity_with_predecessor_v1("
          helper = '''fn predecessor_subject_matches_init(
              init: &CargoAllowReleaseOperationIdentityInitV1,
              predecessor: &CargoAllowReleaseOperationIdentityV1,
          ) -> bool {
              init.repository == predecessor.repository
                  && init.product == predecessor.product
                  && init.version == predecessor.version
                  && init.tag == predecessor.tag
                  && init.channel == predecessor.channel
                  && init.github_prerelease == predecessor.github_prerelease
                  && init.freeze_digest == predecessor.freeze_digest
                  && init.final_evidence_graph_digest == predecessor.final_evidence_graph_digest
                  && init.custody_digest == predecessor.custody_digest
                  && init.replay_digest == predecessor.replay_digest
                  && init.cargo_lock_digest == predecessor.cargo_lock_digest
                  && init.topology_digest == predecessor.topology_digest
                  && init.support_digest == predecessor.support_digest
                  && init.channel_digest == predecessor.channel_digest
                  && init.packages == predecessor.packages
                  && init.assets == predecessor.assets
                  && init.workflow_digest == predecessor.workflow_digest
                  && init.action_inventory_digest == predecessor.action_inventory_digest
                  && init.live_controls_digest == predecessor.live_controls_digest
          }

          '''
          replace_once(authority, marker, helper + marker)
          replace_once(
              authority,
              '''    validate_release_operation_identity_v1(predecessor_identity)?;
              validate_release_operation_history_v1(predecessor_identity, predecessor_events)?;
              let predecessor_digest = release_operation_identity_digest_v1(predecessor_identity)
          ''',
              '''    validate_release_operation_identity_v1(predecessor_identity)?;
              validate_release_operation_history_v1(predecessor_identity, predecessor_events)?;
              if !predecessor_subject_matches_init(&init, predecessor_identity) {
                  return Err(
                      "non-clean operation must retain the predecessor frozen subject and denominators",
                  );
              }
              let predecessor_digest = release_operation_identity_digest_v1(predecessor_identity)
          ''',
          )

          # Remove the superseded generic unknown helper; irreversible requests
          # are now the single request/response correlation authority.
          replace_between(
              authority,
              "fn init_resolves_unknown(",
              "fn exact_package_subjects(",
              "fn exact_package_subjects(",
          )

          replace_once(
              authority,
              '''            && event.payload_schema_id == init.payload_schema_id
                      && event.request_boundary == init.request_boundary
          ''',
              '''            && event.payload_schema_id == init.payload_schema_id
                      && event.payload_digest == init.payload_digest
                      && event.request_boundary == init.request_boundary
          ''',
          )
          replace_once(
              authority,
              '''            && later.payload_schema_id == event.payload_schema_id
                      && later.request_boundary == event.request_boundary
          ''',
              '''            && later.payload_schema_id == event.payload_schema_id
                      && later.payload_digest == event.payload_digest
                      && later.request_boundary == event.request_boundary
          ''',
          )

          # Complete the root public API so the canonical predecessor builder and
          # projection validators are actual production surfaces, not dead code.
          lib = "crates/allow-report/src/lib.rs"
          replace_once(
              lib,
              '''    build_release_operation_identity_v1, compile_release_operation_head_v1,
              evaluate_release_operation_v1, release_operation_event_digest_v1,
          ''',
              '''    build_release_operation_identity_v1,
              build_release_operation_identity_with_predecessor_v1,
              compile_release_operation_head_v1, evaluate_release_operation_v1,
              release_operation_event_digest_v1,
          ''',
          )
          replace_once(
              lib,
              '''    render_release_operation_identity_v1, validate_release_operation_history_v1,
              validate_release_operation_identity_v1,
          ''',
              '''    render_release_operation_identity_v1,
              validate_release_operation_evaluation_v1, validate_release_operation_head_v1,
              validate_release_operation_history_v1, validate_release_operation_identity_v1,
          ''',
          )

          # Test observations must carry the exact request payload identity.
          replace_once(
              tests,
              '''            init.payload_schema_id = request.payload_schema_id.clone();
                  init.request_boundary = request.request_boundary.clone();
          ''',
              '''            init.payload_schema_id = request.payload_schema_id.clone();
                  init.payload_digest = request.payload_digest.clone();
                  init.request_boundary = request.request_boundary.clone();
          ''',
          )

          # Add hostile predecessor-subject controls alongside the existing
          # wrong-predecessor-digest check.
          replace_once(
              tests,
              '''    let mut wrong = identity_init(CargoAllowReleaseOperationClassV1::IncidentRecovery);
              wrong.incident_predecessor_operation_digest = Some(digest(999));
          ''',
              '''    let mut changed_freeze =
                  identity_init(CargoAllowReleaseOperationClassV1::IncidentRecovery);
              changed_freeze.incident_predecessor_operation_digest = Some(predecessor_digest.clone());
              changed_freeze.freeze_digest = digest(998);
              require(
                  build_release_operation_identity_with_predecessor_v1(
                      changed_freeze,
                      &predecessor,
                      &predecessor_events,
                      EVALUATED_AT_UNIX_SECONDS,
                  )
                  .is_err(),
                  "recovery cannot replace the predecessor frozen subject",
              )?;

              let mut changed_denominator =
                  identity_init(CargoAllowReleaseOperationClassV1::IncidentRecovery);
              changed_denominator.incident_predecessor_operation_digest =
                  Some(predecessor_digest.clone());
              changed_denominator.packages[0].package_digest = digest(997);
              require(
                  build_release_operation_identity_with_predecessor_v1(
                      changed_denominator,
                      &predecessor,
                      &predecessor_events,
                      EVALUATED_AT_UNIX_SECONDS,
                  )
                  .is_err(),
                  "recovery cannot replace the predecessor package denominator",
              )?;

              let mut wrong = identity_init(CargoAllowReleaseOperationClassV1::IncidentRecovery);
              wrong.incident_predecessor_operation_digest = Some(digest(999));
          ''',
          )

          for path in (authority, tests):
              text = Path(path).read_text(encoding="utf-8")
              if ")#[test]" in text:
                  raise SystemExit(f"{path}: malformed adjacent test declaration remains")
              if "pub fn append_release_operation_event_v1(pub fn" in text:
                  raise SystemExit(f"{path}: duplicated append signature remains")
              if "pub fn evaluate_release_operation_v1(pub fn" in text:
                  raise SystemExit(f"{path}: duplicated evaluation signature remains")
          PY

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format, prove, and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/automation-pr4303-final-format-proof.yml
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): bind predecessor subject and request payload (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
