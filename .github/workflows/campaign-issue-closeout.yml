name: Campaign issue closeout guard

on:
  issues:
    types: [closed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  group: campaign-issue-closeout-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify active campaign closeout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python3 scripts/verify-campaign-issue-closeout.py
