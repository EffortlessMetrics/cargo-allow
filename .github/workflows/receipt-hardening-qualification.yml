name: Receipt hardening native scanner

# Temporary evidence branch only; excluded from PR4642.
on:
  push:
    branches: [qualify/exact-candidate-receipt-hardening]

permissions:
  contents: read

jobs:
  current-native-scanner:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 900a9dbf82d23fb27ed0776cf346ab418a85f32d
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build the exact reviewed native scanner
        run: cargo build -p cargo-allow --bin cargo-allow --locked
      - name: Record source and executable identity
        shell: pwsh
        run: |
          $subject = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $subject -ne '900a9dbf82d23fb27ed0776cf346ab418a85f32d') { throw 'Unexpected source head' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Source changed during build' }
          $out = 'target/receipt-native-scanner'
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item -LiteralPath target/debug/cargo-allow.exe -Destination $out
          $identity = [ordered]@{
            subject_head = $subject
            subject_tree = (git rev-parse 'HEAD^{tree}')
            workflow_head = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            target = 'x86_64-pc-windows-msvc'
            command = 'cargo build -p cargo-allow --bin cargo-allow --locked'
            rustc = (rustc --version)
            tool_version = (& target/debug/cargo-allow.exe --version)
            binary_sha256 = (Get-FileHash -LiteralPath target/debug/cargo-allow.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            lock_sha256 = (Get-FileHash -LiteralPath Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $identity | ConvertTo-Json | Set-Content -LiteralPath "$out/identity.json" -Encoding utf8
          git ls-tree -r HEAD -- crates Cargo.toml Cargo.lock rust-toolchain.toml | Set-Content -LiteralPath "$out/build-input-tree.txt" -Encoding utf8
          Get-Content -LiteralPath "$out/identity.json"
      - name: Retain native scanner and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: receipt-native-scanner-900a9db
          path: target/receipt-native-scanner/
          if-no-files-found: error
          retention-days: 14
