name: Apply 3915 test module gate

on:
  push:
    branches:
      - fix/3915-root-bound-cache-target
    paths:
      - .github/workflows/apply-3915-test-module-gate.yml

permissions:
  contents: write

concurrency:
  group: apply-3915-test-module-gate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/3915-root-bound-cache-target
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Move syntax gate to the test-module boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("crates/allow-rust/src/lib.rs"): (
                  "#[cfg(test)]\nmod tests;",
                  "#[cfg(all(test, feature = \"syntax\"))]\nmod tests;",
              ),
              Path("crates/allow-rust/src/tests.rs"): (
                  "#[cfg(feature = \"syntax\")]\nmod cache_root_alias;",
                  "mod cache_root_alias;",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one source shape, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rustfmt --edition 2024 --config skip_children=true \
            crates/allow-rust/src/lib.rs crates/allow-rust/src/tests.rs
      - name: Verify minimal and default test surfaces
        shell: bash
        run: |
          cargo check -p allow-rust --no-default-features --locked
          cargo test -p allow-rust --no-default-features scan_cache_store --locked -- --nocapture
          cargo check -p allow-rust --locked
          cargo test -p allow-rust cache_root_alias --locked -- --nocapture
          cargo clippy -p allow-rust --all-targets --locked -- -D warnings
          git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add crates/allow-rust/src/lib.rs crates/allow-rust/src/tests.rs
          git diff --cached --check
          git commit -m "test(cache): gate syntax suite at module boundary"
          git push origin HEAD:fix/3915-root-bound-cache-target
