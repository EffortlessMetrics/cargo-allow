# Trigger after registration.
name: One-shot rust-source-index rebuild

on:
  push:
    branches:
      - refactor/rust-source-index-product-edge-3147
    paths:
      - .github/workflows/one-shot-rust-source-index-rebuild.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/rust-source-index-product-edge-3147
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Refresh generated state and prove package
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo metadata --format-version 1 >/dev/null
          cargo check --workspace --all-targets --locked
          cargo test -p effortless-rust-source-index --locked
          git rm .github/workflows/one-shot-rust-source-index-rebuild.yml
          git add Cargo.lock .changes crates/effortless-rust-source-index
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "refactor(rust-source-index): remove cargo-allow product edge"
          git push origin HEAD:refactor/rust-source-index-product-edge-3147
