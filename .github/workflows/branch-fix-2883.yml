name: Branch Fix 2883

on:
  push:
    branches:
      - agent/2883-bounded-intent-delegation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply checked-slice repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/cargo-allow/src/intent_delegate.rs")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "        bytes.extend_from_slice(&buffer[..retained]);":
                  "        bytes.extend(buffer.iter().copied().take(retained));",
              "pub(crate) fn validate_provider_output(":
                  "fn validate_provider_output(",
              '''            writer
                          .write_all(&chunk[..write])
                          .map_err(|err| err.to_string())?;''':
                  '''            let bytes = chunk
                          .get(..write)
                          .ok_or_else(|| "write chunk exceeded provider buffer".to_string())?;
                      writer.write_all(bytes).map_err(|err| err.to_string())?;''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected repair input missing: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format workspace
        run: cargo fmt --all
      - name: Remove one-shot workflow and push repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/branch-fix-2883.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add crates/cargo-allow/src/intent_delegate.rs \
                  crates/cargo-allow/tests/intent_staged_precommit_delegate.rs \
                  crates/cargo-intent/src/cli.rs \
                  .github/workflows/branch-fix-2883.yml
          git commit -m "fix(intent): format bounded delegation repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"
