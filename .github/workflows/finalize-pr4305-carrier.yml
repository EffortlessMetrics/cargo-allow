name: Finalize PR 4305 repair carrier

on:
  push:
    branches:
      - fix/package-byte-authority

permissions:
  contents: write

concurrency:
  group: finalize-pr-4305-repair-carrier
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/package-byte-authority
          fetch-depth: 15
          persist-credentials: true

      - name: Make the bounded carrier self-retiring
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "555e5c582bfaa166c43342e3322a6b8b0168fa34" HEAD
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/repair-pr4305-git-environment.yml")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''          python3 scripts/test-package-byte-authority.py\n          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown\n''',
                  '''          python3 scripts/test-package-byte-authority.py\n          git rm .github/workflows/repair-pr4305-git-environment.yml\n          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown\n''',
              ),
              (
                  '''          mapfile -t changed < <(git diff --name-only)\n          printf '%s\\n' "${changed[@]}"\n          test "${#changed[@]}" -eq 3\n          test "${changed[0]}" = "scripts/candidate-harness-owned-dir.py"\n          test "${changed[1]}" = "scripts/exact-candidate-package-set.sh"\n          test "${changed[2]}" = "scripts/test-candidate-harness-lifecycle.py"\n''',
                  '''          mapfile -t changed < <(git diff --name-only HEAD)\n          printf '%s\\n' "${changed[@]}"\n          test "${#changed[@]}" -eq 4\n          test "${changed[0]}" = ".github/workflows/repair-pr4305-git-environment.yml"\n          test "${changed[1]}" = "scripts/candidate-harness-owned-dir.py"\n          test "${changed[2]}" = "scripts/exact-candidate-package-set.sh"\n          test "${changed[3]}" = "scripts/test-candidate-harness-lifecycle.py"\n''',
              ),
              (
                  '''          git add \\\n            scripts/candidate-harness-owned-dir.py \\\n            scripts/exact-candidate-package-set.sh \\\n            scripts/test-candidate-harness-lifecycle.py\n''',
                  '''          git add -A\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one carrier replacement, found {count}: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git rm .github/workflows/finalize-pr4305-carrier.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/finalize-pr4305-carrier.yml"
          test "${changed[1]}" = ".github/workflows/repair-pr4305-git-environment.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "ci: make PR 4305 repair carrier self-retiring"
          git push origin HEAD:fix/package-byte-authority
