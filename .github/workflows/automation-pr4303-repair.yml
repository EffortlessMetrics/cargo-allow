name: PR 4303 fail-closed repair

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-fail-closed-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply bounded PR-A repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              p.write_text(
                  text[:start_index] + replacement + text[end_index:],
                  encoding="utf-8",
                  newline="\n",
              )

          authority = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"

          replace_once(
              authority,
              '''fn digest_shape(value: &str) -> bool {
              value
                  .strip_prefix("sha256:")
                  .is_some_and(|hex| hex.len() == 64 && hex.bytes().all(|byte| byte.is_ascii_hexdigit()))
          }

          fn git_sha_shape(value: &str) -> bool {
              (value.len() == 40 || value.len() == 64) && value.bytes().all(|byte| byte.is_ascii_hexdigit())
          }

          fn contains_secret_marker(value: &str) -> bool {
              SECRET_MARKERS.iter().any(|marker| value.contains(marker))
          }
          ''',
              '''fn lowercase_hex_shape(value: &str, expected_len: usize) -> bool {
              value.len() == expected_len
                  && value
                      .bytes()
                      .all(|byte| byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte))
          }

          fn digest_shape(value: &str) -> bool {
              value
                  .strip_prefix("sha256:")
                  .is_some_and(|hex| lowercase_hex_shape(hex, 64))
          }

          fn git_sha_shape(value: &str) -> bool {
              (value.len() == 40 || value.len() == 64)
                  && lowercase_hex_shape(value, value.len())
          }

          fn contains_secret_marker(value: &str) -> bool {
              let value = value.to_ascii_lowercase();
              SECRET_MARKERS
                  .iter()
                  .any(|marker| value.contains(&marker.to_ascii_lowercase()))
          }

          fn bounded_retained_text(value: &str) -> bool {
              !value.trim().is_empty()
                  && value.len() <= 256
                  && !value.contains(['\\n', '\\r', '\\0'])
                  && !contains_secret_marker(value)
                  && !value.starts_with("/home/")
                  && !value.starts_with("/Users/")
                  && !value.starts_with("file://")
                  && !value.contains("\\\\")
                  && !value
                      .as_bytes()
                      .get(1)
                      .is_some_and(|separator| *separator == b':')
          }
          ''',
          )

          replace_once(
              authority,
              '''fn validate_package_rows(
              rows: &[CargoAllowReleaseOperationPackageRowV1],
          ) -> Result<(), &'static str> {
              if rows.len() != 10 {
                  return Err("release operation identity requires exactly ten final package rows");
              }
              let expected = RELEASE_AUTHORIZATION_SELECTION
                  .iter()
                  .filter(|(_, _, _, shared)| !*shared);
              for (row, (logical_id, package_name, version, _)) in rows.iter().zip(expected) {
          ''',
              '''fn validate_package_rows(
              rows: &[CargoAllowReleaseOperationPackageRowV1],
          ) -> Result<(), &'static str> {
              let expected = RELEASE_AUTHORIZATION_SELECTION
                  .iter()
                  .filter(|(_, _, _, shared)| !*shared)
                  .collect::<Vec<_>>();
              if rows.len() != expected.len() {
                  return Err(
                      "release operation identity requires exactly the selected final package rows",
                  );
              }
              for (row, (logical_id, package_name, version, _)) in rows.iter().zip(expected) {
          ''',
          )

          replace_once(
              authority,
              '''    if init.nonce.trim().is_empty() || contains_secret_marker(&init.nonce) {
                  return Err("operation identity requires a bounded non-secret nonce");
              }
          ''',
              '''    if !bounded_retained_text(&init.nonce) {
                  return Err("operation identity requires a bounded non-secret nonce");
              }
          ''',
          )

          replace_once(
              authority,
              '''        || identity.nonce.trim().is_empty()
                  || contains_secret_marker(&identity.nonce)
          ''',
              '''        || !bounded_retained_text(&identity.nonce)
          ''',
          )

          replace_once(
              authority,
              '''    for value in [
                  producer.tool.as_str(),
                  producer.schema.as_str(),
                  producer.repository.as_str(),
                  producer.workflow.as_str(),
                  producer.workflow_ref.as_str(),
                  producer.run.as_str(),
                  producer.job.as_str(),
              ] {
                  if value.trim().is_empty() || contains_secret_marker(value) {
                      return Err("operation event producer identity is malformed");
                  }
              }
          ''',
              '''    for value in [
                  producer.tool.as_str(),
                  producer.schema.as_str(),
                  producer.repository.as_str(),
                  producer.workflow.as_str(),
                  producer.workflow_ref.as_str(),
                  producer.run.as_str(),
                  producer.job.as_str(),
              ] {
                  if !bounded_retained_text(value) {
                      return Err("operation event producer identity is malformed");
                  }
              }
          ''',
          )

          replace_once(
              authority,
              '''    if event.payload_schema_id.trim().is_empty()
                  || !digest_shape(&event.payload_digest)
                  || event.actor.trim().is_empty()
                  || contains_secret_marker(&event.actor)
                  || event.request_boundary.trim().is_empty()
                  || contains_secret_marker(&event.request_boundary)
                  || event.observed_at_unix_seconds == 0
          ''',
              '''    if !bounded_retained_text(&event.payload_schema_id)
                  || !digest_shape(&event.payload_digest)
                  || !bounded_retained_text(&event.actor)
                  || !bounded_retained_text(&event.request_boundary)
                  || event.observed_at_unix_seconds == 0
                  || event.observed_at_unix_seconds > identity.expires_at_unix_seconds
          ''',
          )

          replace_once(
              authority,
              '''fn has_event(
              events: &[CargoAllowReleaseOperationEventV1],
              class: CargoAllowReleaseOperationEventClassV1,
          ) -> bool {
              events.iter().any(|event| event.event_class == class)
          }
          ''',
              '''fn has_event(
              events: &[CargoAllowReleaseOperationEventV1],
              class: CargoAllowReleaseOperationEventClassV1,
          ) -> bool {
              events.iter().any(|event| event.event_class == class)
          }

          fn event_is_exact_authority(event: &CargoAllowReleaseOperationEventV1) -> bool {
              event.semantic_result == CargoAllowReleaseOperationSemanticResultV1::Exact
                  && event.response_posture
                      != CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
          }

          fn has_exact_event(
              events: &[CargoAllowReleaseOperationEventV1],
              class: CargoAllowReleaseOperationEventClassV1,
          ) -> bool {
              events
                  .iter()
                  .any(|event| event.event_class == class && event_is_exact_authority(event))
          }

          fn same_request_identity(
              origin: &CargoAllowReleaseOperationEventV1,
              later: &CargoAllowReleaseOperationEventV1,
          ) -> bool {
              origin.subject == later.subject
                  && origin.payload_schema_id == later.payload_schema_id
                  && origin.payload_digest == later.payload_digest
                  && origin.request_boundary == later.request_boundary
                  && origin.artifact_digest == later.artifact_digest
          }

          fn init_resolves_unknown(
              origin: &CargoAllowReleaseOperationEventV1,
              init: &CargoAllowReleaseOperationEventInitV1,
          ) -> bool {
              let expected_class = match origin.event_class {
                  CargoAllowReleaseOperationEventClassV1::TagIntentDurable => {
                      CargoAllowReleaseOperationEventClassV1::TagObservedExact
                  }
                  CargoAllowReleaseOperationEventClassV1::PackageRowIntentDurable => {
                      CargoAllowReleaseOperationEventClassV1::PackageRowObservedExact
                  }
                  _ => return false,
              };
              init.event_class == expected_class
                  && init.semantic_result == CargoAllowReleaseOperationSemanticResultV1::Exact
                  && init.response_posture
                      != CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
                  && origin.subject == init.subject
                  && origin.payload_schema_id == init.payload_schema_id
                  && origin.payload_digest == init.payload_digest
                  && origin.request_boundary == init.request_boundary
                  && origin.artifact_digest == init.artifact_digest
          }

          fn validate_event_continuity(
              identity: &CargoAllowReleaseOperationIdentityV1,
              events: &[CargoAllowReleaseOperationEventV1],
              event: &CargoAllowReleaseOperationEventV1,
          ) -> Result<(), &'static str> {
              let Some(first) = events.first() else {
                  return Ok(());
              };
              let previous = events
                  .last()
                  .ok_or("operation event continuity lost its previous event")?;
              if event.observed_at_unix_seconds < previous.observed_at_unix_seconds {
                  return Err("operation event observation time moved backwards");
              }
              if identity.one_run_scope
                  && (event.producer.repository != first.producer.repository
                      || event.producer.workflow != first.producer.workflow
                      || event.producer.workflow_ref != first.producer.workflow_ref
                      || event.producer.run != first.producer.run
                      || event.producer.attempt != first.producer.attempt
                      || event.producer.commit != first.producer.commit)
              {
                  return Err("one-run release operation changed producer run identity");
              }
              Ok(())
          }

          fn singleton_event_class(class: CargoAllowReleaseOperationEventClassV1) -> bool {
              use CargoAllowReleaseOperationEventClassV1 as Event;
              matches!(
                  class,
                  Event::OperationSelected
                      | Event::AuthorizationSelected
                      | Event::LeaseAcquired
                      | Event::TagIntentDurable
                      | Event::TagObservedExact
                      | Event::GitHubDraftObservedExact
                      | Event::PublicReleaseObservedExact
                      | Event::RepositoryReconciled
                      | Event::IncidentRecorded
                      | Event::RecoverySelected
                      | Event::OperationSettled
              )
          }
          ''',
          )

          transition = r'''fn validate_event_transition(
              identity: &CargoAllowReleaseOperationIdentityV1,
              events: &[CargoAllowReleaseOperationEventV1],
              init: &CargoAllowReleaseOperationEventInitV1,
          ) -> Result<(), &'static str> {
              use CargoAllowReleaseOperationEventClassV1 as Event;
              use CargoAllowReleaseOperationSemanticResultV1 as ResultClass;

              if events
                  .last()
                  .is_some_and(|event| event.event_class == Event::OperationSettled)
              {
                  return Err("operation history is terminal after OperationSettled");
              }
              if singleton_event_class(init.event_class)
                  && events
                      .iter()
                      .any(|event| event.event_class == init.event_class)
              {
                  return Err("singleton release-operation event cannot be appended twice");
              }
              if events.iter().any(|event| {
                  matches!(
                      event.semantic_result,
                      ResultClass::Partial
                          | ResultClass::Conflict
                          | ResultClass::Stale
                          | ResultClass::ProviderUnavailable
                          | ResultClass::InstrumentFailure
                  )
              }) {
                  return Err("non-clean operation result blocks later transitions");
              }
              let unresolved = events
                  .iter()
                  .enumerate()
                  .filter(|(index, event)| {
                      (event.semantic_result == ResultClass::Unknown
                          || event.response_posture
                              == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown)
                          && !response_unknown_is_resolved(events, *index)
                  })
                  .map(|(_, event)| event)
                  .collect::<Vec<_>>();
              if !unresolved.is_empty()
                  && !unresolved
                      .iter()
                      .any(|origin| init_resolves_unknown(origin, init))
              {
                  return Err("unresolved response-unknown blocks unrelated progression");
              }
              if identity.operation_class == CargoAllowReleaseOperationClassV1::CleanFinalPublication
                  && has_event(events, Event::IncidentRecorded)
              {
