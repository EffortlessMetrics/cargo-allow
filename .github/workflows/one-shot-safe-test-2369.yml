name: one-shot-safe-test-2369

on:
  push:
    branches:
      - agent/fix-requirement-implementation-status-2303

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/fix-requirement-implementation-status-2303
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Replace test indexing with checked access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/allow-policy/src/spec_system/runtime_promotion.rs')
          text = path.read_text()
          old = '        slice.requirement_delta[0].runtime = false;'
          new = '''        slice\n            .requirement_delta\n            .first_mut()\n            .ok_or_else(|| "expected one requirement delta".to_string())?\n            .runtime = false;'''
          if old not in text:
              raise SystemExit('indexed requirement delta mutation not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/one-shot-safe-test-2369.yml
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(spec-system): avoid indexed fixture mutation"
          git push origin HEAD:agent/fix-requirement-implementation-status-2303
