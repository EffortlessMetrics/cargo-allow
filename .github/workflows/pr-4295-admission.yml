name: PR 4295 bounded admission and protocol proof
on:
  push:
    branches: [automation/4295-governed-admission-v1]
permissions:
  contents: read
concurrency:
  group: pr-4295-bounded-admission-v1
  cancel-in-progress: false
env:
  SUBJECT_HEAD: acc1fec31fec1648baa263bff762bb502618fe48
  MAIN_HEAD: 8407b903180a2cafb94708f98efcffef6c7ca1e1
  GENERATED_HEAD: 183962681d81a488089f3e5f58a3dc6115f95027
  PYTHONDONTWRITEBYTECODE: '1'
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: read
    outputs:
      candidate: ${{ steps.retain.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: acc1fec31fec1648baa263bff762bb502618fe48
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve original ledger bytes and exact generated admissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, tomllib
          from pathlib import Path
          def git(*args):
              return subprocess.run(['git',*args],check=True,capture_output=True,timeout=60).stdout
          source=os.environ['SUBJECT_HEAD']
          generated=os.environ['GENERATED_HEAD']
          assert git('rev-parse','HEAD').decode().strip()==source
          assert git('rev-list','--parents','-n','1',generated).decode().split()==[generated,source]
          git('merge-base','--is-ancestor',os.environ['MAIN_HEAD'],'HEAD')
          assert not git('status','--porcelain=v1','--untracked-files=all')
          out=Path('target/pr-4295-admission');out.mkdir(parents=True,exist_ok=True)
          policy=Path('policy/allow.toml')
          note=Path('.allow/revisions/4283-workspace-contract-admission.toml')
          assert not note.exists()
          original=git('show',source+':'+policy.as_posix())
          assert policy.read_bytes()==original
          rendered=git('show',generated+':'+policy.as_posix())
          before=tomllib.loads(original.decode())
          after=tomllib.loads(rendered.decode())
          ids=['allow-4283-workspace-preflight','allow-4283-workspace-preflight-tests','allow-4283-workspace-admission-note']
          assert not set(ids).intersection(row['id'] for row in before['allow'])
          assert [r for r in after['allow'] if r['id'] not in ids]==before['allow']
          assert len(after['allow'])==len(before['allow'])+3
          assert {k:v for k,v in before.items() if k!='allow'}=={k:v for k,v in after.items() if k!='allow'}
          blocks=re.split(rb'(?m)(?=^\[\[allow\]\]\r?$)',rendered)
          selected=[]
          for block in blocks[1:]:
              rows=tomllib.loads(block.decode())['allow']
              assert len(rows)==1
              if rows[0]['id'] in ids:
                  selected.append((rows[0]['id'],block.rstrip(b'\r\n')))
          assert [i for i,_ in selected]==ids
          suffix=b'\n\n'.join(b for _,b in selected)+b'\n'
          preserved=original+(b'\n' if original.endswith(b'\n') else b'\n\n')+suffix
          assert preserved[:len(original)]==original
          assert tomllib.loads(preserved.decode())==after
          note_raw=git('show',generated+':'+note.as_posix())
          records=tomllib.loads(note_raw.decode())['records']
          assert [r['allow_ids'] for r in records]==[[i] for i in ids]
          assert all(r['change_kinds']==['added_allow'] and re.fullmatch(r'sha256:v1:[0-9a-f]{64}',r['after_fingerprint']) for r in records)
          policy.write_bytes(preserved)
          note.write_bytes(note_raw)
          git('add','--',policy.as_posix(),note.as_posix())
          assert set(git('diff','--cached','--name-only').decode().splitlines())=={policy.as_posix(),note.as_posix()}
          git('diff','--cached','--check')
          git('-c','user.name=EffortlessSteven','-c','user.email=15812269+EffortlessSteven@users.noreply.github.com','-c','commit.gpgSign=false','commit','-m','chore(policy): append exact floor preflight admissions without ledger churn (#4283)')
          head=git('rev-parse','HEAD').decode().strip()
          assert git('rev-list','--parents','-n','1','HEAD').decode().split()==[head,source]
          assert not git('status','--porcelain=v1','--untracked-files=all')
          (out/'admission.patch').write_bytes(git('diff','--binary',source,'HEAD'))
          result={'source':source,'head':head,'tree':git('rev-parse','HEAD^{tree}').decode().strip(),'generated_admission_source':generated,'original_policy_sha256':hashlib.sha256(original).hexdigest(),'original_policy_bytes_preserved':len(original),'original_entries_preserved':len(before['allow']),'added_entries':3,'records':records,'claim_boundary':'Byte-preserving admission only; not floor proof, merge approval, or release authority.'}
          (out/'candidate.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Install and observe exact MSRV
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustc -vV | tee target/pr-4295-admission/rustc.txt
          cargo -vV | tee target/pr-4295-admission/cargo.txt
      - name: Qualify bounded candidate without suppressions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-proof-direct-floors-protocol.sh 2>&1 | tee target/pr-4295-admission/protocol.log
          cargo build -p cargo-allow --locked 2>&1 | tee target/pr-4295-admission/build.log
          target/debug/cargo-allow check --mode no-new --format markdown --receipt target/pr-4295-admission/check.receipt.json --output target/pr-4295-admission/check.md
          target/debug/cargo-allow diff --base "$MAIN_HEAD" --head HEAD --require-change-note --format json --receipt target/pr-4295-admission/diff.receipt.json --output target/pr-4295-admission/diff.json
          cargo test -p cargo-allow minimum_direct_version --locked 2>&1 | tee target/pr-4295-admission/minimum-direct-version.log
          git diff --check "$SUBJECT_HEAD" HEAD
          test -z "$(git status --porcelain)"
      - name: Retain qualified candidate on isolated output branch
        id: retain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/EffortlessMetrics/cargo-allow/pulls/4295 > target/pr-4295-admission/live-pr.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          pr=json.loads(Path('target/pr-4295-admission/live-pr.json').read_bytes())
          assert pr['state']=='open' and pr['draft'] is True
          assert pr['head']['sha']==os.environ['SUBJECT_HEAD']
          assert pr['head']['ref']=='fix/4283-floor-workspace-contracts'
          assert pr['head']['repo']['full_name']=='EffortlessMetrics/cargo-allow'
          assert pr['base']['sha']==os.environ['MAIN_HEAD'] and pr['base']['ref']=='main'
          PY
          output_branch="automation/4295-admission-output-${GITHUB_RUN_ID}"
          test -z "$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote origin "refs/heads/$output_branch")"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$output_branch"
          printf '%s\n' "$output_branch" > target/pr-4295-admission/output-branch.txt
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload admission diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-4295-byte-preserving-admission
          path: target/pr-4295-admission/
          if-no-files-found: error
  native-floor:
    needs: admit
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CANDIDATE_HEAD: ${{ needs.admit.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.admit.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact clean native subject and MSRV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test -z "$(git status --porcelain)"
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          mkdir -p target/pr-4295-native
          rustc -vV | tee target/pr-4295-native/rustc.txt
          cargo -vV | tee target/pr-4295-native/cargo.txt
          git --version
          python3 --version
          git rev-parse HEAD HEAD^{tree} | tee target/pr-4295-native/subject.txt
      - name: Native protocol and real Git controls
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-proof-direct-floors-protocol.sh 2>&1 | tee target/pr-4295-native/protocol.log
      - name: Actual native Windows cargo-allow floor check test and package
        shell: bash
        run: |
          set -euo pipefail
          CI_PROOF_MSRV=1.95 CI_PROOF_PRODUCT=cargo-allow CI_PROOF_CLASSES=check,test,package CI_PROOF_OUT=target/pr-4295-native/cargo-allow-proof.json bash scripts/proof-direct-floors.sh 2>&1 | tee target/pr-4295-native/floor.log
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test -z "$(git status --porcelain)"
      - name: Upload exact native qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-4295-exact-native-floor
          path: target/pr-4295-native/
          if-no-files-found: error
