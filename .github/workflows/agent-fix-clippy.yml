name: Agent fix clippy

on:
  push:
    branches:
      - agent/harden-git-revision-boundary

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: satisfy clippy for git revision helpers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact corrections and commit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/allow-diff/src/revision_git.rs')
          text = path.read_text()
          replacements = {
              'if entry.path != PathBuf::from(path) {': 'if entry.path.as_path() != Path::new(path) {',
              '\npub(crate) fn parse_git_ls_tree_file_entries_z(stdout: &[u8]) -> Vec<GitTreeFile> {': '\n#[cfg(test)]\npub(crate) fn parse_git_ls_tree_file_entries_z(stdout: &[u8]) -> Vec<GitTreeFile> {',
              '\nfn parse_git_ls_tree_record(record: &[u8]) -> Option<GitTreeFile> {': '\n#[cfg(test)]\nfn parse_git_ls_tree_record(record: &[u8]) -> Option<GitTreeFile> {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/allow-diff/src/revision_git.rs
          git commit -m "fix: satisfy clippy for git revision helpers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
