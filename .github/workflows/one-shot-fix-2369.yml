name: one-shot-fix-2369

on:
  push:
    branches:
      - agent/fix-requirement-implementation-status-2303

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/fix-requirement-implementation-status-2303
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact fixture correction and clean temporary evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/allow-policy/src/spec_system/runtime_promotion.rs')
          text = path.read_text()
          old = 'schema_version = "2.0"'
          position = text.find(old)
          if position < 0:
              raise SystemExit('runtime-promotion SPEC schema marker not found')
          text = text[:position] + 'schema_version = "1.0"' + text[position + len(old):]
          path.write_text(text)
          PY
          rm -f .tmp/verification/2369-test.log .tmp/verification/2369-status
          rmdir .tmp/verification 2>/dev/null || true
          rmdir .tmp 2>/dev/null || true
          git rm .github/workflows/one-shot-fix-2369.yml
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(spec-system): align runtime-promotion requirement fixture"
          git push origin HEAD:agent/fix-requirement-implementation-status-2303
