name: One-shot 4023 relative lifecycle fixtures v2

on:
  push:
    branches:
      - fix/4023-relative-fixture-dates

permissions:
  contents: write

concurrency:
  group: one-shot-4023-implementation-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/4023-relative-fixture-dates

      - name: Extract and repair the assertion-guarded implementation
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys
          import textwrap
          from pathlib import Path

          source_path = Path('.github/workflows/one-shot-4023-implement.yml')
          source = source_path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          rm .github/workflows/one-shot-4023-inventory.yml"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('implementation heredoc start missing')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('implementation heredoc end missing')
          script = textwrap.dedent(source[start:end])

          function_name = 'fn dated_resolves_every_live_fixture_token_relative_to_today() {{'
          function_at = script.find(function_name)
          if function_at < 0:
              raise SystemExit('generated fixture self-test missing')
          block_start = script.rfind('#[test]\n', 0, function_at)
          block_end = script.find("'''", function_at)
          if block_start < 0 or block_end < 0:
              raise SystemExit('generated fixture self-test boundaries missing')
          replacement = '\n'.join([
              '          #[test]',
              '          fn dated_resolves_every_live_fixture_token_relative_to_today() {{',
              '              let rendered = dated(',
              '                  r#"created = "{CREATED_TOKEN}"',
              '          review_after = "{REVIEW_TOKEN}"',
              '          expires = "{EXPIRES_TOKEN}"',
              '          "#,',
              '              );',
              '              assert!(rendered.contains(&format!(r#"created = "{{}}""#, fixture_created())));',
              '              assert!(rendered.contains(&format!(',
              '                  r#"review_after = "{{}}""#,',
              '                  fixture_review_after()',
              '              )));',
              '              assert!(rendered.contains(&format!(r#"expires = "{{}}""#, fixture_expires())));',
              '              assert!(!rendered.contains("__CARGO_ALLOW_FIXTURE_"));',
              '          }}',
              '',
          ])
          script = script[:block_start] + replacement + script[block_end:]
          horizon_type = 'const HORIZON_DAYS: i32 = 120;'
          if script.count(horizon_type) != 1:
              raise SystemExit('lifecycle guard horizon declaration changed')
          script = script.replace(
              horizon_type,
              'const HORIZON_DAYS: i64 = 120;',
              1,
          )
          compile(script, '<one-shot-4023-implementation>', 'exec')
          script_path = Path('/tmp/one-shot-4023-implementation.py')
          script_path.write_text(script, encoding='utf-8')
          subprocess.run([sys.executable, str(script_path)], check=True)
          PY

      - name: Format and run focused lifecycle fixtures
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p cargo-allow --test lifecycle_fixture_date_guard
          cargo test --locked -p cargo-allow --test saved_artifact_outputs
          cargo test --locked -p cargo-allow --test lifecycle_corpus
          cargo test --locked -p cargo-allow --test audit_output
          cargo test --locked -p cargo-allow --test summary_output
          cargo test --locked -p cargo-allow --test add_glob_ratchet
          cargo test --locked -p cargo-allow --test concurrent_mutation

      - name: Run workspace review gates
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast

      - name: Commit and push only the verified code change
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            crates/cargo-allow/tests/add_glob_ratchet.rs \
            crates/cargo-allow/tests/audit_output.rs \
            crates/cargo-allow/tests/concurrent_mutation.rs \
            crates/cargo-allow/tests/lifecycle_corpus.rs \
            crates/cargo-allow/tests/lifecycle_fixture_date_guard.rs \
            crates/cargo-allow/tests/saved_artifact_outputs.rs \
            crates/cargo-allow/tests/saved_artifact_outputs/diff.rs \
            crates/cargo-allow/tests/saved_artifact_outputs/fixture.rs \
            crates/cargo-allow/tests/saved_artifact_outputs/migrate.rs \
            crates/cargo-allow/tests/summary_output.rs
          git diff --cached --check
          git commit -m "test: make live lifecycle fixtures today-relative"
          git push origin HEAD:fix/4023-relative-fixture-dates
