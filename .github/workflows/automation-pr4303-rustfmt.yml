name: Format exact PR 4303 head

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-rustfmt
  cancel-in-progress: false

jobs:
  format:
    if: contains(github.event.head_commit.message, '[fmt-4303]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "810453cacf785d439be352d0134b8213c42aa4f5"
          test "$(git hash-object crates/allow-report/src/artifacts/release_operation_authority_v1.rs)" = "b1e978f52e5f4c9d587ed882957f14b359b21cd2"
          test "$(git hash-object crates/cargo-allow/tests/release_operation_authority.rs)" = "5526c88380e1bb43f83a336e0b6dd1927cdb2bca"

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply and verify repository formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Commit formatting and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/automation-pr4303-rustfmt.yml
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git commit -m "style(release): format canonical operation authority (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
