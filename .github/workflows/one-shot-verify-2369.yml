name: one-shot-verify-2369

on:
  push:
    branches:
      - agent/fix-requirement-implementation-status-2303

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/fix-requirement-implementation-status-2303
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Run full workspace tests and capture output
        id: verify
        shell: bash
        run: |
          mkdir -p target/one-shot-verify
          set +e
          cargo test --workspace --no-fail-fast --locked > target/one-shot-verify/test.log 2>&1
          status=$?
          echo "$status" > target/one-shot-verify/status
          exit 0
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: one-shot-verify-2369
          path: target/one-shot-verify
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-verify-2369.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(ci): remove one-shot verification workflow"
          git push origin HEAD:agent/fix-requirement-implementation-status-2303
      - name: Preserve verification result
        run: |
          test "$(cat target/one-shot-verify/status)" = 0
