name: Stage exact main sync for PR 4273

on:
  push:
    branches:
      - automation/pr-4273-main-sync-v1

permissions:
  contents: write

concurrency:
  group: pr-4273-main-sync-v1
  cancel-in-progress: false

jobs:
  stage:
    if: "${{ github.event.head_commit.message == 'chore(ci): stage PR 4273 main sync' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: dependabot/cargo/yaml-rust2-0.13.0
      TARGET_HEAD: 0265fcc3b5548b3104c48559709455852c4db754
      MAIN_HEAD: 8407b903180a2cafb94708f98efcffef6c7ca1e1
      OUTPUT_BRANCH: automation/pr-4273-main-sync-output-v2
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/cargo/yaml-rust2-0.13.0
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and merge the exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN_HEAD"

          git config user.name 'cargo-allow automation'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git merge --no-ff --no-edit "$MAIN_HEAD"

          read -r merge_commit first_parent second_parent extra <<EOF
          $(git rev-list --parents -n 1 HEAD)
          EOF
          test -z "${extra:-}"
          test "$first_parent" = "$TARGET_HEAD"
          test "$second_parent" = "$MAIN_HEAD"
          git diff --check "$MAIN_HEAD" HEAD

      - name: Verify bounded semantic union
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$MAIN_HEAD" HEAD | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          Cargo.lock
          crates/allow-files/Cargo.toml
          crates/cargo-allow/src/allow_files_changie_admission_tests.rs
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          grep -F 'yaml-rust2 = { version = "0.13", optional = true }' crates/allow-files/Cargo.toml
          grep -F 'manifest.contains("yaml-rust2 = { version = \\"0.13\\", optional = true }")' \
            crates/cargo-allow/src/allow_files_changie_admission_tests.rs

          test -f scripts/floor_product_workspace.py
          test -f .allow/revisions/4283-direct-floor-product-isolation.toml
          test -f scripts/final-registry-observation.py
          test -f .allow/revisions/3850-final-registry-observation-v1.toml

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Re-run focused merged-subject controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_floor_product_workspace.py
          bash scripts/test-proof-direct-floors-protocol.sh
          cargo test -p cargo-allow --locked allow_files_changie_admission_tests
          cargo check -p allow-files --features changie --locked
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check "$MAIN_HEAD" HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish the verified merge commit to an isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^2)" = "$MAIN_HEAD"
          git rev-parse HEAD
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
