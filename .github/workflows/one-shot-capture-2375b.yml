name: one-shot-capture-2375b

on:
  push:
    branches:
      - agent/exact-rust-test-subjects-2224

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/exact-rust-test-subjects-2224
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture current allow-rust Clippy output
        shell: bash
        run: |
          mkdir -p .tmp/verification
          set +e
          cargo clippy -p allow-rust --all-targets --locked -- -D warnings > .tmp/verification/2375b-clippy.log 2>&1
          echo "$?" > .tmp/verification/2375b-clippy-status
          git rm .github/workflows/one-shot-capture-2375b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .tmp/verification/2375b-clippy.log .tmp/verification/2375b-clippy-status
          git commit -m "chore(ci): retain temporary PR 2375 Clippy log"
          git push origin HEAD:agent/exact-rust-test-subjects-2224
