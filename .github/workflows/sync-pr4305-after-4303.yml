name: Synchronize PR 4305 after 4303

on:
  push:
    branches:
      - fix/package-byte-authority

permissions:
  contents: write

concurrency:
  group: sync-pr-4305-after-4303
  cancel-in-progress: false

jobs:
  synchronize:
    if: contains(github.event.head_commit.message, '[sync-4305-after-4303]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/package-byte-authority
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision

      - name: Guard exact subjects and retain branch policy rows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "26c0af563939ac0f56c4b3f3e7ce22724abb2794"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/sync-pr4305-after-4303.yml"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "6002a5582ec51de79492c06e6cd555e77b99b40f"
          git show origin/main:policy/allow.toml > /tmp/main-policy.toml
          git show f7746ee33da1f21378ce66761bf1e87a5191457a:policy/allow.toml > /tmp/branch-policy.toml
          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          text = Path('/tmp/branch-policy.toml').read_text(encoding='utf-8').replace('\r\n', '\n')
          blocks = re.findall(r'(?ms)^\[\[allow\]\]\n.*?(?=^\[\[allow\]\]\n|\Z)', text)
          selected = {}
          for block in blocks:
              parsed = tomllib.loads(block)
              rows = parsed.get('allow', [])
              if len(rows) != 1:
                  continue
              allow_id = rows[0].get('id')
              if allow_id in {'allow-11320', 'allow-11321'}:
                  selected[allow_id] = block.rstrip() + '\n'
          if set(selected) != {'allow-11320', 'allow-11321'}:
              raise SystemExit(f'expected both colliding branch rows, found {sorted(selected)}')
          Path('/tmp/allow-11320.toml').write_text(selected['allow-11320'], encoding='utf-8', newline='\n')
          Path('/tmp/allow-11321.toml').write_text(selected['allow-11321'], encoding='utf-8', newline='\n')
          PY

      - name: Merge current main and resolve the live ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ ${merge_status} -ne 0 ]]; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            printf 'unresolved paths:\n%s\n' "${unresolved[*]}"
            test "${#unresolved[@]}" -eq 1
            test "${unresolved[0]}" = "policy/allow.toml"
          fi
          git show origin/main:policy/allow.toml > policy/allow.toml
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          main = Path('/tmp/main-policy.toml').read_bytes()
          policy = Path('policy/allow.toml')
          if policy.read_bytes() != main:
              raise SystemExit('forced policy does not exactly equal current main policy bytes')
          text = main.decode('utf-8')
          if 'allow-11324' in text or 'allow-11325' in text:
              raise SystemExit('next policy IDs are no longer free on current main')
          first = Path('/tmp/allow-11320.toml').read_text(encoding='utf-8')
          second = Path('/tmp/allow-11321.toml').read_text(encoding='utf-8')
          first = first.replace('id = "allow-11320"', 'id = "allow-11324"', 1)
          second = second.replace('id = "allow-11321"', 'id = "allow-11325"', 1)
          if 'allow-11320' in first or 'allow-11321' in second:
              raise SystemExit('old policy ID survived reallocation')
          suffix = ('\n' if not text.endswith('\n') else '') + '\n' + first.rstrip() + '\n\n' + second.rstrip() + '\n'
          merged = main + suffix.encode('utf-8')
          if not merged.startswith(main):
              raise SystemExit('unrelated current-main policy bytes changed')
          parsed = tomllib.loads(merged.decode('utf-8'))
          ids = [row.get('id') for row in parsed.get('allow', [])]
          if len(ids) != len(set(ids)):
              raise SystemExit('merged policy contains duplicate IDs')
          if ids.count('allow-11324') != 1 or ids.count('allow-11325') != 1:
              raise SystemExit('reallocated policy rows are not exact')
          policy.write_bytes(merged)
          PY
          git add policy/allow.toml
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Generate exact revision fingerprints
        shell: bash
        run: |
          set -euo pipefail
          printf 'schema_version = 1\n' > .allow/revisions/4304-package-byte-authority.toml
          rm -f /tmp/4304-generated.toml /tmp/4304-diff.json
          set +e
          cargo run -p cargo-allow --locked -- diff \
            --base origin/main \
            --require-change-note \
            --write-change-note-template /tmp/4304-generated.toml \
            --format json \
            --output /tmp/4304-diff.json
          initial_status=$?
          set -e
          test ${initial_status} -ne 0
          test -s /tmp/4304-generated.toml
          printf '%s\n' '--- generated change-note template ---'
          cat /tmp/4304-generated.toml
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path('/tmp/4304-generated.toml').read_text(encoding='utf-8'))
          records = data.get('records', [])
          by_id = {}
          for record in records:
              ids = record.get('allow_ids', [])
              if len(ids) == 1 and ids[0] in {'allow-11324', 'allow-11325'}:
                  by_id[ids[0]] = record
          if set(by_id) != {'allow-11324', 'allow-11325'}:
              raise SystemExit(f'generated note did not contain exact added rows: {sorted(by_id)}')
          reasons = {
              'allow-11324': 'receipt for scripts/test-package-byte-authority.py, the cross-producer package-byte authority proof (#4304)',
              'allow-11325': 'self-receipt for this revision note file, matching the #3792 precedent',
          }
          lines = ['schema_version = 1', '']
          for allow_id in ('allow-11324', 'allow-11325'):
              record = by_id[allow_id]
              if record.get('change_kinds') != ['added_allow']:
                  raise SystemExit(f'unexpected change kinds for {allow_id}: {record.get("change_kinds")}')
              fingerprint = record.get('after_fingerprint')
              if not isinstance(fingerprint, str) or not fingerprint.startswith('sha256:v1:'):
                  raise SystemExit(f'invalid generated fingerprint for {allow_id}: {fingerprint!r}')
              lines.extend([
                  '[[records]]',
                  f'allow_ids = ["{allow_id}"]',
                  'change_kinds = ["added_allow"]',
                  f'after_fingerprint = "{fingerprint}"',
                  f'reason = "{reasons[allow_id]}"',
                  '',
              ])
          Path('.allow/revisions/4304-package-byte-authority.toml').write_text(
              '\n'.join(lines), encoding='utf-8', newline='\n'
          )
          PY
          cargo run -p cargo-allow --locked -- diff \
            --base origin/main \
            --require-change-note \
            --format markdown \
            --output /tmp/4304-diff.md
          cat /tmp/4304-diff.md

      - name: Prove the synchronized package-byte authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/candidate-harness-owned-dir.py \
            scripts/test-candidate-harness-lifecycle.py \
            scripts/test-package-byte-authority.py
          bash -n scripts/exact-candidate-package-set.sh
          python3 scripts/test-candidate-harness-lifecycle.py
          python3 scripts/test-package-byte-authority.py
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          cargo fmt --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main | sort)
          printf 'effective changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 9
          expected=(
            .allow/revisions/4304-package-byte-authority.toml
            .changes/Added-20260919-package-byte-authority.yaml
            .github/workflows/ci.yml
            .github/workflows/sync-pr4305-after-4303.yml
            policy/allow.toml
            scripts/candidate-harness-owned-dir.py
            scripts/exact-candidate-package-set.sh
            scripts/test-candidate-harness-lifecycle.py
            scripts/test-package-byte-authority.py
          )
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          git rm .github/workflows/sync-pr4305-after-4303.yml
          mapfile -t final_changed < <(git diff --name-only origin/main | sort)
          test "${#final_changed[@]}" -eq 8
          test "$(git diff --name-only --diff-filter=U | wc -l)" -eq 0

      - name: Commit and push the normal merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse MERGE_HEAD)" = "6002a5582ec51de79492c06e6cd555e77b99b40f"
          git add \
            .allow/revisions/4304-package-byte-authority.toml \
            policy/allow.toml \
            .github/workflows/sync-pr4305-after-4303.yml
          git commit -m "Merge main into fix/package-byte-authority" \
            -m "Reallocate the package-byte authority rows to allow-11324 and allow-11325 and regenerate their exact revision fingerprints after #4303."
          git push origin HEAD:fix/package-byte-authority
