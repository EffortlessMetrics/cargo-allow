name: Apply 3915 syntax gate

on:
  push:
    branches:
      - fix/3915-root-bound-cache-target
    paths:
      - .github/workflows/apply-3915-syntax-gate.yml

permissions:
  contents: write

concurrency:
  group: apply-3915-syntax-gate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/3915-root-bound-cache-target
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Gate module and export
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/allow-rust/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("mod package;\nmod root_bound_scan_cache;", "mod package;\n#[cfg(feature = \"syntax\")]\nmod root_bound_scan_cache;"),
              ("pub use package::{\n    SourcePackageContext, apply_source_package_context, source_package_contexts_from_sources,\n};\npub use root_bound_scan_cache", "pub use package::{\n    SourcePackageContext, apply_source_package_context, source_package_contexts_from_sources,\n};\n#[cfg(feature = \"syntax\")]\npub use root_bound_scan_cache"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"source shape drift: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rustfmt --edition 2024 --config skip_children=true crates/allow-rust/src/lib.rs
      - name: Verify default and minimal surfaces
        run: |
          cargo check -p allow-rust --locked
          cargo check -p allow-rust --no-default-features --locked
          cargo clippy -p allow-rust --all-targets --locked -- -D warnings
          git diff --check
      - name: Commit syntax-scoped identity
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add crates/allow-rust/Cargo.toml crates/allow-rust/src/lib.rs
          git diff --cached --check
          git commit -m "deps(cache): keep identity syntax-scoped"
          git push origin HEAD:fix/3915-root-bound-cache-target
