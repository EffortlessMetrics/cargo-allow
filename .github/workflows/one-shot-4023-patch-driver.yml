name: One-shot 4023 patch implementation driver

on:
  push:
    branches:
      - fix/4023-relative-fixture-dates

permissions:
  contents: write

concurrency:
  group: one-shot-4023-patch-driver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/4023-relative-fixture-dates

      - name: Replace the generated escaped string with a Rust raw literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/one-shot-4023-implement.yml")
          source = path.read_text(encoding="utf-8")
          start_marker = '''          #[test]
          fn dated_resolves_every_live_fixture_token_relative_to_today() {{
          '''
          end_marker = '''          }}
          '''
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("generated fixture test start marker missing")
          end = source.find(end_marker, start + len(start_marker))
          if end < 0:
              raise SystemExit("generated fixture test end marker missing")
          end += len(end_marker)
          replacement = '''          #[test]
          fn dated_resolves_every_live_fixture_token_relative_to_today() {{
              let rendered = dated(
                  r#"created = "{CREATED_TOKEN}"
          review_after = "{REVIEW_TOKEN}"
          expires = "{EXPIRES_TOKEN}"
          "#,
              );
              assert!(rendered.contains(&format!("created = \\"{{}}\\"", fixture_created())));
              assert!(rendered.contains(&format!(
                  "review_after = \\"{{}}\\"",
                  fixture_review_after()
              )));
              assert!(rendered.contains(&format!("expires = \\"{{}}\\"", fixture_expires())));
              assert!(!rendered.contains("__CARGO_ALLOW_FIXTURE_"));
          }}
          '''
          updated = source[:start] + replacement + source[end:]
          if updated == source:
              raise SystemExit("implementation workflow was not changed")
          path.write_text(updated, encoding="utf-8")
          PY
          rm .github/workflows/one-shot-4023-patch-driver.yml

      - name: Commit and push the repaired driver
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(test): repair generated fixture test literal"
          git push origin HEAD:fix/4023-relative-fixture-dates
