# Trigger the registered one-shot after its definition exists on the branch.
name: One-shot intent-model current-main generated state

on:
  push:
    branches:
      - refactor/intent-model-neutral-3387
    paths:
      - .github/workflows/one-shot-intent-model-current-main.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/intent-model-neutral-3387
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Regenerate lock and movement authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("policy/product-move-ledger.toml")
          text = path.read_text(encoding="utf-8")
          marker = 'id = "INVENTORY-INTENT_MODEL-SRC"'
          start = text.index(marker)
          line_start = text.index('current_paths = [', start)
          line_end = text.index('\n', line_start)
          line = text[line_start:line_end]
          old = 'current_paths = ["crates/intent-model/src/lib.rs"'
          new = 'current_paths = ["crates/intent-model/src/error.rs", "crates/intent-model/src/lib.rs"'
          if line.count(old) != 1:
              raise SystemExit("unexpected intent-model inventory row")
          path.write_text(text[:line_start] + line.replace(old, new) + text[line_end:], encoding="utf-8")
          PY
          cargo fmt --all
          cargo metadata --format-version 1 >/dev/null
          cargo test -p intent-model --locked
          cargo test -p allow-policy regenerate_product_move_map_projection -- --ignored
          cargo test -p allow-policy --locked repository_move_ledger_is_complete_and_projection_is_current
          cargo test -p cargo-allow --bin cargo-allow --locked product_move_ledger -- --nocapture
          git rm .github/workflows/one-shot-intent-model-current-main.yml
          git add Cargo.lock policy/product-move-ledger.toml docs/architecture/product-move-map.md crates/intent-model
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "refactor(intent-model): remove cargo-allow product dependency"
          git push origin HEAD:refactor/intent-model-neutral-3387
