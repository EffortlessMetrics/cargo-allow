name: Temporary fix self-hosted policy entry

on:
  push:
    branches:
      - agent/spec-system-self-hosted-source

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/spec-system-self-hosted-source
      - name: Align policy entry with scanner facts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("policy/allow.toml")
          text = path.read_text(encoding="utf-8")
          old = '''id = "allow-4751"
          kind = "non_rust_file"
          family = "policy_metadata"
          path = ".allow/spec-system/slices/self-hosted-runtime-promotion-v1.toml"'''
          new = '''id = "allow-4751"
          kind = "non_rust_file"
          family = "configuration"
          path = ".allow/spec-system/slices/self-hosted-runtime-promotion-v1.toml"'''
          if old not in text:
              raise SystemExit("allow-4751 source block not found")
          text = text.replace(old, new, 1)
          marker = '''symbol = ".allow/spec-system/slices/self-hosted-runtime-promotion-v1.toml"
          target_fingerprint = "toml"
          line_hint = 1'''
          replacement = marker + '''
          glob = ".allow/spec-system/slices/self-hosted-runtime-promotion-v1.toml"'''
          if marker not in text:
              raise SystemExit("allow-4751 selector block not found")
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit policy repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add policy/allow.toml
          git commit -m "fix(policy): align implementation-slice receipt"
          git push origin HEAD:agent/spec-system-self-hosted-source
