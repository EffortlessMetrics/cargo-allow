name: Finalize PR 4303 committed source tree

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-committed-tree
  cancel-in-progress: false

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[repair-4303-committed-tree]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Build the exact source-only commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b1ea080fb427f58ffdacc6a03f7933b513d7b30e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/automation-pr4303-finalize-committed-tree.yml"

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/automation-pr4303-final-closure.yml"
          ).read_text(encoding="utf-8").splitlines()
          start_marker = "          python3 - <<'PY'"
          end_marker = "          PY"
          start = source.index(start_marker) + 1
          end = source.index(end_marker, start)
          body = []
          for line in source[start:end]:
              if not line.startswith("          "):
                  raise SystemExit(f"unexpected embedded-script indentation: {line!r}")
              body.append(line[10:])
          Path("/tmp/apply-pr4303.py").write_text(
              "\n".join(body) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          python3 /tmp/apply-pr4303.py

          git rm --ignore-unmatch \
            .github/scripts/repair_pr4303_envelope.py \
            .github/scripts/repair_pr4303_envelope_v3.py \
            .github/workflows/automation-pr4303-envelope-carrier-fix.yml \
            .github/workflows/automation-pr4303-envelope-closure-v2.yml \
            .github/workflows/automation-pr4303-envelope-closure-v3.yml \
            .github/workflows/automation-pr4303-envelope-closure.yml \
            .github/workflows/automation-pr4303-script-anchor.yml \
            .github/workflows/automation-pr4303-final-closure.yml \
            .github/workflows/automation-pr4303-finalize-committed-tree.yml
          cargo fmt --all

          mapfile -t effective < <(git diff --name-only origin/main | sort)
          expected=(
            ".allow/revisions/3940-release-operation-authority.toml"
            ".changes/Added-20260919-release-operation-authority-v1.yaml"
            "crates/allow-report/src/artifacts.rs"
            "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
            "crates/allow-report/src/artifacts/release_operation_v1.rs"
            "crates/allow-report/src/lib.rs"
            "crates/allow-report/tests/release_operation_authority_contract.rs"
            "crates/cargo-allow/src/artifact_schema_index_tests.rs"
            "crates/cargo-allow/tests/release_operation_authority.rs"
            "docs/release/release-operation-authority-v1.md"
            "docs/schemas/README.md"
            "docs/schemas/cargo-allow.release-operation-authority.v1.schema.json"
            "policy/allow.toml"
            "policy/evidence-surface-inventory.toml"
          )
          test "${#effective[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${effective[$i]}" = "${expected[$i]}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): close canonical operation authority (#3940)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prove the committed source-only authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cargo fmt --all -- --check
          bash scripts/check-workflow-syntax.sh
          python3 scripts/test-verify-evidence-surface-inventory.py
          python3 scripts/verify-evidence-surface-inventory.py
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check HEAD^
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 14

      - name: Transfer the proven commit object
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:release/3940-operation-authority-v1
