name: Repair 3915 world diff

on:
  push:
    branches:
      - fix/3915-root-bound-cache-target
    paths:
      - .github/workflows/repair-3915-world-diff.yml

permissions:
  contents: write

concurrency:
  group: repair-3915-world-diff
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/3915-root-bound-cache-target
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Restore base bytes and reapply bounded edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/repair-3915-world-diff.py")
          text = path.read_text(encoding="utf-8")
          old = '["git", "diff", "--numstat", "--", PATH.as_posix()]'
          new = '["git", "diff", "--numstat", BASE, "--", PATH.as_posix()]'
          if text.count(old) != 1:
              raise SystemExit("repair assertion source drift")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/repair-3915-world-diff.py
      - name: Check repaired source
        shell: bash
        run: |
          rustfmt --edition 2024 --config skip_children=true --check crates/cargo-allow/src/world.rs
          cargo check -p cargo-allow --locked
          git diff --check
      - name: Commit repaired diff
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add crates/cargo-allow/src/world.rs
          git diff --cached --check
          git commit -m "style(cache): preserve bounded world diff"
          git push origin HEAD:fix/3915-root-bound-cache-target
