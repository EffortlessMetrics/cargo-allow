name: Repair PR 4305 Git environment

on:
  push:
    branches:
      - fix/package-byte-authority

permissions:
  contents: write

concurrency:
  group: repair-pr-4305-git-environment
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/package-byte-authority
          fetch-depth: 12
          persist-credentials: true

      - name: Guard the exact repair carrier
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "555e5c582bfaa166c43342e3322a6b8b0168fa34" HEAD
          test "$(git diff --name-only 555e5c582bfaa166c43342e3322a6b8b0168fa34 HEAD)" = ".github/workflows/repair-pr4305-git-environment.yml"

      - name: Apply the bounded Git-environment repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          harness = Path("scripts/candidate-harness-owned-dir.py")
          text = harness.read_text(encoding="utf-8")
          text, count = re.subn(
              r'subprocess\.run\(\n(?P<indent>\s*)\["git",',
              r'run_git(\n\g<indent>[',
              text,
          )
          if count != 7:
              raise SystemExit(f"{harness}: expected seven Git subprocess replacements, found {count}")
          if re.search(r'subprocess\.run\(\n\s*\["git",', text):
              raise SystemExit(f"{harness}: an unsanitized Git subprocess remains")
          harness.write_text(text, encoding="utf-8", newline="\n")
          replace_once(
              harness,
              'MARKER = ".candidate-harness-owner.json"\nREPARSE_POINT = 0x400\n',
              '''MARKER = ".candidate-harness-owner.json"\nREPARSE_POINT = 0x400\nGIT_REPOSITORY_ENVIRONMENT_VARIABLES = (\n    "GIT_DIR",\n    "GIT_WORK_TREE",\n    "GIT_COMMON_DIR",\n    "GIT_INDEX_FILE",\n    "GIT_OBJECT_DIRECTORY",\n    "GIT_ALTERNATE_OBJECT_DIRECTORIES",\n    "GIT_CEILING_DIRECTORIES",\n    "GIT_DISCOVERY_ACROSS_FILESYSTEM",\n)\nGIT_SUBPROCESS_ENVIRONMENT = os.environ.copy()\nfor variable in GIT_REPOSITORY_ENVIRONMENT_VARIABLES:\n    GIT_SUBPROCESS_ENVIRONMENT.pop(variable, None)\n\n\ndef run_git(arguments: list[str], **kwargs):\n    return subprocess.run(\n        ["git", *arguments],\n        env=GIT_SUBPROCESS_ENVIRONMENT,\n        **kwargs,\n    )\n''',
          )

          package_set = Path("scripts/exact-candidate-package-set.sh")
          replace_once(
              package_set,
              '''strip_cr() {\n  printf '%s' "$1" | tr -d '\\r'\n}\n\n\nSCRIPT_ROOT=''',
              '''strip_cr() {\n  printf '%s' "$1" | tr -d '\\r'\n}\n\n# Git repository-location and object-store variables override `git -C` and\n# Cargo's repository discovery. Candidate packaging must be selected only by\n# the explicit repository/worktree arguments below.\nGIT_REPOSITORY_ENVIRONMENT_VARIABLES=(\n  GIT_DIR\n  GIT_WORK_TREE\n  GIT_COMMON_DIR\n  GIT_INDEX_FILE\n  GIT_OBJECT_DIRECTORY\n  GIT_ALTERNATE_OBJECT_DIRECTORIES\n  GIT_CEILING_DIRECTORIES\n  GIT_DISCOVERY_ACROSS_FILESYSTEM\n)\nfor variable in "${GIT_REPOSITORY_ENVIRONMENT_VARIABLES[@]}"; do\n  unset "${variable}"\ndone\n\n\nSCRIPT_ROOT=''',
          )

          lifecycle_test = Path("scripts/test-candidate-harness-lifecycle.py")
          replace_once(
              lifecycle_test,
              '''def run(*args: str, expect: int = 0) -> subprocess.CompletedProcess[str]:\n    result = subprocess.run(\n        [sys.executable, str(TOOL), *args], capture_output=True, text=True, check=False\n    )\n''',
              '''def run(\n    *args: str,\n    expect: int = 0,\n    env: dict[str, str] | None = None,\n) -> subprocess.CompletedProcess[str]:\n    result = subprocess.run(\n        [sys.executable, str(TOOL), *args],\n        capture_output=True,\n        text=True,\n        check=False,\n        env=env,\n    )\n''',
          )
          replace_once(
              lifecycle_test,
              '''    if __import__("shutil").rmtree.avoids_symlink_attacks:\n        for script in ("exact-candidate-package-set.sh", "source-candidate-smoke.sh"):\n''',
              '''    poison_root = root / "poisoned-git-environment"\n    poison_root.mkdir()\n    poisoned_git_env = {\n        **os.environ,\n        "GIT_DIR": str(poison_root / "foreign.git"),\n        "GIT_WORK_TREE": str(poison_root / "foreign-worktree"),\n        "GIT_COMMON_DIR": str(poison_root / "foreign-common"),\n        "GIT_INDEX_FILE": str(poison_root / "foreign-index"),\n        "GIT_OBJECT_DIRECTORY": str(poison_root / "foreign-objects"),\n        "GIT_ALTERNATE_OBJECT_DIRECTORIES": str(poison_root / "alternate-objects"),\n        "GIT_CEILING_DIRECTORIES": str(poison_root),\n        "GIT_DISCOVERY_ACROSS_FILESYSTEM": "0",\n    }\n\n    if __import__("shutil").rmtree.avoids_symlink_attacks:\n        for script in ("exact-candidate-package-set.sh", "source-candidate-smoke.sh"):\n''',
          )
          text = lifecycle_test.read_text(encoding="utf-8")
          first_env = 'env={**os.environ, "CANDIDATE_HARNESS_SNAPSHOT_PROBE": "1"'
          if text.count(first_env) != 1:
              raise SystemExit("snapshot-probe environment replacement was not unique")
          text = text.replace(
              first_env,
              'env={**poisoned_git_env, "CANDIDATE_HARNESS_SNAPSHOT_PROBE": "1"',
          )
          second_env = 'env={**os.environ, "SKIP_PACKAGE": "1", "PACKAGE_INPUT_DIR": str(package_input),'
          if text.count(second_env) != 1:
              raise SystemExit("package-staging environment replacement was not unique")
          text = text.replace(
              second_env,
              'env={**poisoned_git_env, "SKIP_PACKAGE": "1", "PACKAGE_INPUT_DIR": str(package_input),',
          )
          worktree_call = '''        run("worktree", "--root", str(root), "--repository", str(ROOT), "--purpose", "worktree-auth").stdout\n'''
          if text.count(worktree_call) != 1:
              raise SystemExit("worktree invocation replacement was not unique")
          text = text.replace(
              worktree_call,
              '''        run(\n            "worktree",\n            "--root",\n            str(root),\n            "--repository",\n            str(ROOT),\n            "--purpose",\n            "worktree-auth",\n            env=poisoned_git_env,\n        ).stdout\n''',
          )
          successful_remove = '''    run("worktree-remove", "--root", str(root), "--path", str(work_path),\n        "--purpose", "worktree-auth", "--token", work["token"])\n'''
          if text.count(successful_remove) != 1:
              raise SystemExit("worktree removal replacement was not unique")
          text = text.replace(
              successful_remove,
              '''    run(\n        "worktree-remove",\n        "--root",\n        str(root),\n        "--path",\n        str(work_path),\n        "--purpose",\n        "worktree-auth",\n        "--token",\n        work["token"],\n        env=poisoned_git_env,\n    )\n''',
          )
          list_check = '''    if str(work_path) in listed.stdout:\n        raise SystemExit("worktree removal left stale registration")\n'''
          if text.count(list_check) != 1:
              raise SystemExit("worktree-list check replacement was not unique")
          text = text.replace(
              list_check,
              '''    if listed.returncode != 0:\n        raise SystemExit(\n            f"git worktree list failed while checking cleanup:\\n{listed.stdout}{listed.stderr}"\n        )\n    if str(work_path) in listed.stdout:\n        raise SystemExit("worktree removal left stale registration")\n''',
          )
          lifecycle_test.write_text(text, encoding="utf-8", newline="\n")
          PY

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision

      - name: Prove the exact repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/candidate-harness-owned-dir.py \
            scripts/test-candidate-harness-lifecycle.py \
            scripts/test-package-byte-authority.py
          bash -n scripts/exact-candidate-package-set.sh
          python3 scripts/test-candidate-harness-lifecycle.py
          python3 scripts/test-package-byte-authority.py
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "555e5c582bfaa166c43342e3322a6b8b0168fa34" HEAD
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "scripts/candidate-harness-owned-dir.py"
          test "${changed[1]}" = "scripts/exact-candidate-package-set.sh"
          test "${changed[2]}" = "scripts/test-candidate-harness-lifecycle.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/candidate-harness-owned-dir.py \
            scripts/exact-candidate-package-set.sh \
            scripts/test-candidate-harness-lifecycle.py
          git commit -m "fix(package): scrub inherited Git repository environment"
          git push origin HEAD:fix/package-byte-authority
