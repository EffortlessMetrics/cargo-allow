name: Repair PR 4303 event envelope v3

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-event-envelope-v3
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-envelope-v3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify temporary denominator and apply structural closure
        shell: bash
        run: |
          set -euo pipefail
          source_head=7d9414a86ef56d470d2706136457a97563833038
          git merge-base --is-ancestor "$source_head" HEAD
          mapfile -t carrier_changes < <(git diff --name-only "$source_head" HEAD | sort)
          expected=(
            ".github/scripts/repair_pr4303_envelope.py"
            ".github/scripts/repair_pr4303_envelope_v3.py"
            ".github/scripts/repair_pr4303_envelope_v4.py"
            ".github/workflows/automation-pr4303-envelope-carrier-fix.yml"
            ".github/workflows/automation-pr4303-envelope-closure-v2.yml"
            ".github/workflows/automation-pr4303-envelope-closure-v3.yml"
            ".github/workflows/automation-pr4303-envelope-closure.yml"
            ".github/workflows/automation-pr4303-script-anchor.yml"
          )
          test "${#carrier_changes[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${carrier_changes[$i]}" = "${expected[$i]}"
          done

          python3 .github/scripts/repair_pr4303_envelope_v4.py
          git rm \
            .github/scripts/repair_pr4303_envelope.py \
            .github/scripts/repair_pr4303_envelope_v3.py \
            .github/scripts/repair_pr4303_envelope_v4.py \
            .github/workflows/automation-pr4303-envelope-carrier-fix.yml \
            .github/workflows/automation-pr4303-envelope-closure-v2.yml \
            .github/workflows/automation-pr4303-envelope-closure-v3.yml \
            .github/workflows/automation-pr4303-envelope-closure.yml \
            .github/workflows/automation-pr4303-script-anchor.yml
          cargo fmt --all

      - name: Prove the completed PR A envelope
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit and publish the source-only closure
        shell: bash
        run: |
          set -euo pipefail
          source_head=7d9414a86ef56d470d2706136457a97563833038
          mapfile -t effective < <(git diff --name-only "$source_head" | sort)
          expected=(
            "crates/allow-report/src/artifacts.rs"
            "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
            "crates/allow-report/src/lib.rs"
            "crates/allow-report/tests/release_operation_authority_contract.rs"
            "crates/cargo-allow/tests/release_operation_authority.rs"
            "docs/release/release-operation-authority-v1.md"
            "docs/schemas/cargo-allow.release-operation-authority.v1.schema.json"
            "policy/evidence-surface-inventory.toml"
          )
          test "${#effective[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${effective[$i]}" = "${expected[$i]}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): bind authorization and timestamp provenance (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
