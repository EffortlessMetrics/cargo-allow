name: Repair issue 4288 release-identity denominator

on:
  push:
    branches:
      - automation/4288-release-identity-consumer-v1

permissions:
  contents: write

concurrency:
  group: issue-4288-release-identity-consumer-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: fix/4283-product-floor-isolation
      TARGET_HEAD: 1ecb143fa9aa7ebe8fa5b85b02bf984f8984d6c4
    steps:
      - name: Check out exact target head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/4283-product-floor-isolation
          fetch-depth: 0
          persist-credentials: true

      - name: Verify admitted subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain)"

      - name: Declare product workspace reader boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("policy/release-identity-consumers.toml")
          text = path.read_text(encoding="utf-8")
          if 'id = "floor-product-workspace-reader"' in text:
              raise SystemExit("consumer row already exists")
          next_row = '[[consumers]]\nid = "changie-config"'
          if text.count(next_row) != 1:
              raise SystemExit(f"expected one changie row anchor, found {text.count(next_row)}")
          row_lines = [
              '[[consumers]]',
              'id = "floor-product-workspace-reader"',
              'path = "scripts/floor_product_workspace.py"',
              'role = "product-scoped workspace membership projection for the bounded direct-floor proof (#4283)"',
              'disposition = "non-semantic-formatting"',
              'owner = "#4283"',
              'marker_classes = ["workspace-reader"]',
              'exact_counts = [{ class = "workspace-reader", count = 2 }]',
              'sites = [',
              '  "root manifest does not define [workspace]",',
              '  "[workspace.dependencies] must be a table",',
              ']',
              'claim_boundary = "Reads workspace membership, package names, and path-dependency metadata solely to project the selected proof workspace; it does not read package versions, parse release identity, infer channel, or determine prerelease posture."',
          ]
          row = "\n".join(row_lines)
          path.write_text(text.replace(next_row, row + "\n\n" + next_row), encoding="utf-8", newline="\n")
          PY
          git diff --check
          test "$(git diff --name-only)" = "policy/release-identity-consumers.toml"

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Prove release-identity denominator
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cargo-allow --locked --bin cargo-allow release_identity_denominator_tests

      - name: Preserve direct-floor protocol and no-new
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-proof-direct-floors.sh
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = "policy/release-identity-consumers.toml"

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git diff --name-only)" = "policy/release-identity-consumers.toml"
          git config user.name 'cargo-allow automation'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git add policy/release-identity-consumers.toml
          git diff --cached --check
          git commit --no-verify -m 'fix(ci): declare product workspace release-identity boundary (#4283)'
          git push origin HEAD:fix/4283-product-floor-isolation
