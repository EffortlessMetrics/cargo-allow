name: One-shot provider rustfmt repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 4131 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/2567-provider-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/2567-provider-contract
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Apply the current formatter and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/repair-provider-rustfmt-once.yml
          printf '%s\n' \
            '.github/workflows/repair-provider-rustfmt-once.yml' \
            'crates/cargo-allow/src/capabilities.rs' \
            | sort > /tmp/expected-paths
          git diff --name-only HEAD | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --check HEAD
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/cargo-allow/src/capabilities.rs
          git commit -m 'style(provider): apply current rustfmt'
          git push origin HEAD:codex/2567-provider-contract
