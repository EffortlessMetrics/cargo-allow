name: PR 4302 author repair v2

on:
  push:
    branches:
      - automation/pr-4302-author-repair-v2

permissions:
  contents: write

concurrency:
  group: pr-4302-author-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_HEAD: 751c9bf17526b64a91285c8fa944ca25e91e4b48
      OUTPUT_BRANCH: automation/pr-4302-author-repair-output-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Stage repair scripts and check out the exact blocked head
        shell: bash
        run: |
          set -euo pipefail
          cp .github/repair/pr-4302-author-repair-v2.py /tmp/pr-4302-repair-v2.py
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/pr-4302-author-repair-v1.yml').read_text(encoding='utf-8')
          start_marker = '          cat > "$RUNNER_TEMP/repair.py" <<\'PY\'\n'
          end_marker = '\n          PY\n          python3 "$RUNNER_TEMP/repair.py"'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/pr-4302-repair-v1.py').write_text(
              textwrap.dedent(workflow[start:end]),
              encoding='utf-8',
              newline='\n',
          )
          repair = Path('/tmp/pr-4302-repair-v2.py')
          source = repair.read_text(encoding='utf-8')
          old = '''    finish = text.find(end, begin)
    if finish < 0:
        raise AssertionError(f"{label}: end marker missing")
'''
          new = '''    finish = text.find(end, begin)
    if finish < 0 and label == "current-row dependant gate":
        finish = len(text)
    if finish < 0:
        raise AssertionError(f"{label}: end marker missing")
'''
          if source.count(old) != 1:
              raise AssertionError('replace_between hotfix target moved')
          repair.write_text(source.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git checkout --detach "$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 /tmp/pr-4302-repair-v1.py
          python3 /tmp/pr-4302-repair-v2.py
          cargo fmt --all
          git diff --check

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: ./.github/actions/rust-cache
        with:
          lane: pr-4302-author-repair-v2

      - name: Run focused checkpoint and adjacent authority proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cargo-allow --test publication_checkpoint --locked -- --nocapture
          cargo test -p cargo-allow --test publication_checkpoint_runner_loss --locked -- --nocapture
          cargo test -p cargo-allow --test publication_checkpoint_trust --locked -- --nocapture
          cargo test -p cargo-allow --test publication_journal --locked -- --nocapture
          cargo test -p cargo-allow --locked --bin cargo-allow artifact_schema_index
          cargo check -p allow-report --locked
          cargo clippy -p allow-report -p cargo-allow --all-targets -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown \
            --receipt target/pr-4302-author-repair-v2/check.receipt.json \
            --output target/pr-4302-author-repair-v2/check.md
          git diff --check

      - name: Commit and publish only the repaired source head
        shell: bash
        run: |
          set -euo pipefail
          expected=$'.changes/Added-20260919-publication-checkpoint.yaml\ncrates/allow-report/src/artifacts/publication_checkpoint_v1.rs\ncrates/cargo-allow/tests/publication_checkpoint.rs\ncrates/cargo-allow/tests/publication_checkpoint_runner_loss.rs\ncrates/cargo-allow/tests/publication_checkpoint_trust.rs\ndocs/release/publication-checkpoint-v1.md\ndocs/schemas/cargo-allow.publication-checkpoint.v1.schema.json'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .changes/Added-20260919-publication-checkpoint.yaml \
            crates/allow-report/src/artifacts/publication_checkpoint_v1.rs \
            crates/cargo-allow/tests/publication_checkpoint.rs \
            crates/cargo-allow/tests/publication_checkpoint_runner_loss.rs \
            crates/cargo-allow/tests/publication_checkpoint_trust.rs \
            docs/release/publication-checkpoint-v1.md \
            docs/schemas/cargo-allow.publication-checkpoint.v1.schema.json
          git commit -m 'fix(release): bind checkpoint gates to verified remote evidence (#3922)' \
            -m 'Separate immutable checkpoint identity from runtime readback authority, bind permission gates to exact journal row transitions, consume upload authority on journal advancement, and add fail-closed replay, tamper, ambiguity, overflow, schema and recovery controls.'
          if git ls-remote --exit-code --heads origin "$OUTPUT_BRANCH" >/dev/null 2>&1; then
            echo "output branch already exists: $OUTPUT_BRANCH" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          git show --stat --oneline --decorate HEAD
