        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr-4302-author-repair-v1.yml').read_text(encoding='utf-8')
          start_marker = '          cat > "$RUNNER_TEMP/repair.py" <<\'PY\'\n'
          end_marker = '\n          PY\n          python3 "$RUNNER_TEMP/repair.py"'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/pr-4302-repair-v1.py').write_text(script, encoding='utf-8', newline='\n')
          PY
          git checkout --detach "$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 /tmp/pr-4302-repair-v1.py
          cat > /tmp/pr-4302-repair-v2.py <<'PY'
