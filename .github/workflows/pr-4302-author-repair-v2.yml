name: PR 4302 author repair v2

on:
  push:
    branches:
      - automation/pr-4302-author-repair-v2

permissions:
  contents: write

concurrency:
  group: pr-4302-author-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_HEAD: 751c9bf17526b64a91285c8fa944ca25e91e4b48
      OUTPUT_BRANCH: automation/pr-4302-author-repair-output-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract the reviewed v1 transform, then apply the authority refinement
