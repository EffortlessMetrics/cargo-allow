name: Review readiness

# #3844: project the typed exact-head review state (#3843) onto one
# stable `review-readiness` check context, published as ONE
# authoritative GitHub check run at the PR head so success, neutral
# (missing disposition — never clean), and failure are all visible
# conclusions. Pull-request events recompute on every readiness-
# relevant change (including base-changing edits); pushes to main
# recompute all open pull requests against the new merge base so base
# movement cannot leave a stale green behind. Read-only over review
# semantics: the only write is the review-readiness check run itself.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  review-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Project review readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/project-review-readiness.sh
