name: Review readiness

# #3844: project the typed exact-head review state (#3843) onto one
# stable `review-readiness` check context, published as ONE
# authoritative GitHub check run at the PR head so success, neutral
# (missing disposition — never clean), and failure are all visible
# conclusions. Pull-request events recompute on every readiness-
# relevant change (including base-changing edits); pushes to main
# recompute all open pull requests against the new merge base so base
# movement is checked during acquisition and before publication. These
# observations are not an atomic lock against later movement or concurrent
# publishers. Read-only over review semantics: the only write is the
# review-readiness check run itself.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
  # The queue commit has no pull_request payload. The adapter resolves
  # one PR from merge_group and fails closed when that identity is
  # missing or ambiguous. This trigger does not enable a queue.
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  # The job id is deliberately NOT the published check context: the
  # Actions job check is an implementation detail named
  # review-readiness-publisher; the one stable `review-readiness`
  # context is the published typed check run only.
  review-readiness-publisher:
    runs-on: ubuntu-latest
    # rust-toolchain.toml outranks the action tag, so the 1.95.0 tag alone
    # resolves to the runner's stable. RUSTUP_TOOLCHAIN outranks the file
    # and is what actually pins this required context.
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Characterize review readiness adapter
        run: bash scripts/test-project-review-readiness.sh
      - name: Prove digest recipe environment-invariance
        run: bash scripts/test-review-readiness-digest-stability.sh
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Project review readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_CHANGED: ${{ github.event.changes.base != null }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: bash scripts/project-review-readiness.sh
