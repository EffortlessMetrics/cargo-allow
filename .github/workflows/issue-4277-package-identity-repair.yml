name: Apply issue 4277 package identity repair

on:
  push:
    branches:
      - fix/4277-floor-pin-settlement

permissions:
  contents: write

concurrency:
  group: issue-4277-package-identity-repair
  cancel-in-progress: false

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(ci): apply package identity repair (#4277)'"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/4277-floor-pin-settlement
          fetch-depth: 0
          persist-credentials: true

      - name: Bind settlement to name version and source
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/floor_pin_settlement.py <<'PYFILE'
          #!/usr/bin/env python3
          """Settle all selected direct dependency floors into one Cargo.lock."""

          from __future__ import annotations

          from dataclasses import dataclass
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tomllib
          from typing import Callable, Iterable, Mapping

          MAX_DIAGNOSTIC_BYTES = 300
          CRATES_IO_SOURCES = (
              "registry+https://github.com/rust-lang/crates.io-index",
              "sparse+https://index.crates.io/",
          )


          @dataclass(frozen=True, order=True)
          class LockedPackage:
              """One exact Cargo package identity retained by Cargo.lock."""

              version: str
              source: str | None


          @dataclass(frozen=True)
          class LockSnapshot:
              """All same-name lock identities plus the complete lock digest."""

              resolved: Mapping[str, tuple[LockedPackage, ...]]
              identity: str


          Attempt = Callable[[Mapping[str, str]], tuple[int, str]]
          Snapshot = Callable[[], LockSnapshot]
          ObservedState = tuple[tuple[str, tuple[LockedPackage, ...]], ...]


          def base_version(version: str | None) -> str:
              """Return the SemVer precedence version without build metadata."""

              return (version or "").split("+", 1)[0]


          def locked_occurrences(
              snapshot: LockSnapshot, package: str
          ) -> tuple[LockedPackage, ...]:
              """Return every exact lock identity for a package name."""

              return snapshot.resolved.get(package, ())


          def is_registry_source(source: str | None) -> bool:
              """Return whether a lock source is registry-backed."""

              return bool(source) and source.startswith(("registry+", "sparse+"))


          def source_identity(package: LockedPackage | None) -> str:
              """Project a locked source into the public receipt vocabulary."""

              if package is None:
                  return "unresolved"
              if package.source in CRATES_IO_SOURCES or (
                  package.source
                  and (
                      "crates.io-index" in package.source
                      or "index.crates.io" in package.source
                  )
              ):
                  return "registry:crates.io"
              return package.source or "path:workspace-or-local"


          def _format_identity(package: LockedPackage) -> str:
              source = package.source or "path:workspace-or-local"
              return f"{package.version} @ {source}"


          def selected_registry_identity(
              snapshot: LockSnapshot, row: Mapping[str, str]
          ) -> tuple[LockedPackage | None, str | None]:
              """Select one registry identity or return a fail-closed reason."""

              name = row["package"]
              occurrences = locked_occurrences(snapshot, name)
              if not occurrences:
                  return None, f"{name} is missing from Cargo.lock"
              if len(occurrences) != 1:
                  rendered = ", ".join(_format_identity(item) for item in occurrences)
                  return None, f"{name} has multiple locked identities: {rendered}"
              selected = occurrences[0]
              if not is_registry_source(selected.source):
                  return (
                      selected,
                      f"{name} selected a non-registry lock identity: "
                      f"{_format_identity(selected)}",
                  )
              return selected, None


          def floor_identity(
              snapshot: LockSnapshot, row: Mapping[str, str]
          ) -> tuple[LockedPackage | None, str | None]:
              """Return the unique registry identity only when it is at the floor."""

              selected, issue = selected_registry_identity(snapshot, row)
              if issue:
                  return selected, issue
              assert selected is not None
              observed = base_version(selected.version)
              if observed != row["floor"]:
                  return (
                      selected,
                      "pin did not remain at declared floor: "
                      f"locked at {observed}, floor requires {row['floor']}",
                  )
              return selected, None


          def cargo_update_spec(
              snapshot: LockSnapshot, row: Mapping[str, str]
          ) -> tuple[str | None, str | None]:
              """Choose a non-ambiguous Cargo package spec for one update attempt."""

              occurrences = locked_occurrences(snapshot, row["package"])
              if not occurrences:
                  # The first update bootstraps a freshly removed lock. Cargo still
                  # fails closed if the generated graph makes this name ambiguous.
                  return row["package"], None
              selected, issue = selected_registry_identity(snapshot, row)
              if issue:
                  return None, issue
              assert selected is not None
              return f"{row['package']}@{selected.version}", None


          def _is_exact(snapshot: LockSnapshot, row: Mapping[str, str]) -> bool:
              _, issue = floor_identity(snapshot, row)
              return issue is None


          def _attempt_failure_diagnostic(
              row: Mapping[str, str], returncode: int, stderr: str
          ) -> str:
              detail = stderr.strip()
              if detail:
                  return detail[:MAX_DIAGNOSTIC_BYTES]
              return (
                  f"cargo update failed with exit code {returncode} while pinning "
                  f"{row['package']} to {row['floor']}; stderr was empty"
              )[:MAX_DIAGNOSTIC_BYTES]


          def settle_floors(
              floors: Iterable[Mapping[str, str]],
              attempt: Attempt,
              snapshot: Snapshot,
              *,
              max_passes: int | None = None,
          ) -> dict[str, str]:
              """Return final bounded diagnostics for floors that cannot settle together.

              The caller's ``attempt`` mutates the candidate lock. Rows are sorted by
              package for deterministic execution, but every unresolved row is retried
              after sibling pins have had a chance to settle. Repeated lock states and a
              bounded pass count make an incompatible or oscillating set terminate.
              A selected name must end at exactly one registry-backed name/version/source
              identity at its floor; ambiguous or substituted identities remain non-clean.
              """

              ordered = sorted(
                  (dict(row) for row in floors), key=lambda row: row["package"]
              )
              if not ordered:
                  return {}

              pass_limit = (
                  max_passes
                  if max_passes is not None
                  else max(2, len(ordered) * 2 + 1)
              )
              if pass_limit < 1:
                  raise ValueError("max_passes must be positive")

              diagnostics: dict[str, str] = {}
              seen_states: set[tuple[ObservedState, str]] = set()

              for _ in range(pass_limit):
                  for row in ordered:
                      if _is_exact(snapshot(), row):
                          continue
                      returncode, stderr = attempt(row)
                      name = row["package"]
                      if returncode == 0:
                          diagnostics.pop(name, None)
                      else:
                          diagnostics[name] = _attempt_failure_diagnostic(
                              row, returncode, stderr
                          )

                  current = snapshot()
                  unresolved = [row for row in ordered if not _is_exact(current, row)]
                  if not unresolved:
                      return {}

                  observed: ObservedState = tuple(
                      (
                          row["package"],
                          locked_occurrences(current, row["package"]),
                      )
                      for row in ordered
                  )
                  state = (observed, current.identity)
                  if state in seen_states:
                      break
                  seen_states.add(state)

              current = snapshot()
              failures: dict[str, str] = {}
              for row in ordered:
                  _, issue = floor_identity(current, row)
                  if issue is None:
                      continue
                  name = row["package"]
                  failures[name] = diagnostics.get(name, issue)[:MAX_DIAGNOSTIC_BYTES]
              return failures


          def read_lock_snapshot(lock_path: Path) -> LockSnapshot:
              """Read every name/version/source occurrence from a Cargo lockfile."""

              if not lock_path.exists():
                  return LockSnapshot({}, "missing")

              raw = lock_path.read_bytes().replace(b"\r", b"")
              lock = tomllib.loads(raw.decode("utf-8"))
              observed: dict[str, list[LockedPackage]] = {}
              for package in lock.get("package", []):
                  source = package.get("source")
                  observed.setdefault(package["name"], []).append(
                      LockedPackage(
                          version=package["version"],
                          source=source if isinstance(source, str) else None,
                      )
                  )
              resolved = {
                  name: tuple(sorted(packages))
                  for name, packages in observed.items()
              }
              return LockSnapshot(resolved, hashlib.sha256(raw).hexdigest())


          def main(argv: list[str]) -> int:
              """Run bounded settlement and write final per-package failures."""

              if len(argv) != 4:
                  print(
                      "usage: floor_pin_settlement.py "
                      "<floors.json> <pin-failures.json> <Cargo.lock>",
                      file=sys.stderr,
                  )
                  return 2

              floors_path = Path(argv[1])
              failures_path = Path(argv[2])
              lock_path = Path(argv[3])
              floors = json.loads(floors_path.read_text(encoding="utf-8"))

              def attempt(row: Mapping[str, str]) -> tuple[int, str]:
                  package_spec, issue = cargo_update_spec(
                      read_lock_snapshot(lock_path), row
                  )
                  if issue:
                      return 2, issue
                  assert package_spec is not None
                  proc = subprocess.run(
                      [
                          "cargo",
                          "update",
                          "-p",
                          package_spec,
                          "--precise",
                          row["floor"],
                      ],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  return proc.returncode, proc.stderr

              failures = settle_floors(
                  floors,
                  attempt,
                  lambda: read_lock_snapshot(lock_path),
              )
              failures_path.write_text(
                  json.dumps(failures, indent=1) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv))
          PYFILE

          cat > scripts/test_floor_pin_settlement.py <<'PYTEST'
          #!/usr/bin/env python3

          from __future__ import annotations

          import importlib.util
          from pathlib import Path
          import sys
          import tempfile
          import unittest

          MODULE_PATH = Path(__file__).with_name("floor_pin_settlement.py")
          spec = importlib.util.spec_from_file_location("floor_pin_settlement", MODULE_PATH)
          assert spec and spec.loader
          settlement = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = settlement
          spec.loader.exec_module(settlement)

          REGISTRY = "registry+https://github.com/rust-lang/crates.io-index"


          class FakeResolver:
              def __init__(self, attempt):
                  self.state: dict[str, str] = {}
                  self.attempt_impl = attempt
                  self.calls: list[str] = []

              def attempt(self, row):
                  self.calls.append(row["package"])
                  return self.attempt_impl(self.state, row)

              def snapshot(self):
                  identity = ";".join(
                      f"{name}={version}" for name, version in sorted(self.state.items())
                  ) or "missing"
                  resolved = {
                      name: (settlement.LockedPackage(version, REGISTRY),)
                      for name, version in self.state.items()
                  }
                  return settlement.LockSnapshot(resolved, identity)


          class SettlementTests(unittest.TestCase):
              def test_early_failure_is_retried_after_sibling_floor_settles(self):
                  def attempt(state, row):
                      if row["package"] == "alpha":
                          state.setdefault("alpha", "2.0.0")
                          state.setdefault("beta", "2.0.0")
                          if state["beta"] != "1.0.0":
                              return 1, "beta 2 requires alpha 2"
                          state["alpha"] = "1.0.0"
                          return 0, ""
                      state.setdefault("alpha", "2.0.0")
                      state["beta"] = "1.0.0"
                      return 0, ""

                  floors = [
                      {"package": "alpha", "floor": "1.0.0"},
                      {"package": "beta", "floor": "1.0.0"},
                  ]
                  resolver = FakeResolver(attempt)
                  failures = settlement.settle_floors(
                      floors, resolver.attempt, resolver.snapshot
                  )
                  self.assertEqual({}, failures)
                  self.assertEqual(
                      {"alpha": "1.0.0", "beta": "1.0.0"}, resolver.state
                  )
                  self.assertEqual(["alpha", "beta", "alpha"], resolver.calls)

              def test_input_order_does_not_change_final_identity(self):
                  def run(floors):
                      def attempt(state, row):
                          state[row["package"]] = row["floor"]
                          return 0, ""

                      resolver = FakeResolver(attempt)
                      failures = settlement.settle_floors(
                          floors, resolver.attempt, resolver.snapshot
                      )
                      return failures, resolver.snapshot().identity, resolver.calls

                  floors = [
                      {"package": "zeta", "floor": "1.0.0"},
                      {"package": "alpha", "floor": "2.0.0"},
                  ]
                  forward = run(floors)
                  reverse = run(list(reversed(floors)))
                  self.assertEqual(forward, reverse)
                  self.assertEqual(["alpha", "zeta"], forward[2])

              def test_genuinely_incompatible_set_terminates_with_bounded_failure(self):
                  def attempt(state, row):
                      state.setdefault("alpha", "2.0.0")
                      state.setdefault("beta", "2.0.0")
                      return 1, f"cannot pin {row['package']}"

                  floors = [
                      {"package": "alpha", "floor": "1.0.0"},
                      {"package": "beta", "floor": "1.0.0"},
                  ]
                  resolver = FakeResolver(attempt)
                  failures = settlement.settle_floors(
                      floors, resolver.attempt, resolver.snapshot
                  )
                  self.assertEqual(
                      {"alpha": "cannot pin alpha", "beta": "cannot pin beta"},
                      failures,
                  )
                  self.assertEqual(4, len(resolver.calls))

              def test_duplicate_package_identities_are_not_treated_as_exact(self):
                  calls = []

                  def attempt(row):
                      calls.append(row["package"])
                      return 0, ""

                  def snapshot():
                      return settlement.LockSnapshot(
                          {
                              "alpha": (
                                  settlement.LockedPackage("1.0.0", REGISTRY),
                                  settlement.LockedPackage("2.0.0", REGISTRY),
                              )
                          },
                          "two-alpha-identities",
                      )

                  failures = settlement.settle_floors(
                      [{"package": "alpha", "floor": "1.0.0"}],
                      attempt,
                      snapshot,
                  )
                  self.assertIn("multiple locked identities", failures["alpha"])
                  self.assertIn("1.0.0", failures["alpha"])
                  self.assertIn("2.0.0", failures["alpha"])
                  self.assertEqual(["alpha", "alpha"], calls)

              def test_lock_snapshot_retains_version_and_source_for_duplicate_rows(self):
                  with tempfile.TemporaryDirectory(
                      prefix="floor-lock-snapshot-"
                  ) as directory:
                      lock_path = Path(directory) / "Cargo.lock"
                      lock_path.write_text(
                          'version = 4\n'
                          '[[package]]\nname = "alpha"\nversion = "2.0.0"\n'
                          'source = "git+https://example.invalid/alpha"\n'
                          '[[package]]\nname = "alpha"\nversion = "1.0.0"\n'
                          f'source = "{REGISTRY}"\n',
                          encoding="utf-8",
                          newline="\n",
                      )
                      snapshot = settlement.read_lock_snapshot(lock_path)

                  self.assertEqual(
                      (
                          settlement.LockedPackage("1.0.0", REGISTRY),
                          settlement.LockedPackage(
                              "2.0.0", "git+https://example.invalid/alpha"
                          ),
                      ),
                      snapshot.resolved["alpha"],
                  )
                  self.assertNotEqual("missing", snapshot.identity)

              def test_update_spec_is_qualified_and_ambiguous_sources_fail_closed(self):
                  row = {"package": "alpha", "floor": "1.0.0"}
                  empty = settlement.LockSnapshot({}, "missing")
                  self.assertEqual(("alpha", None), settlement.cargo_update_spec(empty, row))

                  unique = settlement.LockSnapshot(
                      {"alpha": (settlement.LockedPackage("2.0.0", REGISTRY),)},
                      "unique",
                  )
                  self.assertEqual(
                      ("alpha@2.0.0", None),
                      settlement.cargo_update_spec(unique, row),
                  )

                  non_registry = settlement.LockSnapshot(
                      {
                          "alpha": (
                              settlement.LockedPackage(
                                  "2.0.0", "git+https://example.invalid/alpha"
                              ),
                          )
                      },
                      "git",
                  )
                  package_spec, issue = settlement.cargo_update_spec(non_registry, row)
                  self.assertIsNone(package_spec)
                  self.assertIn("non-registry", issue)

                  duplicate = settlement.LockSnapshot(
                      {
                          "alpha": (
                              settlement.LockedPackage("1.0.0", REGISTRY),
                              settlement.LockedPackage(
                                  "1.0.0", "git+https://example.invalid/alpha"
                              ),
                          )
                      },
                      "duplicate",
                  )
                  package_spec, issue = settlement.cargo_update_spec(duplicate, row)
                  self.assertIsNone(package_spec)
                  self.assertIn("multiple locked identities", issue)

              def test_empty_failure_stderr_produces_a_bounded_diagnostic(self):
                  def attempt(state, row):
                      state[row["package"]] = "2.0.0"
                      return 17, " \n"

                  floors = [{"package": "alpha", "floor": "1.0.0"}]
                  resolver = FakeResolver(attempt)
                  failures = settlement.settle_floors(
                      floors, resolver.attempt, resolver.snapshot
                  )
                  self.assertEqual(
                      {
                          "alpha": (
                              "cargo update failed with exit code 17 while pinning "
                              "alpha to 1.0.0; stderr was empty"
                          )
                      },
                      failures,
                  )
                  self.assertEqual(["alpha", "alpha"], resolver.calls)

              def test_later_pin_that_moves_an_earlier_floor_is_not_certified(self):
                  def attempt(state, row):
                      if row["package"] == "alpha":
                          state["alpha"] = "1.0.0"
                          state["beta"] = "2.0.0"
                      else:
                          state["beta"] = "1.0.0"
                          state["alpha"] = "2.0.0"
                      return 0, ""

                  floors = [
                      {"package": "alpha", "floor": "1.0.0"},
                      {"package": "beta", "floor": "1.0.0"},
                  ]
                  resolver = FakeResolver(attempt)
                  failures = settlement.settle_floors(
                      floors, resolver.attempt, resolver.snapshot
                  )
                  self.assertEqual(
                      {
                          "alpha": (
                              "pin did not remain at declared floor: "
                              "locked at 2.0.0, floor requires 1.0.0"
                          )
                      },
                      failures,
                  )
                  self.assertEqual(
                      ["alpha", "beta", "alpha", "beta"], resolver.calls
                  )


          if __name__ == "__main__":
              unittest.main()
          PYTEST

          python3 - <<'PATCH'
          from pathlib import Path

          path = Path("scripts/proof-direct-floors.sh")
          text = path.read_text(encoding="utf-8")
          old_verify = '''# Verify every pin that succeeded actually landed at the floor. Packages
          # whose pin failed are excluded here — they surface as resolver_failure
          # rows in the receipt instead of aborting before any receipt exists.
          floor_move_failures="$(python3 - <<'PY'
          import json
          import tomllib

          lock = tomllib.load(open("Cargo.lock", "rb"))
          floors = json.load(open("target/floor-proof/floors.json", encoding="utf-8"))
          pin_failed = set(json.load(open("target/floor-proof/pin-failures.json", encoding="utf-8")).keys())
          resolved = {}
          for package in lock.get("package", []):
              resolved.setdefault(package["name"], package["version"])
          moved = []
          for row in floors:
              if row["package"] in pin_failed:
                  continue
              # Cargo can record a registry version with build metadata (e.g.
              # 1.1.4+spec-1.1.0); SemVer precedence ignores it, so compare the
              # version without the suffix.
              locked_base = (resolved.get(row["package"]) or "").split("+")[0]
              locked = locked_base
              if locked != row["floor"]:
                  moved.append(row["package"] + ": locked at " + str(locked) + ", floor requires " + str(row["floor"]))
          print("; ".join(moved))
          PY
          )"
          if [ -n "$floor_move_failures" ]; then
            echo "proof-direct-floors: pinned floors silently moved:" >&2
            echo "$floor_move_failures" >&2
            exit 6
          fi
          '''
          new_verify = '''# Re-read the final lock through the same name/version/source selector used
          # by settlement. A row absent from pin-failures must still be one unique
          # registry identity at the declared floor before proof classes may run.
          floor_move_failures="$(python3 - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("scripts").resolve()))
          import floor_pin_settlement as settlement

          snapshot = settlement.read_lock_snapshot(Path("Cargo.lock"))
          floors = json.load(open("target/floor-proof/floors.json", encoding="utf-8"))
          pin_failed = set(json.load(open("target/floor-proof/pin-failures.json", encoding="utf-8")).keys())
          moved = []
          for row in floors:
              if row["package"] in pin_failed:
                  continue
              _, issue = settlement.floor_identity(snapshot, row)
              if issue:
                  moved.append(row["package"] + ": " + issue)
          print("; ".join(moved))
          PY
          )"
          if [ -n "$floor_move_failures" ]; then
            echo "proof-direct-floors: final floor identities are not exact:" >&2
            echo "$floor_move_failures" >&2
            exit 6
          fi
          '''
          if text.count(old_verify) != 1:
              raise SystemExit("expected one legacy floor verification block")
          text = text.replace(old_verify, new_verify)

          old_imports = '''import hashlib
          import json
          import os
          import sys
          import tomllib
          '''
          new_imports = '''import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("scripts").resolve()))
          import floor_pin_settlement as settlement
          '''
          if text.count(old_imports) != 1:
              raise SystemExit("expected one receipt import block")
          text = text.replace(old_imports, new_imports)

          old_resolution = '''lock = tomllib.load(open(lock_path, "rb"))
          floors = json.load(open(floors_path, encoding="utf-8"))
          pin_failures = json.load(open(pins_path, encoding="utf-8"))
          resolved = {}
          for package in lock.get("package", []):
              resolved.setdefault(package["name"], package["version"])
          '''
          new_resolution = '''snapshot = settlement.read_lock_snapshot(Path(lock_path))
          floors = json.load(open(floors_path, encoding="utf-8"))
          pin_failures = json.load(open(pins_path, encoding="utf-8"))
          '''
          if text.count(old_resolution) != 1:
              raise SystemExit("expected one receipt resolution block")
          text = text.replace(old_resolution, new_resolution)

          old_rows = '''for row in floors:
              name = row["package"]
              if name in pin_failures:
                  result = "resolver_failure"
                  limitation = f"pin to the declared floor failed: {pin_failures[name]}"
              elif class_failed:
                  result = "instrument_failure"
                  limitation = "a bounded proof class failed at the floors; see the proof output"
              else:
                  result = "proven"
                  limitation = None
              rows.append({
                  "package": name,
                  "declared_requirement": row["requirement"],
                  "tested_floor": row["floor"],
                  "resolved_version": resolved.get(name, row["floor"]),
                  "source_identity": "registry:crates.io",
                  "result": result,
                  "limitation": limitation,
              })
          '''
          new_rows = '''for row in floors:
              name = row["package"]
              selected, identity_issue = settlement.floor_identity(snapshot, row)
              if name in pin_failures:
                  result = "resolver_failure"
                  limitation = f"pin to the declared floor failed: {pin_failures[name]}"
              elif identity_issue:
                  result = "resolver_failure"
                  limitation = f"final lock identity is not the declared floor: {identity_issue}"
              elif class_failed:
                  result = "instrument_failure"
                  limitation = "a bounded proof class failed at the floors; see the proof output"
              else:
                  result = "proven"
                  limitation = None
              rows.append({
                  "package": name,
                  "declared_requirement": row["requirement"],
                  "tested_floor": row["floor"],
                  "resolved_version": selected.version if selected else "unresolved",
                  "source_identity": settlement.source_identity(selected),
                  "result": result,
                  "limitation": limitation,
              })
          '''
          if text.count(old_rows) != 1:
              raise SystemExit("expected one receipt row block")
          text = text.replace(old_rows, new_rows)

          old_command = 'commands = ["cargo update -p <dep> --precise <floor> (per external direct dep of the product closure)"]'
          new_command = 'commands = ["cargo update -p <dep>@<locked-version> --precise <floor> (bare name only while bootstrapping an absent lock row)"]'
          if text.count(old_command) != 1:
              raise SystemExit("expected one update command description")
          text = text.replace(old_command, new_command)
          path.write_text(text, encoding="utf-8", newline="\n")

          protocol = Path("scripts/test_floor_protocol.py")
          text = protocol.read_text(encoding="utf-8")
          old_shim = '''        if arguments[2] == case.get("fail_pin"):
                      return 42, "", "simulated floor pin failure"
                  lock = 'version = 4\\n[[package]]\\nname = ' + json.dumps(arguments[2])
                  lock += '\\nversion = ' + json.dumps(arguments[4]) + '\\n'
          '''
          new_shim = '''        package_spec = arguments[2]
                  package = package_spec.split("@", 1)[0]
                  if package == case.get("fail_pin"):
                      return 42, "", "simulated floor pin failure"
                  lock = 'version = 4\\n[[package]]\\nname = ' + json.dumps(package)
                  lock += '\\nversion = ' + json.dumps(arguments[4])
                  lock += '\\nsource = "registry+https://github.com/rust-lang/crates.io-index"\\n'
          '''
          if text.count(old_shim) != 1:
              raise SystemExit("expected one protocol cargo update shim")
          protocol.write_text(text.replace(old_shim, new_shim), encoding="utf-8", newline="\n")
          PATCH

          git diff --check

      - name: Run focused settlement and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_floor_pin_settlement.py
          bash scripts/test-proof-direct-floors-protocol.sh

      - name: Run source and change-note guards
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          cargo run -p cargo-allow --locked -- diff \
            --base 2dc1b07e182935cc7c2654035e2fef8b1199ad1a \
            --require-change-note --format json \
            --output target/issue-4277-package-identity-diff.json

      - name: Commit the bounded repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-4277-package-identity-repair.yml
          git add scripts/floor_pin_settlement.py scripts/test_floor_pin_settlement.py \
            scripts/proof-direct-floors.sh scripts/test_floor_protocol.py
          git diff --cached --check
          git commit -m 'fix(ci): bind floor settlement to package identities (#4277)'
          git push origin HEAD:fix/4277-floor-pin-settlement
