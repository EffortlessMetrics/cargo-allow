name: Temporary PR 4131 policy receipt

on:
  push:
    branches:
      - codex/2567-provider-contract

permissions:
  contents: write

concurrency:
  group: temporary-pr-4131-policy-receipt
  cancel-in-progress: false

jobs:
  receipt:
    if: >-
      github.repository == 'EffortlessMetrics/cargo-allow' &&
      github.ref == 'refs/heads/codex/2567-provider-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Append, verify, commit, and remove this workflow
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          TARGET_BRANCH: codex/2567-provider-contract
        run: |
          set -euo pipefail

          git fetch --no-tags origin "${TARGET_BRANCH}" main
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"

          python - <<'PY'
          from __future__ import annotations

          import textwrap
          import tomllib
          from pathlib import Path

          policy_path = Path("policy/allow.toml")
          revision_path = Path(".allow/revisions/4131-provider-contract-schema.toml")
          workflow_path = Path(".github/workflows/zz-temporary-4131-policy-receipt.yml")

          policy_bytes = policy_path.read_bytes()
          newline = b"\r\n" if b"\r\n" in policy_bytes else b"\n"
          policy_text = policy_bytes.decode("utf-8")

          identities = [
              "allow-11231",
              "allow-11232",
              "docs/schemas/cargo-allow-provider-contract-v1.schema.json",
              ".allow/revisions/4131-provider-contract-schema.toml",
          ]
          for identity in identities:
              if identity in policy_text:
                  raise SystemExit(f"policy already contains {identity}")

          block = textwrap.dedent(r'''
              [[allow]]
              id = "allow-11231"
              kind = "non_rust_file"
              family = "documentation"
              path = "docs/schemas/cargo-allow-provider-contract-v1.schema.json"
              owner = "proof/provider"
              classification = "provider_contract_schema"
              reason = "Published closed JSON Schema for the discovery-only cargo-allow provider descriptor introduced by PR #4131; it does not define or authorize request execution or analysis receipts."
              evidence = [
                  "issue:2567",
                  "issue:4144",
                  "doc:docs/schemas/README.md",
                  "test:provider_descriptor_stdout_conforms_without_repository_or_policy",
              ]
              created = "2026-09-06"
              review_after = "2027-03-06"

              [allow.selector]
              ast_kind = "tracked_file"
              symbol = "docs/schemas/cargo-allow-provider-contract-v1.schema.json"
              target_fingerprint = "json"
              glob = "docs/schemas/cargo-allow-provider-contract-v1.schema.json"

              [allow.last_seen]
              line = 1
              column = 1

              [[allow]]
              id = "allow-11232"
              kind = "non_rust_file"
              family = "configuration"
              path = ".allow/revisions/4131-provider-contract-schema.toml"
              owner = "core/policy"
              classification = "ledger_change_note"
              reason = "Revision note authorizing the two bounded policy additions required to receipt the provider descriptor schema and this note itself for PR #4131."
              evidence = [
                  "pr:4131",
                  "issue:2567",
                  "doc:docs/how-to/manage-an-exception.md",
              ]
              created = "2026-09-06"
              review_after = "2027-03-06"

              [allow.selector]
              ast_kind = "tracked_file"
              symbol = ".allow/revisions/4131-provider-contract-schema.toml"
              target_fingerprint = "toml"
              glob = ".allow/revisions/4131-provider-contract-schema.toml"

              [allow.last_seen]
              line = 1
              column = 1
          ''').strip("\n")
          if any(line.rstrip(" \t") != line for line in block.splitlines()):
              raise SystemExit("generated policy block contains trailing horizontal whitespace")

          policy_path.write_bytes(
              policy_bytes.rstrip(b"\r\n")
              + newline
              + newline
              + block.encode("utf-8").replace(b"\n", newline)
              + newline
          )

          revision = textwrap.dedent('''
              # Revision note for #4131: discovery-only provider descriptor schema.

              schema_version = 1

              [[records]]
              allow_ids = ["allow-11231"]
              change_kinds = ["added_allow"]
              after_fingerprint = "sha256:v1:d7498b4478311ac2d602362b7837e603e9ed4f1c793a31e94f4b071940839eab"
              reason = "Receipts the closed provider-descriptor schema added for issue #2567; executable discovery remains in #4144."

              [[records]]
              allow_ids = ["allow-11232"]
              change_kinds = ["added_allow"]
              after_fingerprint = "sha256:v1:46774be4b8dc7d605665b34efd51f8e1970369549e64a7aa8e1717aadcb326e1"
              reason = "Receipts this revision note's own bounded policy exception for PR #4131."
          ''').lstrip()
          if any(line.rstrip(" \t") != line for line in revision.splitlines()):
              raise SystemExit("generated revision note contains trailing horizontal whitespace")
          revision_path.parent.mkdir(parents=True, exist_ok=True)
          revision_path.write_text(revision, encoding="utf-8")

          tomllib.loads(policy_path.read_text(encoding="utf-8"))
          tomllib.loads(revision_path.read_text(encoding="utf-8"))
          workflow_path.unlink()
          PY

          git diff --check -- .allow/revisions/4131-provider-contract-schema.toml

          cargo run -q -p cargo-allow --locked -- \
            check --mode no-new --format markdown \
            --receipt target/cargo-allow/provider-policy-check.receipt.json \
            --output target/cargo-allow/provider-policy-check.md

          cargo run -q -p cargo-allow --locked -- \
            diff --base origin/main --require-change-note --format json \
            --output target/cargo-allow/provider-policy-diff.json

          git fetch --no-tags origin "${TARGET_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${EXPECTED_HEAD}"

          git add -A
          expected_paths=$(printf '%s\n' \
            '.allow/revisions/4131-provider-contract-schema.toml' \
            '.github/workflows/zz-temporary-4131-policy-receipt.yml' \
            'policy/allow.toml' | LC_ALL=C sort)
          actual_paths=$(git diff --cached --name-only | LC_ALL=C sort)
          test "${actual_paths}" = "${expected_paths}"

          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "chore(provider): receipt descriptor schema"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
