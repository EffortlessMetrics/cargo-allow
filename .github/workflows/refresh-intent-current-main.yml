name: Refresh intent candidate on current main

on:
  push:
    branches:
      - feat/intent-compiler-subject-resolution-3147

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[intent-refresh-complete]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feat/intent-compiler-subject-resolution-3147

      - name: Merge current main and preserve the current move-ledger authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e

          if [[ "${merge_code}" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "${path}" in
                policy/product-move-ledger.toml) ;;
                *)
                  printf 'unexpected merge conflict: %s\n' "${path}" >&2
                  exit 1
                  ;;
              esac
            done
            git checkout --theirs -- policy/product-move-ledger.toml
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("policy/product-move-ledger.toml")
          text = path.read_text(encoding="utf-8")
          marker = 'id = "INVENTORY-INTENT_ENGINE-SRC"'
          start = text.index(marker)
          line_start = text.index("current_paths = [", start)
          line_end = text.index("\n", line_start)
          line = text[line_start:line_end]
          new_path = '"crates/intent-engine/src/subject_resolution.rs"'
          if new_path not in line:
              anchor = '"crates/intent-engine/src/tests.rs"'
              if anchor not in line:
                  raise SystemExit("intent-engine inventory anchor missing")
              line = line.replace(anchor, f"{new_path}, {anchor}")
              text = text[:line_start] + line + text[line_end:]
              path.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all
          cargo check -p intent-compiler --locked
          cargo test -p intent-compiler --locked

          git rm .github/workflows/refresh-intent-current-main.yml
          git add policy/product-move-ledger.toml
          git add -u
          git commit -m "merge(main): refresh intent consumer evidence [intent-refresh-complete]"
          git push origin HEAD:feat/intent-compiler-subject-resolution-3147
