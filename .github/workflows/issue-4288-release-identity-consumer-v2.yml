name: Repair issue 4288 release identity denominator v2

on:
  push:
    branches:
      - automation/4288-release-identity-consumer-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_HEAD: 11a9d15347fd77724dc0f8c2e0971fc803a237e3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/4283-product-floor-isolation
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain)"

      - name: Add bounded fixture denominator rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("policy/release-identity-consumers.toml")
          text = path.read_text(encoding="utf-8")
          if 'id = "direct-floor-product-workspace-projector"' not in text:
              raise SystemExit("current head is missing the production projector declaration")
          row_ids = (
              "floor-product-workspace-fixtures",
              "floor-source-identity-projection-fixtures",
          )
          for row_id in row_ids:
              if f'id = "{row_id}"' in text:
                  raise SystemExit(f"consumer row already exists: {row_id}")
          anchor = '[[consumers]]\nid = "changie-config"'
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one anchor, found {text.count(anchor)}")
          rows = []
          rows.append("\n".join([
              '[[consumers]]',
              'id = "floor-product-workspace-fixtures"',
              'path = "scripts/test_floor_product_workspace.py"',
              'role = "synthetic product-workspace projection controls for the bounded direct-floor proof (#4283)"',
              'disposition = "historical-fixture-only"',
              'owner = "#4283"',
              'marker_classes = ["workspace-reader"]',
              'exact_counts = [{ class = "workspace-reader", count = 3 }]',
              'sites = [',
              '  "class ProductWorkspaceProjectionTests(unittest.TestCase):",',
              '  "def test_unrelated_member_cannot_enter_the_execution_workspace(self):",',
              ']',
              'claim_boundary = "The workspace markers occur only in temporary synthetic manifests used to test membership projection and isolation. The fixture driver does not classify a product release version, tag, channel, or prerelease posture."',
          ]))
          rows.append("\n".join([
              '[[consumers]]',
              'id = "floor-source-identity-projection-fixtures"',
              'path = "scripts/test_floor_source_identity.py"',
              'role = "real-Git source-identity controls for the derived product-workspace proof subject (#4283)"',
              'disposition = "historical-fixture-only"',
              'owner = "#4283"',
              'marker_classes = ["workspace-reader"]',
              'exact_counts = [{ class = "workspace-reader", count = 2 }]',
              'sites = [',
              '  "class FloorSourceIdentityTests(unittest.TestCase):",',
              '  "def write_projection(self):",',
              ']',
              'claim_boundary = "The workspace markers occur only in temporary Git fixture manifests that exercise projection binding and dirty-source admission. The fixture driver does not infer package release versions, tags, channels, or prerelease posture."',
          ]))
          path.write_text(text.replace(anchor, "\n\n".join(rows) + "\n\n" + anchor), encoding="utf-8", newline="\n")
          PY
          git diff --check
          test "$(git diff --name-only)" = "policy/release-identity-consumers.toml"

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Prove denominator and floor contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cargo-allow --locked --bin cargo-allow release_identity_denominator_tests
          bash scripts/test-proof-direct-floors.sh
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = "policy/release-identity-consumers.toml"

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git diff --name-only)" = "policy/release-identity-consumers.toml"
          git config user.name 'cargo-allow automation'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git add policy/release-identity-consumers.toml
          git diff --cached --check
          git commit --no-verify -m 'fix(ci): classify product workspace proof fixtures (#4283)'
          git push origin HEAD:fix/4283-product-floor-isolation
