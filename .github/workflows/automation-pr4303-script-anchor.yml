name: Fix PR 4303 envelope script anchor

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

jobs:
  fix-anchor:
    if: contains(github.event.head_commit.message, '[fix-4303-script-anchor]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Replace the one dedented Rust-byte anchor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "57ff123f1d0ab38a4607a18c1205c3e9365a3f55"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/repair_pr4303_envelope.py')
          text = path.read_text(encoding='utf-8')
          needle = "replace_once(\n    authority,\n    dedent(\n        '''\\\n            artifact_digest: &event.artifact_digest,"
          start = text.find(needle)
          if start < 0:
              raise SystemExit('event-digest replacement block was not found')
          end = text.find('\n\nmarker = dedent(', start)
          if end < 0:
              raise SystemExit('event-digest replacement block end was not found')
          replacement = '\n'.join([
              'replace_once(',
              '    authority,',
              '    "        artifact_digest: &event.artifact_digest,\\n"',
              '    "        observed_at_unix_seconds: event.observed_at_unix_seconds,\\n"',
              '    "        claim_boundary: &event.claim_boundary,\\n",',
              '    "        artifact_digest: &event.artifact_digest,\\n"',
              '    "        timestamp_source: event.timestamp_source,\\n"',
              '    "        observed_at_unix_seconds: event.observed_at_unix_seconds,\\n"',
              '    "        claim_boundary: &event.claim_boundary,\\n",',
              ')',
          ])
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')
          PY
          python3 -m py_compile .github/scripts/repair_pr4303_envelope.py
          git rm .github/workflows/automation-pr4303-script-anchor.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(repair): rerun deterministic envelope closure [repair-4303-envelope-v2]"
          git push origin HEAD:release/3940-operation-authority-v1