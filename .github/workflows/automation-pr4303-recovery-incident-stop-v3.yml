name: Repair PR 4303 recovery incident stop v3

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-recovery-incident-v3
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-recovery-incident-v3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply the bounded transition repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f46b2b854d82cc806c1c0f9ec4963c239cdcd894"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/automation-pr4303-recovery-incident-stop-v3.yml"

          python3 - <<'PY'
          import base64
          from pathlib import Path

          def decoded(value: str) -> str:
              return base64.b64decode(value).decode("utf-8")

          def replace_once(path: str, old_b64: str, new_b64: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              old = decoded(old_b64)
              new = decoded(new_b64)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one replacement, found {count}: {old[:120]!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_once(
              "crates/allow-report/src/artifacts/release_operation_authority_v1.rs",
              "",
              "",
          )

          test_path = Path("crates/cargo-allow/tests/release_operation_authority.rs")
          test_text = test_path.read_text(encoding="utf-8")
          test_name = "release_operation_recovery_incident_stops_new_mutation"
          if test_name in test_text:
              raise SystemExit(f"{test_path}: hostile test already exists")
          test_text += decoded(
              ""
          )
          test_path.write_text(test_text, encoding="utf-8", newline="\n")

          replace_once(
              "docs/release/release-operation-authority-v1.md",
              "",
              "",
          )
          PY

          git rm .github/workflows/automation-pr4303-recovery-incident-stop-v3.yml
          cargo fmt --all

          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/automation-pr4303-recovery-incident-stop-v3.yml",
              "crates/allow-report/src/artifacts/release_operation_authority_v1.rs",
              "crates/cargo-allow/tests/release_operation_authority.rs",
              "docs/release/release-operation-authority-v1.md",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True)
              .splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected repair paths: {sorted(actual)}")
          PY

      - name: Prove the source-only repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          bash scripts/check-workflow-syntax.sh
          python3 scripts/test-verify-evidence-surface-inventory.py
          python3 scripts/verify-evidence-surface-inventory.py
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit and transfer the proven source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): stop recovery mutation after incident (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
