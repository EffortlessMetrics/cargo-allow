name: Pre-admit PR 4303 review disposition

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-review-disposition-admission
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-review-admission-v3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision
        with:
          components: rustfmt, clippy

      - name: Stage the governed source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6d1fb4cf065a6cbe77cc7ebbbeca1ceec415e81c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/automation-pr4303-review-disposition-admission.yml"

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import tomllib
          from pathlib import Path

          policy_path = Path("policy/allow.toml")
          raw = policy_path.read_bytes()
          if raw.endswith(b"\r\n"):
              newline = "\r\n"
          elif raw.endswith(b"\n"):
              newline = "\n"
          else:
              newline = "\n"
              raw += b"\n"
          policy = tomllib.loads(raw.decode("utf-8"))
          allows = policy.get("allow", [])
          if not isinstance(allows, list):
              raise SystemExit("policy allow ledger is malformed")

          ids = {entry.get("id") for entry in allows if isinstance(entry, dict)}
          if "allow-11323" in ids:
              raise SystemExit("allow-11323 is already allocated")
          numeric_ids = []
          for value in ids:
              if isinstance(value, str) and re.fullmatch(r"allow-\d{5}", value):
                  numeric_ids.append(int(value.removeprefix("allow-")))
          if not numeric_ids or max(numeric_ids) != 11322:
              raise SystemExit(f"unexpected live numeric ledger tail: {max(numeric_ids, default=None)}")

          precedent = next(
              (
                  entry
                  for entry in allows
                  if isinstance(entry, dict)
                  and entry.get("path") == ".allow/review-dispositions/pr-4153.json"
              ),
              None,
          )
          if precedent is None:
              raise SystemExit("missing governed review-disposition precedent")

          path = ".allow/review-dispositions/pr-4303.json"
          block_lines = [
              "",
              "[[allow]]",
              'id = "allow-11323"',
              f"kind = {json.dumps(precedent['kind'])}",
              f"family = {json.dumps(precedent['family'])}",
              f"path = {json.dumps(path)}",
              f"owner = {json.dumps(precedent['owner'])}",
              f"classification = {json.dumps(precedent['classification'])}",
              'reason = "Exact-path receipt for the retained typed same-maintainer disposition of PR #4303; it records the reviewed source pair and explicit non-independent claim boundary, but carries no CI, merge, authorization, or release authority."',
              'evidence = ["issue:3940", "pull-request:4303", "review:5256498951"]',
              'created = "2026-09-19"',
              'review_after = "2027-03-19"',
              "",
              "[allow.selector]",
              'ast_kind = "tracked_file"',
              f"symbol = {json.dumps(path)}",
              'target_fingerprint = "json"',
              f"glob = {json.dumps(path)}",
              "",
              "[allow.last_seen]",
              "line = 1",
              "column = 1",
              "",
          ]
          policy_path.write_bytes(raw + newline.join(block_lines).encode("utf-8"))

          disposition = Path(path)
          if not disposition.is_file():
              raise SystemExit("expected current review disposition before source-head reconstruction")
          disposition.unlink()
          PY

          mkdir -p target/cargo-allow
          set +e
          cargo run -p cargo-allow --locked -- diff \
            --base origin/main \
            --require-change-note \
            --write-change-note-template target/cargo-allow/pr4303-review-admission.toml \
            --format json \
            --output target/cargo-allow/pr4303-review-admission.diff.json
          template_status=$?
          set -e
          test "$template_status" -eq 0 || test "$template_status" -eq 1
          test -s target/cargo-allow/pr4303-review-admission.toml

          python3 - <<'PY'
          from __future__ import annotations

          import tomllib
          from pathlib import Path

          generated = tomllib.loads(
              Path("target/cargo-allow/pr4303-review-admission.toml").read_text(
                  encoding="utf-8"
              )
          )
          records = generated.get("records", [])
          matches = [
              record
              for record in records
              if record.get("allow_ids") == ["allow-11323"]
              and record.get("change_kinds") == ["added_allow"]
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one generated allow-11323 record, found {len(matches)}"
              )
          fingerprint = matches[0].get("after_fingerprint")
          if not isinstance(fingerprint, str) or not fingerprint.startswith("sha256:v1:"):
              raise SystemExit("generated allow-11323 fingerprint is malformed")

          revision = Path(
              ".allow/revisions/3940-release-operation-authority.toml"
          )
          text = revision.read_text(encoding="utf-8")
          if 'allow_ids = ["allow-11323"]' in text:
              raise SystemExit("allow-11323 revision record already exists")
          text += (
              "\n[[records]]\n"
              'allow_ids = ["allow-11323"]\n'
              'change_kinds = ["added_allow"]\n'
              f'after_fingerprint = "{fingerprint}"\n'
              'reason = "exact-path receipt for the retained typed same-maintainer PR #4303 review disposition; review evidence only, with no CI, merge, authorization, or release authority"\n'
          )
          revision.write_text(text, encoding="utf-8", newline="\n")
          print(f"allow-11323 fingerprint: {fingerprint}")
          PY

          git rm .github/workflows/automation-pr4303-review-disposition-admission.yml

      - name: Prove the governed source head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .allow/review-dispositions/pr-4303.json
          cargo fmt --all -- --check
          bash scripts/check-workflow-syntax.sh
          python3 scripts/test-verify-evidence-surface-inventory.py
          python3 scripts/verify-evidence-surface-inventory.py
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          cargo run -p cargo-allow --locked -- diff \
            --base origin/main \
            --require-change-note \
            --format json \
            --output target/cargo-allow/pr4303-review-admission-verified.diff.json
          git diff --check
          mapfile -t effective < <(git diff --name-only origin/main | sort)
          test "${#effective[@]}" -eq 14
          test "${effective[0]}" = ".allow/revisions/3940-release-operation-authority.toml"
          test "${effective[12]}" = "policy/allow.toml"

      - name: Commit and transfer the governed source head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "governance(review): pre-admit PR 4303 disposition"
          echo "GOVERNED_SOURCE_HEAD=$(git rev-parse HEAD)"
          git push origin HEAD:release/3940-operation-authority-v1
