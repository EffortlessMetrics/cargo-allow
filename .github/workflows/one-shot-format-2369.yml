name: one-shot-format-2369

on:
  push:
    branches:
      - agent/fix-requirement-implementation-status-2303

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/fix-requirement-implementation-status-2303
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and remove this one-shot workflow
        run: |
          cargo fmt --all
          git rm .github/workflows/one-shot-format-2369.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(spec-system): apply rustfmt"
          git push origin HEAD:agent/fix-requirement-implementation-status-2303
