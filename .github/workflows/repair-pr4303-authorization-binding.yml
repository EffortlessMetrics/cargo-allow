name: Repair PR 4303 authorization binding

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-authorization-binding
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 2
          persist-credentials: true

      - name: Guard and stage the exact authorization repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "57976f1451d92f144b5de38d4e6f1e9f2759e62a"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr4303-authorization-binding.yml"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}: {old[:120]!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          authority = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          replace_once(
              authority,
              '''        Event::AuthorizationSelected => {\n            let ready = match identity.operation_class {\n                Class::CleanFinalPublication => has_exact_event(events, Event::OperationSelected),\n                Class::IncidentRecovery => has_exact_event(events, Event::RecoverySelected),\n                Class::Containment => has_exact_event(events, Event::ContainmentSelected),\n            };\n            if !ready {\n                return Err("authorization selection requires exact operation-class selection");\n            }\n        }\n''',
              '''        Event::AuthorizationSelected => {\n            if init.payload_digest != identity.authorization_digest {\n                return Err(\n                    "authorization selection payload does not match immutable authorization digest",\n                );\n            }\n            let ready = match identity.operation_class {\n                Class::CleanFinalPublication => has_exact_event(events, Event::OperationSelected),\n                Class::IncidentRecovery => has_exact_event(events, Event::RecoverySelected),\n                Class::Containment => has_exact_event(events, Event::ContainmentSelected),\n            };\n            if !ready {\n                return Err("authorization selection requires exact operation-class selection");\n            }\n        }\n''',
          )

          cargo_test = "crates/cargo-allow/tests/release_operation_authority.rs"
          replace_once(
              cargo_test,
              '''    CargoAllowReleaseOperationEventInitV1 {\n        event_class: class,\n        subject,\n        payload_schema_id: "cargo-allow.synthetic-release-payload.v1".to_string(),\n        payload_digest: digest(1_000 + ordinal),\n''',
              '''    let payload_digest = if class\n        == CargoAllowReleaseOperationEventClassV1::AuthorizationSelected\n    {\n        identity.authorization_digest.clone()\n    } else {\n        digest(1_000 + ordinal)\n    };\n    CargoAllowReleaseOperationEventInitV1 {\n        event_class: class,\n        subject,\n        payload_schema_id: "cargo-allow.synthetic-release-payload.v1".to_string(),\n        payload_digest,\n''',
          )
          replace_once(
              cargo_test,
              '''    let identity = identity()?;\n    for result in [\n''',
              '''    let identity = identity()?;\n\n    let mut selected = Vec::new();\n    append(\n        &identity,\n        &mut selected,\n        Event::OperationSelected,\n        Operation,\n        1,\n    )?;\n    let mut foreign_authorization = event_init(\n        &identity,\n        Event::AuthorizationSelected,\n        Operation,\n        ResultClass::Exact,\n        2,\n    );\n    foreign_authorization.payload_digest = digest(9_998);\n    require(\n        append_release_operation_event_v1(\n            &identity,\n            &selected,\n            foreign_authorization,\n        )\n        .is_err(),\n        "a foreign authorization digest must never become selected authority",\n    )?;\n    require(\n        event_init(\n            &identity,\n            Event::AuthorizationSelected,\n            Operation,\n            ResultClass::Exact,\n            2,\n        )\n        .payload_digest\n            == identity.authorization_digest,\n        "valid authorization fixtures must name the immutable authorization digest",\n    )?;\n\n    for result in [\n''',
          )

          contract = "crates/allow-report/tests/release_operation_authority_contract.rs"
          replace_once(
              contract,
              '''    compile_release_operation_head_v1, evaluate_release_operation_v1,\n    render_release_operation_evaluation_v1, render_release_operation_event_v1,\n''',
              '''    compile_release_operation_head_v1, evaluate_release_operation_v1,\n    release_operation_event_digest_v1, render_release_operation_evaluation_v1,\n    render_release_operation_event_v1,\n''',
          )
          replace_once(
              contract,
              '''fn event_init(\n    identity: &allow_report::CargoAllowReleaseOperationIdentityV1,\n    class: CargoAllowReleaseOperationEventClassV1,\n    sequence_hint: u64,\n) -> CargoAllowReleaseOperationEventInitV1 {\n    CargoAllowReleaseOperationEventInitV1 {\n        event_class: class,\n        subject: CargoAllowReleaseOperationEventSubjectV1::Operation,\n        payload_schema_id: "cargo-allow.synthetic-operation-payload.v1".to_string(),\n        payload_digest: digest(1000 + sequence_hint),\n''',
              '''fn event_init(\n    identity: &allow_report::CargoAllowReleaseOperationIdentityV1,\n    class: CargoAllowReleaseOperationEventClassV1,\n    sequence_hint: u64,\n) -> CargoAllowReleaseOperationEventInitV1 {\n    let payload_digest = if class\n        == CargoAllowReleaseOperationEventClassV1::AuthorizationSelected\n    {\n        identity.authorization_digest.clone()\n    } else {\n        digest(1000 + sequence_hint)\n    };\n    CargoAllowReleaseOperationEventInitV1 {\n        event_class: class,\n        subject: CargoAllowReleaseOperationEventSubjectV1::Operation,\n        payload_schema_id: "cargo-allow.synthetic-operation-payload.v1".to_string(),\n        payload_digest,\n''',
          )
          replace_once(
              contract,
              '''    validate_release_operation_history_v1(&loaded_identity, &loaded_events)\n        .map_err(io::Error::other)?;\n\n    let head = compile_release_operation_head_v1(&identity, &events, EVALUATED_AT_UNIX_SECONDS)\n''',
              '''    validate_release_operation_history_v1(&loaded_identity, &loaded_events)\n        .map_err(io::Error::other)?;\n\n    let mut foreign_authorization = loaded_events.clone();\n    let authorization = foreign_authorization\n        .get_mut(1)\n        .ok_or_else(|| io::Error::other("authorization event fixture should exist"))?;\n    authorization.payload_digest = digest(9_999);\n    authorization.event_digest = release_operation_event_digest_v1(authorization)?;\n    require(\n        validate_release_operation_history_v1(&loaded_identity, &foreign_authorization).is_err(),\n        "a recomputed event digest must not let a foreign authorization payload replay",\n    )?;\n\n    let head = compile_release_operation_head_v1(&identity, &events, EVALUATED_AT_UNIX_SECONDS)\n''',
          )
          PY
          git rm .github/workflows/repair-pr4303-authorization-binding.yml
          cargo fmt --all

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision

      - name: Prove the bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit the bounded source-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "57976f1451d92f144b5de38d4e6f1e9f2759e62a"
          python3 - <<'PY'
          import subprocess
          expected = {\n              ".github/workflows/repair-pr4303-authorization-binding.yml",\n              "crates/allow-report/src/artifacts/release_operation_authority_v1.rs",\n              "crates/allow-report/tests/release_operation_authority_contract.rs",\n              "crates/cargo-allow/tests/release_operation_authority.rs",\n          }\n          actual = set(\n              subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True)\n              .splitlines()\n          )\n          if actual != expected:\n              raise SystemExit(f"unexpected repair paths: {sorted(actual)}")\n          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): bind selected authorization to operation identity"
          git push origin HEAD:release/3940-operation-authority-v1
