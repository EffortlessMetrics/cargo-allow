name: one-shot-verify-2375

on:
  push:
    branches:
      - agent/exact-rust-test-subjects-2224

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/exact-rust-test-subjects-2224
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Run focused checks and capture output
        shell: bash
        run: |
          mkdir -p target/one-shot-verify
          set +e
          cargo clippy -p allow-rust --all-targets --locked -- -D warnings > target/one-shot-verify/clippy.log 2>&1
          clippy_status=$?
          cargo test -p allow-rust --locked --no-fail-fast > target/one-shot-verify/test.log 2>&1
          test_status=$?
          printf 'clippy=%s\ntest=%s\n' "$clippy_status" "$test_status" > target/one-shot-verify/status
          exit 0
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: one-shot-verify-2375
          path: target/one-shot-verify
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-verify-2375.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(ci): remove one-shot verification workflow"
          git push origin HEAD:agent/exact-rust-test-subjects-2224
      - name: Preserve verification result
        run: |
          grep -qx 'clippy=0' target/one-shot-verify/status
          grep -qx 'test=0' target/one-shot-verify/status
