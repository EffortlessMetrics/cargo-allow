name: PR 4303 final bounded source repair

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-final-bounded-source-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-final-v3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply exact current-head repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "decd6c7c37b0ec790f05019e1bd8c9b6d441f4b2"
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/pr4303-carrier-head

          python3 - <<'PY'
          from pathlib import Path

          lib = Path("crates/allow-report/src/lib.rs")
          lib_text = lib.read_text(encoding="utf-8")
          start_marker = "// Canonical shared release-operation authority (#3940 PR A).\n"
          end_marker = "// Root re-exports for the durable operation lease (#3925)."
          if lib_text.count(start_marker) != 1 or lib_text.count(end_marker) != 1:
              raise SystemExit("canonical crate-root export markers are not unique")
          start = lib_text.index(start_marker)
          end = lib_text.index(end_marker, start)
          export_lines = [
              "// Canonical shared release-operation authority (#3940 PR A).",
              "pub use artifacts::{",
              "    CargoAllowReleaseOperationAssetRowV1, CargoAllowReleaseOperationAuthorityKindV1,",
              "    CargoAllowReleaseOperationClassV1, CargoAllowReleaseOperationEvaluationV1,",
              "    CargoAllowReleaseOperationEventClassV1, CargoAllowReleaseOperationEventInitV1,",
              "    CargoAllowReleaseOperationEventSubjectV1, CargoAllowReleaseOperationEventV1,",
              "    CargoAllowReleaseOperationHeadV1, CargoAllowReleaseOperationIdentityInitV1,",
              "    CargoAllowReleaseOperationIdentityV1, CargoAllowReleaseOperationPackageRowV1,",
              "    CargoAllowReleaseOperationPredecessorProofV1, CargoAllowReleaseOperationProducerV1,",
              "    CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,",
              "    CargoAllowReleaseOperationStateV1, RELEASE_OPERATION_ASSET_SELECTION,",
              "    RELEASE_OPERATION_AUTHORITY_SCHEMA_VERSION, RELEASE_OPERATION_CHANNEL,",
              "    RELEASE_OPERATION_EVALUATION_SCHEMA_ID, RELEASE_OPERATION_EVENT_SCHEMA_ID,",
              "    RELEASE_OPERATION_GENESIS_DIGEST, RELEASE_OPERATION_HEAD_SCHEMA_ID,",
              "    RELEASE_OPERATION_IDENTITY_SCHEMA_ID, RELEASE_OPERATION_PRODUCT,",
              "    RELEASE_OPERATION_REPOSITORY, RELEASE_OPERATION_TAG, RELEASE_OPERATION_VERSION,",
              "    append_release_operation_event_v1,",
              "    append_release_operation_event_with_predecessor_v1,",
              "    build_release_operation_identity_v1,",
              "    build_release_operation_identity_with_predecessor_v1,",
              "    compile_release_operation_head_v1,",
              "    compile_release_operation_head_with_predecessor_v1,",
              "    evaluate_release_operation_v1, evaluate_release_operation_with_predecessor_v1,",
              "    release_operation_event_digest_v1, release_operation_head_digest_v1,",
              "    release_operation_identity_digest_v1, render_release_operation_evaluation_v1,",
              "    render_release_operation_event_v1, render_release_operation_head_v1,",
              "    render_release_operation_identity_v1, validate_release_operation_evaluation_v1,",
              "    validate_release_operation_evaluation_with_predecessor_v1,",
              "    validate_release_operation_head_v1,",
              "    validate_release_operation_head_with_predecessor_v1,",
              "    validate_release_operation_history_v1,",
              "    validate_release_operation_history_with_predecessor_v1,",
              "    validate_release_operation_identity_v1, validate_release_operation_predecessor_v1,",
              "};",
              "",
              "",
          ]
          lib.write_text(
              lib_text[:start] + "\n".join(export_lines) + lib_text[end:],
              encoding="utf-8",
              newline="\n",
          )

          authority = Path("crates/allow-report/src/artifacts/release_operation_authority_v1.rs")
          authority_text = authority.read_text(encoding="utf-8")
          helper_marker = "fn init_resolves_unknown("
          if authority_text.count(helper_marker) != 1:
              raise SystemExit("expected exactly one superseded unknown-response helper")
          helper_start = authority_text.index(helper_marker)
          helper_end = authority_text.index("fn exact_package_subjects(", helper_start)
          authority.write_text(
              authority_text[:helper_start] + authority_text[helper_end:],
              encoding="utf-8",
              newline="\n",
          )

          test_path = Path("crates/cargo-allow/tests/release_operation_authority.rs")
          test_text = test_path.read_text(encoding="utf-8")
          function_marker = "fn release_operation_incident_and_unknown_states_never_reset_to_clean"
          stale_marker = "    let recovery = build_release_operation_identity_v1(identity_init("
          stale_message = "recovery identity must retain distinct incident lineage and authority"
          if test_text.count(function_marker) != 1 or test_text.count(stale_message) != 1:
              raise SystemExit("stale recovery fixture is not uniquely identifiable")
          function_start = test_text.index(function_marker)
          stale_start = test_text.index(stale_marker, function_start)
          function_end = test_text.index("\n}", stale_start)
          replacement = "\n".join(
              [
                  "    require(",
                  "        build_release_operation_identity_v1(identity_init(",
                  "            CargoAllowReleaseOperationClassV1::IncidentRecovery,",
                  "        ))",
                  "        .is_err(),",
                  "        \"recovery identity must require the typed predecessor builder\",",
                  "    )",
              ]
          )
          test_path.write_text(
              test_text[:stale_start] + replacement + test_text[function_end:],
              encoding="utf-8",
              newline="\n",
          )

          final_lib = lib.read_text(encoding="utf-8")
          for symbol in (
              "CargoAllowReleaseOperationPredecessorProofV1",
              "append_release_operation_event_with_predecessor_v1",
              "build_release_operation_identity_with_predecessor_v1",
              "compile_release_operation_head_with_predecessor_v1",
              "evaluate_release_operation_with_predecessor_v1",
              "validate_release_operation_predecessor_v1",
          ):
              if final_lib.count(symbol) != 1:
                  raise SystemExit(f"crate-root export count is not canonical: {symbol}")
          if helper_marker in authority.read_text(encoding="utf-8"):
              raise SystemExit("superseded unknown-response helper remains")
          final_test = test_path.read_text(encoding="utf-8")
          if stale_message in final_test or final_test.count(
              "recovery identity must require the typed predecessor builder"
          ) != 1:
              raise SystemExit("typed-predecessor fixture replacement failed")
          PY

          cargo fmt --all
          git rm \
            .github/workflows/automation-pr4303-source-repair-v2.yml \
            .github/workflows/automation-pr4303-stale-fixture-fix.yml

          expected="$({
            printf '%s\n' \
              .github/workflows/automation-pr4303-source-repair-v2.yml \
              .github/workflows/automation-pr4303-stale-fixture-fix.yml \
              crates/allow-report/src/artifacts/release_operation_authority_v1.rs \
              crates/allow-report/src/artifacts.rs \
              crates/allow-report/src/lib.rs \
              crates/allow-report/tests/release_operation_authority_contract.rs \
              crates/cargo-allow/tests/release_operation_authority.rs
          } | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git diff --check

      - name: Prove repaired authority
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check -p allow-report --all-targets --locked
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Publish source-only result
        shell: bash
        run: |
          set -euo pipefail
          carrier_head="$(cat /tmp/pr4303-carrier-head)"
          git fetch origin release/3940-operation-authority-v1
          test "$(git rev-parse origin/release/3940-operation-authority-v1)" = "$carrier_head"
          test ! -e .github/workflows/automation-pr4303-source-repair-v2.yml
          test ! -e .github/workflows/automation-pr4303-stale-fixture-fix.yml
          test ! -e .github/workflows/pr4303-bounded-repair.yml

          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(release,#3940): publish and prove canonical operation authority"
          git push origin HEAD:release/3940-operation-authority-v1
