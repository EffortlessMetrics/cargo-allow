name: Bootstrap issue 4277 package identity retry

on:
  push:
    branches:
      - fix/4277-floor-pin-settlement

permissions:
  contents: write

concurrency:
  group: issue-4277-package-identity-retry
  cancel-in-progress: false

jobs:
  retry:
    if: "github.event.head_commit.message == 'chore(ci): retry fixture identity bootstrap (#4277)'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/4277-floor-pin-settlement
          fetch-depth: 0
          persist-credentials: true

      - name: Align the protocol fixture lock identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/test_floor_protocol.py")
          source = path.read_text(encoding="utf-8")
          old = '            \'version = 4\\n[[package]]\\nname = "enabled"\\nversion = "0.1.0"\\n\',\n'
          new = (
              '            \'version = 4\\n[[package]]\\nname = "enabled"\\nversion = "0.1.0"\\n\'\n'
              '            \'source = "registry+https://github.com/rust-lang/crates.io-index"\\n\',\n'
          )
          if source.count(old) != 1:
              raise SystemExit(
                  f"expected exactly one protocol fixture lock line, found {source.count(old)}"
              )
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          PY
          git diff --check

      - name: Commit the retry basis and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-4277-package-identity-retry.yml
          git add scripts/test_floor_protocol.py
          git diff --cached --check
          git commit -m 'chore(ci): apply package identity repair (#4277)'
          git push origin HEAD:fix/4277-floor-pin-settlement
