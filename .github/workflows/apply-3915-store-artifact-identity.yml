name: Apply 3915 store artifact identity

on:
  push:
    branches:
      - fix/3915-root-bound-cache-target
    paths:
      - .github/workflows/apply-3915-store-artifact-identity.yml

permissions:
  contents: write

concurrency:
  group: apply-3915-store-artifact-identity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/3915-root-bound-cache-target
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply exact artifact identity patch
        run: python scripts/apply-3915-store-artifact-identity.py
      - name: Format changed store source
        run: rustfmt --edition 2024 --config skip_children=true crates/allow-rust/src/scan_cache_store.rs crates/allow-rust/src/scan_cache_process_tests.rs
      - name: Verify default and minimal builds
        shell: bash
        run: |
          cargo check -p allow-rust --locked
          cargo check -p allow-rust --no-default-features --locked
          cargo clippy -p allow-rust --all-targets --locked -- -D warnings
      - name: Run artifact identity and process fixtures
        shell: bash
        run: |
          cargo test -p allow-rust scan_cache_store --locked -- --nocapture
          cargo test -p allow-rust cache_root_alias --locked -- --nocapture
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add crates/allow-rust/src/scan_cache_store.rs crates/allow-rust/src/scan_cache_process_tests.rs
          git diff --cached --check
          git commit -m "fix(cache): recheck artifact identities at replace"
          git push origin HEAD:fix/3915-root-bound-cache-target
