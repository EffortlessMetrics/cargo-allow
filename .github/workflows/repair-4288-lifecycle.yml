name: Apply exact 4288 lifecycle repair

on:
  push:
    branches:
      - fix/4283-product-floor-isolation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/4283-product-floor-isolation
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact repair subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f1d772695931ebdba0af80f9bb63287c085bc1ef"
          test "$(git rev-parse HEAD^^)" = "538220d3421fc044ebc0c857a46e8531bc6849c0"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-4288-lifecycle.yml"
          test "$(git hash-object policy/allow.toml)" = "45cc93c07d12ad9b62c223a7dae23fc86998e72e"
          test ! -e .allow/revisions/4283-direct-floor-product-isolation.toml
      - name: Append exact policy and lifecycle bytes
        shell: bash
        env:
          POLICY_APPEND_B64: 
          REVISION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          policy = Path("policy/allow.toml")
          revision = Path(".allow/revisions/4283-direct-floor-product-isolation.toml")
          before = policy.read_bytes()
          assert b'id = "allow-11296"' in before
          assert b'id = "allow-11297"' in before
          assert b'id = "allow-4283-direct-floor-product-revision"' not in before
          assert not revision.exists()

          appended = base64.b64decode(os.environ["POLICY_APPEND_B64"], validate=True)
          revision_bytes = base64.b64decode(os.environ["REVISION_B64"], validate=True)
          assert appended.startswith(b"\n\n[[allow]]\n")
          policy.write_bytes(before + appended)
          revision.parent.mkdir(parents=True, exist_ok=True)
          revision.write_bytes(revision_bytes)

          after = policy.read_bytes()
          assert after[: len(before)] == before
          assert after[len(before) :] == appended
          assert revision.read_bytes() == revision_bytes
          PY
      - name: Commit exact net repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-4288-lifecycle.yml
          git add policy/allow.toml .allow/revisions/4283-direct-floor-product-isolation.toml
          git diff --cached --check
          git config user.name "cargo-allow automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(policy): receipt 4283 direct-floor additions"
      - name: Verify lifecycle gate and focused proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          cargo run -p cargo-allow -- diff --base origin/main --format markdown --require-change-note
          python3 scripts/test_floor_product_workspace.py
          bash scripts/test-proof-direct-floors-protocol.sh
      - name: Push exact repair
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/4283-product-floor-isolation
