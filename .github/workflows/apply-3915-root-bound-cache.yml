name: Apply 3915 root-bound cache

on:
  push:
    branches:
      - fix/3915-root-bound-cache-target
    paths:
      - .github/workflows/apply-3915-root-bound-cache.yml

permissions:
  contents: write

concurrency:
  group: apply-3915-root-bound-cache
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/3915-root-bound-cache-target
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply exact source wiring
        run: python scripts/apply-3915-root-bound-cache.py
      - name: Format changed Rust files only
        shell: bash
        run: |
          rustfmt --edition 2024 --config skip_children=true \
            crates/allow-rust/src/root_bound_scan_cache.rs \
            crates/allow-rust/src/lib.rs \
            crates/allow-rust/src/tests/cache_root_alias.rs \
            crates/allow-rust/src/tests/persistent_scan_cache.rs \
            crates/allow-rust/src/scan_cache_store.rs \
            crates/cargo-allow/src/world.rs
      - name: Resolve lockfile and compile
        shell: bash
        run: |
          cargo check -p allow-rust
          cargo check -p cargo-allow
      - name: Targeted cache proof
        run: cargo test -p allow-rust cache_root_alias --locked -- --nocapture
      - name: Commit generated wiring and lockfile
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            Cargo.toml Cargo.lock \
            crates/allow-rust/Cargo.toml \
            crates/allow-rust/src/root_bound_scan_cache.rs \
            crates/allow-rust/src/lib.rs \
            crates/allow-rust/src/tests/cache_root_alias.rs \
            crates/allow-rust/src/tests/persistent_scan_cache.rs \
            crates/allow-rust/src/scan_cache_store.rs \
            crates/cargo-allow/src/world.rs \
            .changes/Fixed-20260825-root-bound-scan-cache.yaml
          git diff --cached --check
          git commit -m "fix(cache): bind persistent store to repository root"
          git push origin HEAD:fix/3915-root-bound-cache-target
