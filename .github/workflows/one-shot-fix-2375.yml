name: one-shot-fix-2375

on:
  push:
    branches:
      - agent/exact-rust-test-subjects-2224

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/exact-rust-test-subjects-2224
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Correct target inference and clean temporary logs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/allow-rust/src/test_subjects.rs')
          text = path.read_text()
          text = text.replace('use std::collections::{BTreeMap, BTreeSet};', 'use std::collections::BTreeSet;')
          text = text.replace(
              '#[derive(Clone, Debug, Eq, PartialEq)]\npub struct RustTestInventoryOptions',
              '#[derive(Clone, Debug, Default, Eq, PartialEq)]\npub struct RustTestInventoryOptions',
              1,
          )
          default_impl = '''\nimpl Default for RustTestInventoryOptions {\n    fn default() -> Self {\n        Self {\n            additional_test_attributes: BTreeSet::new(),\n        }\n    }\n}\n'''
          if default_impl not in text:
              raise SystemExit('manual RustTestInventoryOptions Default impl not found')
          text = text.replace(default_impl, '\n', 1)
          implicit_bin = '''    if key == "bin" && table.get(key).is_none() {\n        targets.push(DeclaredTarget {\n            identity: RustTestTargetIdentity {\n                kind,\n                name: default_name.to_string(),\n            },\n            path: root.join(default_path),\n        });\n        return targets;\n    }\n'''
          if implicit_bin not in text:
              raise SystemExit('implicit binary target block not found')
          text = text.replace(implicit_bin, '', 1)
          path.write_text(text)
          PY
          rm -f .tmp/verification/2375-clippy.log .tmp/verification/2375-test.log
          rm -f .tmp/verification/2375-clippy-status .tmp/verification/2375-test-status
          rmdir .tmp/verification 2>/dev/null || true
          rmdir .tmp 2>/dev/null || true
          git rm .github/workflows/one-shot-fix-2375.yml
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(rust): keep implicit binaries from claiming library modules"
          git push origin HEAD:agent/exact-rust-test-subjects-2224
