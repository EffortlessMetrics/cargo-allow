# Trigger after workflow registration.
name: One-shot canonical intent-protocol rebuild

on:
  push:
    branches:
      - refactor/intent-protocol-canonical-repo-3387
    paths:
      - .github/workflows/one-shot-intent-protocol-canonical-rebuild.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/one-shot-intent-protocol-canonical-rebuild.yml

permissions:
  contents: write

jobs:
  converge:
    if: github.event_name == 'push' || github.head_ref == 'refactor/intent-protocol-canonical-repo-3387'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/intent-protocol-canonical-repo-3387
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Refresh lock and movement authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("policy/product-move-ledger.toml")
          text = path.read_text(encoding="utf-8")
          marker = 'id = "INVENTORY-INTENT_PROTOCOL-SRC"'
          start = text.index(marker)
          line_start = text.index('current_paths = [', start)
          line_end = text.index('\n', line_start)
          line = text[line_start:line_end]
          removed_paths = [
              "crates/intent-protocol/src/snapshot_package/mod.rs",
              "crates/intent-protocol/src/snapshot_package/repo_protocol/mod.rs",
              "crates/intent-protocol/src/snapshot_package/repo_protocol/repository_snapshot.rs",
              "crates/intent-protocol/src/snapshot_package/repo_protocol/result_class.rs",
          ]
          for removed in removed_paths:
              quoted = f'"{removed}"'
              if quoted not in line:
                  raise SystemExit(f"unexpected inventory row; missing {quoted}")
              line = line.replace(f'{quoted}, ', "").replace(f', {quoted}', "").replace(quoted, "")
          path.write_text(text[:line_start] + line + text[line_end:], encoding="utf-8")
          PY
          cargo fmt --all
          cargo metadata --format-version 1 >/dev/null
          cargo clippy -p intent-protocol --all-targets --locked -- -D warnings
          cargo test -p intent-protocol --locked
          cargo test -p allow-policy regenerate_product_move_map_projection -- --ignored
          cargo test -p allow-policy --locked repository_move_ledger_is_complete_and_projection_is_current
          cargo test -p cargo-allow --bin cargo-allow --locked product_move_ledger -- --nocapture
          git rm .github/workflows/one-shot-intent-protocol-canonical-rebuild.yml
          git add Cargo.lock .changes/Fixed-20260811-intent-protocol-canonical-repo.yaml crates/intent-protocol policy/product-move-ledger.toml docs/architecture/product-move-map.md
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "refactor(intent-protocol): use canonical repository contracts"
          git push origin HEAD:refactor/intent-protocol-canonical-repo-3387
