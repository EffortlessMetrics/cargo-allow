# Trigger after workflow registration.
name: One-shot proof subject consumer rebuild

on:
  push:
    branches:
      - feat/proof-orchestrator-subject-reconciliation-3147
    paths:
      - .github/workflows/one-shot-proof-subject-rebuild.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/proof-orchestrator-subject-reconciliation-3147
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Regenerate lock and prove proof consumer
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo metadata --format-version 1 >/dev/null
          cargo clippy -p proof-orchestrator --all-targets --locked -- -D warnings
          cargo test -p proof-orchestrator --locked
          git rm .github/workflows/one-shot-proof-subject-rebuild.yml
          git add Cargo.lock crates/proof-engine .changes/Added-20260811-proof-subject-reconciliation.yaml
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "feat(proof-orchestrator): reconcile structural subjects"
          git push origin HEAD:feat/proof-orchestrator-subject-reconciliation-3147
