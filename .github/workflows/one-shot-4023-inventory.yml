name: One-shot 4023 lifecycle-date inventory

on:
  push:
    branches:
      - fix/4023-relative-fixture-dates

permissions:
  contents: read

concurrency:
  group: one-shot-4023-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory valid future lifecycle dates in cargo-allow integration fixtures
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import re
          from pathlib import Path

          root = Path("crates/cargo-allow/tests")
          field_pattern = re.compile(
              r'\b(created|expires|review_after)\s*=\s*\\?"(20\d{2}-\d{2}-\d{2})\\?"'
          )
          function_pattern = re.compile(r'^\s*(?:pub(?:\([^)]*\))?\s+)?fn\s+([A-Za-z0-9_]+)')
          today = dt.date.today()
          records: list[dict[str, object]] = []

          for path in sorted(root.rglob("*.rs")):
              lines = path.read_text(encoding="utf-8").splitlines()
              current_function = "<module>"
              for line_number, line in enumerate(lines, start=1):
                  function_match = function_pattern.match(line)
                  if function_match:
                      current_function = function_match.group(1)
                  for match in field_pattern.finditer(line):
                      date_text = match.group(2)
                      try:
                          parsed_date = dt.date.fromisoformat(date_text)
                      except ValueError:
                          continue
                      if parsed_date < today:
                          continue
                      first = max(1, line_number - 4)
                      last = min(len(lines), line_number + 4)
                      context = [
                          f"{index:04d}: {lines[index - 1]}"
                          for index in range(first, last + 1)
                      ]
                      records.append(
                          {
                              "path": path.as_posix(),
                              "line": line_number,
                              "field": match.group(1),
                              "date": date_text,
                              "distance_days": (parsed_date - today).days,
                              "function": current_function,
                              "context": context,
                          }
                      )

          print("AGING_INTEGRATION_FIXTURE_DATES_V1")
          print(json.dumps(records, indent=2, sort_keys=True))
          print(f"AGING_INTEGRATION_FIXTURE_COUNT={len(records)}")
          if not records:
              raise SystemExit("expected at least one valid current/future lifecycle fixture date")
          PY
