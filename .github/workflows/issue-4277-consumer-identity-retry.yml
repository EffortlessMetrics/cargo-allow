name: Retry issue 4277 floor identity consumers

on:
  push:
    branches:
      - fix/4277-floor-pin-settlement

permissions:
  contents: write

concurrency:
  group: issue-4277-consumer-identity-repair
  cancel-in-progress: false

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(ci): retry complete floor identity repair (#4277)'"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reuse the reviewed package-identity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT4277'
          from pathlib import Path

          carrier = Path(".github/workflows/issue-4277-consumer-identity-repair.yml")
          lines = carrier.read_text(encoding="utf-8").splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PYFIX4277'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "PYFIX4277")
          prefix = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          body = []
          for line in lines[start + 1 : end]:
              if not line.startswith(prefix):
                  raise SystemExit("reviewed patch indentation changed unexpectedly")
              body.append(line[len(prefix) :])
          Path("/tmp/issue-4277-consumers.py").write_text(
              "".join(body), encoding="utf-8", newline="\n"
          )
          PYEXTRACT4277
          python3 /tmp/issue-4277-consumers.py

          python3 - <<'PYSHIM4277'
          from pathlib import Path

          path = Path("scripts/test_floor_protocol.py")
          text = path.read_text(encoding="utf-8")
          start_marker = '    if program == "cargo" and len(arguments) == 5 and arguments[0] == "update":\n'
          end_marker = '    if program == "cargo" and arguments and arguments[0] in ("check", "test", "package"):\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("protocol cargo-update markers are not unique")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = "\n".join([
              '    if program == "cargo" and len(arguments) == 5 and arguments[0] == "update":',
              '        if arguments[1] != "-p" or arguments[3] != "--precise":',
              '            return 70, "", "unexpected simulated update arguments"',
              '        package_spec = arguments[2]',
              '        package = package_spec.split("@", 1)[0]',
              '        if package == case.get("fail_pin"):',
              '            return 42, "", "simulated floor pin failure"',
              "        lock = 'version = 4\\n[[package]]\\nname = ' + json.dumps(package)",
              "        lock += '\\nversion = ' + json.dumps(arguments[4])",
              "        lock += '\\nsource = \"registry+https://github.com/rust-lang/crates.io-index\"\\n'",
              '        Path("Cargo.lock").write_text(lock, encoding="utf-8", newline="\\n")',
              '        return 0, "", ""',
              '',
          ])
          path.write_text(text[:start] + block + text[end:], encoding="utf-8", newline="\n")
          PYSHIM4277
          git diff --check

      - name: Run focused settlement and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_floor_pin_settlement.py
          bash scripts/test-proof-direct-floors-protocol.sh

      - name: Remove temporary carriers before repository guards
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-4277-consumer-identity-repair.yml
          git rm .github/workflows/issue-4277-consumer-identity-retry.yml

      - name: Run source and change-note guards
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          cargo run -p cargo-allow --locked -- diff \
            --base 2dc1b07e182935cc7c2654035e2fef8b1199ad1a \
            --require-change-note --format json \
            --output target/issue-4277-consumer-identity-diff.json

      - name: Commit the complete package-identity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/floor_pin_settlement.py scripts/proof-direct-floors.sh \
            scripts/test_floor_protocol.py
          git diff --cached --check
          git commit -m 'fix(ci): unify direct-floor package identity consumers (#4277)'
          git push origin HEAD:fix/4277-floor-pin-settlement
