name: One-shot 4023 execute lifecycle repair

on:
  push:
    branches:
      - fix/4023-relative-fixture-dates
    paths:
      - .github/workflows/one-shot-4023-execute.yml

permissions:
  contents: write

concurrency:
  group: one-shot-4023-execute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/4023-relative-fixture-dates

      - name: Execute the reviewed transformation without mutating workflows
        shell: bash
        run: |
          python - <<'DRIVER'
          from __future__ import annotations

          import textwrap
          from pathlib import Path

          workflow_path = Path(".github/workflows/one-shot-4023-implement.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          step_marker = "      - name: Convert live lifecycle fixtures and add the recurrence guard\n"
          step_at = workflow.find(step_marker)
          if step_at < 0:
              raise SystemExit("implementation step marker missing")
          python_marker = "          python - <<'PY'\n"
          script_start = workflow.find(python_marker, step_at)
          if script_start < 0:
              raise SystemExit("implementation Python marker missing")
          script_start += len(python_marker)
          script_end = workflow.find("\n          PY\n", script_start)
          if script_end < 0:
              raise SystemExit("implementation Python terminator missing")
          script = textwrap.dedent(workflow[script_start:script_end])
          exec(compile(script, str(workflow_path), "exec"), {"__name__": "__main__"})

          fixture_path = Path("crates/cargo-allow/tests/saved_artifact_outputs/fixture.rs")
          fixture = fixture_path.read_text(encoding="utf-8")
          name_marker = "fn dated_resolves_every_live_fixture_token_relative_to_today()"
          name_at = fixture.find(name_marker)
          if name_at < 0:
              raise SystemExit("generated lifecycle adapter test missing")
          test_start = fixture.rfind("#[test]", 0, name_at)
          if test_start < 0:
              raise SystemExit("generated lifecycle adapter test attribute missing")
          test_end = fixture.find("\n#[", name_at)
          if test_end < 0:
              test_end = len(fixture)
          replacement = r'''#[test]
          fn dated_resolves_every_live_fixture_token_relative_to_today() {
              let rendered = dated(&format!(
                  r#"created = "{FIXTURE_CREATED_TOKEN}"
          review_after = "{FIXTURE_REVIEW_AFTER_TOKEN}"
          expires = "{FIXTURE_EXPIRES_TOKEN}"
          "#
              ));
              assert!(rendered.contains(&format!("created = \"{}\"", fixture_created())));
              assert!(rendered.contains(&format!(
                  "review_after = \"{}\"",
                  fixture_review_after()
              )));
              assert!(rendered.contains(&format!("expires = \"{}\"", fixture_expires())));
              assert!(!rendered.contains("__CARGO_ALLOW_FIXTURE_"));
          }
          '''
          fixture_path.write_text(
              fixture[:test_start] + replacement + fixture[test_end:],
              encoding="utf-8",
          )
          DRIVER

      - name: Format and run focused lifecycle fixtures
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p cargo-allow --test lifecycle_fixture_date_guard
          cargo test --locked -p cargo-allow --test saved_artifact_outputs
          cargo test --locked -p cargo-allow --test lifecycle_corpus
          cargo test --locked -p cargo-allow --test audit_output
          cargo test --locked -p cargo-allow --test summary_output
          cargo test --locked -p cargo-allow --test add_glob_ratchet
          cargo test --locked -p cargo-allow --test concurrent_mutation

      - name: Run workspace review gates
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast

      - name: Commit and push only the reviewed product and test files
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            crates/cargo-allow/tests/add_glob_ratchet.rs \
            crates/cargo-allow/tests/audit_output.rs \
            crates/cargo-allow/tests/concurrent_mutation.rs \
            crates/cargo-allow/tests/lifecycle_corpus.rs \
            crates/cargo-allow/tests/lifecycle_fixture_date_guard.rs \
            crates/cargo-allow/tests/saved_artifact_outputs.rs \
            crates/cargo-allow/tests/saved_artifact_outputs/diff.rs \
            crates/cargo-allow/tests/saved_artifact_outputs/fixture.rs \
            crates/cargo-allow/tests/saved_artifact_outputs/migrate.rs \
            crates/cargo-allow/tests/summary_output.rs
          git diff --cached --check
          git commit -m "test: make live lifecycle fixtures today-relative"
          git push origin HEAD:fix/4023-relative-fixture-dates
