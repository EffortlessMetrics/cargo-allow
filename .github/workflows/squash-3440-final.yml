name: Squash #3440 to effective source diff

on:
  push:
    branches:
      - automation/3440-final-squash

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rebuild implementation as one clean commit
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: bbf0d23ebcef469512d82806565325f033a0e977
        run: |
          set -euo pipefail
          git fetch origin main fix/3440-package-identities
          actual_source_head="$(git rev-parse origin/fix/3440-package-identities)"
          if [ "${actual_source_head}" != "${EXPECTED_SOURCE_HEAD}" ]; then
            echo "::error::source branch moved: expected ${EXPECTED_SOURCE_HEAD}, got ${actual_source_head}"
            exit 1
          fi

          git checkout --detach origin/main
          git diff --binary origin/main..origin/fix/3440-package-identities > /tmp/3440.patch
          git apply --index /tmp/3440.patch

          expected="Cargo.lock
          Cargo.toml
          crates/allow-policy/src/product_crates/v2_reconcile.rs
          crates/cargo-allow/Cargo.toml
          crates/cargo-allow/src/product_package_topology_tests.rs
          crates/cargo-allow/src/publish_order_validation_tests.rs
          crates/cargo-allow/src/release_prep_tests.rs
          crates/cargo-intent/Cargo.toml
          crates/cargo-proof/Cargo.toml
          crates/intent-edit/Cargo.toml
          crates/intent-engine/Cargo.toml
          crates/proof-engine/Cargo.toml
          docs/dogfood/fixtures/release/intent-candidate-crate-set.toml
          docs/dogfood/fixtures/release/proof-candidate-crate-set.toml
          policy/product-crates-v2.toml
          policy/product-package-topology-v2.toml
          scripts/intent-candidate-smoke.sh
          scripts/package-candidate-smoke.sh
          scripts/proof-candidate-smoke.sh"
          actual="$(git diff --cached --name-only)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::unexpected effective diff"
            printf 'expected:\n%s\nactual:\n%s\n' "${expected}" "${actual}"
            exit 1
          fi

          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(packages): select final intent and proof package identities (#3440)"
          clean_head="$(git rev-parse HEAD)"
          git push --force-with-lease=refs/heads/fix/3440-package-identities:${EXPECTED_SOURCE_HEAD} \
            origin "${clean_head}:refs/heads/fix/3440-package-identities"
          git push origin --delete automation/3440-final-squash
