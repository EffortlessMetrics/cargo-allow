name: Agent clippy diagnostics

on:
  push:
    branches:
      - agent/harden-git-revision-boundary

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message != 'chore: record clippy diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture diagnostics
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > .agent-clippy.txt 2>&1
          status=$?
          set -e
          printf '\nclippy_status=%s\n' "${status}" >> .agent-clippy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-clippy.txt
          git commit -m "chore: record clippy diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
