name: Apply 3915 cache identity closeout

on:
  push:
    branches:
      - fix/3915-root-bound-cache-target
    paths:
      - .github/workflows/apply-3915-cache-identity-closeout.yml

permissions:
  contents: write

concurrency:
  group: apply-3915-cache-identity-closeout
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/3915-root-bound-cache-target
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Repair generator output and apply exact closeout patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-3915-cache-identity-closeout.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "new_test = '''": "new_test = r'''",
              "world_test = '''": "world_test = r'''",
              '        if outside\n            .join("cargo-allow/cache/scan-cache.v2.bin")\n            .exists()\n        {': '        if outside.join("cargo-allow/cache/scan-cache.v2.bin").exists() {',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"generator source drift: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python scripts/apply-3915-cache-identity-closeout.py
      - name: Format changed Rust files
        shell: bash
        run: |
          rustfmt --edition 2024 --config skip_children=true \
            crates/allow-rust/src/scan_cache_store.rs \
            crates/allow-rust/src/tests/cache_root_alias.rs
          rustfmt --edition 2024 --config skip_children=true --check crates/cargo-allow/src/world.rs
      - name: Verify feature and product surfaces
        shell: bash
        run: |
          cargo check -p allow-rust --locked
          cargo check -p allow-rust --no-default-features --locked
          cargo clippy -p allow-rust -p cargo-allow --all-targets --locked -- -D warnings
      - name: Run closeout fixtures
        shell: bash
        run: |
          cargo test -p allow-rust scan_cache_store --locked -- --nocapture
          cargo test -p allow-rust cache_root_alias --locked -- --nocapture
          cargo test -p cargo-allow --bin cargo-allow persistent_cache_admission_failure --locked -- --nocapture
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            crates/allow-rust/Cargo.toml \
            crates/allow-rust/src/scan_cache_store.rs \
            crates/allow-rust/src/tests/cache_root_alias.rs \
            crates/cargo-allow/src/world.rs
          git diff --cached --check -- . ':(exclude)crates/cargo-allow/src/world.rs'
          stat=$(git diff --cached --numstat -- crates/cargo-allow/src/world.rs)
          echo "world.rs staged numstat: $stat"
          additions=$(printf '%s' "$stat" | awk '{print $1}')
          deletions=$(printf '%s' "$stat" | awk '{print $2}')
          test "$additions" -le 100
          test "$deletions" -le 100
          git commit -m "test(cache): prove identity failure cold fallback"
          git push origin HEAD:fix/3915-root-bound-cache-target
