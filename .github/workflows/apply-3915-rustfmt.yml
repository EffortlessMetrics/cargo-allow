name: Apply 3915 rustfmt closeout

on:
  push:
    branches:
      - fix/3915-root-bound-cache-target
    paths:
      - .github/workflows/apply-3915-rustfmt.yml

permissions:
  contents: write

concurrency:
  group: apply-3915-rustfmt
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3915-root-bound-cache-target
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format and validate typed cache repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p allow-rust
          rm .github/workflows/apply-3915-rustfmt.yml
          cargo fmt -p allow-rust -- --check
          cargo test -p allow-rust cache_root_alias --locked -- --nocapture
          cargo clippy -p allow-rust --all-targets --locked -- -D warnings
          git diff --check
      - name: Commit formatted product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          git commit -m "style(cache): format typed flush disposition repair"
          git push origin HEAD:fix/3915-root-bound-cache-target
