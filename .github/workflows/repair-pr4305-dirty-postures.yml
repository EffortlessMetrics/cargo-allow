name: Repair PR 4305 dirty posture proofs

on:
  push:
    branches:
      - fix/package-byte-authority

permissions:
  contents: write

concurrency:
  group: repair-pr-4305-dirty-postures
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/package-byte-authority
          fetch-depth: 2
          persist-credentials: true

      - name: Guard and stage the exact test repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4e07f39a7bc1a1d88bc79473b6e86655dd97d6c3"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr4305-dirty-postures.yml"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          path = Path("scripts/test-package-byte-authority.py")
          replace_once(
              path,
              '''import tempfile\nimport unittest\nfrom pathlib import Path\n''',
              '''import tempfile\nimport unittest\nfrom io import BytesIO\nfrom pathlib import Path\n''',
          )
          replace_once(
              path,
              '''def sole_crate(target_dir):\n''',
              '''def rewrite_vcs_dirty(archive, prefix, output, dirty):\n    """Rewrite only git.dirty in a real Cargo-produced archive."""\n    member_name = f"{prefix}/.cargo_vcs_info.json"\n    rewritten = 0\n    with tarfile.open(archive, mode="r:gz") as source, tarfile.open(\n        output, mode="w:gz"\n    ) as target:\n        for member in source.getmembers():\n            data = None\n            if member.isfile():\n                payload = source.extractfile(member)\n                if payload is None:\n                    raise AssertionError(f"could not read archive member {member.name}")\n                data = payload.read()\n            if member.name == member_name:\n                info = json.loads(data.decode("utf-8"))\n                git = info.get("git")\n                if not isinstance(git, dict):\n                    raise AssertionError("real Cargo VCS metadata lacks its git object")\n                git["dirty"] = dirty\n                data = (json.dumps(info, sort_keys=True) + "\\n").encode("utf-8")\n                member.size = len(data)\n                rewritten += 1\n            target.addfile(member, BytesIO(data) if data is not None else None)\n    if rewritten != 1:\n        raise AssertionError(\n            f"expected one VCS metadata member to rewrite, found {rewritten}"\n        )\n\n\ndef sole_crate(target_dir):\n''',
          )
          replace_once(
              path,
              '''        accepted = verifier_process(archive, prefix, head)\n        self.assertEqual(accepted.returncode, 0, accepted.stderr)\n\n    def test_dirty_worktree_package_is_rejected(self):\n''',
              '''        accepted = verifier_process(archive, prefix, head)\n        self.assertEqual(accepted.returncode, 0, accepted.stderr)\n\n        explicit_false = root / "explicit-dirty-false.crate"\n        rewrite_vcs_dirty(archive, prefix, explicit_false, False)\n        accepted_false = verifier_process(explicit_false, prefix, head)\n        self.assertEqual(accepted_false.returncode, 0, accepted_false.stderr)\n\n        for label, malformed in (("string", "false"), ("null", None), ("integer", 0)):\n            with self.subTest(dirty_posture=label):\n                malformed_archive = root / f"malformed-dirty-{label}.crate"\n                rewrite_vcs_dirty(archive, prefix, malformed_archive, malformed)\n                rejected = verifier_process(malformed_archive, prefix, head)\n                self.assertNotEqual(rejected.returncode, 0)\n                self.assertIn(\n                    "git.dirty must be a JSON boolean when present",\n                    rejected.stderr,\n                )\n\n    def test_dirty_worktree_package_is_rejected(self):\n''',
          )
          PY
          git rm .github/workflows/repair-pr4305-dirty-postures.yml

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision

      - name: Prove the bounded test repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/test-package-byte-authority.py
          python3 scripts/test-package-byte-authority.py
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git restore --source=HEAD --staged --worktree .github/workflows/repair-pr4305-dirty-postures.yml
          git diff --check

      - name: Commit the source-only test repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4e07f39a7bc1a1d88bc79473b6e86655dd97d6c3"
          mapfile -t changed < <(git diff --name-only HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "scripts/test-package-byte-authority.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-package-byte-authority.py
          git commit -m "test(package): prove typed dirty metadata postures"
          git push origin HEAD:fix/package-byte-authority
