name: Reconcile PR 4303 with current main

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: reconcile-pr-4303-with-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[reconcile-4303-main]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision
        with:
          components: rustfmt, clippy

      - name: Merge current main and resolve the one audited conflict
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fc7be0d41de121a48c8a50410e2114275c74a31e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/reconcile-pr4303-with-main.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "89d1376390726a34ae8b2cac14f69af7e684153d"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          test "$merge_status" -ne 0

          actual="$(git diff --name-only --diff-filter=U | sort)"
          test "$actual" = "crates/cargo-allow/src/artifact_schema_index_tests.rs"

          path="$actual"
          git show ":1:$path" > /tmp/base
          git show ":2:$path" > /tmp/ours
          git show ":3:$path" > /tmp/theirs
          git merge-file --union -p /tmp/ours /tmp/base /tmp/theirs > "$path"
          git add "$path"

          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/reconcile-pr4303-with-main.yml
          cargo fmt --all
          git diff --check

      - name: Prove the combined operation and checkpoint authorities
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --all-targets --locked -- --nocapture
          cargo test -p cargo-allow --locked \
            --test release_operation_authority \
            --test publication_checkpoint \
            --test publication_checkpoint_runner_loss \
            --test publication_checkpoint_trust \
            -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit the normal two-parent reconciliation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fc7be0d41de121a48c8a50410e2114275c74a31e"
          test "$(git rev-parse MERGE_HEAD)" = "89d1376390726a34ae8b2cac14f69af7e684153d"
          test ! -e .github/workflows/reconcile-pr4303-with-main.yml
          git commit -m "merge(main): reconcile #4302 checkpoint with #3940 PR A"
          git push origin HEAD:release/3940-operation-authority-v1
