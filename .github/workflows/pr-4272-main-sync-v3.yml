name: Stage exact main sync for PR 4272

on:
  push:
    branches:
      - automation/pr-4272-main-sync-v3

permissions:
  contents: write

concurrency:
  group: pr-4272-main-sync-v3
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: dependabot/cargo/patch-updates-b2061204c1
      TARGET_HEAD: a028885f1502067b87aa206a285e2485df857305
      MAIN_HEAD: e7f7109bcb02278799bb863778b2f2dd673afcbb
      OUTPUT_BRANCH: automation/pr-4272-main-sync-output-v3
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/cargo/patch-updates-b2061204c1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and merge the exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN_HEAD"

          git config user.name 'cargo-allow automation'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git merge --no-ff --no-edit "$MAIN_HEAD"

          read -r merge_commit first_parent second_parent extra <<EOF
          $(git rev-list --parents -n 1 HEAD)
          EOF
          test -z "${extra:-}"
          test "$first_parent" = "$TARGET_HEAD"
          test "$second_parent" = "$MAIN_HEAD"

          git diff --check "$TARGET_HEAD" HEAD
          git diff --name-only "$TARGET_HEAD" HEAD | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .changes/Fixed-20260915-212600-floor-python-bytecode.yaml
          scripts/proof-direct-floors.sh
          scripts/test_floor_pin_settlement.py
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Re-run the repaired producer protocol controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_floor_pin_settlement.py
          bash scripts/test-proof-direct-floors-protocol.sh
          git diff --check "$TARGET_HEAD" HEAD

      - name: Publish the verified merge commit to an isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$TARGET_HEAD"
          test "$(git rev-parse HEAD^2)" = "$MAIN_HEAD"
          git rev-parse HEAD
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
