name: Temporary campaign-skill policy receipt

on:
  push:
    branches:
      - feat/3770-campaign-skill

permissions:
  contents: write

concurrency:
  group: temporary-receipt-campaign-skill
  cancel-in-progress: false

jobs:
  receipt:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Receipt the campaign skill through the installed source tree
        run: |
          set -euo pipefail
          mkdir -p target/cargo-allow
          cargo run -p cargo-allow -- why \
            --kind non-rust \
            --path .agents/skills/cargo-allow-0.2-campaign/SKILL.md \
            --line 1 \
            --plan target/cargo-allow/campaign-skill-plan.json
          cargo run -p cargo-allow -- add \
            --from-plan target/cargo-allow/campaign-skill-plan.json \
            --update \
            --owner core/devex \
            --reason "Defines the repository-native implementation router for the selected cargo-allow 0.2 campaign while preserving one-writer, reversible-work, independent-review, and irreversible-operation boundaries." \
            --classification agent_skill \
            --review-after 2027-02-24 \
            --evidence issue:3770 \
            --evidence doc:AGENTS.md \
            --evidence doc:GEMINI.md \
            --evidence doc:docs/campaigns/cargo-allow-0.2.0.md \
            --evidence test:cargo_allow_0_2_campaign_skill_contract_is_wired \
            --summary-format json \
            --summary-output target/cargo-allow/campaign-skill-application.json

      - name: Commit the policy receipt and remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add policy/allow.toml
          git rm .github/workflows/temporary-receipt-campaign-skill.yml
          git commit -m "policy: receipt cargo-allow 0.2 campaign skill (#3770)"

      - name: Validate the exact resulting head
        run: |
          set -euo pipefail
          cargo test -p cargo-allow --test cargo_allow_0_2_campaign_skill --locked -- --nocapture
          cargo test -p cargo-allow --test review_current_head_skill --locked -- --nocapture
          cargo run -p cargo-allow -- check --mode no-new
          git diff --check HEAD^
          git status --short

      - name: Push the validated self-cleaning commit
        run: git push origin HEAD:feat/3770-campaign-skill
