name: Fix PR 4303 v3 digest matcher

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-4303-v3-pattern]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Correct one exact structural matcher and retrigger v3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "03883ee4902ab8f7560cedee29a2a7c8ae1a204e"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/repair_pr4303_envelope_v3.py')
          text = path.read_text(encoding='utf-8')
          old = "struct EventDigestBody<'a>"
          new = "struct EventDigestBodyV1<'a>"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale digest-body matcher, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          python3 -m py_compile .github/scripts/repair_pr4303_envelope_v3.py
          git rm .github/workflows/automation-pr4303-v3-pattern-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(repair): rerun structural envelope closure [repair-4303-envelope-v3]"
          git push origin HEAD:release/3940-operation-authority-v1