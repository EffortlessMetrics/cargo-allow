# Bootstrap the historical changelog into Changie-owned version files before
# the final native batch/merge. This workflow removes itself before commit.
name: One-shot v0.2.0 release closeout

on:
  push:
    branches:
      - release/v0.2.0-closeout
    paths:
      - .github/workflows/one-shot-v020-closeout.yml

permissions:
  contents: write

concurrency:
  group: one-shot-v020-closeout
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.2.0-closeout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.0'
          cache: false
      - name: Apply the durable release closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/one-shot-v020-closeout.py
          python3 scripts/one-shot-changie-bootstrap.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/cargo-allow/src/release_prep_tests.rs')
          text = path.read_text(encoding='utf-8')
          old_version = '''    assert!(
                  publish.contains(r#"version="${RELEASE_VERSION}""#),
                  "publish should consume the preflight-resolved version"
              );'''
          new_version = '''    assert!(
                  publish.contains("needs.preflight.outputs.version"),
                  "publish should consume the preflight-resolved version"
              );'''
          old_archive = '"cargo-allow-' + '$' + '{{ github.ref_name }}' + '-x86_64-unknown-linux-gnu.tar.gz",'
          new_archive = '"cargo-allow-' + '$' + '{{ needs.preflight.outputs.tag }}' + '-x86_64-unknown-linux-gnu.tar.gz",'
          replacements = [
              (old_version, new_version),
              ('"Generate release manifest"', '"Generate exact mixed-version release manifest"'),
              ('"Attach release manifest to GitHub Release"', '"Attach verified release evidence and Linux archive"'),
              (old_archive, new_archive),
              ('workflow.contains("needs: [install-smoke, publish]")', 'workflow.contains("needs: [preflight, install-smoke, publish]")'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          if 'publish.contains("needs.preflight.outputs.version")' not in text:
              raise SystemExit('release recovery version assertion seam changed')
          path.write_text(text, encoding='utf-8')

          manifest = Path('crates/allow-report/src/artifacts/release_manifest.rs')
          text = manifest.read_text(encoding='utf-8')
          old = '        assert_eq!(manifest.crates[9].name, "cargo-allow");'
          new = '''        assert_eq!(
              manifest.crates.last().map(|entry| entry.name.as_str()),
              Some("cargo-allow")
          );'''
          if old not in text:
              raise SystemExit('release manifest mixed-row test seam changed')
          manifest.write_text(text.replace(old, new, 1), encoding='utf-8')

          record = Path('docs/release/0.2.0.md')
          text = record.read_text(encoding='utf-8')
          text = text.replace('## Topology authority order', '## Publish Order', 1)
          needle = '''The output schema is `cargo-allow.sensor-capabilities.v1`, generation 1. It
states which source-tree sensors ran and which claims remain excluded. It is not
a compilation, type-analysis, macro-expansion, MIR, runtime, test-adequacy, or
coverage-proof contract.'''
          replacement = '''The output schema is `cargo-allow.sensor-capabilities.v1`, generation 1. The
catalog describes source-tree sensors and their bounded limitations. The catalog
does not claim compilation, type analysis, macro expansion, MIR, runtime
behavior, or test adequacy. Its checked source of truth remains #2570 and
`docs/support-matrix.toml`; it is not a coverage-proof contract.'''
          if needle not in text:
              raise SystemExit('release capability claim-boundary seam changed')
          record.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8')
          commit_ref = '$' + '{{ needs.preflight.outputs.commit }}'
          tree_ref = '$' + '{{ needs.preflight.outputs.tree }}'
          old = (
              '          test "$(git rev-parse HEAD^{commit})" = "' + commit_ref + '"\n'
              '          test "$(git rev-parse HEAD^{tree})" = "' + tree_ref + '"'
          )
          new = (
              '          if [ "$(git rev-parse HEAD^{commit})" != "' + commit_ref + '" ]; then\n'
              '            echo "::error::publish checkout commit differs from preflight"\n'
              '            exit 1\n'
              '          fi\n'
              '          if [ "$(git rev-parse HEAD^{tree})" != "' + tree_ref + '" ]; then\n'
              '            echo "::error::publish checkout tree differs from preflight"\n'
              '            exit 1\n'
              '          fi'
          )
          if old not in text:
              raise SystemExit('publish identity recheck seam changed')
          release.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install and run exact Changie batch
        env:
          GOBIN: ${{ runner.temp }}/changie-bin
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = 'go1.25.0'
          mkdir -p "${GOBIN}"
          go install github.com/miniscruff/changie@v1.25.2
          go version -m "${GOBIN}/changie" | grep -Eq $'^\tmod\tgithub\.com/miniscruff/changie\tv1\.25\.2(\t|$)'
          "${GOBIN}/changie" batch v0.2.0
          "${GOBIN}/changie" merge
          test "$(grep -c '^## \[0\.2\.0\] - ' CHANGELOG.md)" -eq 1
          test "$(grep -c '^## \[0\.1\.11\] - ' CHANGELOG.md)" -eq 1
          grep -q '^## \[Unreleased\]$' CHANGELOG.md
      - name: Remove temporary migration surfaces
        run: |
          git rm .github/workflows/one-shot-v020-closeout.yml
          git rm scripts/one-shot-v020-closeout.py
          git rm scripts/one-shot-changie-bootstrap.py
      - name: Prove release controller and package graph
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/generate-release-manifest.sh scripts/release-topology-publisher.py
          python3 -m py_compile scripts/release-topology-publisher.py
          test "$(python3 scripts/release-topology-publisher.py --mode namespace --list | wc -l)" -eq 12
          test "$(python3 scripts/release-topology-publisher.py --mode cargo-allow --list | wc -l)" -eq 13
          ! grep -q 'rust-lang/crates-io-auth-action@' .github/workflows/release.yml
          grep -q 'CARGO_REGISTRY_TOKEN:' .github/workflows/release.yml
          grep -q 'secrets.CARGO_REGISTRY_TOKEN' .github/workflows/release.yml
          grep -q 'crates_io_api_token' .github/workflows/release.yml
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p allow-report release_manifest --locked -- --nocapture
          cargo test -p cargo-allow --bin cargo-allow release_prep --locked -- --nocapture
          cargo test --workspace --locked
          cargo run -p cargo-allow -- check --mode no-new \
            --format markdown \
            --receipt target/cargo-allow/check.receipt.json \
            --output target/cargo-allow/check.md
          git diff --check
      - name: Commit the exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "build(release): close out the token-backed v0.2.0 candidate"
          git push origin HEAD:release/v0.2.0-closeout
