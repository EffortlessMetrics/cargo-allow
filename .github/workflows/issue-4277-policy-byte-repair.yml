name: Repair issue 4277 policy byte preservation

on:
  push:
    branches:
      - fix/4277-floor-pin-settlement

permissions:
  contents: write

concurrency:
  group: issue-4277-policy-byte-repair
  cancel-in-progress: false

jobs:
  repair:
    if: "github.event.head_commit.message == 'chore(ci): retry issue 4277 policy byte preservation'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/4277-floor-pin-settlement
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          toolchain: 1.95.0
      - name: Restore base bytes and append only reviewed entries
        shell: bash
        env:
          REVIEWED_BASE: 2dc1b07e182935cc7c2654035e2fef8b1199ad1a
        run: |
          set -euo pipefail
          rm .github/workflows/issue-4277-policy-byte-repair.yml
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          base_sha = os.environ['REVIEWED_BASE']
          path = Path('policy/allow.toml')
          current = path.read_text(encoding='utf-8')
          starts = [match.start() for match in re.finditer(r'(?m)^\[\[allow\]\]\n', current)]
          starts.append(len(current))
          wanted = {
              'allow-4277-floor-settlement',
              'allow-4277-floor-settlement-test',
              'allow-4277-floor-settlement-revision',
          }
          found = {}
          for left, right in zip(starts, starts[1:]):
              block = current[left:right].rstrip('\n')
              for allow_id in wanted:
                  if f'id = "{allow_id}"' in block:
                      if allow_id in found:
                          raise SystemExit(f'duplicate reviewed entry: {allow_id}')
                      found[allow_id] = block
          missing = wanted - found.keys()
          if missing:
              raise SystemExit(f'missing reviewed entries: {sorted(missing)}')

          base = subprocess.check_output(
              ['git', 'show', f'{base_sha}:policy/allow.toml']
          )
          for allow_id in wanted:
              if allow_id.encode() in base:
                  raise SystemExit(f'base already contains {allow_id}')
          if not base.endswith(b'\n'):
              base += b'\n'
          ordered = [
              found['allow-4277-floor-settlement'],
              found['allow-4277-floor-settlement-test'],
              found['allow-4277-floor-settlement-revision'],
          ]
          appended = ('\n' + '\n\n'.join(ordered) + '\n').encode('utf-8')
          path.write_bytes(base + appended)

          repaired = path.read_bytes()
          if repaired[:len(base)] != base:
              raise SystemExit('existing ledger bytes changed before appended entries')
          PY
          git diff --check
          numstat="$(git diff --numstat "${REVIEWED_BASE}" -- policy/allow.toml)"
          printf '%s\n' "$numstat"
          additions="$(printf '%s' "$numstat" | awk '{print $1}')"
          deletions="$(printf '%s' "$numstat" | awk '{print $2}')"
          test "$deletions" = 0
          test "$additions" -gt 0
          test "$additions" -lt 120
      - name: Revalidate exact policy and producer
        shell: bash
        env:
          REVIEWED_BASE: 2dc1b07e182935cc7c2654035e2fef8b1199ad1a
        run: |
          set -euo pipefail
          mkdir -p target/cargo-allow/4277-byte-repair
          cargo run -p cargo-allow --locked -- check \
            --mode no-new \
            --format markdown \
            --receipt target/cargo-allow/4277-byte-repair/check.receipt.json \
            --output target/cargo-allow/4277-byte-repair/check.md
          cargo run -p cargo-allow --locked -- diff \
            --base "${REVIEWED_BASE}" \
            --require-change-note \
            --format json \
            --receipt target/cargo-allow/4277-byte-repair/diff.receipt.json \
            --output target/cargo-allow/4277-byte-repair/diff.json
          python3 scripts/test_floor_pin_settlement.py
          bash scripts/test-proof-direct-floors-protocol.sh
          git diff --check
          test ! -e .github/workflows/issue-4277-policy-byte-repair.yml
      - name: Commit byte-preserving policy repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/issue-4277-policy-byte-repair.yml \
            policy/allow.toml
          git diff --cached --check
          git commit -m 'fix(policy): preserve existing ledger bytes (#4277)'
          git push origin HEAD:fix/4277-floor-pin-settlement
