name: Repair PR 4303 phase-bound request correlation

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-phase-bound-request
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-request-phase]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply the bounded phase-correlation repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "c16026eb2536ef187a79a79cea83e3b1fa67ffd2"
          mapfile -t carrier_changes < <(git diff --name-only c16026eb2536ef187a79a79cea83e3b1fa67ffd2 HEAD | sort)
          test "${#carrier_changes[@]}" -eq 1
          test "${carrier_changes[0]}" = ".github/workflows/automation-pr4303-phase-bound-request.yml"
          python3 - <<'PY'
          from pathlib import Path

          authority = Path(
              "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          )
          text = authority.read_text(encoding="utf-8")

          start = text.index("fn matching_irreversible_request(")
          end = text.index("fn validate_event_transition(", start)
          replacement = r'''fn expected_observation_class_for_request(
              identity: &CargoAllowReleaseOperationIdentityV1,
              events: &[CargoAllowReleaseOperationEventV1],
              request_index: usize,
          ) -> Option<CargoAllowReleaseOperationEventClassV1> {
              use CargoAllowReleaseOperationClassV1 as Class;
              use CargoAllowReleaseOperationEventClassV1 as Event;
              use CargoAllowReleaseOperationEventSubjectV1 as Subject;

              let request = events.get(request_index)?;
              if request.event_class != Event::IrreversibleRequestStarted {
                  return None;
              }
              let prefix = events.get(..request_index)?;
              match &request.subject {
                  Subject::Package(_) => Some(Event::PackageRowObservedExact),
                  Subject::Asset(_) => Some(Event::AssetObservedExact),
                  Subject::Operation
                      if identity.operation_class == Class::CleanFinalPublication
                          && has_exact_event(prefix, Event::TagIntentDurable)
                          && !has_exact_event(prefix, Event::TagObservedExact) =>
                  {
                      Some(Event::TagObservedExact)
                  }
                  Subject::Operation
                      if identity.operation_class != Class::Containment
                          && all_packages_exact(identity, prefix)
                          && !has_exact_event(prefix, Event::GitHubDraftObservedExact) =>
                  {
                      Some(Event::GitHubDraftObservedExact)
                  }
                  Subject::Operation
                      if identity.operation_class != Class::Containment
                          && all_assets_exact(identity, prefix)
                          && has_exact_event(prefix, Event::GitHubDraftObservedExact)
                          && !has_exact_event(prefix, Event::PublicReleaseObservedExact) =>
                  {
                      Some(Event::PublicReleaseObservedExact)
                  }
                  Subject::Operation
                      if identity.operation_class == Class::Containment
                          && has_exact_event(prefix, Event::ContainmentSelected)
                          && has_exact_event(prefix, Event::AuthorizationSelected)
                          && has_exact_event(prefix, Event::LeaseAcquired)
                          && !has_exact_event(prefix, Event::ContainmentObservedExact) =>
                  {
                      Some(Event::ContainmentObservedExact)
                  }
                  Subject::Operation => None,
              }
          }

          fn matching_irreversible_request(
              identity: &CargoAllowReleaseOperationIdentityV1,
              events: &[CargoAllowReleaseOperationEventV1],
              init: &CargoAllowReleaseOperationEventInitV1,
          ) -> bool {
              events.iter().enumerate().any(|(index, event)| {
                  expected_observation_class_for_request(identity, events, index)
                      == Some(init.event_class)
                      && event.subject == init.subject
                      && event.payload_schema_id == init.payload_schema_id
                      && event.payload_digest == init.payload_digest
                      && event.request_boundary == init.request_boundary
                      && event.artifact_digest.is_some()
                      && event.artifact_digest == init.artifact_digest
              })
          }

          fn unresolved_irreversible_request_exists(
              identity: &CargoAllowReleaseOperationIdentityV1,
              events: &[CargoAllowReleaseOperationEventV1],
          ) -> bool {
              events.iter().enumerate().any(|(index, event)| {
                  event.event_class
                      == CargoAllowReleaseOperationEventClassV1::IrreversibleRequestStarted
                      && !response_unknown_is_resolved(identity, events, index)
              })
          }

          '''
          text = text[:start] + replacement + text[end:]

          old = "matching_irreversible_request(events, init)"
          count = text.count(old)
          if count != 7:
              raise SystemExit(
                  f"expected seven request matcher call sites, found {count}"
              )
          text = text.replace(
              old,
              "matching_irreversible_request(identity, events, init)",
          )

          old = "unresolved_irreversible_request_exists(events)"
          count = text.count(old)
          if count != 4:
              raise SystemExit(
                  f"expected four unresolved-request call sites, found {count}"
              )
          text = text.replace(
              old,
              "unresolved_irreversible_request_exists(identity, events)",
          )

          start = text.index("fn response_unknown_is_resolved(")
          end = text.index("fn evaluate_state(", start)
          replacement = r'''fn response_unknown_is_resolved(
              identity: &CargoAllowReleaseOperationIdentityV1,
              events: &[CargoAllowReleaseOperationEventV1],
              index: usize,
          ) -> bool {
              let Some(event) = events.get(index) else {
                  return false;
              };
              let Some(expected_class) =
                  expected_observation_class_for_request(identity, events, index)
              else {
                  return false;
              };
              events.iter().skip(index + 1).any(|later| {
                  later.event_class == expected_class
                      && event_is_exact_authority(later)
                      && later.subject == event.subject
                      && later.payload_schema_id == event.payload_schema_id
                      && later.payload_digest == event.payload_digest
                      && later.request_boundary == event.request_boundary
                      && later.artifact_digest.is_some()
                      && later.artifact_digest == event.artifact_digest
              })
          }

          fn limiting_state(
              identity: &CargoAllowReleaseOperationIdentityV1,
              events: &[CargoAllowReleaseOperationEventV1],
          ) -> Option<CargoAllowReleaseOperationStateV1> {
              use CargoAllowReleaseOperationSemanticResultV1 as ResultClass;
              use CargoAllowReleaseOperationStateV1 as State;
              if events
                  .iter()
                  .any(|event| event.semantic_result == ResultClass::InstrumentFailure)
              {
                  return Some(State::InstrumentFailure);
              }
              if events
                  .iter()
                  .any(|event| event.semantic_result == ResultClass::ProviderUnavailable)
              {
                  return Some(State::ProviderUnavailable);
              }
              if events
                  .iter()
                  .any(|event| event.semantic_result == ResultClass::Conflict)
              {
                  return Some(State::Conflict);
              }
              if events
                  .iter()
                  .any(|event| event.semantic_result == ResultClass::Stale)
              {
                  return Some(State::Stale);
              }
              if events
                  .iter()
                  .any(|event| event.semantic_result == ResultClass::Partial)
              {
                  return Some(State::RecoveryRequired);
              }
              if events.iter().enumerate().any(|(index, event)| {
                  (event.semantic_result == ResultClass::Unknown
                      || event.response_posture
                          == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown)
                      && !response_unknown_is_resolved(identity, events, index)
              }) {
                  return Some(State::RecoveryRequired);
              }
              None
          }

          '''
          text = text[:start] + replacement + text[end:]

          old = "limiting_state(events)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one limiting-state call, found {count}")
          text = text.replace(old, "limiting_state(identity, events)")
          authority.write_text(text, encoding="utf-8", newline="\n")

          tests = Path("crates/cargo-allow/tests/release_operation_authority.rs")
          test_text = tests.read_text(encoding="utf-8")
          test_name = "fn release_operation_request_correlation_is_phase_bound()"
          if test_name in test_text:
              raise SystemExit("phase-bound request hostile test already exists")
          test_text += r'''

          #[test]
          fn release_operation_request_correlation_is_phase_bound() -> Result<(), Box<dyn Error>> {
              use CargoAllowReleaseOperationEventClassV1 as Event;
              use CargoAllowReleaseOperationEventSubjectV1::{Asset, Operation, Package};
              use CargoAllowReleaseOperationSemanticResultV1 as ResultClass;

              let identity = identity()?;
              let mut events = Vec::new();
              append_preamble(&identity, &mut events)?;
              let tag_request = events
                  .iter()
                  .find(|event| {
                      event.event_class == Event::IrreversibleRequestStarted
                          && event.subject == Operation
                  })
                  .cloned()
                  .ok_or_else(|| io::Error::other("tag request should be retained"))?;

              let package_ids = identity
                  .packages
                  .iter()
                  .map(|row| row.logical_id.clone())
                  .collect::<Vec<_>>();
              let mut ordinal = 10;
              for id in package_ids {
                  append(
                      &identity,
                      &mut events,
                      Event::PackageRowIntentDurable,
                      Package(id.clone()),
                      ordinal,
                  )?;
                  ordinal += 1;
                  append_request(&identity, &mut events, Package(id.clone()), ordinal)?;
                  ordinal += 1;
                  append(
                      &identity,
                      &mut events,
                      Event::PackageRowObservedExact,
                      Package(id),
                      ordinal,
                  )?;
                  ordinal += 1;
              }

              let mut replay_tag_as_draft = event_init(
                  &identity,
                  Event::GitHubDraftObservedExact,
                  Operation,
                  ResultClass::Exact,
                  ordinal,
              );
              replay_tag_as_draft.response_posture =
                  CargoAllowReleaseOperationResponsePostureV1::ResponseKnown;
              replay_tag_as_draft.payload_schema_id = tag_request.payload_schema_id.clone();
              replay_tag_as_draft.payload_digest = tag_request.payload_digest.clone();
              replay_tag_as_draft.request_boundary = tag_request.request_boundary.clone();
              replay_tag_as_draft.artifact_digest = tag_request.artifact_digest.clone();
              require(
                  append_release_operation_event_v1(
                      &identity,
                      &events,
                      replay_tag_as_draft,
                  )
                  .is_err(),
                  "a tag request tuple must not authorize GitHub draft observation",
              )?;

              ordinal += 1;
              append_request(&identity, &mut events, Operation, ordinal)?;
              let draft_request = events
                  .last()
                  .cloned()
                  .ok_or_else(|| io::Error::other("draft request should be retained"))?;
              ordinal += 1;
              append(
                  &identity,
                  &mut events,
                  Event::GitHubDraftObservedExact,
                  Operation,
                  ordinal,
              )?;
              ordinal += 1;

              let asset_ids = identity
                  .assets
                  .iter()
                  .map(|row| row.asset_id.clone())
                  .collect::<Vec<_>>();
              for id in asset_ids {
                  append_request(&identity, &mut events, Asset(id.clone()), ordinal)?;
                  ordinal += 1;
                  append(
                      &identity,
                      &mut events,
                      Event::AssetObservedExact,
                      Asset(id),
                      ordinal,
                  )?;
                  ordinal += 1;
              }

              let mut replay_draft_as_public = event_init(
                  &identity,
                  Event::PublicReleaseObservedExact,
                  Operation,
                  ResultClass::Exact,
                  ordinal,
              );
              replay_draft_as_public.response_posture =
                  CargoAllowReleaseOperationResponsePostureV1::ResponseKnown;
              replay_draft_as_public.payload_schema_id = draft_request.payload_schema_id.clone();
              replay_draft_as_public.payload_digest = draft_request.payload_digest.clone();
              replay_draft_as_public.request_boundary = draft_request.request_boundary.clone();
              replay_draft_as_public.artifact_digest = draft_request.artifact_digest.clone();
              require(
                  append_release_operation_event_v1(
                      &identity,
                      &events,
                      replay_draft_as_public,
                  )
                  .is_err(),
                  "a GitHub draft request tuple must not authorize public-release observation",
              )
          }
          '''
          tests.write_text(test_text, encoding="utf-8", newline="\n")
          PY
          cargo fmt --all
          git rm .github/workflows/automation-pr4303-phase-bound-request.yml

      - name: Prove the phase-bound authority
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit and publish the source-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "c16026eb2536ef187a79a79cea83e3b1fa67ffd2"
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = ".github/workflows/automation-pr4303-phase-bound-request.yml"
          test "${changed[1]}" = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          test "${changed[2]}" = "crates/cargo-allow/tests/release_operation_authority.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): bind irreversible requests to their response phase (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1