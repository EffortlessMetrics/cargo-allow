# Task-owned focused worker. Never merge this workflow override.
name: PR 4743 redaction oracle proof
on:
  push:
    branches: [agent/4743-redaction-proof-c9b]
permissions:
  contents: read
concurrency:
  group: pr4743-redaction-proof-c9b
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'EffortlessMetrics/cargo-allow' && github.ref == 'refs/heads/agent/4743-redaction-proof-c9b'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.bind.outputs.candidate }}
      tree: ${{ steps.bind.outputs.tree }}
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Select immutable source and apply the selected diagnostic delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostic-proof"
          test "$(git hash-object .github/maintenance/4742.patch)" = 703c3146ce46df72a8e1b1cd7e92169bc6110f24
          python - <<'PY_PATCH'
          import hashlib, os
          from pathlib import Path
          raw=Path('.github/maintenance/4742.patch').read_bytes()
          # Normalize only the two known patch-envelope transport delimiters.
          raw=raw.replace(b'\n diff --git', b'\ndiff --git')+b' \n'
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if digest!='2db963662e1b331d1c2fbceceb1f57a7e8e3a0c4': raise SystemExit('unexpected selected patch bytes')
          Path(os.environ['RUNNER_TEMP'],'diagnostic-proof','selected.patch').write_bytes(raw)
          PY_PATCH
          git -c core.autocrlf=false checkout --detach c9b623a3f6d94b6bdf5c03483b1d98945c0701a6
          test -z "$(git status --porcelain)"
          git apply --index "$RUNNER_TEMP/diagnostic-proof/selected.patch"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - uses: ./.github/actions/rust-cache
        with:
          lane: issue4742-focused
          toolchain: '1.99.1'
      - name: Native formatting and cheap production-phase controls
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv > "$RUNNER_TEMP/diagnostic-proof/rustc.txt"
          cargo -V > "$RUNNER_TEMP/diagnostic-proof/cargo.txt"
          rustfmt --edition 2024 --config-path rustfmt.toml crates/cargo-allow/tests/release_rehearsal.rs
          git add -u
          cargo fmt --all -- --check --config-path rustfmt.toml
          python scripts/test-release-rehearsal.py TestCandidatePackageDiagnostics -v 2>&1 | tee "$RUNNER_TEMP/diagnostic-proof/python-controls.log"
          python scripts/test-verify-evidence-surface-inventory.py
          python scripts/verify-evidence-surface-inventory.py
          git diff --check
          git diff --cached --check
      - name: Bind and retain actual candidate before native tests
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'crates/cargo-allow/tests/release_rehearsal.rs','scripts/test-release-rehearsal.py'}
          if actual!=expected: raise SystemExit(f'Unexpected paths: {actual ^ expected}')
          PY
          git config user.name 'cargo-allow focused proof worker'
          git config user.email 'focused-proof-worker@users.noreply.github.com'
          tree=$(git write-tree)
          candidate=$(printf '%s\n' 'test(release): strengthen diagnostic redaction oracles (#4742)' '' 'Use independently shaped canaries and bound producer record count and keys.' 'No production diagnostic or admission change.' | git commit-tree "$tree" -p c9b623a3f6d94b6bdf5c03483b1d98945c0701a6)
          git checkout --detach "$candidate"
          git update-ref refs/heads/pr4743-redaction-prepared "$candidate"
          git bundle create "$RUNNER_TEMP/diagnostic-proof/candidate.bundle" refs/heads/pr4743-redaction-prepared
          git diff c9b623a3f6d94b6bdf5c03483b1d98945c0701a6 "$candidate" > "$RUNNER_TEMP/diagnostic-proof/actual.patch"
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/diagnostic-proof/candidate.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/diagnostic-proof/tree.txt"
          printf 'candidate=%s\ntree=%s\n' "$candidate" "$tree" >> "$GITHUB_OUTPUT"
      - name: Prove the Rust redaction oracle rejects actual raw forwarding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_MUTATION'
          import os, subprocess
          from pathlib import Path
          path=Path('crates/cargo-allow/tests/release_rehearsal.rs')
          original=path.read_bytes()
          marker=b'    context.push_str(&format!("; producer_stderr_sha256={stderr_digest}"));\n    context\n'
          if original.count(marker)!=1: raise SystemExit('mutation seam changed')
          try:
              path.write_bytes(original.replace(marker,marker.replace(b'    context\n',b'    context.push_str(stderr);\n    context\n')))
              result=subprocess.run(['cargo','test','-p','cargo-allow','--test','release_rehearsal','--locked','candidate_package_failure_context_is_specific_and_redacted','--','--exact'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=600)
              Path(os.environ['RUNNER_TEMP'],'diagnostic-proof','raw-forwarding-mutation.log').write_bytes(result.stdout)
              if result.returncode!=101 or b'failure context leaked an independently shaped canary' not in result.stdout:
                  raise SystemExit('redaction oracle did not reject the selected raw-forwarding mutant')
          finally:
              path.write_bytes(original)
          PY_MUTATION
          git diff --exit-code
      - name: Execute the affected native rehearsal target
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cargo-allow --test release_rehearsal --locked 2>&1 | tee "$RUNNER_TEMP/diagnostic-proof/native-tests.log"
          grep -F 'test result: ok. 15 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/diagnostic-proof/native-tests.log"
      - name: Native lint and committed source guards
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p cargo-allow --test release_rehearsal --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/diagnostic-proof/clippy.log"
          cargo run -q -p cargo-allow --locked -- check --mode no-new --format markdown 2>&1 | tee "$RUNNER_TEMP/diagnostic-proof/no-new.log"
          cargo run -q -p cargo-allow --locked -- diff --base aaf2c6d1689c31683617a8068132ef538dc68997 --head "$(cat "$RUNNER_TEMP/diagnostic-proof/candidate.txt")" --require-change-note --format markdown 2>&1 | tee "$RUNNER_TEMP/diagnostic-proof/diff.log"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/diagnostic-proof/tree.txt")"
      - name: Retain original observations even when native proof fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr4743-redaction-proof
          path: ${{ runner.temp }}/diagnostic-proof/
          if-no-files-found: error
          retention-days: 14
  retain-source-branch:
    needs: focused
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CANDIDATE: ${{ needs.focused.outputs.candidate }}
      TREE: ${{ needs.focused.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c9b623a3f6d94b6bdf5c03483b1d98945c0701a6
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr4743-redaction-proof
          path: retained
      - name: Publish a new staging branch only after proof and source readback
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          test "$CANDIDATE" = "$(cat retained/candidate.txt)"
          git fetch retained/candidate.bundle refs/heads/pr4743-redaction-prepared
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%P "$CANDIDATE")" = c9b623a3f6d94b6bdf5c03483b1d98945c0701a6
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = aaf2c6d1689c31683617a8068132ef538dc68997
          test "$(git ls-remote origin refs/heads/fix/4742-rehearsal-diagnostics | cut -f1)" = c9b623a3f6d94b6bdf5c03483b1d98945c0701a6
          test -z "$(git ls-remote origin refs/heads/agent/4743-redaction-qualified-c9b)"
          git push origin "$CANDIDATE:refs/heads/agent/4743-redaction-qualified-c9b"
          test "$(git ls-remote origin refs/heads/agent/4743-redaction-qualified-c9b | cut -f1)" = "$CANDIDATE"
