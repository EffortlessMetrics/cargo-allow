name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Temporary branch-local write access for the one-shot source revision below.
# The step restores this file from main before committing.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Preserve Git path bytes and read exact blobs by object ID
        if: github.head_ref == 'agent/harden-git-revision-boundary'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              begin = text.index(start)
              finish = text.index(end, begin)
              return text[:begin] + replacement + text[finish:]

          source_path = Path('crates/allow-diff/src/revision_git.rs')
          text = source_path.read_text()
          text = text.replace(
              'use std::path::{Path, PathBuf};',
              '#[cfg(unix)]\nuse std::ffi::OsString;\n#[cfg(unix)]\nuse std::os::unix::ffi::OsStringExt;\nuse std::path::{Component, Path, PathBuf};',
              1,
          )
          old_struct = '''#[derive(Debug, Clone, PartialEq, Eq)]
          pub(crate) struct GitTreeFile {
              pub(crate) mode: String,
              pub(crate) path: PathBuf,
          }
          '''.replace('          ', '')
          new_struct = '''#[derive(Debug, Clone, PartialEq, Eq)]
          pub(crate) struct GitTreeFile {
              pub(crate) mode: String,
              pub(crate) path: PathBuf,
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          struct GitTreeEntry {
              mode: String,
              object_type: String,
              object_id: String,
              path: PathBuf,
          }

          impl GitTreeEntry {
              fn into_file(self) -> GitTreeFile {
                  GitTreeFile {
                      mode: self.mode,
                      path: self.path,
                  }
              }
          }
          '''.replace('          ', '')
          if old_struct not in text:
              raise SystemExit('GitTreeFile struct marker changed')
          text = text.replace(old_struct, new_struct, 1)
          text = text.replace(
              '    Ok(parse_nul_paths(&output.stdout))\n',
              '    parse_nul_paths(&output.stdout)\n',
              1,
          )
          read_function = '''pub fn read_file_at_revision(
              root: impl AsRef<Path>,
              revision: &str,
              path: impl AsRef<Path>,
          ) -> CargoAllowResult<Option<String>> {
              let root = root.as_ref();
              let oid = resolve_commit_oid(root, revision)?;
              let path = validate_object_path(path.as_ref())?;

              let Some(blob_oid) = regular_file_blob_at_revision(root, &oid, path)? else {
                  return Ok(None);
              };

              // The path is used only for a literal ls-tree lookup. Blob content is
              // read by the object ID returned by Git, so colon, backslash, and raw
              // Unix filename bytes are never reconstructed as `tree:path` syntax.
              let mut cmd = git_command(root);
              cmd.arg("cat-file").arg("blob").arg(&blob_oid);
              let output = run_git(cmd, "git cat-file blob")?;
              if !output.status.success() {
                  return Err(git_status_error("git cat-file blob", &output));
              }

              Ok(Some(String::from_utf8_lossy(&output.stdout).to_string()))
          }

          '''.replace('          ', '')
          text = replace_between(text, 'pub fn read_file_at_revision(', 'fn resolve_commit_oid', read_function)

          path_and_blob = '''fn validate_object_path(path: &Path) -> CargoAllowResult<&Path> {
              let invalid = path.as_os_str().is_empty()
                  || path.is_absolute()
                  || path_contains_nul(path)
                  || path.components().any(|component| {
                      matches!(
                          component,
                          Component::Prefix(_)
                              | Component::RootDir
                              | Component::ParentDir
                              | Component::CurDir
                      )
                  });
              if invalid {
                  return Err(git_error(
                      CargoAllowErrorKind::InvalidConfig,
                      "invalid_source_tree_path",
                      format!(
                          "source-tree path `{}` cannot be read from a Git revision",
                          path.display()
                      ),
                  ));
              }
              Ok(path)
          }

          #[cfg(unix)]
          fn path_contains_nul(path: &Path) -> bool {
              use std::os::unix::ffi::OsStrExt;
              path.as_os_str().as_bytes().contains(&0)
          }

          #[cfg(not(unix))]
          fn path_contains_nul(path: &Path) -> bool {
              path.to_string_lossy().contains('\0')
          }

          fn regular_file_blob_at_revision(
              root: &Path,
              oid: &str,
              path: &Path,
          ) -> CargoAllowResult<Option<String>> {
              let mut cmd = literal_pathspec_git_command(root);
              cmd.arg("ls-tree")
                  .arg("-z")
                  .arg("--full-tree")
                  .arg(oid)
                  .arg("--")
                  .arg(path.as_os_str());
              let output = run_git(cmd, "git ls-tree exact path")?;
              if !output.status.success() {
                  return Err(git_status_error("git ls-tree exact path", &output));
              }

              let records = output
                  .stdout
                  .split(|byte| *byte == 0)
                  .filter(|record| !record.is_empty())
                  .collect::<Vec<_>>();
              if records.is_empty() {
                  return Ok(None);
              }
              if records.len() != 1 {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      format!(
                          "git ls-tree returned multiple records for exact path `{}`",
                          path.display()
                      ),
                  ));
              }

              let entry = parse_git_tree_record_any(records[0])?;
              if entry.path.as_path() != path {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      format!(
                          "git ls-tree returned `{}` for requested exact path `{}`",
                          entry.path.display(),
                          path.display()
                      ),
                  ));
              }
              if !entry.mode.starts_with("100") || entry.object_type != "blob" {
                  return Ok(None);
              }
              if !is_full_oid(&entry.object_id) {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "git ls-tree returned a malformed blob object ID",
                  ));
              }
              Ok(Some(entry.object_id))
          }

          '''.replace('          ', '')
          text = replace_between(
              text,
              'fn normalize_object_path',
              'fn parse_git_ls_tree_file_entries_z_checked',
              path_and_blob,
          )

          checked_parser = '''fn parse_git_ls_tree_file_entries_z_checked(
              stdout: &[u8],
          ) -> CargoAllowResult<Vec<GitTreeFile>> {
              let mut files = Vec::new();
              for record in stdout
                  .split(|byte| *byte == 0)
                  .filter(|record| !record.is_empty())
              {
                  let entry = parse_git_tree_record_any(record)?;
                  if entry.mode.starts_with("100") {
                      if entry.object_type != "blob" || !is_full_oid(&entry.object_id) {
                          return Err(git_error(
                              CargoAllowErrorKind::Inventory,
                              "git_output_malformed",
                              "git ls-tree returned an invalid regular-file record",
                          ));
                      }
                      files.push(entry.into_file());
                  }
              }
              Ok(files)
          }

          '''.replace('          ', '')
          text = replace_between(
              text,
              'fn parse_git_ls_tree_file_entries_z_checked',
              'fn git_command',
              checked_parser,
          )

          nul_parser = '''fn parse_nul_paths(stdout: &[u8]) -> CargoAllowResult<Vec<PathBuf>> {
              stdout
                  .split(|byte| *byte == 0)
                  .filter(|record| !record.is_empty())
                  .map(path_from_git_bytes)
                  .collect()
          }

          #[cfg(unix)]
          fn path_from_git_bytes(bytes: &[u8]) -> CargoAllowResult<PathBuf> {
              Ok(PathBuf::from(OsString::from_vec(bytes.to_vec())))
          }

          #[cfg(not(unix))]
          fn path_from_git_bytes(bytes: &[u8]) -> CargoAllowResult<PathBuf> {
              let text = std::str::from_utf8(bytes).map_err(|source| {
                  git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "Git returned a non-UTF-8 path on this platform",
                  )
                  .with_cause(&source)
              })?;
              Ok(PathBuf::from(text))
          }

          '''.replace('          ', '')
          text = replace_between(text, 'fn parse_nul_paths', '/// Parse NUL-delimited', nul_parser)
          text = text.replace(
              '    parse_nul_paths(stdout)\n}',
              '    parse_nul_paths(stdout).unwrap_or_else(|err| {\n        std::panic::panic_any(format!("NUL path parser failed: {err}"))\n    })\n}',
              1,
          )

          bottom = '''#[cfg(test)]
          pub(crate) fn parse_git_ls_tree_file_entries_z(stdout: &[u8]) -> Vec<GitTreeFile> {
              stdout
                  .split(|byte| *byte == 0)
                  .filter(|record| !record.is_empty())
                  .filter_map(parse_git_ls_tree_record)
                  .collect()
          }

          #[cfg(test)]
          pub(crate) fn parse_git_ls_tree_record_for_test(record: &[u8]) -> Option<GitTreeFile> {
              parse_git_ls_tree_record(record)
          }

          #[cfg(test)]
          fn parse_git_ls_tree_record(record: &[u8]) -> Option<GitTreeFile> {
              let entry = parse_git_tree_record_any(record).ok()?;
              (entry.mode.starts_with("100") && entry.object_type == "blob")
                  .then(|| entry.into_file())
          }

          fn parse_git_tree_record_any(record: &[u8]) -> CargoAllowResult<GitTreeEntry> {
              let Some(tab) = record.iter().position(|byte| *byte == b'\t') else {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "git ls-tree record is missing its path separator",
                  ));
              };
              let metadata = std::str::from_utf8(&record[..tab]).map_err(|source| {
                  git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "git ls-tree record metadata is not UTF-8",
                  )
                  .with_cause(&source)
              })?;
              let path_bytes = &record[tab + 1..];
              if path_bytes.is_empty() {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "git ls-tree record has an empty path",
                  ));
              }

              let mut fields = metadata.split_whitespace();
              let Some(mode) = fields.next() else {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "git ls-tree record is missing mode",
                  ));
              };
              let Some(object_type) = fields.next() else {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "git ls-tree record is missing object type",
                  ));
              };
              let Some(object_id) = fields.next() else {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "git ls-tree record is missing object ID",
                  ));
              };
              if fields.next().is_some() {
                  return Err(git_error(
                      CargoAllowErrorKind::Inventory,
                      "git_output_malformed",
                      "git ls-tree record has unexpected metadata fields",
                  ));
              }

              Ok(GitTreeEntry {
                  mode: mode.to_string(),
                  object_type: object_type.to_string(),
                  object_id: object_id.to_string(),
                  path: path_from_git_bytes(path_bytes)?,
              })
          }
          '''.replace('          ', '')
          text = replace_between(
              text,
              '#[cfg(test)]\npub(crate) fn parse_git_ls_tree_file_entries_z',
              '',
              bottom,
          ) if False else text[:text.index('#[cfg(test)]\npub(crate) fn parse_git_ls_tree_file_entries_z')] + bottom
          source_path.write_text(text)

          tests_path = Path('crates/allow-diff/src/tests/revision_git_parser.rs')
          tests = tests_path.read_text()
          tests = tests.replace(
              'use std::fs;\n',
              'use std::fs;\n#[cfg(unix)]\nuse std::ffi::OsString;\n#[cfg(unix)]\nuse std::os::unix::ffi::{OsStrExt, OsStringExt};\n',
              1,
          )
          generic_parser_test = '''#[test]
          fn git_tree_revision_parser_filters_malformed_records() {
              let output = b"record without separator\0\\
          \tpath-without-mode\0\\
          040000 tree abc123\tsrc\0\\
          100644 blob abc123\tvalid.txt\0";

              let files = revision_git::parse_git_ls_tree_file_entries_z(output);

              assert_eq!(
                  files,
                  vec![revision_git::GitTreeFile {
                      mode: "100644".to_string(),
                      path: PathBuf::from("valid.txt"),
                  }]
              );
          }

          #[cfg(unix)]
          #[test]
          fn git_tree_revision_parser_preserves_non_utf8_path_bytes() {
              let output = b"100644 blob def456\tinvalid-\xff.txt\0";
              let files = revision_git::parse_git_ls_tree_file_entries_z(output);

              assert_eq!(files.len(), 1);
              assert_eq!(files[0].path.as_os_str().as_bytes(), b"invalid-\xff.txt");
          }

          '''.replace('          ', '')
          tests = replace_between(
              tests,
              '#[test]\nfn git_tree_revision_parser_filters_malformed_records',
              '#[test]\nfn parse_git_ls_tree_record_call_presence_observer',
              generic_parser_test,
          )
          call_observer = '''#[test]
          fn parse_git_ls_tree_record_call_presence_observer() {
              assert_eq!(
                  revision_git::parse_git_ls_tree_record_for_test(b"record without separator"),
                  None
              );
              assert_eq!(
                  revision_git::parse_git_ls_tree_record_for_test(b"\tpath-without-mode"),
                  None
              );
              assert_eq!(
                  revision_git::parse_git_ls_tree_record_for_test(b"040000 tree abc123\tsrc"),
                  None
              );

              let entry = revision_git::parse_git_ls_tree_record_for_test(
                  b"100644 blob abc123\tregular.txt",
              )
              .unwrap_or_else(|| std::panic::panic_any("file record should parse"));
              assert_eq!(entry.mode, "100644");
              assert_eq!(entry.path, PathBuf::from("regular.txt"));
          }

          '''.replace('          ', '')
          tests = replace_between(
              tests,
              '#[test]\nfn parse_git_ls_tree_record_call_presence_observer',
              '#[test]\nfn parse_git_ls_tree_record_return_value_discriminator',
              call_observer,
          )
          tests = tests.replace(
              'PathBuf::from("src\\\\lib.rs")',
              'PathBuf::from("src/lib.rs")',
              1,
          )
          unix_literal_test = '''#[cfg(unix)]
          #[test]
          fn read_file_at_revision_preserves_colon_backslash_and_non_utf8_paths() {
              let repo = TempGitRepo::new("revision-git-raw-paths");
              repo.git(&["init"]);
              repo.git(&["config", "user.email", "cargo-allow@example.invalid"]);
              repo.git(&["config", "user.name", "cargo-allow"]);
              repo.write("a:b.txt", "colon\n");
              repo.write("weird\\\\name.txt", "backslash\n");
              let non_utf8 = PathBuf::from(OsString::from_vec(b"invalid-\xff.txt".to_vec()));
              repo.write_path(&non_utf8, b"non-utf8\n");
              repo.git(&["add", "."]);
              repo.git(&["commit", "-m", "raw paths"]);

              for (path, expected) in [
                  (PathBuf::from("a:b.txt"), "colon\n"),
                  (PathBuf::from("weird\\\\name.txt"), "backslash\n"),
                  (non_utf8.clone(), "non-utf8\n"),
              ] {
                  let value = revision_git::read_file_at_revision(repo.path(), "HEAD", &path)
                      .unwrap_or_else(|err| {
                          std::panic::panic_any(format!("read {}: {err}", path.display()))
                      });
                  assert_eq!(value.as_deref(), Some(expected));
              }

              let tracked = revision_git::git_tracked_files_at_revision(repo.path(), "HEAD")
                  .unwrap_or_else(|err| {
                      std::panic::panic_any(format!("tracked paths read: {err}"))
                  });
              assert!(tracked.iter().any(|path| path == &non_utf8));
          }

          '''.replace('          ', '')
          tests = tests.replace(
              '#[test]\nfn option_like_revision_is_rejected_before_git_can_create_output',
              unix_literal_test + '#[test]\nfn option_like_revision_is_rejected_before_git_can_create_output',
              1,
          )
          old_write = '''    fn write(&self, relative: &str, contents: &str) {
              let path = self.path.join(relative);
              if let Some(parent) = path.parent() {
                  fs::create_dir_all(parent).unwrap_or_else(|err| {
                      std::panic::panic_any(format!("test parent directory created: {err}"))
                  });
              }
              fs::write(&path, contents)
                  .unwrap_or_else(|err| std::panic::panic_any(format!("test file written: {err}")));
          }
          '''.replace('          ', '')
          new_write = '''    fn write(&self, relative: &str, contents: &str) {
              self.write_path(Path::new(relative), contents.as_bytes());
          }

              fn write_path(&self, relative: &Path, contents: &[u8]) {
                  let path = self.path.join(relative);
                  if let Some(parent) = path.parent() {
                      fs::create_dir_all(parent).unwrap_or_else(|err| {
                          std::panic::panic_any(format!("test parent directory created: {err}"))
                      });
                  }
                  fs::write(&path, contents).unwrap_or_else(|err| {
                      std::panic::panic_any(format!("test file written: {err}"))
                  });
              }
          '''.replace('          ', '')
          if old_write not in tests:
              raise SystemExit('TempGitRepo::write marker changed')
          tests = tests.replace(old_write, new_write, 1)
          tests_path.write_text(tests)
          PY
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > /tmp/cargo-allow-ci.yml
          mv /tmp/cargo-allow-ci.yml .github/workflows/ci.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/allow-diff/src/revision_git.rs \
                  crates/allow-diff/src/tests/revision_git_parser.rs \
                  .github/workflows/ci.yml
          git commit -m "fix: preserve Git path bytes and read blobs by object ID"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --doc --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p cargo-allow -- audit --format json --output target/cargo-allow/audit.json
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - run: cargo run -p cargo-allow -- check --profile spec-system --mode audit --format json --output target/cargo-allow/spec-system.json
      - run: cargo run -p cargo-allow -- check --profile spec-system --mode audit --format markdown --output target/cargo-allow/spec-system.md
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-reports
          path: target/cargo-allow/
