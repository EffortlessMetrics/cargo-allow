# Task-owned worker; never merge this workflow override into main.
name: Issue 4734 focused lint proof
on:
  push:
    branches: [agent/4734-focused-ba6f8ab]
permissions:
  contents: read
concurrency:
  group: issue4734-focused-ba6f8ab
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    if: github.repository == 'EffortlessMetrics/cargo-allow' && github.ref == 'refs/heads/agent/4734-focused-ba6f8ab'
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
      tree: ${{ steps.candidate.outputs.tree }}
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact main and preserve the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint-proof"
          test "$(git hash-object .github/maintenance/lint4734.patch)" = 856ba3a7e186257ec5b9c808050f6d38c438de6b
          cp .github/maintenance/lint4734.patch "$RUNNER_TEMP/lint-proof/selected.patch"
          git checkout --detach ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-cache
        with:
          lane: issue4734-focused
          toolchain: '1.95.0'
      - name: Reproduce all six diagnostics on clean main
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee "$RUNNER_TEMP/lint-proof/rustc-1.95.txt"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          dest = Path(os.environ['RUNNER_TEMP']) / 'lint-proof'
          result = subprocess.run(['cargo', 'clippy', '-p', 'cargo-allow', '--all-targets', '--locked', '--message-format=json', '--', '-D', 'warnings'], capture_output=True)
          (dest/'base-clippy.jsonl').write_bytes(result.stdout)
          (dest/'base-clippy.stderr').write_bytes(result.stderr)
          errors = []
          for line in result.stdout.splitlines():
              row = json.loads(line)
              if row.get('reason') == 'compiler-message' and row['message']['level'] == 'error':
                  message = row['message']
                  errors.extend((span['file_name'], (message.get('code') or {}).get('code')) for span in message['spans'] if span['is_primary'])
          expected = {
              'crates/cargo-allow/src/cli/release_final_tag_bridge.rs',
              'crates/cargo-allow/src/cli/release_freeze_experience.rs',
              'crates/cargo-allow/src/cli/release_freeze_rehearsal.rs',
              'crates/cargo-allow/src/cli/release_freeze_rehearsal_tests.rs',
              'crates/cargo-allow/src/campaign_issue_closeout_workflow_tests.rs',
              'crates/cargo-allow/src/extraction_shim_registry_tests.rs',
          }
          if result.returncode != 101 or {path for path, _ in errors} != expected or any(code not in {'clippy::nonminimal_bool', 'clippy::collapsible_match'} for _, code in errors):
              raise SystemExit(f'Unexpected clean-main result: exit={result.returncode}, errors={errors}')
          (dest/'base-diagnostics.json').write_text(json.dumps({'source':'ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198','exit':result.returncode,'errors':errors},indent=2))
          print('Reproduced six expected clean-main diagnostic locations; failure remains retained.')
          PY
      - name: Apply only the selected repair and format its files
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/lint-proof/selected.patch"
          git diff --cached --name-only -z -- '*.rs' | xargs -0 rustfmt --edition 2024 --config-path rustfmt.toml
          git add -u
          cargo fmt --all -- --check --config-path rustfmt.toml
          python3 scripts/test-verify-evidence-surface-inventory.py
          python3 scripts/verify-evidence-surface-inventory.py
          git diff --check
          git diff --cached --check
      - name: Bind exact candidate and preserve it before native proof
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.changes/Fixed-20261104-0235.yaml','crates/cargo-allow/src/campaign_issue_closeout_workflow_tests.rs','crates/cargo-allow/src/cli/release_final_tag_bridge.rs','crates/cargo-allow/src/cli/release_freeze_experience.rs','crates/cargo-allow/src/cli/release_freeze_experience_tests.rs','crates/cargo-allow/src/cli/release_freeze_rehearsal.rs','crates/cargo-allow/src/cli/release_freeze_rehearsal_tests.rs','crates/cargo-allow/src/extraction_shim_registry_tests.rs'}
          if actual != expected: raise SystemExit(f'Unexpected candidate paths: {actual ^ expected}')
          PY
          git config user.name 'cargo-allow focused proof worker'
          git config user.email 'focused-proof-worker@users.noreply.github.com'
          tree=$(git write-tree)
          sha=$(printf '%s\n' 'fix(lints): preserve release refusals on Rust 1.95 (#4734)' '' 'Equivalent Option predicates and match guards with date and package-size controls.' 'No lint suppression, policy expansion, dependency change or release action.' | git commit-tree "$tree" -p ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198)
          git checkout --detach "$sha"
          git update-ref refs/heads/pr4734-prepared "$sha"
          git bundle create "$RUNNER_TEMP/lint-proof/candidate.bundle" refs/heads/pr4734-prepared
          printf '%s\n' "$sha" > "$RUNNER_TEMP/lint-proof/candidate.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/lint-proof/tree.txt"
          git diff ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198 "$sha" > "$RUNNER_TEMP/lint-proof/actual.patch"
          printf 'sha=%s\ntree=%s\n' "$sha" "$tree" >> "$GITHUB_OUTPUT"
      - name: Rust 1.95 Clippy and affected production controls
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p cargo-allow --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/lint-proof/repaired-clippy-1.95.log"
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          dest=Path(os.environ['RUNNER_TEMP'])/'lint-proof'
          for selected,minimum in [('release_freeze',50),('control_time_tests',1),('campaign_issue_closeout_workflow',8),('extraction_shim_registry',4)]:
              result=subprocess.run(['cargo','test','-p','cargo-allow','--bin','cargo-allow','--locked',selected],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (dest/(selected+'.log')).write_bytes(result.stdout)
              text=result.stdout.decode(errors='replace')
              passed=sum(int(n) for n in re.findall(r'test result: ok\. (\d+) passed;',text))
              print(selected, 'exit',result.returncode,'passed',passed,flush=True)
              if result.returncode or passed<minimum: raise SystemExit(text)
          PY
          cargo run -q -p cargo-allow --locked -- check --mode no-new --format markdown 2>&1 | tee "$RUNNER_TEMP/lint-proof/no-new.log"
          cargo run -q -p cargo-allow --locked -- diff --base ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198 --head "$(cat "$RUNNER_TEMP/lint-proof/candidate.txt")" --format markdown --require-change-note 2>&1 | tee "$RUNNER_TEMP/lint-proof/diff.log"
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          toolchain: '1.99.1'
          components: clippy
      - name: Recorded stable compiler Clippy and unchanged-tree check
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee "$RUNNER_TEMP/lint-proof/rustc-1.99.1.txt"
          cargo clippy -p cargo-allow --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/lint-proof/repaired-clippy-1.99.1.log"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/lint-proof/tree.txt")"
      - name: Retain successes and negative evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue4734-focused-proof
          path: ${{ runner.temp }}/lint-proof/
          if-no-files-found: warn
          retention-days: 14
  publish-candidate-branch:
    needs: proof
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CANDIDATE: ${{ needs.proof.outputs.candidate }}
      EXPECTED_TREE: ${{ needs.proof.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: issue4734-focused-proof
          path: retained-proof
      - name: Retain only the verified new issue branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[a-f0-9]{40}$ ]]
          test "$CANDIDATE" = "$(cat retained-proof/candidate.txt)"
          git fetch retained-proof/candidate.bundle refs/heads/pr4734-prepared
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%P "$CANDIDATE")" = ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$EXPECTED_TREE"
          refs=$(git ls-remote --heads origin refs/heads/main refs/heads/fix/4734-msrv-clippy)
          printf '%s\n' "$refs" | grep -Fx $'ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198\trefs/heads/main'
          if printf '%s\n' "$refs" | grep -Fq 'refs/heads/fix/4734-msrv-clippy'; then exit 1; fi
          git push origin "$CANDIDATE:refs/heads/fix/4734-msrv-clippy"
          test "$(git ls-remote origin refs/heads/fix/4734-msrv-clippy | cut -f1)" = "$CANDIDATE"
