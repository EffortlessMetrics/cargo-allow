name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Run Clippy and retain diagnostics
        run: |
          mkdir -p target/cargo-allow
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > target/cargo-allow/clippy.txt 2>&1
          status=$?
          set -e
          cat target/cargo-allow/clippy.txt
          exit "${status}"
      - run: cargo test --workspace
      - run: cargo test --doc --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p cargo-allow -- audit --format json --output target/cargo-allow/audit.json
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - run: cargo run -p cargo-allow -- check --profile spec-system --mode audit --format json --output target/cargo-allow/spec-system.json
      - run: cargo run -p cargo-allow -- check --profile spec-system --mode audit --format markdown --output target/cargo-allow/spec-system.md
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-reports
          path: target/cargo-allow/
