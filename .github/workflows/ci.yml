# Task-only integration worker. Never merge this workflow override.
name: PR 4716 current-main integration
on:
  push:
    branches: [agent/4716-integrate-4ee9723]
permissions:
  contents: read
  actions: read
jobs:
  integrate:
    if: github.repository == 'EffortlessMetrics/cargo-allow' && github.ref == 'refs/heads/agent/4716-integrate-4ee9723'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      candidate: ${{ steps.bind.outputs.candidate }}
      tree: ${{ steps.bind.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr4716-alias-proof
          run-id: 41770730815
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-proof
      - name: Preserve the verified source and integrate only incoming main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integrated-proof"
          python - <<'PY'
          import hashlib, json, os, subprocess, tomllib
          from pathlib import Path
          head='807b7e35bae86df3a71079293deea1fbad1f3e1a'
          main='4ee9723fb9fcabfcda880fc07db7bb75416c2412'
          base='ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198'
          temp=Path(os.environ['RUNNER_TEMP']); prior=temp/'prior-proof'; out=temp/'integrated-proof'
          def git(*args, check=True):
              r=subprocess.run(['git','-c','core.autocrlf=false',*args],capture_output=True)
              if check and r.returncode: raise RuntimeError(r.stderr.decode(errors='replace'))
              return r
          def need(ok,msg):
              if not ok: raise RuntimeError(msg)
          need((prior/'candidate.txt').read_text().strip()==head,'wrong prior candidate')
          need((prior/'tree.txt').read_text().strip()=='6351b5bd4c1e0c3b4f3cb060d36402053878cc0c','wrong prior tree')
          need(hashlib.sha256((prior/'cargo-allow').read_bytes()).hexdigest()=='8c27317a7da71aa8ca2dceb5896a5b872a9ebcb57bd7d1ce61bcd42d39869bac','wrong binary')
          git('checkout','--detach',head)
          need(not git('status','--porcelain').stdout,'dirty checkout')
          need(git('merge-base','--all',head,main).stdout.decode().strip()==base,'wrong merge base')
          own=set(git('diff','--name-only',base,head).stdout.decode().splitlines())
          expected={'.allow/revisions/4716-review-disposition.toml','.changes/Fixed-20261103-2359.yaml','crates/cargo-allow/src/cli.rs','crates/cargo-allow/src/core_command_router.rs','crates/cargo-allow/src/init.rs','crates/cargo-allow/tests/core_command_summary_router_cli.rs','crates/cargo-allow/tests/init_summary_backup_cli.rs','policy/allow.toml'}
          incoming=set(git('diff','--name-only',base,main).stdout.decode().splitlines())
          need(own==expected,'unexpected own paths')
          need(incoming=={'.allow/revisions/4255-review-posting-truth.toml','.changes/Fixed-20261103-2028.yaml','.github/workflows/ub-review.yml','policy/allow.toml','scripts/check-ub-review-post-agreement.sh'},'unexpected main paths')
          need(own & incoming=={'policy/allow.toml'},'unexpected overlap')
          raw={ref:git('show',f'{ref}:policy/allow.toml').stdout for ref in [base,head,main]}
          normalize=lambda b:b.replace(b'\r\n',b'\n')
          need(normalize(raw[head]).startswith(normalize(raw[base])),'non-append head policy')
          docs={ref:tomllib.loads(raw[ref].decode()) for ref in raw}
          rows={ref:{r['id']:r for r in doc['allow']} for ref,doc in docs.items()}
          need(all(len(rows[r])==len(docs[r]['allow']) for r in rows),'duplicate IDs')
          added=set(rows[head])-set(rows[base])
          need(added=={'allow-4716-review-disposition','allow-4716-review-revision'},'unexpected additions')
          need(not added & set(rows[main]),'ID collision')
          for key,value in rows[base].items():
              need(rows[head].get(key)==value and rows[main].get(key)==value,'changed old policy record')
          need({k:v for k,v in docs[head].items() if k!='allow'}=={k:v for k,v in docs[base].items() if k!='allow'},'changed head settings')
          merged=raw[main]+(b'' if raw[main].endswith(b'\n') else b'\n')+normalize(raw[head])[len(normalize(raw[base])):]
          md=tomllib.loads(merged.decode()); mr={r['id']:r for r in md['allow']}
          need(len(mr)==len(md['allow']) and mr==dict(rows[main],**{k:rows[head][k] for k in added}),'wrong merged records')
          need({k:v for k,v in md.items() if k!='allow'}=={k:v for k,v in docs[main].items() if k!='allow'},'lost main settings')
          git('config','user.name','cargo-allow integration worker')
          git('config','user.email','integration-worker@users.noreply.github.com')
          result=git('merge','--no-ff','--no-commit',main,check=False)
          conflicts=set(git('diff','--name-only','--diff-filter=U').stdout.decode().splitlines())
          need(result.returncode in (0,1) and conflicts<={'policy/allow.toml'},'unexpected merge failure')
          Path('policy/allow.toml').write_bytes(merged)
          blob=git('hash-object','-w','--no-filters','policy/allow.toml').stdout.decode().strip()
          git('update-index','--add','--cacheinfo',f'100644,{blob},policy/allow.toml')
          need(set(git('diff','--cached','--name-only',main).stdout.decode().splitlines())==expected,'unrelated main paths changed')
          for path in expected-{'policy/allow.toml'}:
              need(git('rev-parse',f':{path}').stdout==git('rev-parse',f'{head}:{path}').stdout,f'own path changed: {path}')
          need(not git('diff','--cached','--name-only',head,'--','crates','Cargo.toml','Cargo.lock','rust-toolchain.toml','rustfmt.toml').stdout,'runtime/build source changed')
          report={'source_head':head,'incoming_main':main,'merge_base':base,'main_policy_raw_prefix_preserved':merged.startswith(raw[main]),'main_policy_sha256':hashlib.sha256(raw[main]).hexdigest(),'merged_policy_sha256':hashlib.sha256(merged).hexdigest(),'all_prior_records_unchanged':True,'runtime_build_source_unchanged':True,'reused_native_evidence':{'run':41770730815,'artifact':13295680192,'integration_tests':46,'router_tests':19,'clippy':'1.99.1 all targets'},'claim_boundary':'Native runtime/lint evidence is reused only for byte-identical runtime/build source. Current integrated source guards and incoming script fixtures are executed separately. No final review or merge authority.'}
          (out/'integration.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - name: Bind integrated candidate and retain original history
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check 4ee9723fb9fcabfcda880fc07db7bb75416c2412
          tree=$(git write-tree)
          candidate=$(printf '%s\n' 'Merge current main into init alias and ancestry repair (#4714)' '' 'Preserve exact main policy bytes and both existing init review records.' 'Runtime/build source is unchanged from focused-qualified 807b7e35.' | git commit-tree "$tree" -p 807b7e35bae86df3a71079293deea1fbad1f3e1a -p 4ee9723fb9fcabfcda880fc07db7bb75416c2412)
          git merge --quit
          git checkout --detach "$candidate"
          git update-ref refs/heads/pr4716-integrated "$candidate"
          git bundle create "$RUNNER_TEMP/integrated-proof/candidate.bundle" refs/heads/pr4716-integrated
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/integrated-proof/candidate.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/integrated-proof/tree.txt"
          printf 'candidate=%s\ntree=%s\n' "$candidate" "$tree" >> "$GITHUB_OUTPUT"
      - name: Execute current integrated source checks and incoming self-test
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-ub-review-post-agreement.sh --self-test | tee "$RUNNER_TEMP/integrated-proof/post-agreement.log"
          python scripts/test-verify-evidence-surface-inventory.py
          python scripts/verify-evidence-surface-inventory.py
          chmod +x "$RUNNER_TEMP/prior-proof/cargo-allow"
          mkdir -p target/integrated-proof
          "$RUNNER_TEMP/prior-proof/cargo-allow" check --mode no-new --format markdown --output target/integrated-proof/check.md --receipt target/integrated-proof/check.receipt.json
          "$RUNNER_TEMP/prior-proof/cargo-allow" diff --base 4ee9723fb9fcabfcda880fc07db7bb75416c2412 --head "$(cat "$RUNNER_TEMP/integrated-proof/candidate.txt")" --format markdown --require-change-note > "$RUNNER_TEMP/integrated-proof/diff.md"
          cp target/integrated-proof/check.* "$RUNNER_TEMP/integrated-proof/"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr4716-current-main-integration
          path: ${{ runner.temp }}/integrated-proof/
          retention-days: 14
          if-no-files-found: error
  retain:
    needs: integrate
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      CANDIDATE: ${{ needs.integrate.outputs.candidate }}
      TREE: ${{ needs.integrate.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4ee9723fb9fcabfcda880fc07db7bb75416c2412
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr4716-current-main-integration
          path: retained
      - name: Retain only new staging ref after current input readback
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          git fetch retained/candidate.bundle refs/heads/pr4716-integrated
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%P "$CANDIDATE")" = '807b7e35bae86df3a71079293deea1fbad1f3e1a 4ee9723fb9fcabfcda880fc07db7bb75416c2412'
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 4ee9723fb9fcabfcda880fc07db7bb75416c2412
          test "$(git ls-remote origin refs/heads/fix/4714-init-summary-preflight | cut -f1)" = 8dfebdbcdf0bb585861fdeec9dda65f52a78c0e3
          test -z "$(git ls-remote origin refs/heads/agent/4716-integrated-4ee9723)"
          git push origin "$CANDIDATE:refs/heads/agent/4716-integrated-4ee9723"
          test "$(git ls-remote origin refs/heads/agent/4716-integrated-4ee9723 | cut -f1)" = "$CANDIDATE"
