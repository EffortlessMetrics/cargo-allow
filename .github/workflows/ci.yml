on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Prove the workspace rust-version pin (1.95) still builds and runs the
  # fast package proof. Stable/full suite stays on the `test` job below so
  # the MSRV lane stays short and release-claim oriented (#1901).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: msrv-1.95
      - name: MSRV workspace check
        run: cargo check --workspace --all-targets --locked
      - name: MSRV fast cargo-allow package proof
        run: cargo test -p cargo-allow --bins --locked

  # Pre-publication SourceCandidateSmoke (#2256 Stage A): prove the exact
  # reviewed source candidate packages, has no path dependencies, installs
  # from the workspace path, and passes first-hour CLI checks. Uploads a
  # hosted receipt artifact so the readiness claim rests on CI evidence, not
  # a local run. Linux only for the narrow claim; the msrv lane above
  # separately proves Rust 1.95.
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: package-smoke
      - name: Package candidate smoke (Stage A)
        run: bash scripts/package-candidate-smoke.sh
      - name: Exact candidate package set (#2372)
        run: |
          mkdir -p target/exact-candidate-package-set/packages
          cp target/package-candidate-smoke/packages/*.crate \
            target/exact-candidate-package-set/packages/
          SKIP_PACKAGE=1 bash scripts/exact-candidate-package-set.sh
      - name: Source candidate first-hour journey (#2278)
        run: |
          bin="target/exact-candidate-package-set/install/bin/cargo-allow"
          if [[ ! -x "${bin}" && ! -x "${bin}.exe" ]]; then
            bin="target/package-candidate-smoke/install/bin/cargo-allow"
          fi
          if [[ -x "${bin}.exe" ]]; then
            bin="${bin}.exe"
          fi
          CARGO_ALLOW_BIN="${bin}" bash scripts/source-candidate-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: package-candidate-smoke-receipt
          path: target/package-candidate-smoke/package-candidate-smoke.receipt.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-candidate-package-set-receipt
          path: target/exact-candidate-package-set/exact-candidate-package-set.receipt.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-candidate-smoke-receipt
          path: target/source-candidate-smoke/source-candidate-smoke.receipt.json
          if-no-files-found: warn
      - name: Intent candidate install smoke (#2599-C)
        run: bash scripts/intent-candidate-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: intent-candidate-smoke-receipt
          path: target/intent-candidate-smoke/intent-candidate-smoke.receipt.json
          if-no-files-found: warn
  # Hosted characterization for #2366 / #2355: shallow missing-base fails closed,
  # then the same diff succeeds after history is available. Linux-only; keeps PR
  # CI cheap relative to a full matrix.
  shallow-diff-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: shallow-diff-smoke
      - name: Shallow diff base smoke
        run: bash scripts/shallow-diff-base-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shallow-diff-base-smoke
          path: |
            target/shallow-diff-base-smoke/shallow-diff-base-smoke.receipt.txt
            target/shallow-diff-base-smoke/artifacts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify cargo-allow proof classes are non-empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/cargo-allow
          fast_start=$(date +%s)
          fast_count=$(cargo test -p cargo-allow --bins --locked -- --list | grep -cE ': test$' || true)
          fast_end=$(date +%s)
          contract_start=$(date +%s)
          contract_count=$(cargo test -p cargo-allow --tests --locked -- --list | grep -cE ': test$' || true)
          contract_end=$(date +%s)
          test "$fast_count" -gt 0
          test "$contract_count" -gt 0
          {
            echo "fast_tests=$fast_count"
            echo "fast_seconds=$((fast_end-fast_start))"
            echo "contract_tests=$contract_count"
            echo "contract_seconds=$((contract_end-contract_start))"
          } | tee target/cargo-allow/test-proof-classes.txt
      - name: Fast cargo-allow package proof
        run: cargo test -p cargo-allow --bins --locked
      - name: Contract cargo-allow package proof
        run: cargo test -p cargo-allow --tests --locked
      - name: Full workspace proof union
        run: cargo test --workspace --locked
      - run: cargo test --doc --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p cargo-allow -- audit --format json --output target/cargo-allow/audit.json
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - run: cargo run -p cargo-allow -- check --profile spec-system --mode audit --format json --output target/cargo-allow/spec-system.json
      - run: cargo run -p cargo-allow -- check --profile spec-system --mode audit --format markdown --output target/cargo-allow/spec-system.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cargo-allow-reports
          path: |
            target/cargo-allow/

  # Cross-platform workspace test proof (#1825): run the workspace test suite
  # on Windows to guard the platform-specific code paths (path separators,
  # verbatim prefixes, CRLF, MAIN_SEPARATOR_STR). Kept separate from the main
  # `test` job so lint/doc/audit feedback stays fast on Linux. Windows-only
  # for now; macOS can be added when the cost/benefit shifts.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: test-windows
      - name: Full workspace test suite
        run: cargo test --workspace --locked

  # Test coverage reporting (#1902). Runs cargo-tarpaulin on Linux and
  # uploads coverage to Codecov. Kept separate from the main test job so
  # coverage instrumentation doesn't slow down PR feedback.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: coverage
      - name: Generate coverage report
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --workspace --locked --out xml --output-dir target/cargo-allow
      - uses: codecov/codecov-action@4650159d642e33fdc30954ca22638caf0df6cac8 # v5.4.3
        if: always()
        with:
          files: target/cargo-allow/cobertura.xml
          fail_ci_if_error: false

  # Supply-chain audit via cargo-deny (#1897). Checks for known advisories,
  # disallowed licenses, banned crates, and untrusted source registries.
  # cargo-allow is a governance tool — it should enforce its own supply chain.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          arguments: --workspace
          command: check

