on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Prove the workspace rust-version pin (1.95) still builds and runs the
  # fast package proof. Stable/full suite stays on the `test` job below so
  # the MSRV lane stays short and release-claim oriented (#1901).
  msrv:
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins the floating `stable` channel for local
    # development. rustup ranks that file ABOVE `rustup default`, and `rustup
    # default` is how `dtolnay/rust-toolchain` selects its toolchain, so the
    # action tag below is inert on its own: cargo would resolve the runner's
    # stable and this lane would prove a Rust version the workspace does not
    # claim. `RUSTUP_TOOLCHAIN` outranks the toolchain file, so it is what
    # actually pins the lane. Removing it silently unpins the MSRV proof;
    # `scripts/check-msrv-consistency.sh` fails closed if it goes missing.
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs before the toolchain so drift fails in seconds. `rust-version` in
      # Cargo.toml is the source of truth; this proves the toolchain pin, the
      # cache key, and the attested release-manifest MSRV all still match it.
      - name: MSRV consistency
        run: bash scripts/check-msrv-consistency.sh
      # Proves the guard above still fails closed on each drift site, so it
      # cannot be weakened into a no-op without CI noticing. No toolchain, no
      # cargo: runs in about a second.
      - name: MSRV consistency guard characterization
        run: bash scripts/test-check-msrv-consistency.sh
      # Drives the resolved-toolchain guard with stub compilers, so its
      # fail-closed behaviour is proven without installing real toolchains.
      - name: MSRV resolved toolchain guard characterization
        run: bash scripts/test-check-msrv-resolved.sh
      # The action tag IS the proven toolchain, not a dependency version: it
      # must equal Cargo.toml `rust-version`. Dependabot is configured to leave
      # this action alone (.github/dependabot.yml); bumping it would keep CI
      # green while proving a Rust version the workspace does not claim.
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/rust-cache
        with:
          lane: msrv
          toolchain: 1.95.0
      # The pin above is configuration; this is the evidence. Asks the resolved
      # compiler what it is and fails closed unless it matches the declared
      # `rust-version`, so no future toolchain-selection change can leave this
      # lane green while proving a different Rust version.
      - name: MSRV resolved toolchain
        run: bash scripts/check-msrv-resolved.sh
      - name: MSRV workspace check
        # cargo-allow-scoped by policy (#3358): intent and proof claim
        # no toolchain yet; their lanes run stable checks only.
        run: |
          cargo check --locked --all-targets \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy \
            -p allow-inventory -p allow-files -p allow-rust -p allow-match \
            -p allow-report -p allow-diff \
            -p effortless-repo-protocol -p effortless-repo-snapshot \
            -p effortless-repo-edit

      - name: MSRV fast cargo-allow package proof
        run: cargo test -p cargo-allow --bins --locked

  # Pre-publication SourceCandidateSmoke (#2256 Stage A): prove the exact
  # reviewed source candidate packages, has no path dependencies, installs
  # from the workspace path, and passes first-hour CLI checks. Uploads a
  # hosted receipt artifact so the readiness claim rests on CI evidence, not
  # a local run. Linux only for the narrow claim; the msrv lane above
  # separately proves Rust 1.95.
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: package-smoke
      - name: Package candidate smoke (Stage A)
        run: bash scripts/package-candidate-smoke.sh
      - name: Linux release binary packaging contract (#2464)
        run: |
          mkdir -p target/release-binary-contract
          RECEIPT_PATH=target/release-binary-contract/release-binary-test.receipt.json \
            bash scripts/test-release-binary.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-binary-contract-receipt
          path: target/release-binary-contract/
          if-no-files-found: warn
      - name: Exact candidate package set (#2372)
        run: |
          mkdir -p target/exact-candidate-package-set/packages
          cp target/package-candidate-smoke/packages/*.crate \
            target/exact-candidate-package-set/packages/
          SKIP_PACKAGE=1 bash scripts/exact-candidate-package-set.sh
      - name: Cutover build receipts from package-set artifacts (#3469/#3552)
        run: |
          bash scripts/extraction-cutover-build-receipt.sh repo-snapshot
          bash scripts/extraction-cutover-build-receipt.sh repo-edit
      - name: Exact candidate install journey (#3357)
        run: bash scripts/exact-candidate-install-journey.sh
      - name: Exact candidate journey contract characterization (#3357)
        run: bash scripts/test-exact-candidate-install-journey.sh
      - name: Exact installed upgrade and rollback journey (#3853)
        run: bash scripts/exact-upgrade-rollback-journey.sh
      - name: Exact upgrade and rollback contract characterization (#3853)
        run: bash scripts/test-exact-upgrade-rollback-journey.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extraction-cutover-build-receipts
          path: |
            target/extraction-cutover/**/build-package.json
            target/exact-candidate-package-set/exact-candidate-package-set.receipt.json
            target/exact-candidate-package-set/packages/
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: package-candidate-smoke-receipt
          path: target/package-candidate-smoke/package-candidate-smoke.receipt.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-candidate-package-set-receipt
          path: target/exact-candidate-package-set/exact-candidate-package-set.receipt.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-candidate-install-journey-receipt
          path: target/exact-candidate-install-journey/exact-candidate-install-journey.receipt.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-upgrade-rollback-journey-receipt
          path: target/exact-upgrade-rollback-journey/exact-upgrade-rollback-journey.receipt.json
          if-no-files-found: warn
  # Product-scoped candidate lanes (#3358): one product's experimental
  # packaging failure must not block the cargo-allow patch/release lanes.
  # This lane owns the intent and proof candidate smokes plus the
  # three-product interop matrix; it re-runs the cargo-allow exact
  # candidate set standalone because the interop smoke drives the
  # installed cargo-allow binary. Posture: experimental-informational.
  product-candidates-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: product-candidates-interop
      - name: Exact candidate package set for interop (#2372)
        run: |
          mkdir -p target/exact-candidate-package-set/packages
          bash scripts/exact-candidate-package-set.sh
      - name: Intent candidate install smoke (#2599-C)
        run: bash scripts/intent-candidate-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: intent-candidate-smoke-receipt
          path: target/intent-candidate-smoke/intent-candidate-smoke.receipt.json
          if-no-files-found: warn
      - name: Proof candidate install smoke (#2589-B)
        run: bash scripts/proof-candidate-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: proof-candidate-smoke-receipt
          path: target/proof-candidate-smoke/proof-candidate-smoke.receipt.json
          if-no-files-found: warn
      - name: Exact candidate interop smoke (#2605)
        run: |
          allow_bin="target/exact-candidate-package-set/install/bin/cargo-allow"
          intent_bin="target/intent-candidate-smoke/install/bin/cargo-intent"
          proof_bin="target/proof-candidate-smoke/install/bin/cargo-proof"
          for bin in "${allow_bin}" "${intent_bin}" "${proof_bin}"; do
            if [[ -x "${bin}.exe" ]]; then
              :
            elif [[ ! -x "${bin}" && ! -f "${bin}" ]]; then
              echo "missing candidate binary ${bin}" >&2
              exit 1
            fi
          done
          CARGO_ALLOW_BIN="${allow_bin}" \
          CARGO_INTENT_BIN="${intent_bin}" \
          CARGO_PROOF_BIN="${proof_bin}" \
          bash scripts/exact-candidate-interop-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-candidate-interop-receipt
          path: target/exact-candidate-interop/exact-candidate-interop.receipt.json
          if-no-files-found: warn
  # Hosted characterization for #2366 / #2355: shallow missing-base fails closed,
  # then the same diff succeeds after history is available. Linux-only; keeps PR
  # CI cheap relative to a full matrix.
  shallow-diff-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: shallow-diff-smoke
      - name: Shallow diff base smoke
        run: bash scripts/shallow-diff-base-smoke.sh
      - name: Shallow diff failure artifact characterization (#3566)
        if: always()
        run: bash scripts/test-shallow-diff-base-failure.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shallow-diff-base-smoke
          path: |
            target/shallow-diff-base-smoke/shallow-diff-base-smoke.receipt.txt
            target/shallow-diff-base-smoke/artifacts/

  # Hosted characterization for #2468: bind the supported operator loop to a
  # release binary, verify each command's semantic artifact, and retain the
  # receipt/artifacts for review. This is a conservative catastrophic ceiling,
  # not a universal latency target or hardware claim.
  operator-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: operator-latency
      - name: Operator latency harness contract (#2468)
        run: bash scripts/test-perf-budget-smoke.sh
      - name: Build release cargo-allow binary
        run: cargo build -p cargo-allow --bin cargo-allow --release --locked
      - name: Operator latency smoke (#2468)
        env:
          PROFILE: release
          CARGO_ALLOW_BIN: ${{ github.workspace }}/target/release/cargo-allow
          HARD_CEILING_MS: "60000"
        run: bash scripts/perf-budget-smoke.sh
      - name: Validate operator latency receipt contract
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt_path = Path("target/perf-budget/operator-latency.receipt.json")
          schema_path = Path("docs/schemas/operator-latency.v2.schema.json")
          assert receipt_path.is_file(), f"missing receipt: {receipt_path}; see the harness step output"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          assert schema["$id"].endswith("operator-latency.v2.schema.json")
          assert receipt["schema_id"] == "cargo-allow.operator-latency.v2"
          assert receipt["schema_version"] == 2
          assert all("cache_mode" in sample for sample in receipt["samples"])
          assert receipt["result"] == "pass"
          assert receipt["binary"]["profile"] == "release"
          samples = receipt["samples"]
          policy = receipt["sample_policy"]
          assert len(samples) == (
              policy["cold_process_samples"]
              + policy["warm_process_samples"]
              + policy["targeted_samples"]
          )
          assert policy["cache_mode_samples"] == {"on": 2, "off": 1, "not_applicable": 6}
          assert (policy["cold_process_samples"], policy["warm_process_samples"], policy["targeted_samples"]) == (2, 3, 4)
          assert all(sample["status"] == "passed" for sample in receipt["samples"])
          ceiling = receipt["budget"]["ceiling_ms"]
          assert all(
              isinstance(sample["elapsed_ms"], int) and sample["elapsed_ms"] <= ceiling
              for sample in receipt["samples"]
          )
          print(f"validated {len(receipt['samples'])} operator-latency samples")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: operator-latency-receipt
          path: |
            target/perf-budget/operator-latency.receipt.json
            target/perf-budget/artifacts/
          if-no-files-found: warn

  test:
    # The cutover status lane restores the build receipts produced by the
    # package-smoke job; artifacts are only downloadable once that job
    # completes (#3469/#3552).
    needs: package-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-cache
        with:
          lane: release-set
      - run: cargo fmt --all --check
      - name: cargo-allow release-set clippy (#3358)
        run: |
          cargo clippy --locked --all-targets \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit \
            -- -D warnings

      - name: Changie sensor projections and falsifiers (#3623)
        run: |
          cargo test -p cargo-allow --locked changie_source_view -- --nocapture
          cargo test -p cargo-allow --locked changie_command -- --nocapture
      - name: Changie fragment schema independent-validation smoke (#3613)
        run: bash scripts/test-changie-fragment-schema-smoke.sh
      - name: Changie sensor self-dogfood (#3623)
        # cargo-allow analyzes its own .changie.yaml and complete
        # fragment population with the Rust-native sensor: no Go,
        # Aqua, or Changie on the runner, no ledger mutation.
        run: cargo run -p cargo-allow --locked -- changie lint --format json
      - name: Changie sensor packaged external-consumer proof (#3621)
        # Packages the workspace candidate set, extracts the exact
        # packaged allow-files bytes, patches crates-io to the packaged
        # siblings, and runs an isolated offline fixture crate against
        # the facade with the source checkout unneeded.
        run: bash scripts/test-changie-sensor-external-consumer.sh
      - name: Changie sensor feature proof (#3588)
        # The allow-files changie module is feature-gated; without this
        # step nothing in CI compiles or tests it.
        run: cargo test -p allow-files --locked --features changie
      - name: Candidate harness lifecycle characterization (#3509)


        run: python scripts/test-candidate-harness-lifecycle.py
      - name: Extraction readiness receipt (#2559)
        run: bash scripts/extraction-readiness-receipt.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extraction-readiness-receipt
          path: target/extraction-readiness/extraction-readiness.receipt.json
          if-no-files-found: warn
      - name: Characterize extraction parity cutover status (#3469)
        run: bash scripts/test-extraction-cutover-status.sh
      - name: Restore cutover build receipts (#3469/#3552)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extraction-cutover-build-receipts
          path: target
        continue-on-error: true
      - name: Extraction parity cutover status (#3469)
        run: bash scripts/extraction-cutover-status.sh
        env:
          # #3469 slice B: parity execution, ownership derivation, receipt
          # supply, and ledger linkage gate CI; old-path retirement stays
          # observational until #3543.
          EXTRACTION_CUTOVER_LANE_GATE: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extraction-cutover-status
          path: target/extraction-cutover/
          if-no-files-found: warn
      - name: Verify cargo-allow proof classes are non-empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/cargo-allow
          fast_start=$(date +%s)
          fast_count=$(cargo test -p cargo-allow --bins --locked -- --list | grep -cE ': test$' || true)
          fast_end=$(date +%s)
          contract_start=$(date +%s)
          contract_count=$(cargo test -p cargo-allow --tests --locked -- --list | grep -cE ': test$' || true)
          contract_end=$(date +%s)
          test "$fast_count" -gt 0
          test "$contract_count" -gt 0
          {
            echo "fast_tests=$fast_count"
            echo "fast_seconds=$((fast_end-fast_start))"
            echo "contract_tests=$contract_count"
            echo "contract_seconds=$((contract_end-contract_start))"
          } | tee target/cargo-allow/test-proof-classes.txt
      - name: Fast cargo-allow package proof
        run: cargo test -p cargo-allow --bins --locked
      - name: Contract cargo-allow package proof
        run: cargo test -p cargo-allow --tests --locked
      - name: Cargo-allow release-set proof union (#3358)
        run: |
          cargo test --locked \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit

      - name: Cargo-allow release-set doc tests (#3358)
        run: |
          cargo test --doc --locked \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit

      - name: Cargo-allow release-set docs (#3358)
        run: |
          cargo doc --no-deps --locked \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit

        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p cargo-allow -- audit --format json --output target/cargo-allow/audit.json
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - name: Verify PR template diff evidence
        run: cargo run -p cargo-allow -- diff --base origin/main --format markdown --require-change-note
      - name: Spec-system cutover receipt (#2568)
        run: bash scripts/spec-system-cutover-receipt.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: spec-system-cutover-receipt
          path: target/spec-system-cutover/spec-system-cutover.receipt.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cargo-allow-reports
          path: |
            target/cargo-allow/

  # Cross-platform workspace test proof (#1825): run the workspace test suite
  # on Windows to guard the platform-specific code paths (path separators,
  # verbatim prefixes, CRLF, MAIN_SEPARATOR_STR). Kept separate from the main
  # `test` job so lint/doc/audit feedback stays fast on Linux. Windows-only
  # for now; macOS can be added when the cost/benefit shifts.
  # Integrated dogfood lane (#3358): cross-product contracts change here.
  # Governance validation, three-product dogfood, and the simplification
  # audit exercise the products together and stay out of the
  # cargo-allow-required test lane. Posture: integrated-informational.
  integrated-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: integrated-dogfood
      - name: Build three-product binaries for dogfood (#2558)
        run: cargo build -p cargo-allow -p cargo-intent -p cargo-proof --locked
      - name: Governance validation receipt (#2942 step 5)
        run: |
          cargo run -p cargo-intent --locked -- --root . governance \
            --receipt target/cargo-intent/governance-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: governance-receipt
          path: target/cargo-intent/governance-receipt.json
          if-no-files-found: warn
      - name: Three-product dogfood smoke (#2558)
        run: bash scripts/three-product-dogfood-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: three-product-dogfood-receipt
          path: target/three-product-dogfood/three-product-dogfood.receipt.json
          if-no-files-found: warn
      - name: Three-product simplification audit (#2208)
        run: bash scripts/three-product-simplification-audit.sh

  test-core-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cache_scope: full
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cache_scope: full
          - os: macos-14
            target: aarch64-apple-darwin
            cache_scope: bounded
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cache_scope: bounded
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: release-set
      - name: Cargo-allow release-set test suite (#3358)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cache_scope }}" == "bounded" ]]; then
            # macOS currently cannot run allow-rust's persistent scan-cache
            # fixture because /var is presented as /private/var. Keep the
            # bounded exception explicit until that path guard is portable.
            cargo test --locked -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit
            cargo test --locked -p allow-rust --lib -- --skip persistent_scan_cache --skip scan_cache_store
          else
            cargo test --locked -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit
          fi
      - name: Cross-platform semantic fixture (#2265)
        shell: bash
        run: cargo test --locked -p allow-core cross_platform_semantics -- --nocapture
      - name: Retain platform proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/cross-platform
          {
            printf 'commit=%s\n' '${{ github.sha }}'
            printf 'run_id=%s\n' '${{ github.run_id }}'
            printf 'platform=%s\n' '${{ matrix.os }}'
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'runner_os=%s\n' "${RUNNER_OS}"
            printf 'toolchain_identity=\n'
            rustc -Vv | sed 's/^/  /'
            printf 'proof=release-set,cross_platform_semantics\n'
            if [[ "${{ matrix.cache_scope }}" == "bounded" ]]; then
              printf 'limitation=allow-rust persistent scan-cache tests excluded; macOS /var alias is not accepted by the cache path guard\n'
            fi
            printf 'result=%s\n' '${{ job.status }}'
          } > target/cross-platform/${{ matrix.target }}.proof.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cross-platform-proof-${{ matrix.target }}
          path: target/cross-platform
          if-no-files-found: error

  # Compatibility delegation lane (#3369/#2601-B): cargo-allow's staged
  # precommit delegation contract against cargo-intent. Core lanes no
  # longer build cargo-intent; this required lane proves the contract
  # with the exact installed candidate on Linux and a fresh build on
  # Windows.
  compat-delegation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: compat-delegation
      - name: Core independence graph proof (#3369)
        # cargo-allow has no dependency edge on the cargo-intent
        # application; the delegation e2e lives in the
        # compat-delegation lane. --locked keeps the tree from
        # rewriting the lockfile; bash runs on both matrix OSes.
        shell: bash
        run: |
          if cargo tree --locked -p cargo-allow --all-targets -e normal,dev \
            | grep -q "cargo-intent v"; then
            echo "::error::cargo-allow graph gained a cargo-intent edge" >&2
            exit 1
          fi
      - name: Install the exact cargo-intent candidate (Linux)
        # The smoke packages against a patched registry without
        # --locked on every invocation and may rewrite Cargo.lock;
        # restore it so the --locked test step below stays honest.
        run: |
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.guard"
          bash scripts/intent-candidate-smoke.sh
          cp "${RUNNER_TEMP}/Cargo.lock.guard" Cargo.lock

        if: runner.os == 'Linux'
      - name: Build cargo-intent (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p cargo-intent --locked
      - name: Delegation e2e against the resolved cargo-intent binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            bin="target/intent-candidate-smoke/install/bin/cargo-intent"
          else
            bin="target/debug/cargo-intent.exe"
          fi
          test -f "${bin}"
          env "CARGO_BIN_EXE_cargo-intent=$(pwd)/${bin}" \
            "CARGO_ALLOW_COMPAT_DELEGATION_REQUIRED=1" \
            cargo test -p cargo-allow --locked --test intent_staged_precommit_delegate -- --nocapture
  # Product-scoped test lanes (#3358): experimental products prove
  # themselves without gating the cargo-allow patch/release lanes.
  # Posture: experimental-informational.
  test-intent-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          lane: test-intent-experimental
      - name: cargo-intent clippy
        run: cargo clippy --locked --all-targets -p intent-model -p intent-protocol -p intent-compiler -p intent-edit -p cargo-intent -- -D warnings
      - name: cargo-intent test suite
        run: cargo test --locked -p intent-model -p intent-protocol -p intent-compiler -p intent-edit -p cargo-intent
      - name: cargo-intent doc tests
        run: cargo test --doc --locked -p intent-model -p intent-protocol -p intent-compiler -p intent-edit -p cargo-intent

  test-proof-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          lane: test-proof-experimental
      - name: cargo-proof clippy
        run: cargo clippy --locked --all-targets -p proof-protocol -p proof-orchestrator -p cargo-proof -- -D warnings
      - name: cargo-proof test suite
        run: cargo test --locked -p proof-protocol -p proof-orchestrator -p cargo-proof
      - name: cargo-proof doc tests
        run: cargo test --doc --locked -p proof-protocol -p proof-orchestrator -p cargo-proof

  # Shared-protocol lane (#3358): the namespace-rail shared crate is not
  # part of the cargo-allow release set and keeps its own proof lane.
  # Posture: shared-protocol-informational.
  test-shared-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: test-shared-protocol
      - name: Shared protocol test suite
        run: cargo test --locked -p effortless-rust-source-index

  # Test coverage reporting (#1902). Runs cargo-tarpaulin on Linux and
  # uploads coverage to Codecov. Kept separate from the main test job so
  # coverage instrumentation doesn't slow down PR feedback.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: coverage
      - name: Generate coverage report
        run: |
          coverage_temp="$RUNNER_TEMP/cargo-allow-coverage"
          mkdir -p "$coverage_temp"
          export TMPDIR="$coverage_temp"
          export TMP="$coverage_temp"
          export TEMP="$coverage_temp"
          # Pin the tool and use LLVM instrumentation. The workspace coverage
          # suite launches cargo-allow subprocesses; Tarpaulin's default
          # ptrace backend has produced false fixture failures in that lane.
          cargo install cargo-tarpaulin --version 0.37.0 --locked
          # Cover the cargo-allow release set plus the captured-receipt
          # validation products; coverage does not gate this lane.
          cargo tarpaulin --features cargo-proof/all-providers --locked --engine llvm --out xml \
            --output-dir target/cargo-allow \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit \
            -p proof-protocol -p proof-orchestrator -p cargo-proof \
            -p effortless-rust-source-index \
            -- --test-threads 1

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: target/cargo-allow/cobertura.xml
          fail_ci_if_error: false

  # Supply-chain audit via cargo-deny (#1897). Checks for known advisories,
  # disallowed licenses, banned crates, and untrusted source registries.
  # cargo-allow is a governance tool — it should enforce its own supply chain.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace
          command: check
