# Task-owned worker only. Never merge this workflow override into main.
name: PR 4716 focused integration
on:
  push:
    branches: [agent/4716-focused-ba6f8ab]
permissions:
  contents: read
concurrency:
  group: pr4716-focused-ba6f8ab
  cancel-in-progress: false
jobs:
  prepare-and-test:
    if: github.repository == 'EffortlessMetrics/cargo-allow' && github.ref == 'refs/heads/agent/4716-focused-ba6f8ab'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.bind.outputs.candidate }}
      tree: ${{ steps.bind.outputs.tree }}
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prepare immutable selected inputs
        shell: bash
        run: |
          set -euo pipefail
          cp .github/maintenance/prepare-pr4716.py "$RUNNER_TEMP/prepare-pr4716.py"
          git fetch --no-tags origin 8a2090d946392d47e41e0ce7e5907770a92efa3d
          git -c core.autocrlf=false checkout --detach 8a2090d946392d47e41e0ce7e5907770a92efa3d
          python "$RUNNER_TEMP/prepare-pr4716.py"
          test ! -e .changes/Fixed-20261103-2359.yaml
          printf '%s\n' 'kind: Fixed' 'body: Reject invalid init summary destinations before policy mutation and protect recovery backups across write, preview, and error paths.' 'time: 2026-11-03T23:59:00Z' > .changes/Fixed-20261103-2359.yaml
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          lane: pr4716-focused
          toolchain: '1.95.0'
      - name: Format the new test and verify the exact source
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee "$RUNNER_TEMP/integration-evidence/rustc.txt"
          rustfmt --edition 2024 --config-path rustfmt.toml crates/cargo-allow/tests/init_summary_backup_cli.rs
          git add crates/cargo-allow/tests/init_summary_backup_cli.rs .changes/Fixed-20261103-2359.yaml
          cargo fmt --all -- --check --config-path rustfmt.toml
          python scripts/test-verify-evidence-surface-inventory.py
          python scripts/verify-evidence-surface-inventory.py
          git diff --check
          git diff --cached --check ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198
      - name: Bind the candidate before source and revision proof
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          tree=$(git write-tree)
          test "$tree" = 5c0f056fc5a568e505009688ac2cf535b920c034
          candidate=$(printf '%s\n' 'Merge current main into init summary safety repair (#4714)' '' 'Preserve the exact main policy prefix and both existing branch records.' 'Qualification is recorded by exact-tree external results, not this commit message.' | git commit-tree "$tree" -p 8a2090d946392d47e41e0ce7e5907770a92efa3d -p ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198)
          git merge --quit
          git checkout --detach "$candidate"
          git diff --exit-code
          git diff --cached --exit-code
          git update-ref refs/heads/pr4716-prepared "$candidate"
          git bundle create "$RUNNER_TEMP/integration-evidence/integration.bundle" refs/heads/pr4716-prepared
          git diff --stat ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198 "$candidate" > "$RUNNER_TEMP/integration-evidence/diff-stat.txt"
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/integration-evidence/candidate.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/integration-evidence/tested-tree.txt"
          printf 'candidate=%s\ntree=%s\n' "$candidate" "$tree" >> "$GITHUB_OUTPUT"
      - name: Focused real-binary tests on Rust 1.95
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cargo-allow --locked --test init_summary_backup_cli --test core_command_summary_router_cli 2>&1 | tee "$RUNNER_TEMP/integration-evidence/focused-tests.log"
          cp target/debug/cargo-allow "$RUNNER_TEMP/integration-evidence/cargo-allow"
          sha256sum "$RUNNER_TEMP/integration-evidence/cargo-allow" > "$RUNNER_TEMP/integration-evidence/binary.sha256"
      - name: Source and exact committed revision guards
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(cat "$RUNNER_TEMP/integration-evidence/candidate.txt")
          test "$(git rev-parse HEAD)" = "$candidate"
          cargo run -q -p cargo-allow --locked -- check --mode no-new --format markdown 2>&1 | tee "$RUNNER_TEMP/integration-evidence/no-new.log"
          cargo run -q -p cargo-allow --locked -- diff --base ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198 --head "$candidate" --format markdown --require-change-note 2>&1 | tee "$RUNNER_TEMP/integration-evidence/diff.log"
      - name: Select the normal stable lint compiler
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          toolchain: stable
          components: clippy
      - name: Stable Clippy without suppressions
        env:
          RUSTUP_TOOLCHAIN: stable
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv | tee "$RUNNER_TEMP/integration-evidence/clippy-rustc.txt"
          cargo clippy -p cargo-allow --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/integration-evidence/clippy.log"
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/integration-evidence/tested-tree.txt")"
      - name: Retain original candidate and proof even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr4716-focused-integration
          path: ${{ runner.temp }}/integration-evidence/
          if-no-files-found: warn
          retention-days: 14
  retain-staging-branch:
    needs: prepare-and-test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CANDIDATE: ${{ needs.prepare-and-test.outputs.candidate }}
      EXPECTED_TREE: ${{ needs.prepare-and-test.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr4716-focused-integration
          path: retained-proof
      - name: Publish only the task-owned staging branch after fixed-input readback
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[a-f0-9]{40}$ ]]
          test "$CANDIDATE" = "$(cat retained-proof/candidate.txt)"
          git fetch retained-proof/integration.bundle refs/heads/pr4716-prepared
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%P "$CANDIDATE")" = '8a2090d946392d47e41e0ce7e5907770a92efa3d ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198'
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$EXPECTED_TREE"
          refs=$(git ls-remote --heads origin refs/heads/main refs/heads/fix/4714-init-summary-preflight refs/heads/agent/4716-integrated-ba6f8ab)
          printf '%s\n' "$refs" | grep -Fx $'ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198\trefs/heads/main'
          printf '%s\n' "$refs" | grep -Fx $'8a2090d946392d47e41e0ce7e5907770a92efa3d\trefs/heads/fix/4714-init-summary-preflight'
          if printf '%s\n' "$refs" | grep -Fq 'refs/heads/agent/4716-integrated-ba6f8ab'; then
            echo 'Staging branch already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          git push origin "$CANDIDATE:refs/heads/agent/4716-integrated-ba6f8ab"
          test "$(git ls-remote origin refs/heads/agent/4716-integrated-ba6f8ab | cut -f1)" = "$CANDIDATE"
          printf 'Retained candidate %s. No main, PR, tag, setting or release mutation.\n' "$CANDIDATE"
