name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Temporary branch-local write access for the one-shot formatter below. The
# step restores this file from main before committing.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt and restore the normal workflow
        if: github.head_ref == 'agent/harden-git-revision-boundary'
        run: |
          set -euo pipefail
          cargo fmt --all
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > /tmp/cargo-allow-ci.yml
          mv /tmp/cargo-allow-ci.yml .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/cargo-allow/src/diff_args.rs .github/workflows/ci.yml
          git commit -m "style: apply final rustfmt cleanup"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --doc --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p cargo-allow -- audit --format json --output target/cargo-allow/audit.json
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - run: cargo run -p cargo-allow -- check --profile spec-system --mode audit --format json --output target/cargo-allow/spec-system.json
      - run: cargo run -p cargo-allow -- check --profile spec-system --mode audit --format markdown --output target/cargo-allow/spec-system.md
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-reports
          path: target/cargo-allow/
