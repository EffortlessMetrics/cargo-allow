# Ordinary proof is admitted only by the native queue (#4602).
# Development checks and H review/authorization stay in the owning session.
on:
  pull_request:
    # Full proof runs on drafts too; review-readiness.yml handles Ready events.
    # Avoid launching the same source proof twice on a draft-to-ready transition (#3753).
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-subject:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the actual merge-group checkout
        if: github.event_name == 'merge_group'
        run: python3 scripts/merge-group-subject.py subject --receipt target/queue/subject.json
      - name: Exercise queue identity and event regressions
        if: github.event_name == 'merge_group'
        run: python3 scripts/test-merge-group-lifecycle.py
      - name: Retain the observed queue subject
        if: always() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/queue/subject.json
          if-no-files-found: error

  # Stage 1 pre-gate (#3836): one fast deterministic tier that rejects
  # cheap source-controlled defects before the expensive proof jobs are
  # provisioned. The selected denominator is the #3835-measured cheap,
  # load-bearing set: workflow syntax (actionlint, pinned release +
  # checksum), formatting, the no-new source-exception guard, and retained
  # direct-floor freshness. Stale receipts otherwise fail independently
  # in each expensive test lane. The
  # typed result is emitted with `ci-pregate evaluate`; only a permit
  # state exits zero. This changes workflow reachability only — the
  # proof denominator stays #2569's, Clippy stays in Stage 2, and no
  # release secrets are read here.
  pregate:
    needs: queue-subject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same precedence law the msrv job documents: `rust-toolchain.toml`
    # pins the floating `stable` channel and rustup ranks that file ABOVE
    # `rustup default` (the only thing the dtolnay action changes), so the
    # action tag below is inert on its own: cargo would resolve the
    # runner's stable and this lane would prove a Rust version the
    # workspace does not claim while the cache below keys on 1.95.0.
    # `RUSTUP_TOOLCHAIN` outranks the toolchain file, so it is what
    # actually pins the compiler and keeps the cache identity honest.
    # Removing it silently unpins the pregate proof onto the runner's
    # stable; the `test_pregate_cache_matches_its_pinned_toolchain`
    # regression test fails closed if the pin goes missing.
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        # The RUSTUP_TOOLCHAIN pin above selects this exact toolchain, so
        # the components the pregate needs must be installed here: the
        # runner's stable toolchain (which rust-toolchain.toml would
        # otherwise select) ships rustfmt, but a bare 1.95.0 install does
        # not, and the Formatting step below would fail with
        # "'cargo-fmt' is not installed for the toolchain". Clippy stays
        # out: it runs in the Stage 2 heavy lanes, not in the pregate.
        with:
          components: rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          lane: pregate
          toolchain: 1.95.0
      - name: Check workflow syntax (actionlint, pinned)
        id: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail --location             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"             -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # Stage 1 v1 scopes the syntax gate to this workflow's graph.
          # The other retained workflows still carry pre-existing SC1083
          # lint findings (release.yml's deliberate interpolation);
          # widening the scope is recorded work for the tiering lane
          # after those are fixed.
          # The pinned actionlint release predates GitHub's
          # macos-15-intel and macos-26 labels (the current matrix names each
          # lane), so those findings are ignored precisely. The embedded
          # shellcheck layer stays off in stage 1: the retained scripts
          # carry pre-existing style findings and shellcheck state is
          # already visible in the editor/lane surfaces; wiring it in
          # is recorded work for the tiering lane.
          /tmp/actionlint -color -shellcheck=             -ignore 'label "macos-15-intel" is unknown'             -ignore 'label "macos-26" is unknown'             .github/workflows/ci.yml
      - name: Merge-group checkout refs
        id: checkout_ref
        # A merge_group workflow must not check out github.ref or
        # github.head_ref without a merge_group term: those name the queue
        # ref, not the merge-group head. Unconditional so it also runs on
        # pull_request, where the same fallback is one edit away.
        run: python3 scripts/check-merge-group-checkout-refs.py
      - name: Formatting
        id: fmt
        # #4222: the committed rustfmt.toml is the nearest config and
        # terminates ancestor discovery; pin it explicitly so formatting
        # evidence never depends on what sits above the checkout.
        run: cargo fmt --all -- --check --config-path rustfmt.toml
      - name: Source-exception no-new guard
        id: no_new
        run: cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
      - name: Retained direct-floor freshness
        id: floor_freshness
        # Reuse the binary built by no-new. This grades retained evidence;
        # it does not rerun or replace the direct-floor proof.
        run: cargo run -p cargo-allow --locked -- min-version-drift check --format human
      - name: Emit and evaluate the typed pre-gate result
        if: always()
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FMT_OUTCOME: ${{ steps.fmt.outcome || 'skipped' }}
          NO_NEW_OUTCOME: ${{ steps.no_new.outcome || 'skipped' }}
          FLOOR_FRESHNESS_OUTCOME: ${{ steps.floor_freshness.outcome || 'skipped' }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome || 'skipped' }}
          CHECKOUT_REF_OUTCOME: ${{ steps.checkout_ref.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          outcome_to_state() {
            case "$1" in
              success) echo passed ;;
              skipped) echo skipped ;;
              *) echo failed ;;
            esac
          }
          checks="[]"
          for pair in "actionlint:$ACTIONLINT_OUTCOME" "checkout-ref:$CHECKOUT_REF_OUTCOME" "fmt:$FMT_OUTCOME" "no-new:$NO_NEW_OUTCOME" "floor-freshness:$FLOOR_FRESHNESS_OUTCOME"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            checks="$(jq -c --arg n "$name" --arg s "$(outcome_to_state "$outcome")"               '. + [{name: $n, state: $s, not_applicable_reason: null}]' <<<"$checks")"
          done
          jq -n --arg schema "cargo-allow.ci-pregate-result.v1" --argjson version 1             --arg head "$PR_HEAD" --arg base "$PR_BASE" --argjson checks "$checks"             '{schema_id: $schema, schema_version: $version, head_sha: $head, base_sha: $base,
              checks: $checks, diagnostics_uploaded: [], limits:
              ["actionlint scopes the syntax gate to ci.yml in stage 1; shellcheck integration stays off while the retained scripts carry pre-existing style findings",
               "actionlint runs before the toolchain steps are recorded here; its outcome is carried by the job conclusion"],
              claim_boundary: "A typed reachability gate for the CI workflow graph: deterministic cheap checks decide whether expensive proof jobs may start."}'             > pregate-result.json
          # A toolchain failure skips the cargo steps and fails the job
          # before this step: model that as an instrument failure.
          if [ "${{ steps.fmt.outcome }}" = "" ] && [ "${{ steps.no_new.outcome }}" = "" ]; then
            jq '.checks = [.checks[], {name: "toolchain", state: "instrument_failure", not_applicable_reason: null}]'               pregate-result.json > pregate-result.tmp && mv pregate-result.tmp pregate-result.json
          fi
          cargo run -p cargo-allow --locked -- ci-pregate evaluate             --result pregate-result.json --head "$PR_HEAD" --format human
      - name: Upload pre-gate diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pregate-result
          path: pregate-result.json
          if-no-files-found: ignore

  # The pinned syntax/expression lane (#3907 PR B): the exact actionlint
  # release the pregate pins runs over the full construction denominator
  # (workflows + checked examples) and the findings are graded into the
  # typed lane report. Advisory at this stage; enforcement selection is
  # the aggregate lane's authority (PR D under #2283/#2284).
  workflow-syntax:
    needs: [proof-route, queue-subject]
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/rust-cache
        with:
          lane: workflow-syntax
      - name: Pinned syntax lane over the construction denominator
        run: bash scripts/check-workflow-syntax.sh

  # The qualified security construction lane (#3907 PR C): the
  # qualified zizmor release runs offline over the full denominator and
  # the findings are graded with exact reviewed exceptions. Advisory:
  # completed runs always exit zero; enforcement selection is the
  # aggregate lane's authority (PR D under #2283/#2284).
  workflow-security:
    needs: [proof-route, queue-subject]
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/rust-cache
        with:
          lane: workflow-security
      - name: Qualified security lane over the construction denominator
        run: bash scripts/check-workflow-security.sh

  # The workflow construction aggregate (#3907 PR D): one stable
  # semantic report combining the syntax and security lanes over the
  # same denominator. Advisory: the aggregate does not gate;
  # enforcement selection is the #2283/#2284 authority. The aggregate
  # JSON is retained even when the aggregate carries findings or an
  # instrument failure.
  workflow-construction:
    needs: [proof-route, queue-subject]
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/rust-cache
        with:
          lane: workflow-construction
      - name: Construction aggregate over the denominator
        run: bash scripts/check-workflow-construction.sh
      - name: Retain the aggregate artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-construction-aggregate
          path: workflow-construction-aggregate.json
          if-no-files-found: warn

  # One exact base/head dependency graph delta for review (#3920 PR D).
  # Advisory until the owning policy selects blocking consequences;
  # malformed/empty inputs fail immediately inside the script.
  dependency-graph-delta:
    needs: [proof-route, queue-subject]
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # The complete B..G composition governs queue proof.
          # Pin the review head: on pull_request events the default
          # checkout is GitHub's synthetic merge commit, and the
          # receipt must bind the submitted head instead.
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/rust-cache
        with:
          lane: dependency-graph-delta
      - name: Compile and enrich the base/head delta
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: bash scripts/check-dependency-graph-delta.sh
      - name: Retain the delta and evidence artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-graph-delta
          path: |
            dependency-graph-delta.json
            dependency-graph-evidence-summary.md
          if-no-files-found: warn

  msrv:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins the floating `stable` channel for local
    # development. rustup ranks that file ABOVE `rustup default`, and `rustup
    # default` is how `dtolnay/rust-toolchain` selects its toolchain, so the
    # action tag below is inert on its own: cargo would resolve the runner's
    # stable and this lane would prove a Rust version the workspace does not
    # claim. `RUSTUP_TOOLCHAIN` outranks the toolchain file, so it is what
    # actually pins the lane. Removing it silently unpins the MSRV proof;
    # `scripts/check-msrv-consistency.sh` fails closed if it goes missing.
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      # Runs before the toolchain so drift fails in seconds. `rust-version` in
      # Cargo.toml is the source of truth; this proves the toolchain pin, the
      # cache key, and the attested release-manifest MSRV all still match it.
      - name: MSRV consistency
        run: bash scripts/check-msrv-consistency.sh
      # Keep installation profile and required components explicit before
      # rustup resolves the toolchain.
      - name: Toolchain installation profile
        run: bash scripts/check-toolchain-profile.sh
      # Proves the guard above still fails closed on each drift site, so it
      # cannot be weakened into a no-op without CI noticing. No toolchain, no
      # cargo: runs in about a second.
      - name: MSRV consistency guard characterization
        run: bash scripts/test-check-msrv-consistency.sh
      - name: Toolchain profile characterization
        run: bash scripts/test-check-toolchain-profile.sh
      # Drives the resolved-toolchain guard with stub compilers, so its
      # fail-closed behaviour is proven without installing real toolchains.
      - name: MSRV resolved toolchain guard characterization
        run: bash scripts/test-check-msrv-resolved.sh
      # Proves the direct-floor proof lane's shell contracts (product
      # registry, advisory pinning, meta-test skips, digest recipe) and
      # its fail-closed posture without installing any toolchain.
      - name: Direct-floor proof script characterization
        run: bash scripts/test-proof-direct-floors.sh
      # The action tag IS the proven toolchain, not a dependency version: it
      # must equal Cargo.toml `rust-version`. Dependabot is configured to leave
      # this action alone (.github/dependabot.yml); bumping it would keep CI
      # green while proving a Rust version the workspace does not claim.
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/rust-cache
        with:
          lane: msrv
          toolchain: 1.95.0
      # The pin above is configuration; this is the evidence. Asks the resolved
      # compiler what it is and fails closed unless it matches the declared
      # `rust-version`, so no future toolchain-selection change can leave this
      # lane green while proving a different Rust version.
      - name: MSRV resolved toolchain
        run: bash scripts/check-msrv-resolved.sh
      - name: MSRV workspace check
        # cargo-allow-scoped by policy (#3358): intent and proof claim
        # no toolchain yet; their lanes run stable checks only.
        run: |
          cargo check --locked --all-targets \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy \
            -p allow-inventory -p allow-files -p allow-rust -p allow-match \
            -p allow-report -p allow-diff \
            -p effortless-repo-protocol -p effortless-repo-snapshot \
            -p effortless-repo-edit

      - name: MSRV fast cargo-allow package proof
        run: cargo test -p cargo-allow --bins --locked

  # Pre-publication SourceCandidateSmoke (#2256 Stage A): prove the exact
  # reviewed source candidate packages, has no path dependencies, installs
  # from the workspace path, and passes first-hour CLI checks. Uploads a
  # hosted receipt artifact so the readiness claim rests on CI evidence, not
  # a local run. Linux only for the narrow claim; the msrv lane above
  # separately proves Rust 1.95.
  # Release-impact routing (#3794), job 1 of 3: a no-secret classifier that
  # decides the exact base/head/merge-base subject into the typed
  # ReleaseImpactReceiptV1 (cargo-allow.release-impact.v1). The job runs
  # unless proof-route succeeded with release_lanes=not_applicable, which is
  # only a docs_only plan whose paths are all provably unrelated. Any other
  # result, including a failed plan, runs this job. The skip is not keyed
  # off narrow. The denominator is the checked release-sensitive path rules
  # plus the #3786 semantic-owner inventory plus the generation-2 package
  # topology include/file-list authority; an unmatched path or unresolved
  # semantic owner selects the rehearsal (fail closed). This job routes
  # proof only — it never receives token context and never performs an
  # external action.
  release-impact:
    needs: proof-route
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.release_lanes != 'not_applicable') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Bind to the submitted head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Resolve the exact base/head/merge-base subject
        id: subject
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ -n "${EVENT_BASE:-}" ]; then
            base_sha="${EVENT_BASE}"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base_sha="${BEFORE}"
          else
            base_sha="$(git rev-parse HEAD~1)"
          fi
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          git diff --name-only "$merge_base" "$head_sha" > "$RUNNER_TEMP/changed-paths.txt"
          {
            echo "head=$head_sha"
            echo "base=$base_sha"
            echo "merge_base=$merge_base"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: release-impact
      - name: Classify the release impact
        env:
          SUBJECT_BASE: ${{ steps.subject.outputs.base }}
          SUBJECT_HEAD: ${{ steps.subject.outputs.head }}
          SUBJECT_MERGE_BASE: ${{ steps.subject.outputs.merge_base }}
        run: |
          set -euo pipefail
          mkdir -p target/cargo-allow
          cargo run -p cargo-allow --locked -- release-impact classify \
            --base "$SUBJECT_BASE" \
            --head "$SUBJECT_HEAD" \
            --merge-base "$SUBJECT_MERGE_BASE" \
            --paths-from "$RUNNER_TEMP/changed-paths.txt" \
            --root . \
            --output target/cargo-allow/release-impact.receipt.json
      - name: Expose the routing decision
        id: impact
        run: |
          set -euo pipefail
          required="$(jq -r '.rehearsal_required' target/cargo-allow/release-impact.receipt.json)"
          echo "rehearsal_required=$required" >> "$GITHUB_OUTPUT"
      - name: Retain the release-impact receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-impact-receipt
          path: target/cargo-allow/release-impact.receipt.json
          if-no-files-found: error

  # Release-impact routing (#3794), job 2 of 3: the conditional
  # exact-subject rehearsal. When the validated impact receipt requires
  # the rehearsal, the #3792 harness runs against the pinned head and its
  # receipt is recorded verbatim; otherwise the job records the checked
  # NotApplicable observation. The job validates the receipt subject
  # binding itself, receives no secrets, and records no interpretation:
  # #3792 owns the discriminating-status correction.
  release-rehearsal:
    needs: [release-impact, proof-route]
    # Still requires the impact receipt. Also skips when proof-route succeeded
    # with release_lanes=not_applicable. A failed impact job does not run the
    # harness against a missing receipt.
    if: ${{ !cancelled() && needs.release-impact.result == 'success' && (needs.proof-route.result != 'success' || needs.proof-route.outputs.release_lanes != 'not_applicable') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Resolve the exact base/head/merge-base subject
        id: subject
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ -n "${EVENT_BASE:-}" ]; then
            base_sha="${EVENT_BASE}"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base_sha="${BEFORE}"
          else
            base_sha="$(git rev-parse HEAD~1)"
          fi
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          {
            echo "head=$head_sha"
            echo "base=$base_sha"
            echo "merge_base=$merge_base"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: release-rehearsal
      - name: Restore the release-impact receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-impact-receipt
          path: target/cargo-allow
      - name: Validate the impact receipt against the exact subject
        env:
          SUBJECT_BASE: ${{ steps.subject.outputs.base }}
          SUBJECT_HEAD: ${{ steps.subject.outputs.head }}
          SUBJECT_MERGE_BASE: ${{ steps.subject.outputs.merge_base }}
        run: |
          set -euo pipefail
          cargo run -p cargo-allow --locked -- release-impact validate \
            --impact-receipt target/cargo-allow/release-impact.receipt.json \
            --expected-base "$SUBJECT_BASE" \
            --expected-head "$SUBJECT_HEAD" \
            --expected-merge-base "$SUBJECT_MERGE_BASE"
      - name: Read the routing decision
        id: impact
        run: |
          set -euo pipefail
          required="$(jq -r '.rehearsal_required' target/cargo-allow/release-impact.receipt.json)"
          echo "rehearsal_required=$required" >> "$GITHUB_OUTPUT"
      - name: Run the exact-subject release rehearsal when required
        id: harness
        if: steps.impact.outputs.rehearsal_required == 'true'
        env:
          SUBJECT_HEAD: ${{ steps.subject.outputs.head }}
        # The #3792 harness fails closed (its aggregate carries the
        # reserved-authorization posture), so the invocation exit code is
        # recorded and routed into the observation instead of failing the
        # job before the observation exists.
        run: |
          set -euo pipefail
          mkdir -p target/cargo-allow/release-rehearsal
          set +e
          python3 scripts/release-rehearsal.py --commit "$SUBJECT_HEAD" \
            --output target/cargo-allow/release-rehearsal/release-rehearsal.receipt.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "harness invocation exit code: $code"
      - name: Record the routing observation
        if: always()
        env:
          REHEARSAL_REQUIRED: ${{ steps.impact.outputs.rehearsal_required }}
          HARNESS_EXIT: ${{ steps.harness.outputs.exit_code }}
        run: |
          set -euo pipefail
          args=()
          if [ "$REHEARSAL_REQUIRED" = "true" ]; then
            args+=(--outcome executed --harness-exit-code "$HARNESS_EXIT" --harness-receipt target/cargo-allow/release-rehearsal/release-rehearsal.receipt.json)
          else
            args+=(--outcome not-applicable)
          fi
          cargo run -p cargo-allow --locked -- release-impact observe \
            --impact-receipt target/cargo-allow/release-impact.receipt.json \
            "${args[@]}" \
            --output target/cargo-allow/release-rehearsal-observation.json
      - name: Retain the rehearsal observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal-observation
          path: target/cargo-allow/release-rehearsal-observation.json
          if-no-files-found: error

  # Release-impact routing (#3794), job 3 of 3: the always-run terminal
  # routing aggregate and the stable required-check identity for this
  # graph (`release-rehearsal-required`; live required-check selection is
  # the #2283/#2284 authority and is not registered by this workflow). It
  # validates that the impact receipt and the rehearsal observation
  # exist, bind the exact expected subject, and agree — distinguishing a
  # legitimate NotApplicable from missing, skipped, cancelled, stale, or
  # malformed proof. A Passing result is routing completeness only; it is
  # not release authorization and does not interpret the harness status.
  release-rehearsal-required:
    needs: [release-impact, release-rehearsal, proof-route]
    # Runs for every result except a successful proof-route output of
    # release_lanes=not_applicable, including when a sibling fails, so a
    # skipped rehearsal is not mistaken for a passing aggregate. This job is
    # not a ruleset context. Live required-check selection stays with
    # #2283/#2284 and is not registered here.
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.release_lanes != 'not_applicable') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Resolve the exact base/head/merge-base subject
        id: subject
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ -n "${EVENT_BASE:-}" ]; then
            base_sha="${EVENT_BASE}"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base_sha="${BEFORE}"
          else
            base_sha="$(git rev-parse HEAD~1)"
          fi
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          {
            echo "head=$head_sha"
            echo "base=$base_sha"
            echo "merge_base=$merge_base"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: release-rehearsal-required
      - name: Restore the impact receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-impact-receipt
          path: target/cargo-allow
        # A missing artifact is exactly the failure the aggregate must
        # report; the typed result is emitted either way.
        continue-on-error: true
      - name: Restore the rehearsal observation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-rehearsal-observation
          path: target/cargo-allow
        continue-on-error: true
      - name: Evaluate the terminal routing aggregate
        env:
          SUBJECT_BASE: ${{ steps.subject.outputs.base }}
          SUBJECT_HEAD: ${{ steps.subject.outputs.head }}
          SUBJECT_MERGE_BASE: ${{ steps.subject.outputs.merge_base }}
        run: |
          set -euo pipefail
          cargo run -p cargo-allow --locked -- release-impact aggregate \
            --impact-receipt target/cargo-allow/release-impact.receipt.json \
            --rehearsal-observation target/cargo-allow/release-rehearsal-observation.json \
            --expected-base "$SUBJECT_BASE" \
            --expected-head "$SUBJECT_HEAD" \
            --expected-merge-base "$SUBJECT_MERGE_BASE" \
            --output target/cargo-allow/release-rehearsal-required.json
      - name: Retain the terminal routing aggregate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal-required
          path: target/cargo-allow/release-rehearsal-required.json
          if-no-files-found: error

  # Prove the workspace rust-version pin (1.95) still builds and runs the
  # fast package proof. Stable/full suite stays on the `test` job below so
  # the MSRV lane stays short and release-claim oriented (#1901).
  package-smoke:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || (needs.proof-route.outputs.class != 'docs_only' && needs.proof-route.outputs.class != 'test_only')) }}
    # The linked candidate must not inherit ubuntu-latest's libc upgrades.
    # This image retires 2027-04-17; #3151 owns its successor.
    runs-on: ubuntu-22.04
    env:
      # Match the exact lint lane. The action tag alone is inert because
      # rust-toolchain.toml outranks rustup default; RUSTUP_TOOLCHAIN is the
      # effective pin. Kept literal so the profiles checker resolves it.
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - uses: ./.github/actions/rust-cache
        with:
          lane: package-smoke-glibc235
          toolchain: "1.100.0"
      - name: GNU candidate ABI and binding falsifiers (#3151)
        run: python3 scripts/test-linux-gnu-candidate.py
      - name: Package candidate smoke (Stage A)
        run: bash scripts/package-candidate-smoke.sh
      - name: Linux release binary packaging contract (#2464)
        run: |
          mkdir -p target/release-binary-contract
          RECEIPT_PATH=target/release-binary-contract/release-binary-test.receipt.json \
            bash scripts/test-release-binary.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-binary-contract-receipt
          path: target/release-binary-contract/
          if-no-files-found: warn
      - name: Exact candidate package set (#2372)
        run: bash scripts/exact-candidate-package-set.sh
      - name: Package-byte authority proof (#4304)
        run: python3 scripts/test-package-byte-authority.py
      - name: Exact topology-selected package candidate artifact (#2924)
        run: |
          python3 scripts/exact-candidate-package-candidate.py --mode verify-packaged \
            --package-dir target/exact-candidate-package-set/packages \
            --output target/exact-candidate-package-candidate/package-candidate-v2.json
          python3 scripts/exact-candidate-package-candidate.py --mode baseline \
            --baseline docs/dogfood/receipts/package-candidate-v2.example.json
      - name: Package candidate producer contract characterization (#2924)
        run: python3 scripts/test-exact-candidate-package-candidate.py
      - name: Exact staged outside-workspace packaging (#2886)
        run: |
          python3 scripts/test-exact-candidate-staged-packaging.py
          cargo fetch --locked
          STAGED_ROOT="${RUNNER_TEMP}/exact-candidate-staged"
          python3 scripts/exact-candidate-staged-packaging.py --mode stage \
            --output-root "${STAGED_ROOT}" \
            --receipt target/cargo-allow/staged-packaging.receipt.json
          python3 scripts/exact-candidate-staged-packaging.py --mode package \
            --output-root "${STAGED_ROOT}" \
            --receipt target/cargo-allow/staged-packaging.receipt.json
          python3 scripts/exact-candidate-staged-packaging.py --mode verify \
            --output-root "${STAGED_ROOT}" \
            --receipt target/cargo-allow/staged-packaging.receipt.json
      - name: Exact isolated local-registry install (#2925)
        run: |
          python3 scripts/test-exact-candidate-index-checksum.py
          bash scripts/exact-candidate-isolated-install.sh
          python3 scripts/exact-candidate-isolated-install.py --mode classify \
            --candidate-artifact target/exact-candidate-package-candidate/package-candidate-v2.json \
            --input-receipt target/exact-candidate-isolated-install/isolated-install.receipt.json
          python3 scripts/test-exact-candidate-isolated-install.py
      - name: Exact candidate qualification journey (#2926)
        run: bash scripts/exact-candidate-qualification.sh
      - name: Cutover build receipts from package-set artifacts (#3469/#3552)
        run: |
          bash scripts/extraction-cutover-build-receipt.sh repo-snapshot
          bash scripts/extraction-cutover-build-receipt.sh repo-edit
      - name: Exact candidate install journey (#3357)
        env:
          # Restored target caches may contain an earlier default output.
          # Keep it untouched and bind this run's receipt uploads below.
          WORK_DIR: ${{ github.workspace }}/target/exact-candidate-install-journey-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/exact-candidate-install-journey.sh
      - name: Exact candidate journey contract characterization (#3357)
        run: bash scripts/test-exact-candidate-install-journey.sh
      - name: Exact installed upgrade and rollback journey (#3853)
        run: bash scripts/exact-upgrade-rollback-journey.sh
      - name: Exact upgrade and rollback contract characterization (#3853)
        run: bash scripts/test-exact-upgrade-rollback-journey.sh
      - name: Export qualified GNU libc 2.35 candidate without rebuilding (#3151)
        run: python3 scripts/linux-gnu-candidate.py package --output "${RUNNER_TEMP}/linux-gnu-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-gnu-glibc235-candidate
          path: ${{ runner.temp }}/linux-gnu-candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extraction-cutover-build-receipts
          path: |
            target/extraction-cutover/**/build-package.json
            target/exact-candidate-package-set/exact-candidate-package-set.receipt.json
            target/exact-candidate-package-set/packages/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: package-candidate-smoke-receipt
          path: target/package-candidate-smoke/package-candidate-smoke.receipt.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-candidate-package-set-receipt
          path: target/exact-candidate-package-set/exact-candidate-package-set.receipt.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-candidate-package-candidate-receipt
          path: target/exact-candidate-package-candidate/package-candidate-v2.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-candidate-staged-packaging-receipt
          path: target/cargo-allow/staged-packaging.receipt.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-candidate-isolated-install-receipt
          path: |
            target/exact-candidate-isolated-install/isolated-install.receipt.json
            target/exact-candidate-isolated-install/index-checksum-control-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-candidate-qualification-receipt
          path: target/exact-candidate-qualification/exact-candidate.receipt.v2.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-candidate-install-journey-receipt
          path: |
            target/exact-candidate-install-journey-${{ github.run_id }}-${{ github.run_attempt }}/exact-candidate-install-journey.receipt.json
            target/exact-candidate-install-journey-${{ github.run_id }}-${{ github.run_attempt }}/source-candidate-smoke.receipt.json
            target/exact-candidate-install-journey-${{ github.run_id }}-${{ github.run_attempt }}/exact-candidate-source-journey.*/source-candidate-smoke.receipt.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-upgrade-rollback-journey-receipt
          path: target/exact-upgrade-rollback-journey/exact-upgrade-rollback-journey.receipt.json
          if-no-files-found: warn
  # Product-scoped candidate lanes (#3358): one product's experimental
  # packaging failure must not block the cargo-allow patch/release lanes.
  # This lane owns the intent and proof candidate smokes plus the
  # three-product interop matrix; it re-runs the cargo-allow exact
  # candidate set standalone because the interop smoke drives the
  # installed cargo-allow binary. Posture: experimental-informational.
  product-candidates-interop:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || (needs.proof-route.outputs.narrow != 'true' && needs.proof-route.outputs.class != 'test_only')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: product-candidates-interop
      - name: Exact candidate package set for interop (#2372)
        run: |
          mkdir -p target/exact-candidate-package-set/packages
          bash scripts/exact-candidate-package-set.sh
      - name: Intent candidate install smoke (#2599-C)
        run: bash scripts/intent-candidate-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: intent-candidate-smoke-receipt
          path: target/intent-candidate-smoke/intent-candidate-smoke.receipt.json
          if-no-files-found: warn
      - name: Proof candidate install smoke (#2589-B)
        run: bash scripts/proof-candidate-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: proof-candidate-smoke-receipt
          path: target/proof-candidate-smoke/proof-candidate-smoke.receipt.json
          if-no-files-found: warn
      - name: Exact candidate interop smoke (#2605)
        run: |
          allow_bin="target/exact-candidate-package-set/install/bin/cargo-allow"
          intent_bin="target/intent-candidate-smoke/install/bin/cargo-intent"
          proof_bin="target/proof-candidate-smoke/install/bin/cargo-proof"
          for bin in "${allow_bin}" "${intent_bin}" "${proof_bin}"; do
            if [[ -x "${bin}.exe" ]]; then
              :
            elif [[ ! -x "${bin}" && ! -f "${bin}" ]]; then
              echo "missing candidate binary ${bin}" >&2
              exit 1
            fi
          done
          CARGO_ALLOW_BIN="${allow_bin}" \
          CARGO_INTENT_BIN="${intent_bin}" \
          CARGO_PROOF_BIN="${proof_bin}" \
          bash scripts/exact-candidate-interop-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-candidate-interop-receipt
          path: target/exact-candidate-interop/exact-candidate-interop.receipt.json
          if-no-files-found: warn
  # Hosted characterization for #2366 / #2355: shallow missing-base fails closed,
  # then the same diff succeeds after history is available. Linux-only; keeps PR
  # CI cheap relative to a full matrix.
  # Historical source provenance for the CI performance collector
  # (#4173): discriminating fixture harness, no live GitHub calls.
  collect-performance-fixtures:
    needs: [proof-route, queue-subject]
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - name: Collector provenance fixtures
        run: bash scripts/test-collect-ci-performance.sh

  shallow-diff-smoke:
    needs: [proof-route, queue-subject]
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate CI environment profiles (#3926)
        run: python scripts/check-ci-environment-profiles.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: shallow-diff-smoke
      - name: Shallow diff base smoke
        run: bash scripts/shallow-diff-base-smoke.sh
      - name: Shallow diff failure artifact characterization (#3566)
        if: always()
        run: bash scripts/test-shallow-diff-base-failure.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shallow-diff-base-smoke
          path: |
            target/shallow-diff-base-smoke/shallow-diff-base-smoke.receipt.txt
            target/shallow-diff-base-smoke/artifacts/

  # Hosted characterization for #2468: bind the supported operator loop to a
  # release binary, verify each command's semantic artifact, and retain the
  # receipt/artifacts for review. This is a conservative catastrophic ceiling,
  # not a universal latency target or hardware claim.
  operator-latency:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || (needs.proof-route.outputs.narrow != 'true' && needs.proof-route.outputs.class != 'test_only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: operator-latency
      # rust-cache restores target/ across runs, including target/perf-budget
      # per-run output (worklist page evidence, retained attempt archives).
      # The harness treats pre-existing retained evidence as a prior-owner
      # collision and refuses to replace it (#2468 contract, #4682), so the
      # cache layer — not the script — must start each run from empty. The
      # harness-characterization suite plants its own fixtures under
      # OUTPUT_DIR and requires them to survive smoke start.
      - name: Clear cached per-run operator-latency output
        run: rm -rf target/perf-budget
      - name: Operator latency harness contract (#2468)
        run: bash scripts/test-perf-budget-smoke.sh
      - name: Build release cargo-allow binary
        run: cargo build -p cargo-allow --bin cargo-allow --release --locked
      - name: Operator latency smoke (#2468)
        env:
          PROFILE: release
          CARGO_ALLOW_BIN: target/release/cargo-allow
          HARD_CEILING_MS: "60000"
        run: bash scripts/perf-budget-smoke.sh
      - name: Validate operator latency receipt contract
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt_path = Path("target/perf-budget/operator-latency.receipt.json")
          schema_path = Path("docs/schemas/operator-latency.v4.schema.json")
          assert receipt_path.is_file(), f"missing receipt: {receipt_path}; see the harness step output"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          assert schema["$id"].endswith("operator-latency.v4.schema.json")
          assert receipt["schema_id"] == "cargo-allow.operator-latency.v4"
          assert receipt["schema_version"] == 4
          assert all("cache_mode" in sample for sample in receipt["samples"])
          assert all(
              "payload_bytes" in sample and "semantic_payload_bytes" in sample
              for sample in receipt["samples"]
          ), "samples must record payload_bytes and semantic_payload_bytes"
          assert receipt["result"] == "pass"
          assert receipt["binary"]["profile"] == "release"
          samples = receipt["samples"]
          policy = receipt["sample_policy"]
          assert len(samples) == (
              policy["cold_process_samples"]
              + policy["warm_process_samples"]
              + policy["targeted_samples"]
              + policy["agent_loop_samples"]
              + policy["cadence_samples"]
              + policy["delta_samples"]
              + policy["incremental_samples"]
          )
          assert policy["cache_mode_samples"] == {"on": 3, "off": 1, "not_applicable": 18}
          assert (policy["cold_process_samples"], policy["warm_process_samples"], policy["targeted_samples"], policy["agent_loop_samples"]) == (2, 4, 6, 6)
          assert (policy["cadence_samples"], policy["delta_samples"], policy["incremental_samples"]) == (1, 2, 1)
          assert all(sample["status"] == "passed" for sample in receipt["samples"])
          cadence_rows = [sample for sample in samples if sample["name"] == "cadence_explicit_date"]
          assert len(cadence_rows) == 1, "expected exactly one cadence_explicit_date sample"
          assert cadence_rows[0]["phase"] == "cadence" and cadence_rows[0]["cache_mode"] == "not_applicable"
          delta_rows = [sample for sample in samples if sample["phase"] == "delta"]
          assert sorted(sample["name"] for sample in delta_rows) == [
              "delta_compile_moved_pair", "delta_compile_unchanged_pair",
          ], "expected exactly the two committed-pair delta compile samples"
          incremental_rows = [sample for sample in samples if sample["name"] == "incremental_one_file_check"]
          assert len(incremental_rows) == 1, "expected exactly one incremental_one_file_check sample"
          assert incremental_rows[0]["phase"] == "incremental" and incremental_rows[0]["cache_mode"] == "on"
          full_checks = [sample for sample in samples if sample["name"] == "full_check_json"]
          assert len(full_checks) == 1, "expected exactly one full_check_json sample"
          full_check = full_checks[0]
          assert full_check["phase"] == "warm" and full_check["cache_mode"] == "not_applicable"
          assert full_check["artifact"]["path"] == "artifacts/full-check.json"
          assert full_check["semantic_artifact"]["path"] == "artifacts/full-check.receipt.json"
          argv = full_check["argv"]
          assert len(argv) == 9 and argv[:6] == [
              "check", "--mode", "no-new", "--format", "json", "--receipt",
          ] and argv[7] == "--output", "full_check_json must measure the full JSON check command"
          assert Path(argv[6]).resolve() == receipt_path.parent.joinpath(full_check["semantic_artifact"]["path"]).resolve()
          assert Path(argv[8]).resolve() == receipt_path.parent.joinpath(full_check["artifact"]["path"]).resolve()
          def is_nonnegative_integer(value):
              return type(value) is int and value >= 0

          # Byte-count admission: each recorded count must be a nonnegative
          # integer and must match the byte size of the retained file behind
          # its own digest, so receipt growth stays observable per artifact.
          # Recompute both digests from retained bytes, including same-size
          # substitutions that byte-count checks alone cannot detect.
          artifact_root = receipt_path.parent
          for sample in samples:
              assert (
                  is_nonnegative_integer(sample["payload_bytes"])
                  and is_nonnegative_integer(sample["semantic_payload_bytes"])
              ), "samples payload and semantic payload byte counts must be nonnegative integers"
              assert (
                  artifact_root.joinpath(sample["artifact"]["path"]).stat().st_size
                  == sample["payload_bytes"]
              ), f"sample {sample['name']} payload_bytes must match the retained artifact size"
              assert (
                  artifact_root.joinpath(sample["semantic_artifact"]["path"]).stat().st_size
                  == sample["semantic_payload_bytes"]
              ), f"sample {sample['name']} semantic_payload_bytes must match the retained semantic artifact size"
              for key in ("artifact", "semantic_artifact"):
                  retained = artifact_root.joinpath(sample[key]["path"]).read_bytes()
                  assert hashlib.sha256(retained).hexdigest() == sample[key]["sha256"], (
                      f"sample {sample['name']} {key} sha256 must match the retained bytes"
                  )

          ceiling = receipt["budget"]["ceiling_ms"]
          assert all(
              is_nonnegative_integer(sample["elapsed_ms"]) and sample["elapsed_ms"] <= ceiling
              for sample in receipt["samples"]
          ), "samples.elapsed_ms must be nonnegative integers within the ceiling"
          agent_loop = receipt["agent_loop"]
          composite = agent_loop["composite"]
          assert [step["sample"] for step in composite["steps"]] == [
              "agent_loop_worklist",
              "agent_loop_why_plan",
              "agent_loop_add",
              "agent_loop_check",
          ]
          assert is_nonnegative_integer(composite["total_elapsed_ms"]), (
              "agent_loop.composite.total_elapsed_ms must be a nonnegative integer"
          )
          assert all(
              is_nonnegative_integer(step["elapsed_ms"]) for step in composite["steps"]
          ), "agent_loop.composite.steps.elapsed_ms must be nonnegative integers"
          assert all(
              is_nonnegative_integer(step.get("payload_bytes"))
              and is_nonnegative_integer(step.get("semantic_payload_bytes"))
              for step in composite["steps"]
          ), "agent_loop.composite.steps payload and semantic payload byte counts must be nonnegative integers"
          assert composite["total_elapsed_ms"] >= sum(
              step["elapsed_ms"] for step in composite["steps"]
          )
          assert composite["added_allow_id"]
          overhead = agent_loop["hooks_overhead"]
          assert overhead["wrapped_sample"] == "hooks_wrapped_check"
          assert overhead["bare_sample"] == "hooks_bare_check"
          assert all(
              is_nonnegative_integer(overhead[field])
              for field in ("wrapped_elapsed_ms", "bare_elapsed_ms")
          ), "agent_loop.hooks_overhead elapsed values must be nonnegative integers"
          assert overhead["overhead_ms"] == (
              overhead["wrapped_elapsed_ms"] - overhead["bare_elapsed_ms"]
          )
          # Coverage admission recursively rehashes the full population and
          # every actual page; companion existence alone proves nothing.
          import importlib.util
          spec = importlib.util.spec_from_file_location("worklist_pages", "scripts/qualify-worklist-pages.py")
          worklist_pages = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worklist_pages)
          for name in ("worklist", "agent_loop_worklist"):
              rows = [sample for sample in samples if sample["name"] == name]
              assert len(rows) == 1, f"expected one {name} sample"
              worklist_pages.validate_sample(
                  rows[0], artifact_root, ceiling, receipt["binary"]["sha256"],
                  receipt["repository"]["commit"],
              )
          print(f"validated {len(samples)} operator-latency samples")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: operator-latency-receipt
          path: |
            target/perf-budget/operator-latency.receipt.json
            target/perf-budget/artifacts/
            target/perf-budget/utc-rollover-attempt-1/
            target/perf-budget/utc-rollover-attempt-2/
          if-no-files-found: warn

  test:
    needs: [pregate, package-smoke, proof-route, queue-subject]
    # The cutover status lane restores the build receipts produced by the
    # package-smoke job; artifacts are only downloadable once that job
    # completes (#3469/#3552). A skipped package-smoke on docs_only or
    # test_only must not skip this ruleset context. The restore and the
    # status step run only when that job produced the receipts.
    # Heavy steps run unless proof-route succeeds with narrow=true and
    # class docs_only. Their if keeps success(), so an earlier failure in
    # this job stops the later heavy steps. Any other proof-route result
    # keeps them. This job is not skipped.
    # Inventory, fmt, audit, no-new, the change-note gate, and if: always()
    # uploads stay unconditional.
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.package-smoke.result == 'success' || needs.package-smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      # The release-set lint lane is intentionally newer than the workspace
      # MSRV (1.95). The action tag alone is inert because rust-toolchain.toml
      # pins the floating `stable` channel and rustup ranks that file above
      # `rustup default`; RUSTUP_TOOLCHAIN outranks the file. LINT_TOOLCHAIN is
      # the single declared value for RUSTUP_TOOLCHAIN, the toolchain action
      # input and the cache input, and the MSRV guard enforces that those uses
      # stay equal and that the versioned pins and toolchain inputs it scans
      # stay on the declared MSRV.
      # Advance the pin by bumping LINT_TOOLCHAIN and rerunning the release-set
      # clippy. Do not raise the workspace `rust-version` for this job: the
      # `msrv` job must keep proving the declared 1.95 MSRV.
      LINT_TOOLCHAIN: "1.100.0"
      # The env context is not available in a job-level env block, so the
      # value is written literally here; the guard fails if it drifts from
      # LINT_TOOLCHAIN.
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.LINT_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-cache
        with:
          lane: release-set
          toolchain: ${{ env.LINT_TOOLCHAIN }}
      - name: Evidence-surface inventory guard (#3810)
        run: |
          python3 scripts/test-verify-evidence-surface-inventory.py
          python3 scripts/verify-evidence-surface-inventory.py
      # #4222: pin the repository-owned rustfmt config; see the pregate
      # Formatting step for the merged-ancestor-discovery rationale.
      - run: cargo fmt --all --check -- --config-path rustfmt.toml
      - name: cargo-allow release-set clippy (#3358)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: |
          cargo clippy --locked --all-targets \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit \
            -- -D warnings

      - name: Changie sensor projections and falsifiers (#3623)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: |
          cargo test -p cargo-allow --locked changie_source_view -- --nocapture
          cargo test -p cargo-allow --locked changie_command -- --nocapture
      - name: Changie fragment schema independent-validation smoke (#3613)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: bash scripts/test-changie-fragment-schema-smoke.sh
      - name: Changie 0.2.0 union superset assertion (#3725)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        # The batch rewrites .changes/0.2.0.md from the fragments; the
        # pre-cut authored bullets have no fragment source. This is the
        # only check that reddens when that body is dropped, because the
        # history generator derives its expectation from CHANGELOG.md.
        run: python scripts/test-changie-0-2-0-union.py
      - name: Changie sensor self-dogfood (#3623)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        # cargo-allow analyzes its own .changie.yaml and complete
        # fragment population with the Rust-native sensor: no Go,
        # Aqua, or Changie on the runner, no ledger mutation.
        run: cargo run -p cargo-allow --locked -- changie lint --format json
      - name: Changie sensor packaged external-consumer proof (#3621)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        # Packages the workspace candidate set, extracts the exact
        # packaged allow-files bytes, patches crates-io to the packaged
        # siblings, and runs an isolated offline fixture crate against
        # the facade with the source checkout unneeded.
        run: bash scripts/test-changie-sensor-external-consumer.sh
      - name: Changie sensor feature proof (#3588)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        # The allow-files changie module is feature-gated; without this
        # step nothing in CI compiles or tests it.
        run: cargo test -p allow-files --locked --features changie
      - name: Candidate harness lifecycle characterization (#3509)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}


        run: python scripts/test-candidate-harness-lifecycle.py
      - name: Extraction readiness receipt (#2559)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: bash scripts/extraction-readiness-receipt.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extraction-readiness-receipt
          path: target/extraction-readiness/extraction-readiness.receipt.json
          if-no-files-found: warn
      - name: Characterize extraction parity cutover status (#3469)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: bash scripts/test-extraction-cutover-status.sh
      - name: Restore cutover build receipts (#3469/#3552)
        if: ${{ needs.package-smoke.result == 'success' && success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extraction-cutover-build-receipts
          path: target
        continue-on-error: true
      - name: Extraction parity cutover status (#3469)
        if: ${{ needs.package-smoke.result == 'success' && success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: bash scripts/extraction-cutover-status.sh
        env:
          # #3469 slice B: parity execution, ownership derivation, receipt
          # supply, and ledger linkage gate CI; old-path retirement stays
          # observational until #3543.
          EXTRACTION_CUTOVER_LANE_GATE: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extraction-cutover-status
          path: target/extraction-cutover/
          if-no-files-found: warn
      - name: Verify cargo-allow proof classes are non-empty
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/cargo-allow
          fast_start=$(date +%s)
          fast_count=$(cargo test -p cargo-allow --bins --locked -- --list | grep -cE ': test$' || true)
          fast_end=$(date +%s)
          contract_start=$(date +%s)
          contract_count=$(cargo test -p cargo-allow --tests --locked -- --list | grep -cE ': test$' || true)
          contract_end=$(date +%s)
          test "$fast_count" -gt 0
          test "$contract_count" -gt 0
          {
            echo "fast_tests=$fast_count"
            echo "fast_seconds=$((fast_end-fast_start))"
            echo "contract_tests=$contract_count"
            echo "contract_seconds=$((contract_end-contract_start))"
          } | tee target/cargo-allow/test-proof-classes.txt
      - name: Fast cargo-allow package proof
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: cargo test -p cargo-allow --bins --locked
      - name: Contract cargo-allow package proof
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: cargo test -p cargo-allow --tests --locked
      - name: Cargo-allow release-set proof union (#3358)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: |
          cargo test --locked \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit

      - name: Cargo-allow release-set doc tests (#3358)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: |
          cargo test --doc --locked \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit

      - name: Cargo-allow release-set docs (#3358)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: |
          cargo doc --no-deps --locked \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit

        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run -p cargo-allow -- audit --format json --output target/cargo-allow/audit.json
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - name: Verify exact merge-group policy-change evidence
        # Resolve a comparison pair for every event: pull_request and
        # merge_group supply it directly, push uses before..sha, and a
        # genuinely empty or all-zeros base skips with a recorded reason.
        env:
          QUEUE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          QUEUE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          case "${QUEUE_BASE_SHA:-}" in
            ''|0000000000000000000000000000000000000000)
              echo "policy-change evidence: no comparison base for ${GITHUB_EVENT_NAME}; skipping"
              exit 0
              ;;
          esac
          cargo run -p cargo-allow -- diff --base "$QUEUE_BASE_SHA" --head "$QUEUE_HEAD_SHA" --format markdown --require-change-note
      - name: Spec-system cutover receipt (#2568)
        if: ${{ success() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true' || needs.proof-route.outputs.class != 'docs_only') }}
        run: bash scripts/spec-system-cutover-receipt.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spec-system-cutover-receipt
          path: target/spec-system-cutover/spec-system-cutover.receipt.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cargo-allow-reports
          path: |
            target/cargo-allow/

  # Advisory stable clippy (#4781): the required release-set lint lane is
  # pinned to LINT_TOOLCHAIN, so a future Rust release cannot redden it.
  # This non-required lane runs the same release-set clippy on the runner's
  # current stable, so a new lint still surfaces early without blocking.
  clippy-stable:
    needs: proof-route
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          lane: clippy-stable
      - name: Release-set clippy on stable (advisory)
        run: |
          cargo clippy --locked --all-targets \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit \
            -- -D warnings

  # Routed feature-configuration proof (#3905 PR D): the recursive cargo
  # proof suite behind allow-report's feature_configuration_proof test is
  # #[ignore]d out of the always-on `test` job above. This blocking lane
  # derives the affected matrix rows from the changed files (wide by
  # default, per scripts/feature-config-routing.py) and proves exactly
  # those rows. Docs-only changes select no rows and skip the prove step;
  # the weekly feature-configuration-qualification workflow carries the
  # full selected union. Self-contained on purpose: it computes its own
  # merge base from a full-history checkout instead of waiting on
  # shallow-diff-smoke, a characterization job that produces no inputs
  # this job consumes.
  feature-configuration-proof:
    needs: [proof-route, queue-subject]
    if: ${{ !cancelled() && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Derive affected feature-configuration rows (#3905)
        id: routing
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          # Use the event's immutable base, including every queued predecessor.
          # A push event has no PR or merge-group base; use github.event.before
          # and fall back to HEAD~1 when it is empty or all zeros.
          if [ -z "${BASE_SHA:-}" ] || [ -z "${BASE_SHA//0/}" ]; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          # A failed diff must not become an empty/docs-only proof selection.
          git diff --name-only "$BASE_SHA" HEAD \
            | python3 scripts/feature-config-routing.py > "$RUNNER_TEMP/routing-rows.json"
          cat "$RUNNER_TEMP/routing-rows.json"
          # The router always emits one single-line JSON object whose rows
          # carry the concrete row IDs ("all" mode lists every ID), and the
          # value contains no %, CR, or newline, so plain GITHUB_OUTPUT
          # lines are the proper escaping here.
          echo "rows=$(cat "$RUNNER_TEMP/routing-rows.json")" >> "$GITHUB_OUTPUT"
          echo "proof_rows=$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))["rows"]))' "$RUNNER_TEMP/routing-rows.json")" >> "$GITHUB_OUTPUT"
          # mode "all" counts as has_rows even when the router could not list
          # IDs (unreadable/malformed projection): the wide-fail path must
          # prove, never skip. With an empty CARGO_ALLOW_PROOF_ROWS the
          # proof runs the full selected union.
          echo "has_rows=$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); print("true" if data["rows"] or data["mode"]=="all" else "false")' "$RUNNER_TEMP/routing-rows.json")" >> "$GITHUB_OUTPUT"
      - name: Routing self-test
        run: python3 scripts/test-feature-config-routing.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: feature-configuration-proof
      - name: Prove affected rows
        if: steps.routing.outputs.has_rows == 'true'
        env:
          CARGO_ALLOW_PROOF_ROWS: ${{ steps.routing.outputs.proof_rows }}
        run: cargo test -p allow-report --locked --test feature_configuration_proof -- --ignored

  # Cross-platform workspace test proof (#1825): run the workspace test suite
  # on Windows to guard the platform-specific code paths (path separators,
  # verbatim prefixes, CRLF, MAIN_SEPARATOR_STR). Kept separate from the main
  # `test` job so lint/doc/audit feedback stays fast on Linux. Windows-only
  # for now; macOS can be added when the cost/benefit shifts.
  # Integrated dogfood lane (#3358): cross-product contracts change here.
  # Governance validation, three-product dogfood, and the simplification
  # audit exercise the products together and stay out of the
  # cargo-allow-required test lane. Posture: integrated-informational.
  integrated-dogfood:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || (needs.proof-route.outputs.narrow != 'true' && needs.proof-route.outputs.class != 'test_only')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: integrated-dogfood
      - name: Build three-product binaries for dogfood (#2558)
        run: cargo build -p cargo-allow -p cargo-intent -p cargo-proof --locked
      - name: Governance validation receipt (#2942 step 5)
        run: |
          cargo run -p cargo-intent --locked -- --root . governance \
            --receipt target/cargo-intent/governance-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: governance-receipt
          path: target/cargo-intent/governance-receipt.json
          if-no-files-found: warn
      - name: Three-product dogfood smoke (#2558)
        run: bash scripts/three-product-dogfood-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: three-product-dogfood-receipt
          path: target/three-product-dogfood/three-product-dogfood.receipt.json
          if-no-files-found: warn
      - name: Three-product simplification audit (#2208)
        run: bash scripts/three-product-simplification-audit.sh

  test-core-platforms:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: release-set
      - name: Cargo-allow release-set test suite (#3358)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit
      - name: Cross-platform semantic fixture (#2265)
        shell: bash
        run: cargo test --locked -p allow-core cross_platform_semantics -- --nocapture
      - name: Retain platform proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/cross-platform
          {
            printf 'commit=%s\n' '${{ github.sha }}'
            printf 'run_id=%s\n' '${{ github.run_id }}'
            printf 'platform=%s\n' '${{ matrix.os }}'
            printf 'target=%s\n' '${{ matrix.target }}'
            printf 'runner_os=%s\n' "${RUNNER_OS}"
            printf 'toolchain_identity=\n'
            rustc -Vv | sed 's/^/  /'
            printf 'proof=release-set,cross_platform_semantics\n'
            printf 'result=%s\n' '${{ job.status }}'
          } > target/cross-platform/${{ matrix.target }}.proof.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cross-platform-proof-${{ matrix.target }}
          path: target/cross-platform
          if-no-files-found: error

  # Compatibility delegation lane (#3369/#2601-B): cargo-allow's staged
  # precommit delegation contract against cargo-intent. Core lanes no
  # longer build cargo-intent; this required lane proves the contract
  # with the exact installed candidate on Linux and a fresh build on
  # Windows.
  compat-delegation:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || (needs.proof-route.outputs.narrow != 'true' && needs.proof-route.outputs.class != 'test_only')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: compat-delegation
      - name: Core independence graph proof (#3369)
        # cargo-allow has no dependency edge on the cargo-intent
        # application; the delegation e2e lives in the
        # compat-delegation lane. --locked keeps the tree from
        # rewriting the lockfile; bash runs on both matrix OSes.
        shell: bash
        run: |
          if cargo tree --locked -p cargo-allow --all-targets -e normal,dev \
            | grep -q "cargo-intent v"; then
            echo "::error::cargo-allow graph gained a cargo-intent edge" >&2
            exit 1
          fi
      - name: Install the exact cargo-intent candidate (Linux)
        # The smoke packages against a patched registry without
        # --locked on every invocation and may rewrite Cargo.lock;
        # restore it so the --locked test step below stays honest.
        run: |
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock.guard"
          bash scripts/intent-candidate-smoke.sh
          cp "${RUNNER_TEMP}/Cargo.lock.guard" Cargo.lock

        if: runner.os == 'Linux'
      - name: Build cargo-intent (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p cargo-intent --locked
      - name: Delegation e2e against the resolved cargo-intent binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            bin="target/intent-candidate-smoke/install/bin/cargo-intent"
          else
            bin="target/debug/cargo-intent.exe"
          fi
          test -f "${bin}"
          env "CARGO_BIN_EXE_cargo-intent=$(pwd)/${bin}" \
            "CARGO_ALLOW_COMPAT_DELEGATION_REQUIRED=1" \
            cargo test -p cargo-allow --locked --test intent_staged_precommit_delegate -- --nocapture
  # Product-scoped test lanes (#3358): experimental products prove
  # themselves without gating the cargo-allow patch/release lanes.
  # Posture: experimental-informational.
  test-intent-experimental:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          lane: test-intent-experimental
      - name: cargo-intent clippy
        run: cargo clippy --locked --all-targets -p intent-model -p intent-protocol -p intent-compiler -p intent-edit -p cargo-intent -- -D warnings
      - name: cargo-intent test suite
        run: cargo test --locked -p intent-model -p intent-protocol -p intent-compiler -p intent-edit -p cargo-intent
      - name: cargo-intent doc tests
        run: cargo test --doc --locked -p intent-model -p intent-protocol -p intent-compiler -p intent-edit -p cargo-intent

  test-proof-experimental:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          lane: test-proof-experimental
      - name: cargo-proof clippy
        run: cargo clippy --locked --all-targets -p proof-protocol -p proof-orchestrator -p cargo-proof -- -D warnings
      - name: cargo-proof test suite
        run: cargo test --locked -p proof-protocol -p proof-orchestrator -p cargo-proof
      - name: cargo-proof doc tests
        run: cargo test --doc --locked -p proof-protocol -p proof-orchestrator -p cargo-proof

  # Shared-protocol lane (#3358): the namespace-rail shared crate is not
  # part of the cargo-allow release set and keeps its own proof lane.
  # Posture: shared-protocol-informational.
  test-shared-protocol:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          lane: test-shared-protocol
      - name: Shared protocol test suite
        run: cargo test --locked -p effortless-rust-source-index

  # Test coverage reporting (#1902). Runs cargo-tarpaulin on Linux and
  # uploads coverage to Codecov. Kept separate from the main test job so
  # coverage instrumentation doesn't slow down PR feedback.
  coverage:
    needs: [pregate, proof-route, queue-subject]
    if: ${{ !cancelled() && needs.pregate.result == 'success' && (needs.proof-route.result != 'success' || needs.proof-route.outputs.narrow != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
        # Pinned to the repo toolchain like every other lane here; a
        # floating stable toolchain ships a new LLVM whose profraw
        # format tarpaulin 0.37.0's parser cannot read, deterministically
        # failing the report merge (#4356).
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: ./.github/actions/rust-cache
        with:
          lane: coverage
      - name: Generate coverage report
        # Same precedence law the msrv job documents above: rust-toolchain.toml
        # ranks above `rustup default` (the only thing the dtolnay action
        # changes), so this env is what actually pins the compiler for the
        # install and tarpaulin runs. Removing it floats the coverage proof
        # on the runner's stable and can bring the profraw failure back.
        env:
          RUSTUP_TOOLCHAIN: "1.95.0"
        run: |
          coverage_temp="$RUNNER_TEMP/cargo-allow-coverage"
          mkdir -p "$coverage_temp"
          export TMPDIR="$coverage_temp"
          export TMP="$coverage_temp"
          export TEMP="$coverage_temp"
          # Pin the tool and use LLVM instrumentation. The workspace coverage
          # suite launches cargo-allow subprocesses; Tarpaulin's default
          # ptrace backend has produced false fixture failures in that lane.
          cargo install cargo-tarpaulin --version 0.37.0 --locked
          # Cover the cargo-allow release set plus the captured-receipt
          # validation products; coverage does not gate this lane.
          cargo tarpaulin --features cargo-proof/all-providers --locked --engine llvm --out xml \
            --output-dir target/cargo-allow \
            -p cargo-allow -p allow-core -p allow-policy -p allow-policy-legacy -p allow-inventory -p allow-files -p allow-rust -p allow-match -p allow-report -p allow-diff -p effortless-repo-protocol -p effortless-repo-snapshot -p effortless-repo-edit \
            -p proof-protocol -p proof-orchestrator -p cargo-proof \
            -p effortless-rust-source-index \
            -- --test-threads 1

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: target/cargo-allow/cobertura.xml
          fail_ci_if_error: false

  # Supply-chain audit via cargo-deny (#1897). Checks for known advisories,
  # disallowed licenses, banned crates, and untrusted source registries.
  # cargo-allow is a governance tool — it should enforce its own supply chain.
  cargo-deny:
    needs: queue-subject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - name: Install stable Rust for the dependency audit
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Check supply chain (cargo-deny, pinned)
        env:
          # Preserve the binary selected by cargo-deny-action v2.1.1
          # (3c6349835b2b7b196a839186cb8b78e02f7b5f25), without its
          # Docker Hub base-image pull. Version and asset digest move together.
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          CARGO_TERM_COLOR: always
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          cargo_deny_dir="${RUNNER_TEMP}/cargo-deny"
          cargo_deny_asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "${cargo_deny_dir}"
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail --location \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${cargo_deny_asset}.tar.gz" \
            -o "${cargo_deny_dir}/cargo-deny.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${cargo_deny_dir}/cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf "${cargo_deny_dir}/cargo-deny.tar.gz" --no-same-owner \
            -C "${cargo_deny_dir}" --strip-components=1 "${cargo_deny_asset}/cargo-deny"
          "${cargo_deny_dir}/cargo-deny" --version
          "${cargo_deny_dir}/cargo-deny" --log-level warn --manifest-path ./Cargo.toml --workspace check

  proof-route:
    # Lane applicability (#2569/#4332). One source-controlled plan in
    # scripts/ci-proof-route.py. A review-ledger successor narrows only
    # when predecessor proof is exact, terminal, and for the same source
    # and base. A docs-only effective diff can narrow. docs/schemas stays
    # wide. Unknown, malformed, shared impact, missing proof, and every
    # non-pull_request event stay wide, including push, workflow_dispatch,
    # and merge_group. Heavy lanes skip only when this job succeeds with
    # narrow=true; a failure still runs them. package-smoke also skips when
    # this job succeeds with class docs_only or test_only. The test job
    # still runs. Its heavy steps skip only when this job succeeds with
    # narrow=true and class docs_only; any other result keeps those steps.
    # pregate and cargo-deny do not read this output. The release graph reads
    # release_lanes only: it skips when this job succeeds with
    # release_lanes=not_applicable, and any other result keeps those jobs.
    # It does not read narrow. review-readiness and frozen-subject-lock are
    # separate workflows and are not filtered. Feature-configuration row
    # selection stays inside its own lane when that lane runs. Lookup is
    # read-only and stays off during the routing controls.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      narrow: ${{ steps.plan.outputs.narrow }}
      class: ${{ steps.plan.outputs.class }}
      release_lanes: ${{ steps.plan.outputs.release_lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Routing controls
        run: python3 scripts/test-ci-proof-route.py
      - name: Classify the lane plan
        id: plan
        env:
          PROOF_EVENT: ${{ github.event_name }}
          PROOF_BEFORE: ${{ github.event.before }}
          PROOF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROOF_BASE_REF: ${{ github.base_ref }}
          PROOF_LOOKUP_PREDECESSOR: "1"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python3 scripts/ci-proof-route.py
      - name: Retain the lane plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-proof-plan
          path: proof-plan.json
          if-no-files-found: error

  # This result cannot turn a skipped/failed/missing mandatory producer green.
  # Independent sentinel, frozen-subject and Changie checks remain required
  # separately in the coordinated settings generation.
  queue-qualification:
    # The actual-group proof exists only for a merge_group event. A PR run has
    # no group to qualify, so it skips rather than failing on a missing event.
    if: always() && github.event_name == 'merge_group'
    needs: [queue-subject, pregate, msrv, package-smoke, shallow-diff-smoke, operator-latency, test, feature-configuration-proof, test-core-platforms, compat-delegation, coverage, cargo-deny]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require complete actual-group proof
        env:
          QUEUE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/merge-group-subject.py result --receipt target/queue/result.json
      - name: Retain the queue result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/queue/result.json
          if-no-files-found: error
