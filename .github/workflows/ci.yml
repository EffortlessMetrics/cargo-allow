# Task-only diagnostic experiment. Never merge this workflow override.
name: Rehearsal compiler and cache controls
on:
  push:
    branches: [agent/4742-environment-controls]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'EffortlessMetrics/cargo-allow' && github.ref == 'refs/heads/agent/4742-environment-controls'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Select exact diagnostic source, not worker tree
        shell: bash
        run: |
          set -euo pipefail
          git -c core.autocrlf=false checkout --detach c9b623a3f6d94b6bdf5c03483b1d98945c0701a6
          test "$(git rev-parse HEAD^{tree})" = abbaf7f2e8e3bed3efb7b35afa141552256a546c
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/observations"
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - uses: ./.github/actions/rust-cache
        with:
          lane: issue4742-environment
          toolchain: '1.99.1'
      - name: Observe exact native fixture with controlled compiler and Cargo-home changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,signal,subprocess,tempfile,time
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'observations'
          results=[]
          for toolchain in ['1.95.0','1.99.1']:
              env=dict(os.environ); env.pop('CARGO_REGISTRY_TOKEN',None)
              env['RUSTUP_TOOLCHAIN']=toolchain
              compiler=subprocess.check_output(['rustc','-Vv'],env=env,text=True)
              cargo=subprocess.check_output(['cargo','-Vv'],env=env,text=True)
              (out/(toolchain+'-rustc.txt')).write_text(compiler)
              (out/(toolchain+'-cargo.txt')).write_text(cargo)
              build=subprocess.run(['cargo','test','-p','cargo-allow','--test','release_rehearsal','--locked','--no-run','--message-format=json'],env=env,capture_output=True,timeout=600)
              (out/(toolchain+'-build.jsonl')).write_bytes(build.stdout)
              (out/(toolchain+'-build.stderr')).write_bytes(build.stderr)
              if build.returncode: raise SystemExit(f'Native fixture build failed on {toolchain}; original output retained')
              executables=[]
              for line in build.stdout.splitlines():
                  row=json.loads(line)
                  if row.get('reason')=='compiler-artifact' and row.get('target',{}).get('name')=='release_rehearsal' and row.get('executable'):
                      executables.append(row['executable'])
              if len(executables)!=1: raise SystemExit('Expected exactly one native test executable')
              binary=Path(executables[0])
              binary_digest=hashlib.sha256(binary.read_bytes()).hexdigest()
              candidate_digest=hashlib.sha256(Path('target/debug/cargo-allow').read_bytes()).hexdigest()
              for mode in ['normal-home','isolated-offline-home']:
                  with tempfile.TemporaryDirectory(prefix='owned-cargo-control-') as home:
                      selected=dict(env)
                      if mode=='isolated-offline-home':
                          selected['CARGO_HOME']=home
                          selected['CARGO_NET_OFFLINE']='true'
                          selected['CARGO_NET_RETRY']='0'
                      command=[str(binary),'--exact','rehearsal_characterization_fails_closed','--nocapture']
                      start=time.monotonic()
                      proc=subprocess.Popen(command,env=selected,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
                      timed_out=False
                      try:
                          stdout,stderr=proc.communicate(timeout=300)
                      except subprocess.TimeoutExpired:
                          timed_out=True
                          os.killpg(proc.pid,signal.SIGKILL)
                          stdout,stderr=proc.communicate()
                      elapsed=time.monotonic()-start
                      label=toolchain+'-'+mode
                      (out/(label+'.stdout')).write_bytes(stdout)
                      (out/(label+'.stderr')).write_bytes(stderr)
                      if b'running 1 test' not in stdout: raise SystemExit('Selected fixture did not run')
                      row={'toolchain':toolchain,'mode':mode,'exit':proc.returncode,'timed_out':timed_out,'elapsed_seconds':round(elapsed,3),'test_executable_sha256':binary_digest,'candidate_executable_sha256':candidate_digest,'stdout_sha256':hashlib.sha256(stdout).hexdigest(),'stderr_sha256':hashlib.sha256(stderr).hexdigest(),'claim_boundary':'Controlled diagnostic observation; failure is retained and is not a qualification pass or retrospective root-cause conclusion.'}
                      results.append(row)
                      (out/'results.json').write_text(json.dumps(results,indent=2))
                      print(json.dumps(row),flush=True)
          PY
          test -z "$(git status --porcelain)"
      - name: Retain all observations, including native failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rehearsal-environment-observations
          path: ${{ runner.temp }}/observations/
          if-no-files-found: error
          retention-days: 14
