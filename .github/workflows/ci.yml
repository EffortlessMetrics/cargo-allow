# Task-only focused proof. Never merge this workflow override.
name: PR 4735 current-main focused proof
on:
  push:
    branches: [agent/4735-proof-aaf2c6d]
permissions:
  contents: read
concurrency:
  group: pr4735-proof-aaf2c6d
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'EffortlessMetrics/cargo-allow' && github.ref == 'refs/heads/agent/4735-proof-aaf2c6d'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Bind the independently reconstructed exact integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          git -c core.autocrlf=false checkout --detach 63b75618410fec1b22b801d0fb7002492f925abd
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = 7c89ae425cceca0712c6dc6140f5d3aa7a0a39fa
          test "$(git show -s --format=%P HEAD)" = 'f14d2ad7611d4c334b79250dd746b82fcb9769ef aaf2c6d1689c31683617a8068132ef538dc68997'
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          old='f14d2ad7611d4c334b79250dd746b82fcb9769ef'
          base='ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198'
          main='aaf2c6d1689c31683617a8068132ef538dc68997'
          expected=set(git('diff','--name-only',base,old).splitlines())
          actual=set(git('diff','--name-only',main,'HEAD').splitlines())
          if len(expected)!=8 or actual!=expected: raise SystemExit('unexpected candidate delta')
          for path in sorted(expected):
              if git('rev-parse',f'{old}:{path}')!=git('rev-parse',f'HEAD:{path}'): raise SystemExit(f'changed original repair: {path}')
          report={'candidate':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'main':main,'paths':sorted(actual),'original_repair_blobs_preserved':True,'unrelated_main_paths_preserved':True}
          Path(os.environ['RUNNER_TEMP'],'proof','subject.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          git update-ref refs/heads/pr4735-integrated HEAD
          git bundle create "$RUNNER_TEMP/proof/candidate.bundle" refs/heads/pr4735-integrated
          git diff aaf2c6d1689c31683617a8068132ef538dc68997 HEAD > "$RUNNER_TEMP/proof/actual.patch"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - uses: ./.github/actions/rust-cache
        with:
          lane: issue4734-focused
          toolchain: '1.95.0'
      - name: Format, inventory and MSRV all-target lint
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv > "$RUNNER_TEMP/proof/rustc-1.95.txt"
          cargo fmt --all -- --check --config-path rustfmt.toml
          git diff --check aaf2c6d1689c31683617a8068132ef538dc68997 HEAD
          python scripts/test-verify-evidence-surface-inventory.py
          python scripts/verify-evidence-surface-inventory.py
          cargo clippy -p cargo-allow --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/proof/clippy-1.95.log"
      - name: Execute affected native production-consumer controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'proof'
          results=[]
          for selected,minimum in [('release_freeze',70),('control_time_tests',1),('campaign_issue_closeout_workflow',8),('extraction_shim_registry',6)]:
              run=subprocess.run(['cargo','test','-p','cargo-allow','--bin','cargo-allow','--locked',selected],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (out/(selected+'.log')).write_bytes(run.stdout)
              text=run.stdout.decode(errors='replace')
              count=sum(int(n) for n in re.findall(r'test result: ok\. (\d+) passed;',text))
              results.append({'selection':selected,'exit':run.returncode,'passed':count})
              print(json.dumps(results[-1]),flush=True)
              if run.returncode or count<minimum: raise SystemExit(text)
          (out/'test-results.json').write_text(json.dumps(results,indent=2))
          PY
          cargo run -q -p cargo-allow --locked -- check --mode no-new --format markdown 2>&1 | tee "$RUNNER_TEMP/proof/no-new.log"
          cargo run -q -p cargo-allow --locked -- diff --base aaf2c6d1689c31683617a8068132ef538dc68997 --head 63b75618410fec1b22b801d0fb7002492f925abd --require-change-note --format markdown 2>&1 | tee "$RUNNER_TEMP/proof/diff.log"
      - name: Install the recorded stable lint compiler
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --no-self-update
      - name: Stable all-target lint and final source readback
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv > "$RUNNER_TEMP/proof/rustc-1.99.1.txt"
          cargo clippy -p cargo-allow --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/proof/clippy-1.99.1.log"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = 7c89ae425cceca0712c6dc6140f5d3aa7a0a39fa
      - name: Retain exact source and observations on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr4735-current-main-proof
          path: ${{ runner.temp }}/proof/
          retention-days: 14
          if-no-files-found: error
