# Task-only worker. Never merge this workflow override.
name: PR 4716 alias and ancestry proof
on:
  push:
    branches: [agent/4716-alias-proof-8df]
permissions:
  contents: read
concurrency:
  group: pr4716-alias-proof-8df
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'EffortlessMetrics/cargo-allow' && github.ref == 'refs/heads/agent/4716-alias-proof-8df'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.bind.outputs.candidate }}
      tree: ${{ steps.bind.outputs.tree }}
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply the exact selected patch to the original PR head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          test "$(git hash-object .github/maintenance/pr4716-alias.patch)" = ae2f007de0ed6fdff73245e41e81438e8c017a08
          cp .github/maintenance/pr4716-alias.patch "$RUNNER_TEMP/proof/selected.patch"
          git -c core.autocrlf=false checkout --detach 8dfebdbcdf0bb585861fdeec9dda65f52a78c0e3
          test -z "$(git status --porcelain)"
          git apply --index "$RUNNER_TEMP/proof/selected.patch"
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          components: rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          lane: pr4716-focused
          toolchain: '1.95.0'
      - name: Format only selected paths and check source inventory
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv > "$RUNNER_TEMP/proof/rustc-1.95.txt"
          git diff --cached --name-only -z -- '*.rs' | xargs -0 rustfmt --edition 2024 --config-path rustfmt.toml
          git add -u
          cargo fmt --all -- --check --config-path rustfmt.toml
          python scripts/test-verify-evidence-surface-inventory.py
          python scripts/verify-evidence-surface-inventory.py
          git diff --check
          git diff --cached --check
      - name: Bind and retain the exact candidate before tests
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.changes/Fixed-20261103-2359.yaml','crates/cargo-allow/src/cli.rs','crates/cargo-allow/src/core_command_router.rs','crates/cargo-allow/tests/core_command_summary_router_cli.rs','crates/cargo-allow/tests/init_summary_backup_cli.rs'}
          if actual != expected: raise SystemExit(f'Unexpected paths: {actual ^ expected}')
          PY
          git config user.name 'cargo-allow focused repair worker'
          git config user.email 'focused-repair-worker@users.noreply.github.com'
          tree=$(git write-tree)
          candidate=$(printf '%s\n' 'fix(init): protect canonical backups and file ancestry (#4714)' '' 'Reserve resolved backups on every shared validation; preserve symlink writer refusal.' 'Reject conflicting file ancestry and retain noncolliding prefix siblings.' | git commit-tree "$tree" -p 8dfebdbcdf0bb585861fdeec9dda65f52a78c0e3)
          git checkout --detach "$candidate"
          git update-ref refs/heads/pr4716-alias-prepared "$candidate"
          git bundle create "$RUNNER_TEMP/proof/candidate.bundle" refs/heads/pr4716-alias-prepared
          git diff 8dfebdbcdf0bb585861fdeec9dda65f52a78c0e3 "$candidate" > "$RUNNER_TEMP/proof/actual.patch"
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/proof/candidate.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/proof/tree.txt"
          printf 'candidate=%s\ntree=%s\n' "$candidate" "$tree" >> "$GITHUB_OUTPUT"
      - name: Rust 1.95 real-process and shared-router tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cargo-allow --locked --test init_summary_backup_cli --test core_command_summary_router_cli 2>&1 | tee "$RUNNER_TEMP/proof/integration.log"
          grep -F 'test result: ok. 8 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/proof/integration.log"
          grep -F 'test result: ok. 38 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/proof/integration.log"
          cargo test -p cargo-allow --bin cargo-allow --locked core_command_router 2>&1 | tee "$RUNNER_TEMP/proof/router-unit.log"
          grep -E 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/proof/router-unit.log"
          cp target/debug/cargo-allow "$RUNNER_TEMP/proof/cargo-allow"
          sha256sum "$RUNNER_TEMP/proof/cargo-allow" > "$RUNNER_TEMP/proof/binary.sha256"
      - name: Exact committed source guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/focused-alias-proof
          target/debug/cargo-allow check --mode no-new --format markdown --receipt target/focused-alias-proof/check.receipt.json --output target/focused-alias-proof/check.md
          target/debug/cargo-allow diff --base ba6f8ab086edc0217ae241ec5a9f24fb1b6f7198 --head "$(cat "$RUNNER_TEMP/proof/candidate.txt")" --format markdown --require-change-note > "$RUNNER_TEMP/proof/diff.md"
          cp target/focused-alias-proof/check.* "$RUNNER_TEMP/proof/"
      - name: Install the recorded stable lint compiler
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --no-self-update
      - name: Stable Clippy and unchanged tree
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv > "$RUNNER_TEMP/proof/rustc-1.99.1.txt"
          cargo clippy -p cargo-allow --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/proof/clippy.log"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/proof/tree.txt")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr4716-alias-proof
          path: ${{ runner.temp }}/proof/
          retention-days: 14
          if-no-files-found: error
  retain-candidate:
    needs: proof
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CANDIDATE: ${{ needs.proof.outputs.candidate }}
      TREE: ${{ needs.proof.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8dfebdbcdf0bb585861fdeec9dda65f52a78c0e3
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pr4716-alias-proof
          path: retained
      - name: Publish only a new staging ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          test "$CANDIDATE" = "$(cat retained/candidate.txt)"
          git fetch retained/candidate.bundle refs/heads/pr4716-alias-prepared
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          test "$(git show -s --format=%P "$CANDIDATE")" = 8dfebdbcdf0bb585861fdeec9dda65f52a78c0e3
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "$TREE"
          test "$(git ls-remote origin refs/heads/fix/4714-init-summary-preflight | cut -f1)" = 8dfebdbcdf0bb585861fdeec9dda65f52a78c0e3
          test -z "$(git ls-remote origin refs/heads/agent/4716-alias-qualified-8df)"
          git push origin "$CANDIDATE:refs/heads/agent/4716-alias-qualified-8df"
          test "$(git ls-remote origin refs/heads/agent/4716-alias-qualified-8df | cut -f1)" = "$CANDIDATE"
