name: Temporary materialize self-hosted spec source

on:
  push:
    branches:
      - agent/spec-system-self-hosted-source

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/spec-system-self-hosted-source
      - name: Register source artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ledger = Path(".allow/artifacts/doc-artifacts.toml")
          block = '''

          [[artifact]]
          id = "CARGO-ALLOW-SPEC-0009"
          kind = "spec"
          path = "docs/specs/CARGO-ALLOW-SPEC-0009-design-to-proof-walking-skeleton.md"
          status = "accepted"
          owner = "repo-infra"
          created = "2026-07-15"
          standalone_reason = "The first design-to-proof walking skeleton is a bounded self-hosted control-plane invariant; no separate product proposal is required."
          '''
          text = ledger.read_text(encoding="utf-8").rstrip()
          if 'id = "CARGO-ALLOW-SPEC-0009"' not in text:
              ledger.write_text(text + block + "\n", encoding="utf-8")

          policy = Path("policy/allow.toml")
          policy_blocks = '''

          [[allow]]
          id = "allow-4750"
          kind = "non_rust_file"
          family = "documentation"
          path = "docs/specs/CARGO-ALLOW-SPEC-0009-design-to-proof-walking-skeleton.md"
          owner = "core/policy"
          classification = "source_truth_spec"
          reason = "Defines the first retained design-to-proof runtime-promotion requirement and its bounded non-claims."
          evidence = ["issue:2206", "doc:.allow/artifacts/doc-artifacts.toml"]
          created = "2026-07-15"
          review_after = "2026-11-01"

          [allow.selector]
          ast_kind = "tracked_file"
          symbol = "docs/specs/CARGO-ALLOW-SPEC-0009-design-to-proof-walking-skeleton.md"
          target_fingerprint = "md"
          line_hint = 1

          [[allow]]
          id = "allow-4751"
          kind = "non_rust_file"
          family = "policy_metadata"
          path = ".allow/spec-system/slices/self-hosted-runtime-promotion-v1.toml"
          owner = "core/policy"
          classification = "normative_implementation_slice"
          reason = "Carries the compact spec/governance implementation slice for the first self-hosted requirement without mutable execution state."
          evidence = ["issue:2206", "doc:docs/specs/CARGO-ALLOW-SPEC-0009-design-to-proof-walking-skeleton.md"]
          created = "2026-07-15"
          review_after = "2026-11-01"

          [allow.selector]
          ast_kind = "tracked_file"
          symbol = ".allow/spec-system/slices/self-hosted-runtime-promotion-v1.toml"
          target_fingerprint = "toml"
          line_hint = 1
          '''
          text = policy.read_text(encoding="utf-8").rstrip()
          if 'id = "allow-4750"' not in text:
              policy.write_text(text + policy_blocks + "\n", encoding="utf-8")
          PY
      - name: Commit registrations
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .allow/artifacts/doc-artifacts.toml policy/allow.toml
          git commit -m "specs: register self-hosted requirement sources"
          git push origin HEAD:agent/spec-system-self-hosted-source
