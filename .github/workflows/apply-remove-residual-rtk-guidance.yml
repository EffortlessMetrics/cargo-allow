name: Apply residual RTK guidance cleanup

on:
  push:
    branches:
      - agent/remove-residual-rtk-guidance
    paths:
      - .github/workflows/apply-remove-residual-rtk-guidance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/remove-residual-rtk-guidance
          fetch-depth: 0

      - name: Remove RTK from live guidance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          paths = [
              Path("docs/readiness/self-hosting.md"),
              Path("docs/release/README.md"),
              Path("docs/specs/CARGO-ALLOW-SPEC-0001-spec-system-profile.md"),
              Path("plans/external-dogfood/ripr-spec-system-adoption.md"),
              Path("plans/federation/implementation-plan.md"),
              Path("plans/ledger-coherence/implementation-plan.md"),
              Path("plans/migration-parity/implementation-plan.md"),
              Path("plans/readiness/implementation-plan.md"),
              Path("plans/spec-system/implementation-plan.md"),
          ]

          changed = []
          for path in paths:
              raw = subprocess.check_output(
                  ["git", "show", f"origin/main:{path.as_posix()}"]
              )
              count = raw.count(b"rtk ")
              if count == 0:
                  raise SystemExit(f"expected at least one RTK command in {path}")
              path.write_bytes(raw.replace(b"rtk ", b""))
              changed.append((str(path), count))

          for path, count in changed:
              print(f"{path}: removed {count} RTK prefix(es)")
          PY

          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            docs/readiness/self-hosting.md \
            docs/release/README.md \
            docs/specs/CARGO-ALLOW-SPEC-0001-spec-system-profile.md \
            plans/external-dogfood/ripr-spec-system-adoption.md \
            plans/federation/implementation-plan.md \
            plans/ledger-coherence/implementation-plan.md \
            plans/migration-parity/implementation-plan.md \
            plans/readiness/implementation-plan.md \
            plans/spec-system/implementation-plan.md
          git commit -m "docs: remove RTK from live plans and runbooks"
          git push origin HEAD:agent/remove-residual-rtk-guidance
