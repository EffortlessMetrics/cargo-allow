name: one-shot-fix-2375b

on:
  push:
    branches:
      - agent/exact-rust-test-subjects-2224

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/exact-rust-test-subjects-2224
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove obsolete target defaults and temporary logs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/allow-rust/src/test_subjects.rs')
          text = path.read_text()
          text = text.replace('''            &root,\n            &default_target_name,\n            "src/main.rs",\n        );''', '''            &root,\n        );''', 1)
          text = text.replace('''            &root,\n            "",\n            "",\n        );''', '''            &root,\n        );''', 1)
          text = text.replace('''    root: &Path,\n    default_name: &str,\n    default_path: &str,\n) -> Vec<DeclaredTarget> {''', '''    root: &Path,\n) -> Vec<DeclaredTarget> {''', 1)
          path.write_text(text)
          PY
          rm -f .tmp/verification/2375b-clippy.log .tmp/verification/2375b-clippy-status
          rmdir .tmp/verification 2>/dev/null || true
          rmdir .tmp 2>/dev/null || true
          git rm .github/workflows/one-shot-fix-2375b.yml
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(rust): remove obsolete target defaults"
          git push origin HEAD:agent/exact-rust-test-subjects-2224
