name: one-shot-review-fixes-2369

on:
  push:
    branches:
      - agent/fix-requirement-implementation-status-2303

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/fix-requirement-implementation-status-2303
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply final review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          slice_path = Path('crates/allow-policy/src/spec_system/implementation_slice.rs')
          text = slice_path.read_text()
          status_change_struct = '''/// Optional normative change for a requirement referenced by a slice.\n///\n/// Most behavior slices merely reference an already accepted requirement and\n/// therefore omit this object. When present, it describes a real normative\n/// status transition and cannot be a no-op.\n#[derive(Clone, Debug, Eq, PartialEq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct RequirementStatusChange {\n    pub from: RequirementStatus,\n    pub to: RequirementStatus,\n}\n\n'''
          if status_change_struct not in text:
              raise SystemExit('RequirementStatusChange block not found')
          text = text.replace(status_change_struct, '', 1)
          text = text.replace('use super::{RequirementId, RequirementStatus};', 'use super::RequirementId;', 1)
          text = text.replace('''    #[serde(default)]\n    pub status_change: Option<RequirementStatusChange>,\n''', '', 1)
          validation = '''        if let Some(change) = &delta.status_change {\n            if change.from == change.to {\n                return Err(invalid_slice(\n                    path,\n                    format!(\n                        "requirement {} status_change must describe a real normative transition",\n                        delta.requirement_id.as_str()\n                    ),\n                ));\n            }\n        }\n'''
          if validation not in text:
              raise SystemExit('status-change validation block not found')
          text = text.replace(validation, '', 1)
          text = text.replace(
              'fn implementation_slice_rejects_unknown_generation()',
              'fn implementation_slice_rejects_unknown_schema_version()',
              1,
          )
          test_start = text.find('''    #[test]\n    fn implementation_slice_rejects_fake_normative_transition()''')
          if test_start < 0:
              raise SystemExit('fake normative transition test not found')
          test_end = text.find('''    #[test]\n    fn several_independent_implementation_slices_can_coexist()''', test_start)
          if test_end < 0:
              raise SystemExit('next test marker not found')
          text = text[:test_start] + text[test_end:]
          slice_path.write_text(text)

          runtime_path = Path('crates/allow-policy/src/spec_system/runtime_promotion.rs')
          text = runtime_path.read_text()
          text = text.replace('    RequirementStatusMismatch,\n', '', 1)
          marker = '    RequirementStatusDoesNotAllowImplementation,\n'
          if marker not in text:
              raise SystemExit('finding code marker not found')
          text = text.replace(marker, marker + '    ImplementedClaimWithoutRuntimeRequirement,\n', 1)
          status_check = '''        if let Some(change) = &delta.status_change {\n            if change.to != requirement.status {\n                findings.push(RuntimePromotionFinding::new(\n                    RuntimePromotionFindingCode::RequirementStatusMismatch,\n                    Some(delta.requirement_id.clone()),\n                    format!(\n                        "requirement {} status change targets {:?}, but current normative status is {:?}",\n                        delta.requirement_id.as_str(),\n                        change.to,\n                        requirement.status\n                    ),\n                ));\n            }\n        }\n'''
          if status_check not in text:
              raise SystemExit('runtime status-change check not found')
          text = text.replace(status_check, '', 1)
          guard = '''    if slice.implementation_claim.status != ImplementationClaimStatus::Implemented {\n        return;\n    }\n\n'''
          insertion = guard + '''    if runtime_requirements.is_empty() {\n        findings.push(RuntimePromotionFinding::new(\n            RuntimePromotionFindingCode::ImplementedClaimWithoutRuntimeRequirement,\n            None,\n            "implemented claim requires at least one eligible runtime requirement",\n        ));\n        return;\n    }\n\n'''
          if guard not in text:
              raise SystemExit('implementation claim guard not found')
          text = text.replace(guard, insertion, 1)
          test_marker = '''    #[test]\n    fn behavior_change_accepts_implemented_claim_with_current_evidence()'''
          new_test = '''    #[test]\n    fn implemented_claim_without_runtime_requirement_is_rejected() -> Result<(), String> {\n        let graph = graph()?;\n        let mut slice = slice()?;\n        slice.change_class = ImplementationSliceClass::BehaviorChange;\n        slice.implementation_claim.status = ImplementationClaimStatus::Implemented;\n        slice.evidence.state = EvidenceDispositionState::Current;\n        slice.evidence.receipt = Some("receipt:current-head".to_string());\n        slice.requirement_delta[0].runtime = false;\n\n        let findings = validate_runtime_promotion(&graph, &slice);\n        assert_eq!(\n            findings.first().map(|finding| finding.code),\n            Some(RuntimePromotionFindingCode::ImplementedClaimWithoutRuntimeRequirement)\n        );\n        Ok(())\n    }\n\n'''
          if test_marker not in text:
              raise SystemExit('behavior test marker not found')
          text = text.replace(test_marker, new_test + test_marker, 1)
          runtime_path.write_text(text)

          mod_path = Path('crates/allow-policy/src/spec_system/mod.rs')
          text = mod_path.read_text()
          text = text.replace(' RequirementDelta, RequirementStatusChange,\n', ' RequirementDelta,\n', 1)
          mod_path.write_text(text)
          PY
          git rm .github/workflows/one-shot-review-fixes-2369.yml
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(spec-system): reject ownerless implemented claims"
          git push origin HEAD:agent/fix-requirement-implementation-status-2303
