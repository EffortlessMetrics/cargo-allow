name: one-shot-fix-test-subjects-2375

on:
  push:
    branches:
      - agent/exact-rust-test-subjects-2224

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'EffortlessMetrics/cargo-allow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/exact-rust-test-subjects-2224
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Refactor traversal and remove panic-prone indexing
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/allow-rust/src/test_subjects.rs')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one marker, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '            let name = Path::new(&components[1]).file_stem()?.to_str()?.to_string();',
              '            let file = components.get(1)?;\n            let name = Path::new(file).file_stem()?.to_str()?.to_string();',
          )

          call_start = text.index('        let mut file_prefix = file_module_prefix(&path, &target.root_path);')
          call_end = text.index('        );\n', call_start) + len('        );\n')
          call = '\n'.join([
              '        let file_prefix = file_module_prefix(&path, &target.root_path);',
              '        let mut traversal = TestTraversal {',
              '            source: &source,',
              '            path: &path,',
              '            package,',
              '            target: &target,',
              '            file_prefix: &file_prefix,',
              '            inline_modules: Vec::new(),',
              '            options,',
              '            subjects: &mut subjects,',
              '        };',
              '        traversal.collect(syntax.tree.root_node(), false);',
              '',
          ])
          text = text[:call_start] + call + text[call_end:]

          function_start = text.index('#[allow(clippy::too_many_arguments)]\nfn collect_test_subjects(')
          function_end = text.index('\nfn node_attributes(', function_start)
          traversal = r'''struct TestTraversal<'a> {
              source: &'a str,
              path: &'a Path,
              package: &'a PackageManifest,
              target: &'a TargetContext,
              file_prefix: &'a [String],
              inline_modules: Vec<String>,
              options: &'a RustTestInventoryOptions,
              subjects: &'a mut Vec<RustTestSubject>,
          }

          impl TestTraversal<'_> {
              fn collect(&mut self, node: Node<'_>, inherited_cfg_unknown: bool) {
                  let attributes = node_attributes(node, self.source);
                  let local_cfg_unknown = attributes.iter().any(|attribute| cfg_is_unknown(attribute));

                  if node.kind() == "mod_item" {
                      if let Some(name) = node
                          .child_by_field_name("name")
                          .and_then(|name| node_text(self.source, name))
                      {
                          self.inline_modules.push(name.to_string());
                          self.visit_children(node, inherited_cfg_unknown || local_cfg_unknown);
                          self.inline_modules.pop();
                          return;
                      }
                  }

                  if node.kind() == "function_item" {
                      let attribute_names = attributes
                          .iter()
                          .filter_map(|attribute| attribute_name(attribute))
                          .collect::<Vec<_>>();
                      let is_test = attribute_names.iter().any(|name| name == "test")
                          || attribute_names
                              .iter()
                              .any(|name| self.options.additional_test_attributes.contains(name));
                      if is_test {
                          if let Some(name) = node
                              .child_by_field_name("name")
                              .and_then(|name| node_text(self.source, name))
                          {
                              let start_byte = attribute_start_byte(node, self.source)
                                  .unwrap_or(node.start_byte());
                              let start_position = attribute_start_position(node, self.source)
                                  .unwrap_or_else(|| node.start_position());
                              let end_position = node.end_position();
                              let body = self
                                  .source
                                  .get(start_byte..node.end_byte())
                                  .unwrap_or_default()
                                  .replace("\r\n", "\n");
                              let mut module_path = self.file_prefix.to_vec();
                              module_path.extend(self.inline_modules.iter().cloned());
                              let generated_or_parameterized = attribute_names.iter().any(|name| {
                                  name == "rstest"
                                      || name == "test_case"
                                      || name.ends_with("::rstest")
                                      || name.ends_with("::test_case")
                              });
                              let cfg_or_feature_unknown = inherited_cfg_unknown || local_cfg_unknown;
                              let mut limitations = Vec::new();
                              if self.target.source_membership_limited {
                                  limitations.push(
                                      "source-only analysis cannot prove the module is included by the target"
                                          .to_string(),
                                  );
                              }
                              if generated_or_parameterized {
                                  limitations.push(
                                      "parameterized/generated test cases do not have exact executable identities"
                                          .to_string(),
                                  );
                              }
                              if cfg_or_feature_unknown {
                                  limitations.push(
                                      "cfg or feature expansion is not resolved by source-only inventory"
                                          .to_string(),
                                  );
                              }
                              limitations.sort();
                              limitations.dedup();
                              self.subjects.push(RustTestSubject {
                                  selector: RustTestSelector {
                                      package: self.package.name.clone(),
                                      target: self.target.identity.clone(),
                                      module_path,
                                      function: name.to_string(),
                                  },
                                  source_path: normalize_path(self.path),
                                  source_range: RustTestSourceRange {
                                      start_line: start_position.row as u32 + 1,
                                      start_column: source_column(
                                          self.source,
                                          start_position.row,
                                          start_position.column,
                                      ),
                                      end_line: end_position.row as u32 + 1,
                                      end_column: source_column(
                                          self.source,
                                          end_position.row,
                                          end_position.column,
                                      ),
                                  },
                                  body_identity: stable_hash_hex(&body),
                                  attributes,
                                  generated_or_parameterized,
                                  cfg_or_feature_unknown,
                                  limitations,
                              });
                          }
                      }
                  }

                  self.visit_children(node, inherited_cfg_unknown || local_cfg_unknown);
              }

              fn visit_children(&mut self, node: Node<'_>, inherited_cfg_unknown: bool) {
                  let mut cursor = node.walk();
                  for child in node.children(&mut cursor) {
                      self.collect(child, inherited_cfg_unknown);
                  }
              }
          }
          '''
          text = text[:function_start] + traversal + text[function_end:]

          test_marker = '\n    #[test]\n    fn inventories_nested_inline_unit_test()'
          helper = '''
              fn only_subject(inventory: &RustTestInventory) -> &RustTestSubject {
                  assert_eq!(inventory.subjects.len(), 1);
                  inventory
                      .subjects
                      .first()
                      .expect("one exact source-declared test subject")
              }
          '''
          if test_marker not in text:
              raise SystemExit('unit-test insertion marker changed')
          text = text.replace(test_marker, helper + test_marker, 1)
          text = text.replace('let subject = &inventory.subjects[0];', 'let subject = only_subject(&inventory);')

          same_start = text.index('        assert_ne!(\n            inventory.subjects[0].selector.target.name,')
          same_end = text.index('        );\n', same_start) + len('        );\n')
          same = '\n'.join([
              '        let mut subjects = inventory.subjects.iter();',
              '        let first = subjects.next().expect("first integration test subject");',
              '        let second = subjects.next().expect("second integration test subject");',
              '        assert!(subjects.next().is_none());',
              '        assert_ne!(first.selector.target.name, second.selector.target.name);',
              '',
          ])
          text = text[:same_start] + same + text[same_end:]

          changed_start = text.index('        assert_eq!(first.subjects[0].selector, second.subjects[0].selector);')
          changed_end = text.index('        );\n', changed_start) + len('        );\n')
          changed = '\n'.join([
              '        let first_subject = only_subject(&first);',
              '        let second_subject = only_subject(&second);',
              '        assert_eq!(first_subject.selector, second_subject.selector);',
              '        assert_ne!(first_subject.body_identity, second_subject.body_identity);',
              '',
          ])
          text = text[:changed_start] + changed + text[changed_end:]
          text = text.replace(
              'let selector = inventory.subjects[0].selector.clone();',
              'let selector = only_subject(&inventory).selector.clone();',
          )

          if '#[allow(clippy::too_many_arguments)]' in text:
              raise SystemExit('too_many_arguments allow remained')
          if 'subjects[0]' in text or 'subjects[1]' in text or 'components[1]' in text:
              raise SystemExit('panic-prone indexing remained')
          path.write_text(text)
      - name: Verify focused implementation
        run: |
          cargo fmt --all
          cargo test -p allow-rust test_subjects --locked -- --nocapture
          cargo clippy -p allow-rust --all-targets --locked -- -D warnings
      - name: Remove one-shot workflow and prove no-new
        run: |
          rm .github/workflows/one-shot-fix-test-subjects-2375.yml
          cargo run -p cargo-allow -- check --mode no-new --format markdown --output target/cargo-allow/test-subjects-no-new.md
      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(rust): bound exact test-subject traversal'
          git push origin HEAD:agent/exact-rust-test-subjects-2224
