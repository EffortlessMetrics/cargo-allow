name: Diagnostic 2901 MSRV Clippy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Capture MSRV check
        id: check
        shell: bash
        run: |
          set +e
          mkdir -p target/diagnostic-2901
          cargo check --workspace --all-targets --locked \
            > target/diagnostic-2901/check.log 2>&1
          echo "exit_code=$?" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Capture MSRV Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings \
            > target/diagnostic-2901/clippy.log 2>&1
          echo "exit_code=$?" >> "${GITHUB_OUTPUT}"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-2901-msrv-clippy
          path: target/diagnostic-2901/
          if-no-files-found: error
      - name: Preserve failure
        shell: bash
        run: |
          test "${{ steps.check.outputs.exit_code }}" = 0
          test "${{ steps.clippy.outputs.exit_code }}" = 0
