name: PR 4303 final source repair

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-final-source-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[finalize-4303]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/automation-pr4303-finalize.yml
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/allow-report/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          start = text.index('// Canonical shared release-operation authority (#3940 PR A).')
          end = text.index('// Root re-exports for the durable operation lease (#3925).', start)
          replacement = '''// Canonical shared release-operation authority (#3940 PR A).
          pub use artifacts::{
              CargoAllowReleaseOperationAssetRowV1, CargoAllowReleaseOperationAuthorityKindV1,
              CargoAllowReleaseOperationClassV1, CargoAllowReleaseOperationEvaluationV1,
              CargoAllowReleaseOperationEventClassV1, CargoAllowReleaseOperationEventInitV1,
              CargoAllowReleaseOperationEventSubjectV1, CargoAllowReleaseOperationEventV1,
              CargoAllowReleaseOperationHeadV1, CargoAllowReleaseOperationIdentityInitV1,
              CargoAllowReleaseOperationIdentityV1, CargoAllowReleaseOperationPackageRowV1,
              CargoAllowReleaseOperationPredecessorProofV1, CargoAllowReleaseOperationProducerV1,
              CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,
              CargoAllowReleaseOperationStateV1, RELEASE_OPERATION_ASSET_SELECTION,
              RELEASE_OPERATION_AUTHORITY_SCHEMA_VERSION, RELEASE_OPERATION_CHANNEL,
              RELEASE_OPERATION_EVALUATION_SCHEMA_ID, RELEASE_OPERATION_EVENT_SCHEMA_ID,
              RELEASE_OPERATION_GENESIS_DIGEST, RELEASE_OPERATION_HEAD_SCHEMA_ID,
              RELEASE_OPERATION_IDENTITY_SCHEMA_ID, RELEASE_OPERATION_PRODUCT, RELEASE_OPERATION_REPOSITORY,
              RELEASE_OPERATION_TAG, RELEASE_OPERATION_VERSION, append_release_operation_event_v1,
              append_release_operation_event_with_predecessor_v1, build_release_operation_identity_v1,
              build_release_operation_identity_with_predecessor_v1, compile_release_operation_head_v1,
              compile_release_operation_head_with_predecessor_v1, evaluate_release_operation_v1,
              evaluate_release_operation_with_predecessor_v1, release_operation_event_digest_v1,
              release_operation_head_digest_v1, release_operation_identity_digest_v1,
              render_release_operation_evaluation_v1, render_release_operation_event_v1,
              render_release_operation_head_v1, render_release_operation_identity_v1,
              validate_release_operation_evaluation_v1,
              validate_release_operation_evaluation_with_predecessor_v1, validate_release_operation_head_v1,
              validate_release_operation_head_with_predecessor_v1, validate_release_operation_history_v1,
              validate_release_operation_history_with_predecessor_v1,
              validate_release_operation_identity_v1, validate_release_operation_predecessor_v1,
          };

          '''
          lib.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')

          authority = Path('crates/allow-report/src/artifacts/release_operation_authority_v1.rs')
          text = authority.read_text(encoding='utf-8')
          start = text.index('fn init_resolves_unknown(')
          end = text.index('fn exact_package_subjects(', start)
          authority.write_text(text[:start] + text[end:], encoding='utf-8', newline='\n')
          PY
          cargo fmt --all

      - name: Focused authority proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit validated final tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/automation-pr4303-finalize.yml
          git config user.name 'EffortlessSteven'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'fix(release): expose and format canonical operation authority (#3940)'
          git push origin HEAD:release/3940-operation-authority-v1
