name: One-shot provider dirty-state repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 4131 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/2567-provider-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/2567-provider-contract
          fetch-depth: 0
      - name: Repair the exact accidental token replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/cargo-allow/src/provider_contract.rs')
          source = path.read_text(encoding='utf-8')
          wrong = 'let dut value = request();'
          right = 'let mut value = request();'
          if source.count(wrong) != 1:
              raise SystemExit('expected exactly one accidental token replacement')
          path.write_text(source.replace(wrong, right), encoding='utf-8')
          PY
          changed="$(git diff --name-only)"
          test "$changed" = "crates/cargo-allow/src/provider_contract.rs"
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/cargo-allow/src/provider_contract.rs
          git commit -m 'fix(provider): repair dirty-state validation patch'
          git push origin HEAD:codex/2567-provider-contract
