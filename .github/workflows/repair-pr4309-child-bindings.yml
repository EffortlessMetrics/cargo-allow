name: Repair PR 4309 child authority bindings

on:
  push:
    branches:
      - release/3940-operation-migration-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4309-child-bindings
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/3940-operation-migration-v1
          fetch-depth: 2
          persist-credentials: true

      - name: Guard and stage the exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1613303c20bddc33d870451671514682409a5a20"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr4309-child-bindings.yml"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          def replace_tail(path: str, marker: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected one tail marker, found {count}")
              prefix = text[: text.index(marker)]
              target.write_text(prefix + replacement.rstrip() + "\n", encoding="utf-8", newline="\n")

          replace_once(
              "crates/allow-report/src/artifacts/publication_journal_v1.rs",
              '''pub fn begin_publication_journal_for_operation_v1(
              identity: &CargoAllowReleaseOperationIdentityV1,
              mut init: PublicationJournalInitV1,
          ) -> Result<CargoAllowPublicationJournalV1, &'static str> {
              validate_release_operation_identity_v1(identity)
                  .map_err(|_| "journal operation identity is not canonical")?;
              let class_agrees = matches!(
                  (&identity.operation_class, &init.operation_class,),
                  (
                      CargoAllowReleaseOperationClassV1::CleanFinalPublication,
                      PublicationJournalClassV1::CleanFinalPublication,
                  ) | (
                      CargoAllowReleaseOperationClassV1::IncidentRecovery,
                      PublicationJournalClassV1::IncidentRecovery,
                  )
              );
              if !class_agrees {
                  return Err("journal class must agree with the canonical operation class");
              }
              init.operation_identity_digest =
                  release_operation_identity_digest_v1(identity).map_err(|_| "identity digest failed")?;
              begin_publication_journal_v1(init)
          }
          ''',
              '''pub fn begin_publication_journal_for_operation_v1(
              identity: &CargoAllowReleaseOperationIdentityV1,
              mut init: PublicationJournalInitV1,
          ) -> Result<CargoAllowPublicationJournalV1, &'static str> {
              validate_release_operation_identity_v1(identity)
                  .map_err(|_| "journal operation identity is not canonical")?;
              let expected_class = match identity.operation_class {
                  CargoAllowReleaseOperationClassV1::CleanFinalPublication => {
                      PublicationJournalClassV1::CleanFinalPublication
                  }
                  CargoAllowReleaseOperationClassV1::IncidentRecovery => {
                      PublicationJournalClassV1::IncidentRecovery
                  }
                  CargoAllowReleaseOperationClassV1::Containment => {
                      return Err("containment operations cannot own a publication journal");
                  }
              };
              if init.operation_class != expected_class {
                  return Err("journal class must agree with the canonical operation class");
              }
              if init.authorization_digest != identity.authorization_digest
                  || init.custody_digest != identity.custody_digest
                  || init.freeze_digest != identity.freeze_digest
              {
                  return Err("journal authority fields must agree with the canonical operation");
              }
              init.operation_identity_digest =
                  release_operation_identity_digest_v1(identity).map_err(|_| "identity digest failed")?;
              begin_publication_journal_v1(init)
          }
          ''',
          )

          replace_once(
              "crates/allow-report/src/artifacts/final_tag_transaction_v1.rs",
              '''pub fn begin_tag_transaction_for_operation_v1(
              identity: &CargoAllowReleaseOperationIdentityV1,
              mut init: FinalTagTransactionInitV1,
          ) -> Result<CargoAllowFinalTagTransactionV1, &'static str> {
              validate_release_operation_identity_v1(identity)
                  .map_err(|_| "tag operation identity is not canonical")?;
              if identity.operation_class != CargoAllowReleaseOperationClassV1::CleanFinalPublication {
                  return Err("tag transactions belong only to the clean final operation");
              }
              init.operation_identity_digest =
                  release_operation_identity_digest_v1(identity).map_err(|_| "identity digest failed")?;
              begin_tag_transaction_v1(init)
          }
          ''',
              '''pub fn begin_tag_transaction_for_operation_v1(
              identity: &CargoAllowReleaseOperationIdentityV1,
              mut init: FinalTagTransactionInitV1,
          ) -> Result<CargoAllowFinalTagTransactionV1, &'static str> {
              validate_release_operation_identity_v1(identity)
                  .map_err(|_| "tag operation identity is not canonical")?;
              if identity.operation_class != CargoAllowReleaseOperationClassV1::CleanFinalPublication {
                  return Err("tag transactions belong only to the clean final operation");
              }
              if init.authorization_digest != identity.authorization_digest
                  || init.freeze_digest != identity.freeze_digest
                  || init.custody_digest != identity.custody_digest
                  || init.replay_digest != identity.replay_digest
              {
                  return Err("tag authority fields must agree with the canonical operation");
              }
              init.operation_identity_digest =
                  release_operation_identity_digest_v1(identity).map_err(|_| "identity digest failed")?;
              begin_tag_transaction_v1(init)
          }
