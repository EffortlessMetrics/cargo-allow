              mut init: OperationLeaseAcquireInitV1,
              observed: Option<&CargoAllowReleaseOperationLeaseV1>,
              now_unix_seconds: u64,
          ) -> Result<CargoAllowReleaseOperationLeaseV1, &'static str> {
              validate_release_operation_identity_v1(identity)
                  .map_err(|_| "lease operation identity is not canonical")?;
              let class_agrees = matches!(
                  (&identity.operation_class, &init.class,),
                  (
                      CargoAllowReleaseOperationClassV1::CleanFinalPublication,
                      OperationLeaseClassV1::Clean,
                  ) | (
                      CargoAllowReleaseOperationClassV1::IncidentRecovery,
                      OperationLeaseClassV1::Recovery,
                  )
              );
              if !class_agrees {
                  return Err("lease class must agree with the canonical operation class");
              }
              init.key.operation_identity_digest =
                  release_operation_identity_digest_v1(identity).map_err(|_| "identity digest failed")?;
              acquire_operation_lease_v1(init, observed, now_unix_seconds)
          }
          ''',
              '''pub fn acquire_operation_lease_for_operation_v1(
              identity: &CargoAllowReleaseOperationIdentityV1,
              mut init: OperationLeaseAcquireInitV1,
              observed: Option<&CargoAllowReleaseOperationLeaseV1>,
              now_unix_seconds: u64,
          ) -> Result<CargoAllowReleaseOperationLeaseV1, &'static str> {
              validate_release_operation_identity_v1(identity)
                  .map_err(|_| "lease operation identity is not canonical")?;
              let (expected_class, expected_operation) = match identity.operation_class {
                  CargoAllowReleaseOperationClassV1::CleanFinalPublication => (
                      OperationLeaseClassV1::Clean,
                      OPERATION_LEASE_FINAL_OPERATION,
                  ),
                  CargoAllowReleaseOperationClassV1::IncidentRecovery => (
                      OperationLeaseClassV1::Recovery,
                      OPERATION_LEASE_RECOVERY_OPERATION,
                  ),
                  CargoAllowReleaseOperationClassV1::Containment => {
                      return Err("containment operations cannot acquire a publication lease");
                  }
              };
              if init.class != expected_class || init.key.operation != expected_operation {
                  return Err("lease class and operation must agree with the canonical operation");
              }
              init.key.operation_identity_digest =
                  release_operation_identity_digest_v1(identity).map_err(|_| "identity digest failed")?;
              acquire_operation_lease_v1(init, observed, now_unix_seconds)
          }
          ''',
          )

          replace_once(
              "crates/allow-report/src/artifacts/release_authorization_custody_v1.rs",
              '''pub fn selection_payload_v1(
              identity: &CargoAllowReleaseOperationIdentityV1,
              record: &CargoAllowReleaseAuthorizationCustodyV1,
          ) -> Result<AuthorizationSelectionPayloadV1, &'static str> {
              validate_release_operation_identity_v1(identity)
                  .map_err(|_| "selection operation identity is not canonical")?;
              if identity.authorization_digest != record.authorization_digest {
                  return Err("selection payload requires the operation authorization");
              }
              Ok(AuthorizationSelectionPayloadV1 {
                  authorization_id: record.authorization_id.clone(),
                  authorization_digest: record.authorization_digest.clone(),
                  operation_identity_digest: release_operation_identity_digest_v1(identity)
                      .map_err(|_| "identity digest failed")?,
                  operation_name: record.operation.name.clone(),
                  operation_version: record.operation.version.clone(),
                  operation_tag: record.operation.tag.clone(),
                  operation_channel: record.operation.channel.clone(),
                  commit: record.freeze.commit.clone(),
                  tree: record.freeze.tree.clone(),
                  denominator_digest: record.freeze.denominator_digest.clone(),
                  evidence_digest: record.evidence_digest.clone(),
                  nonce: record.nonce.clone(),
                  state: record.state,
                  valid_from_unix_seconds: record.valid_from_unix_seconds,
                  expires_at_unix_seconds: record.expires_at_unix_seconds,
              })
          }
          ''',
              '''pub fn selection_payload_v1(
              identity: &CargoAllowReleaseOperationIdentityV1,
              record: &CargoAllowReleaseAuthorizationCustodyV1,
          ) -> Result<AuthorizationSelectionPayloadV1, &'static str> {
              use ReleaseAuthorizationConsumptionV1 as Consumption;
              validate_release_operation_identity_v1(identity)
                  .map_err(|_| "selection operation identity is not canonical")?;
              if identity.authorization_digest != record.authorization_digest {
                  return Err("selection payload requires the operation authorization");
              }
              let operation_identity_digest =
                  release_operation_identity_digest_v1(identity).map_err(|_| "identity digest failed")?;
              if record.selected_operation_identity_digest.as_deref()
                  != Some(operation_identity_digest.as_str())
              {
                  return Err("selection payload requires the exact selected operation identity");
              }
              if !matches!(
                  record.state,
                  Consumption::SelectedForRun
                      | Consumption::IrreversibleOperationStarted
                      | Consumption::ConsumedComplete
                      | Consumption::ConsumedIncident
              ) {
                  return Err("selection payload requires selected or retained consumed authority");
              }
              Ok(AuthorizationSelectionPayloadV1 {
                  authorization_id: record.authorization_id.clone(),
                  authorization_digest: record.authorization_digest.clone(),
                  operation_identity_digest,
                  operation_name: record.operation.name.clone(),
                  operation_version: record.operation.version.clone(),
                  operation_tag: record.operation.tag.clone(),
                  operation_channel: record.operation.channel.clone(),
                  commit: record.freeze.commit.clone(),
                  tree: record.freeze.tree.clone(),
                  denominator_digest: record.freeze.denominator_digest.clone(),
                  evidence_digest: record.evidence_digest.clone(),
                  nonce: record.nonce.clone(),
                  state: record.state,
                  valid_from_unix_seconds: record.valid_from_unix_seconds,
                  expires_at_unix_seconds: record.expires_at_unix_seconds,
              })
          }
          ''',
