name: Repair PR 4303 retained-path and schema context

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-final-hardening
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-final-v3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision
        with:
          components: rustfmt, clippy

      - name: Guard and stage the exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "af7498da72f4df99a589cbb81a9ae3abda52c488"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr4303-final-hardening.yml"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              print(f"{path}: replacement count={count}")
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          authority = Path(
              "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          )
          authority_text = authority.read_text(encoding="utf-8")
          marker = "fn bounded_retained_text(value: &str) -> bool {"
          if authority_text.count(marker) != 1:
              raise SystemExit("bounded_retained_text marker is not unique")
          helper = r'''fn contains_private_path_marker(value: &str) -> bool {
              let normalized = value.replace('\\', "/");
              let lowercase = normalized.to_ascii_lowercase();
              let private_roots = ["/home/", "/users/", "/tmp/", "/private/", "/var/folders/"];
              if lowercase.starts_with('/')
                  || lowercase.starts_with("~/")
                  || lowercase.starts_with("file://")
                  || private_roots.iter().any(|root| {
                      lowercase.starts_with(root)
                          || lowercase.contains(&format!(":{root}"))
                          || lowercase.contains(&format!("={root}"))
                          || lowercase.contains(&format!(" {root}"))
                  })
              {
                  return true;
              }
              normalized.as_bytes().windows(4).any(|window| {
                  window
                      .first()
                      .is_some_and(|byte| byte.is_ascii_alphabetic())
                      && window.get(1) == Some(&b':')
                      && window.get(2) == Some(&b'/')
                      && window.get(3) != Some(&b'/')
              })
          }

          '''
          authority_text = authority_text.replace(marker, helper + marker)
          old_tail = '''        && !contains_secret_marker(value)
          }

          fn denominator_digest'''
          new_tail = '''        && !contains_secret_marker(value)
                  && !contains_private_path_marker(value)
          }

          fn denominator_digest'''
          if authority_text.count(old_tail) != 1:
              raise SystemExit("bounded_retained_text tail is not unique")
          authority.write_text(
              authority_text.replace(old_tail, new_tail),
              encoding="utf-8",
              newline="\n",
          )

          tests = Path("crates/cargo-allow/tests/release_operation_authority.rs")
          replace_once(
              tests,
              r'''    let root = repository_root()?;
              let schema: serde_json::Value = serde_json::from_str(&fs::read_to_string(
                  root.join("docs/schemas/cargo-allow.release-operation-authority.v1.schema.json"),
              )?)?;
          ''',
              r'''    let manifest_dir = Path::new(env!("CARGO_MANIFEST_DIR"));
              let is_repository_layout = manifest_dir
                  .parent()
                  .and_then(Path::file_name)
                  .is_some_and(|name| name == std::ffi::OsStr::new("crates"));
              if !is_repository_layout {
                  // Published crate archives do not include the repository-owned docs tree.
                  // Source exports and shallow checkouts retain crates/cargo-allow and must
                  // therefore prove the schema without relying on a .git directory.
                  return Ok(());
              }
              let root = repository_root()?;
              let schema_path =
                  root.join("docs/schemas/cargo-allow.release-operation-authority.v1.schema.json");
              require(
                  schema_path.is_file(),
                  format!(
                      "repository source layout must retain the operation authority schema: {}",
                      schema_path.display()
                  ),
              )?;
              let schema: serde_json::Value =
                  serde_json::from_str(&fs::read_to_string(schema_path)?)?;
          ''',
          )

          test_text = tests.read_text(encoding="utf-8")
          test_name = "fn release_operation_rejects_private_path_metadata()"
          if test_name in test_text:
              raise SystemExit("private-path hostile test already exists")
          test_text += r'''

          #[test]
          fn release_operation_rejects_private_path_metadata() -> Result<(), Box<dyn Error>> {
              use CargoAllowReleaseOperationEventClassV1 as Event;
              use CargoAllowReleaseOperationEventSubjectV1::Operation;

              let identity = identity()?;
              let mut events = Vec::new();
              append(
                  &identity,
                  &mut events,
                  Event::OperationSelected,
                  Operation,
                  1,
              )?;
              append(
                  &identity,
                  &mut events,
                  Event::AuthorizationSelected,
                  Operation,
                  2,
              )?;
              append(&identity, &mut events, Event::LeaseAcquired, Operation, 3)?;

              let mut repository_url = event_init(
                  &identity,
                  Event::TagIntentDurable,
                  Operation,
                  CargoAllowReleaseOperationSemanticResultV1::Exact,
                  4,
              );
              repository_url.request_boundary =
                  "https://github.com/EffortlessMetrics/cargo-allow/actions/runs/1".to_string();
              require(
                  append_release_operation_event_v1(&identity, &events, repository_url).is_ok(),
                  "bounded repository URLs must remain valid retained metadata",
              )?;

              let mut private_posix_path = event_init(
                  &identity,
                  Event::TagIntentDurable,
                  Operation,
                  CargoAllowReleaseOperationSemanticResultV1::Exact,
                  5,
              );
              private_posix_path.request_boundary =
                  "github-event:/home/runner/work/_temp/event.json".to_string();
              require(
                  append_release_operation_event_v1(&identity, &events, private_posix_path)
                      .is_err(),
                  "machine-private POSIX paths must never enter retained operation metadata",
              )?;

              let mut private_windows_path = event_init(
                  &identity,
                  Event::TagIntentDurable,
                  Operation,
                  CargoAllowReleaseOperationSemanticResultV1::Exact,
                  6,
              );
              private_windows_path.producer.job =
                  r"C:\Users\runneradmin\AppData\Local\Temp\event.json".to_string();
              require(
                  append_release_operation_event_v1(&identity, &events, private_windows_path)
                      .is_err(),
                  "machine-private Windows paths must never enter retained operation metadata",
              )
          }
          '''
          tests.write_text(test_text, encoding="utf-8", newline="\n")
          PY
          git rm .github/workflows/repair-pr4303-final-hardening.yml
          git rm .github/workflows/repair-pr4303-schema-proof.yml
          cargo fmt --all

      - name: Prove the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit the bounded repair and both carrier removals
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "af7498da72f4df99a589cbb81a9ae3abda52c488"
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = ".github/workflows/repair-pr4303-final-hardening.yml"
          test "${changed[1]}" = ".github/workflows/repair-pr4303-schema-proof.yml"
          test "${changed[2]}" = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          test "${changed[3]}" = "crates/cargo-allow/tests/release_operation_authority.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): reject private paths and bind schema proof context (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
