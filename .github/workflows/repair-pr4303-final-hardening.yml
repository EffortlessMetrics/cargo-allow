name: Repair PR 4303 retained-path and schema context

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-final-hardening
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-final]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 2
          persist-credentials: true

      - name: Guard and stage the exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f9f506d5aacc6c6d2fb78b470be2270d81cd016f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr4303-final-hardening.yml"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}: {old[:100]!r}"
                  )
              target.write_text(
                  text.replace(old, new),
                  encoding="utf-8",
                  newline="\n",
              )

          authority = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          replace_once(
              authority,
              r'''fn bounded_retained_text(value: &str) -> bool {
              !value.trim().is_empty()
                  && value.len() <= 256
                  && !value.chars().any(|ch| matches!(ch, '\n' | '\r' | '\0'))
                  && !contains_secret_marker(value)
          }
          ''',
              r'''fn contains_private_path_marker(value: &str) -> bool {
              let normalized = value.replace('\\', "/");
              let lowercase = normalized.to_ascii_lowercase();
              let private_roots = ["/home/", "/users/", "/tmp/", "/private/", "/var/folders/"];
              if lowercase.starts_with('/')
                  || lowercase.starts_with("~/")
                  || lowercase.starts_with("file://")
                  || private_roots.iter().any(|root| {
                      lowercase.starts_with(root)
                          || lowercase.contains(&format!(":{root}"))
                          || lowercase.contains(&format!("={root}"))
                          || lowercase.contains(&format!(" {root}"))
                  })
              {
                  return true;
              }
              normalized.as_bytes().windows(4).any(|window| {
                  window
                      .first()
                      .is_some_and(|byte| byte.is_ascii_alphabetic())
                      && window.get(1) == Some(&b':')
                      && window.get(2) == Some(&b'/')
                      && window.get(3) != Some(&b'/')
              })
          }

          fn bounded_retained_text(value: &str) -> bool {
              !value.trim().is_empty()
                  && value.len() <= 256
                  && !value.chars().any(|ch| matches!(ch, '\n' | '\r' | '\0'))
                  && !contains_secret_marker(value)
                  && !contains_private_path_marker(value)
          }
          ''',
          )

          tests = "crates/cargo-allow/tests/release_operation_authority.rs"
          replace_once(
              tests,
              r'''    let root = repository_root()?;
              let schema: serde_json::Value = serde_json::from_str(&fs::read_to_string(
                  root.join("docs/schemas/cargo-allow.release-operation-authority.v1.schema.json"),
              )?)?;
          ''',
              r'''    let manifest_dir = Path::new(env!("CARGO_MANIFEST_DIR"));
              let is_repository_layout = manifest_dir
                  .parent()
                  .and_then(Path::file_name)
                  .is_some_and(|name| name == std::ffi::OsStr::new("crates"));
              if !is_repository_layout {
                  // Published crate archives do not include the repository-owned docs tree.
                  // Source exports and shallow checkouts retain crates/cargo-allow and must
                  // therefore prove the schema without relying on a .git directory.
                  return Ok(());
              }
              let root = repository_root()?;
              let schema_path =
                  root.join("docs/schemas/cargo-allow.release-operation-authority.v1.schema.json");
              require(
                  schema_path.is_file(),
                  format!(
                      "repository source layout must retain the operation authority schema: {}",
                      schema_path.display()
                  ),
              )?;
              let schema: serde_json::Value =
                  serde_json::from_str(&fs::read_to_string(schema_path)?)?;
          ''',
          )
          replace_once(
              tests,
              r'''    require(
                  append_release_operation_event_v1(&identity, &events, secret).is_err(),
                  "secret-like actor text must never enter the retained event envelope",
              )
          ''',
              r'''    require(
              append_release_operation_event_v1(&identity, &events, secret).is_err(),
              "secret-like actor text must never enter the retained event envelope",
          )?;

              let mut repository_url = event_init(
                  &identity,
                  Event::TagIntentDurable,
                  Operation,
                  CargoAllowReleaseOperationSemanticResultV1::Exact,
                  5,
              );
              repository_url.request_boundary =
                  "https://github.com/EffortlessMetrics/cargo-allow/actions/runs/1".to_string();
              require(
                  append_release_operation_event_v1(&identity, &events, repository_url).is_ok(),
                  "bounded repository URLs must remain valid retained metadata",
              )?;

              let mut private_posix_path = event_init(
                  &identity,
                  Event::TagIntentDurable,
                  Operation,
                  CargoAllowReleaseOperationSemanticResultV1::Exact,
                  6,
              );
              private_posix_path.request_boundary =
                  "github-event:/home/runner/work/_temp/event.json".to_string();
              require(
                  append_release_operation_event_v1(&identity, &events, private_posix_path)
                      .is_err(),
                  "machine-private POSIX paths must never enter retained operation metadata",
              )?;

              let mut private_windows_path = event_init(
                  &identity,
                  Event::TagIntentDurable,
                  Operation,
                  CargoAllowReleaseOperationSemanticResultV1::Exact,
                  7,
              );
              private_windows_path.producer.job =
                  r"C:\Users\runneradmin\AppData\Local\Temp\event.json".to_string();
              require(
                  append_release_operation_event_v1(&identity, &events, private_windows_path)
                      .is_err(),
                  "machine-private Windows paths must never enter retained operation metadata",
              )
          ''',
          )
          PY
          git rm .github/workflows/repair-pr4303-final-hardening.yml
          cargo fmt --all

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision
        with:
          components: rustfmt

      - name: Prove the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit the bounded repair and carrier removal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f9f506d5aacc6c6d2fb78b470be2270d81cd016f"
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = ".github/workflows/repair-pr4303-final-hardening.yml"
          test "${changed[1]}" = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          test "${changed[2]}" = "crates/cargo-allow/tests/release_operation_authority.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): reject private paths and bind schema proof context (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
