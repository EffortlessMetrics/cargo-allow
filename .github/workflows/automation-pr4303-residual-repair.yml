name: PR 4303 residual authority repair

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-residual-authority-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-residual]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a7ca49f33c13e012ebca3bd2938218a949e8f683"
          test "$(git hash-object crates/allow-report/src/artifacts/release_operation_authority_v1.rs)" = "4abf430ae97ab701e4d4f7071d25c68a2b907f27"

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply bounded residual repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          authority = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"

          replace_once(
              authority,
              '''fn digest_shape(value: &str) -> bool {
              value
                  .strip_prefix("sha256:")
                  .is_some_and(|hex| hex.len() == 64 && hex.bytes().all(|byte| byte.is_ascii_hexdigit()))
          }

          fn git_sha_shape(value: &str) -> bool {
              (value.len() == 40 || value.len() == 64) && value.bytes().all(|byte| byte.is_ascii_hexdigit())
          }

          fn contains_secret_marker(value: &str) -> bool {
              SECRET_MARKERS.iter().any(|marker| value.contains(marker))
          }
          ''',
              '''fn lowercase_hex_shape(value: &str, expected_len: usize) -> bool {
              value.len() == expected_len
                  && value
                      .bytes()
                      .all(|byte| byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte))
          }

          fn digest_shape(value: &str) -> bool {
              value
                  .strip_prefix("sha256:")
                  .is_some_and(|hex| lowercase_hex_shape(hex, 64))
          }

          fn git_sha_shape(value: &str) -> bool {
              (value.len() == 40 || value.len() == 64)
                  && lowercase_hex_shape(value, value.len())
          }

          fn contains_secret_marker(value: &str) -> bool {
              let lowercase = value.to_ascii_lowercase();
              SECRET_MARKERS
                  .iter()
                  .any(|marker| lowercase.contains(&marker.to_ascii_lowercase()))
          }
          ''',
          )

          replace_once(
              authority,
              '''        if value.trim().is_empty() || contains_secret_marker(value) {
                      return Err("operation event producer identity is malformed");
                  }
          ''',
              '''        if value.trim().is_empty()
                      || value.len() > 256
                      || contains_secret_marker(value)
                      || value.contains(['\\n', '\\r', '\\0'])
                  {
                      return Err("operation event producer identity is malformed");
                  }
          ''',
          )

          replace_once(
              authority,
              '''        event.event_class == class
                      && event.semantic_result == CargoAllowReleaseOperationSemanticResultV1::Exact
          ''',
              '''        event.event_class == class
                      && event.semantic_result == CargoAllowReleaseOperationSemanticResultV1::Exact
                      && event.response_posture
                          != CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
          ''',
          )

          replace_once(
              authority,
              '''            && event.payload_schema_id == init.payload_schema_id
                      && event.request_boundary == init.request_boundary
                      && event.artifact_digest.is_some()
                      && event.artifact_digest == init.artifact_digest
          ''',
              '''            && event.payload_schema_id == init.payload_schema_id
                      && event.payload_digest == init.payload_digest
                      && event.request_boundary == init.request_boundary
                      && event.artifact_digest.is_some()
                      && event.artifact_digest == init.artifact_digest
                      && init.semantic_result
                          == CargoAllowReleaseOperationSemanticResultV1::Exact
                      && init.response_posture
                          != CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
          ''',
          )

          replace_once(
              authority,
              '''        if init.producer.run != events[0].producer.run
                      || init.producer.attempt != events[0].producer.attempt
                  {
                      return Err("one-run operation events must retain the selected run and attempt");
                  }
          ''',
              '''        let selected = &events[0].producer;
                  if init.producer.repository != selected.repository
                      || init.producer.workflow != selected.workflow
                      || init.producer.workflow_ref != selected.workflow_ref
                      || init.producer.run != selected.run
                      || init.producer.attempt != selected.attempt
                      || init.producer.commit != selected.commit
                  {
                      return Err(
                          "one-run operation events must retain the selected workflow/run/attempt/commit",
                      );
                  }
          ''',
          )

          replace_once(
              authority,
              '''    if is_singleton_event_class(init.event_class) && has_event(events, init.event_class) {
                  return Err("singleton operation event was already recorded");
              }
              if identity.operation_class == CargoAllowReleaseOperationClassV1::CleanFinalPublication
          ''',
              '''    if is_singleton_event_class(init.event_class) && has_event(events, init.event_class) {
                  return Err("singleton operation event was already recorded");
              }
              if events.iter().any(|event| {
                  matches!(
                      event.semantic_result,
                      ResultClass::Partial
                          | ResultClass::Conflict
                          | ResultClass::Stale
                          | ResultClass::ProviderUnavailable
                          | ResultClass::InstrumentFailure
                  )
              }) && init.event_class != Event::IncidentRecorded
              {
                  return Err("a retained non-clean result blocks later operation progress");
              }
              let unresolved_unknown = events.iter().any(|event| {
                  event.semantic_result == ResultClass::Unknown
                      || event.response_posture
                          == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
              });
              let resolves_unknown = init_resolves_unknown(events, init, Event::TagIntentDurable)
                  || init_resolves_unknown(events, init, Event::PackageRowIntentDurable);
              if unresolved_unknown
                  && !resolves_unknown
                  && init.event_class != Event::IncidentRecorded
              {
                  return Err("an unresolved response-unknown blocks unrelated operation progress");
              }
              if identity.operation_class == CargoAllowReleaseOperationClassV1::CleanFinalPublication
          ''',
          )

          replace_once(
              authority,
              '''    match init.event_class {
                  Event::OperationSelected => {
          ''',
              '''    if identity.operation_class == CargoAllowReleaseOperationClassV1::Containment
                  && matches!(
                      init.event_class,
                      Event::TagIntentDurable
                          | Event::TagObservedExact
                          | Event::PackageRowIntentDurable
                          | Event::PackageRowObservedExact
                          | Event::GitHubDraftObservedExact
                          | Event::AssetObservedExact
                          | Event::PublicReleaseObservedExact
                          | Event::RepositoryReconciled
                  )
              {
                  return Err("containment authority cannot create new publication progress");
              }

              match init.event_class {
                  Event::OperationSelected => {
          ''',
          )

          replace_once(
              authority,
              '''        Event::AuthorizationSelected => {
                      if !has_exact_event(events, Event::OperationSelected) {
                          return Err("authorization selection requires OperationSelected");
                      }
                  }
          ''',
              '''        Event::AuthorizationSelected => {
                      if !has_exact_event(events, Event::OperationSelected) {
                          return Err("authorization selection requires exact OperationSelected");
                      }
                      if identity.operation_class
                          == CargoAllowReleaseOperationClassV1::IncidentRecovery
                          && !has_exact_event(events, Event::RecoverySelected)
                      {
                          return Err("recovery authorization requires exact RecoverySelected");
                      }
                  }
          ''',
          )

          replace_once(
              authority,
              '''        Event::RecoverySelected => {
                      if identity.operation_class != CargoAllowReleaseOperationClassV1::IncidentRecovery
                          || !has_event(events, Event::OperationSelected)
                      {
                          return Err("RecoverySelected belongs only to an incident-recovery operation");
                      }
                  }
          ''',
              '''        Event::RecoverySelected => {
                      if identity.operation_class != CargoAllowReleaseOperationClassV1::IncidentRecovery
                          || !has_exact_event(events, Event::OperationSelected)
                          || init.semantic_result != ResultClass::Exact
                          || init.response_posture
                              == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
                      {
                          return Err(
                              "RecoverySelected requires an exact incident-recovery operation selection",
                          );
                      }
                  }
          ''',
          )

          replace_once(
              authority,
              '''        Event::OperationSettled => {
                      if !has_exact_event(events, Event::RepositoryReconciled)
                          || !all_packages_exact(identity, events)
                          || !all_assets_exact(identity, events)
                          || !has_exact_event(events, Event::PublicReleaseObservedExact)
                      {
                          return Err("operation settlement requires the complete selected denominator");
                      }
                  }
          ''',
              '''        Event::OperationSettled => {
                      if identity.operation_class == CargoAllowReleaseOperationClassV1::Containment {
                          if !has_exact_event(events, Event::AuthorizationSelected)
                              || !has_exact_event(events, Event::LeaseAcquired)
                          {
                              return Err(
                                  "containment settlement requires exact authorization and lease",
                              );
                          }
                      } else if !has_exact_event(events, Event::RepositoryReconciled)
                          || !all_packages_exact(identity, events)
                          || !all_assets_exact(identity, events)
                          || !has_exact_event(events, Event::PublicReleaseObservedExact)
                      {
                          return Err("operation settlement requires the complete selected denominator");
                      }
                  }
          ''',
          )

          replace_once(
              authority,
              '''            | Event::RepositoryReconciled
                      | Event::OperationSettled
              ) && init.semantic_result != ResultClass::Exact
              {
                  return Err("exact completion event classes require semantic_result=Exact");
              }
              Ok(())
          ''',
              '''            | Event::RepositoryReconciled
                      | Event::RecoverySelected
                      | Event::OperationSettled
              ) && (init.semantic_result != ResultClass::Exact
                  || init.response_posture
                      == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown)
              {
                  return Err(
                      "exact completion event classes require an exact known semantic result",
                  );
              }
              if init.semantic_result == ResultClass::Unknown
                  && init.response_posture
                      != CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
              {
                  return Err("unknown semantic result requires response_unknown posture");
              }
              if init.response_posture
                  == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
                  && init.semantic_result != ResultClass::Unknown
              {
                  return Err("response_unknown posture requires an unknown semantic result");
              }
              Ok(())
          ''',
          )

          replace_once(
              authority,
              '''            && later.payload_schema_id == event.payload_schema_id
                      && later.request_boundary == event.request_boundary
                      && later.artifact_digest.is_some()
          ''',
              '''            && later.payload_schema_id == event.payload_schema_id
                      && later.payload_digest == event.payload_digest
                      && later.request_boundary == event.request_boundary
                      && later.response_posture
                          != CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
                      && later.artifact_digest.is_some()
          ''',
          )

          replace_once(
              authority,
              '''    if events.is_empty() || !has_event(events, Event::AuthorizationSelected) {
                  return State::Prepared;
              }
              if !has_event(events, Event::LeaseAcquired) {
                  return State::Authorized;
              }
              if !has_event(events, Event::TagObservedExact) {
                  return State::HeldPreIrreversible;
              }
          ''',
              '''    if events.is_empty() || !has_exact_event(events, Event::AuthorizationSelected) {
                  return State::Prepared;
              }
              if !has_exact_event(events, Event::LeaseAcquired) {
                  return State::Authorized;
              }
              if identity.operation_class == CargoAllowReleaseOperationClassV1::Containment {
                  return if has_exact_event(events, Event::OperationSettled) {
                      State::CompleteWithIncidentLineage
                  } else {
                      State::HeldPreIrreversible
                  };
              }
              if !has_exact_event(events, Event::TagObservedExact) {
                  return State::HeldPreIrreversible;
              }
          ''',
          )

          replace_once(
              authority,
              '''    if !has_event(events, Event::GitHubDraftObservedExact) {
                  return State::PackagesPublishedExact;
              }
              if !all_assets_exact(identity, events) || !has_event(events, Event::PublicReleaseObservedExact)
              {
                  return State::GitHubReleaseInProgress;
              }
              if !has_event(events, Event::RepositoryReconciled) {
                  return State::PublicReleaseObserved;
              }
              if !has_event(events, Event::OperationSettled) {
          ''',
              '''    if !has_exact_event(events, Event::GitHubDraftObservedExact) {
                  return State::PackagesPublishedExact;
              }
              if !all_assets_exact(identity, events)
                  || !has_exact_event(events, Event::PublicReleaseObservedExact)
              {
                  return State::GitHubReleaseInProgress;
              }
              if !has_exact_event(events, Event::RepositoryReconciled) {
                  return State::PublicReleaseObserved;
              }
              if !has_exact_event(events, Event::OperationSettled) {
          ''',
          )

          replace_once(
              authority,
              '''            event.response_posture
                      == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
                      || matches!(
                          event.event_class,
          ''',
              '''            (event.response_posture
                      == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
                      && matches!(
                          event.event_class,
                          Event::TagIntentDurable | Event::PackageRowIntentDurable
                      ))
                      || matches!(
                          event.event_class,
          ''',
          )

          tests = "crates/cargo-allow/tests/release_operation_authority.rs"
          replace_once(
              tests,
              '''    append(
                  &identity,
                  &mut events,
                  Event::PublicReleaseObservedExact,
                  Operation,
                  64,
              )?;
              append(
                  &identity,
                  &mut events,
                  Event::RepositoryReconciled,
                  Operation,
                  65,
              )?;
          ''',
              '''    append(
                  &identity,
                  &mut events,
                  Event::PublicReleaseObservedExact,
                  Operation,
                  asset_ordinal,
              )?;
              asset_ordinal += 1;
              append(
                  &identity,
                  &mut events,
                  Event::RepositoryReconciled,
                  Operation,
                  asset_ordinal,
              )?;
          ''',
          )

          replace_once(
              tests,
              '''        Event::OperationSettled,
                  Operation,
                  66,
          ''',
              '''        Event::OperationSettled,
                  Operation,
                  asset_ordinal + 1,
          ''',
          )

          replace_once(
              tests,
              '''    matching.request_boundary = unknown.request_boundary.clone();
              matching.payload_schema_id = unknown.payload_schema_id.clone();
              matching.artifact_digest = unknown.artifact_digest.clone();
          ''',
              '''    matching.request_boundary = unknown.request_boundary.clone();
              matching.payload_schema_id = unknown.payload_schema_id.clone();
              matching.payload_digest = unknown.payload_digest.clone();
              matching.artifact_digest = unknown.artifact_digest.clone();
          ''',
          )

          extra = r'''

          #[test]
          fn recovery_and_containment_follow_distinct_fail_closed_paths() -> Result<(), Box<dyn Error>> {
              use CargoAllowReleaseOperationEventClassV1 as Event;
              use CargoAllowReleaseOperationEventSubjectV1::{Operation, Package};
              use CargoAllowReleaseOperationSemanticResultV1 as ResultClass;
              use CargoAllowReleaseOperationStateV1 as State;

              let recovery = build_release_operation_identity_v1(identity_init(
                  CargoAllowReleaseOperationClassV1::IncidentRecovery,
              ))
              .map_err(io::Error::other)?;
              let mut recovery_events = Vec::new();
              append(
                  &recovery,
                  &mut recovery_events,
                  Event::OperationSelected,
                  Operation,
                  1,
              )?;
              require(
                  append_release_operation_event_v1(
                      &recovery,
                      &recovery_events,
                      event_init(
                          &recovery,
                          Event::AuthorizationSelected,
                          Operation,
                          ResultClass::Exact,
                          2,
                      ),
                  )
                  .is_err(),
                  "recovery cannot authorize before exact RecoverySelected",
              )?;
              append(
                  &recovery,
                  &mut recovery_events,
                  Event::RecoverySelected,
                  Operation,
                  3,
              )?;
              append(
                  &recovery,
                  &mut recovery_events,
                  Event::AuthorizationSelected,
                  Operation,
                  4,
              )?;

              let containment = build_release_operation_identity_v1(identity_init(
                  CargoAllowReleaseOperationClassV1::Containment,
              ))
              .map_err(io::Error::other)?;
              let mut containment_events = Vec::new();
              append(
                  &containment,
                  &mut containment_events,
                  Event::OperationSelected,
                  Operation,
                  10,
              )?;
              append(
                  &containment,
                  &mut containment_events,
                  Event::AuthorizationSelected,
                  Operation,
                  11,
              )?;
              append(
                  &containment,
                  &mut containment_events,
                  Event::LeaseAcquired,
                  Operation,
                  12,
              )?;
              let package_id = containment
                  .packages
                  .first()
                  .ok_or_else(|| io::Error::other("package denominator should not be empty"))?
                  .logical_id
                  .clone();
              require(
                  append_release_operation_event_v1(
                      &containment,
                      &containment_events,
                      event_init(
                          &containment,
                          Event::PackageRowIntentDurable,
                          Package(package_id),
                          ResultClass::Exact,
                          13,
                      ),
                  )
                  .is_err(),
                  "containment cannot create package publication progress",
              )?;
              append(
                  &containment,
                  &mut containment_events,
                  Event::OperationSettled,
                  Operation,
                  14,
              )?;
              require(
                  evaluate_release_operation_v1(&containment, &containment_events)
                      .map_err(io::Error::other)?
                      .state
                      == State::CompleteWithIncidentLineage,
                  "containment has a distinct non-publication terminal state",
              )
          }
          '''
          p = Path(tests)
          p.write_text(p.read_text(encoding="utf-8") + extra, encoding="utf-8", newline="\n")
          PY

          cargo fmt --all

      - name: Focused proof
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit validated repair and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/automation-pr4303-residual-repair.yml
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): close immediate operation transition false-allows (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
