name: PR 4303 bounded repair

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-bounded-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Verify exact carrier ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='583a8c2a67124af3e235f3df458117df69918019'
          expected_path='.github/workflows/pr4303-bounded-repair.yml'
          test "$(git rev-parse HEAD^)" = "${expected_parent}"
          test "$(git diff --name-only "${expected_parent}"..HEAD)" = "${expected_path}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib_path = Path("crates/allow-report/src/lib.rs")
          authority_path = Path(
              "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          )
          integration_test_path = Path(
              "crates/cargo-allow/tests/release_operation_authority.rs"
          )

          old_export = '''// Canonical shared release-operation authority (#3940 PR A).
          pub use artifacts::{
              CargoAllowReleaseOperationAssetRowV1, CargoAllowReleaseOperationAuthorityKindV1,
              CargoAllowReleaseOperationClassV1, CargoAllowReleaseOperationEvaluationV1,
              CargoAllowReleaseOperationEventClassV1, CargoAllowReleaseOperationEventInitV1,
              CargoAllowReleaseOperationEventSubjectV1, CargoAllowReleaseOperationEventV1,
              CargoAllowReleaseOperationHeadV1, CargoAllowReleaseOperationIdentityInitV1,
              CargoAllowReleaseOperationIdentityV1, CargoAllowReleaseOperationPackageRowV1,
              CargoAllowReleaseOperationProducerV1, CargoAllowReleaseOperationResponsePostureV1,
              CargoAllowReleaseOperationSemanticResultV1, CargoAllowReleaseOperationStateV1,
              RELEASE_OPERATION_ASSET_SELECTION, RELEASE_OPERATION_AUTHORITY_SCHEMA_VERSION, RELEASE_OPERATION_CHANNEL,
              RELEASE_OPERATION_EVALUATION_SCHEMA_ID, RELEASE_OPERATION_EVENT_SCHEMA_ID,
              RELEASE_OPERATION_GENESIS_DIGEST, RELEASE_OPERATION_HEAD_SCHEMA_ID,
              RELEASE_OPERATION_IDENTITY_SCHEMA_ID, RELEASE_OPERATION_PRODUCT, RELEASE_OPERATION_REPOSITORY,
              RELEASE_OPERATION_TAG, RELEASE_OPERATION_VERSION, append_release_operation_event_v1,
              build_release_operation_identity_v1, compile_release_operation_head_v1,
              evaluate_release_operation_v1, release_operation_event_digest_v1,
              release_operation_identity_digest_v1, render_release_operation_evaluation_v1,
              render_release_operation_event_v1, render_release_operation_head_v1,
              render_release_operation_identity_v1, validate_release_operation_history_v1,
              validate_release_operation_identity_v1,
          };
          '''

          new_export = '''// Canonical shared release-operation authority (#3940 PR A).
          pub use artifacts::{
              CargoAllowReleaseOperationAssetRowV1, CargoAllowReleaseOperationAuthorityKindV1,
              CargoAllowReleaseOperationClassV1, CargoAllowReleaseOperationEvaluationV1,
              CargoAllowReleaseOperationEventClassV1, CargoAllowReleaseOperationEventInitV1,
              CargoAllowReleaseOperationEventSubjectV1, CargoAllowReleaseOperationEventV1,
              CargoAllowReleaseOperationHeadV1, CargoAllowReleaseOperationIdentityInitV1,
              CargoAllowReleaseOperationIdentityV1, CargoAllowReleaseOperationPackageRowV1,
              CargoAllowReleaseOperationPredecessorProofV1, CargoAllowReleaseOperationProducerV1,
              CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,
              CargoAllowReleaseOperationStateV1, RELEASE_OPERATION_ASSET_SELECTION,
              RELEASE_OPERATION_AUTHORITY_SCHEMA_VERSION, RELEASE_OPERATION_CHANNEL,
              RELEASE_OPERATION_EVALUATION_SCHEMA_ID, RELEASE_OPERATION_EVENT_SCHEMA_ID,
              RELEASE_OPERATION_GENESIS_DIGEST, RELEASE_OPERATION_HEAD_SCHEMA_ID,
              RELEASE_OPERATION_IDENTITY_SCHEMA_ID, RELEASE_OPERATION_PRODUCT, RELEASE_OPERATION_REPOSITORY,
              RELEASE_OPERATION_TAG, RELEASE_OPERATION_VERSION, append_release_operation_event_v1,
              append_release_operation_event_with_predecessor_v1, build_release_operation_identity_v1,
              build_release_operation_identity_with_predecessor_v1, compile_release_operation_head_v1,
              compile_release_operation_head_with_predecessor_v1, evaluate_release_operation_v1,
              evaluate_release_operation_with_predecessor_v1, release_operation_event_digest_v1,
              release_operation_head_digest_v1, release_operation_identity_digest_v1,
              render_release_operation_evaluation_v1, render_release_operation_event_v1,
              render_release_operation_head_v1, render_release_operation_identity_v1,
              validate_release_operation_evaluation_v1,
              validate_release_operation_evaluation_with_predecessor_v1, validate_release_operation_head_v1,
              validate_release_operation_head_with_predecessor_v1, validate_release_operation_history_v1,
              validate_release_operation_history_with_predecessor_v1,
              validate_release_operation_identity_v1, validate_release_operation_predecessor_v1,
          };
          '''

          old_helper = '''fn init_resolves_unknown(
              events: &[CargoAllowReleaseOperationEventV1],
              init: &CargoAllowReleaseOperationEventInitV1,
              origin_class: CargoAllowReleaseOperationEventClassV1,
          ) -> bool {
              events.iter().any(|event| {
                  event.event_class == origin_class
                      && (event.semantic_result == CargoAllowReleaseOperationSemanticResultV1::Unknown
                          || event.response_posture
                              == CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown)
                      && init.semantic_result == CargoAllowReleaseOperationSemanticResultV1::Exact
                      && init.response_posture
                          != CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown
                      && event.subject == init.subject
                      && event.payload_schema_id == init.payload_schema_id
                      && event.payload_digest == init.payload_digest
                      && event.request_boundary == init.request_boundary
                      && event.artifact_digest.is_some()
                      && event.artifact_digest == init.artifact_digest
              })
          }

          '''

          lib = lib_path.read_text(encoding="utf-8")
          if lib.count(old_export) != 1:
              raise SystemExit("crate-root authority export block does not match expected head")
          lib_path.write_text(lib.replace(old_export, new_export), encoding="utf-8")

          authority = authority_path.read_text(encoding="utf-8")
          if authority.count(old_helper) != 1:
              raise SystemExit("superseded init_resolves_unknown helper does not match expected head")
          authority_path.write_text(authority.replace(old_helper, ""), encoding="utf-8")

          test_source = integration_test_path.read_text(encoding="utf-8")

          loop_anchor = '''        )?;
              }

              let mut events = Vec::new();
              append(&identity, &mut events, Event::OperationSelected, Operation, 10)?;
          '''
          loop_replacement = '''        )?;
              }

              let mut envelope_events = Vec::new();
              append(
                  &identity,
                  &mut envelope_events,
                  Event::OperationSelected,
                  Operation,
                  4,
              )?;
              let mut exact_unknown_authorization = event_init(
                  &identity,
                  Event::AuthorizationSelected,
                  Operation,
                  ResultClass::Exact,
                  5,
              );
              exact_unknown_authorization.response_posture =
                  CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown;
              require(
                  append_release_operation_event_v1(
                      &identity,
                      &envelope_events,
                      exact_unknown_authorization,
                  )
                  .is_err(),
                  "Exact + ResponseUnknown local events must fail envelope validation",
              )?;

              let mut events = Vec::new();
              append(&identity, &mut events, Event::OperationSelected, Operation, 10)?;
          '''
          if test_source.count(loop_anchor) != 1:
              raise SystemExit("exact-prerequisite test anchor does not match expected head")
          test_source = test_source.replace(loop_anchor, loop_replacement)

          request_anchor = '''    let request = events.last().ok_or_else(|| io::Error::other("request absent"))?.clone();
              let mut unrelated = event_init(
                  &identity,
                  Event::TagObservedExact,
                  Operation,
                  ResultClass::Exact,
                  15,
              );
              unrelated.response_posture = CargoAllowReleaseOperationResponsePostureV1::ResponseKnown;
              unrelated.payload_schema_id = request.payload_schema_id.clone();
              unrelated.request_boundary = request.request_boundary.clone();
              unrelated.artifact_digest = request.artifact_digest.clone();
              require(
                  append_release_operation_event_v1(&identity, &events, unrelated).is_err(),
                  "unrelated exact observation must not resolve another request",
              )?;
          '''
          request_replacement = '''    let request = events.last().ok_or_else(|| io::Error::other("request absent"))?.clone();

              let mut exact_unknown_observation = event_init(
                  &identity,
                  Event::TagObservedExact,
                  Operation,
                  ResultClass::Exact,
                  15,
              );
              exact_unknown_observation.response_posture =
                  CargoAllowReleaseOperationResponsePostureV1::ResponseUnknown;
              exact_unknown_observation.payload_schema_id = request.payload_schema_id.clone();
              exact_unknown_observation.payload_digest = request.payload_digest.clone();
              exact_unknown_observation.request_boundary = request.request_boundary.clone();
              exact_unknown_observation.artifact_digest = request.artifact_digest.clone();
              require(
                  append_release_operation_event_v1(
                      &identity,
                      &events,
                      exact_unknown_observation,
                  )
                  .is_err(),
                  "Exact + ResponseUnknown provider observations must fail envelope validation",
              )?;

              let mut unrelated = event_init(
                  &identity,
                  Event::TagObservedExact,
                  Operation,
                  ResultClass::Exact,
                  15,
              );
              unrelated.response_posture = CargoAllowReleaseOperationResponsePostureV1::ResponseKnown;
              unrelated.payload_schema_id = request.payload_schema_id.clone();
              unrelated.payload_digest = digest(9_998);
              unrelated.request_boundary = request.request_boundary.clone();
              unrelated.artifact_digest = request.artifact_digest.clone();
              require(
                  unrelated.payload_digest != request.payload_digest,
                  "payload-correlation negative control must use a different payload digest",
              )?;
              require(
                  append_release_operation_event_v1(&identity, &events, unrelated).is_err(),
                  "unrelated exact observation must not resolve another request",
              )?;
          '''
          if test_source.count(request_anchor) != 1:
              raise SystemExit("operation correlation test anchor does not match expected head")
          test_source = test_source.replace(request_anchor, request_replacement)
          integration_test_path.write_text(test_source, encoding="utf-8")
          PY

          cargo fmt --all
          git rm .github/workflows/pr4303-bounded-repair.yml

      - name: Verify bounded changed-file set
        shell: bash
        run: |
          set -euo pipefail
          expected="$({
            printf '%s\n' \
              .github/workflows/pr4303-bounded-repair.yml \
              crates/allow-report/src/artifacts/release_operation_authority_v1.rs \
              crates/allow-report/src/artifacts.rs \
              crates/allow-report/src/lib.rs \
              crates/allow-report/tests/release_operation_authority_contract.rs \
              crates/cargo-allow/tests/release_operation_authority.rs
          } | sort)"
          actual="$(git diff --name-only | sort)"
          test "${actual}" = "${expected}"

      - name: Run focused authority proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo fmt --all -- --check
          cargo check --locked -p allow-report --all-targets
          cargo test --locked -p allow-report --test release_operation_authority_contract -- --nocapture
          cargo test --locked -p cargo-allow --test release_operation_authority -- --nocapture
          cargo clippy --locked -p allow-report -p cargo-allow --all-targets -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown

      - name: Commit and push the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/pr4303-bounded-repair.yml \
            crates/allow-report/src/artifacts/release_operation_authority_v1.rs \
            crates/allow-report/src/artifacts.rs \
            crates/allow-report/src/lib.rs \
            crates/allow-report/tests/release_operation_authority_contract.rs \
            crates/cargo-allow/tests/release_operation_authority.rs
          git commit -m 'fix(release,#3940): publish and prove canonical operation authority'
          git push origin HEAD:release/3940-operation-authority-v1
