name: Integrate issue 4283 product floor isolation

on:
  push:
    branches:
      - automation/4283-integrate-producer-v1

permissions:
  contents: write

concurrency:
  group: issue-4283-integrate-producer-v1
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TARGET_BRANCH: fix/4283-product-floor-isolation
      TARGET_HEAD: b0cf6ef0460c79a26bd25ff2bea095349650bcab
    steps:
      - name: Check out the exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/4283-product-floor-isolation
          fetch-depth: 0
          persist-credentials: true

      - name: Verify admitted repair subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git status --porcelain)"

      - name: Integrate projection into producer and protocol fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one reviewed anchor, found {text.count(old)}")
              target.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          proof = "scripts/proof-direct-floors.sh"
          replace_once(
              proof,
              "jq '.floors' target/floor-proof/floors-selection.json > target/floor-proof/floors.json\n"
              "mapfile -t CLOSURE < <(jq -r '.closure[]' target/floor-proof/floors-selection.json)\n\n"
              "# 2. Build one simultaneous direct-floor candidate lock.",
              "jq '.floors' target/floor-proof/floors-selection.json > target/floor-proof/floors.json\n"
              "mapfile -t CLOSURE < <(jq -r '.closure[]' target/floor-proof/floors-selection.json)\n\n"
              "# Project the detached checkout to the selected product's causal path-dependency\n"
              "# workspace before Cargo resolves a lock. The projected Cargo.toml is committed\n"
              "# beside the floor lock, so the executed subject remains an exact Git tree.\n"
              "python3 scripts/floor_product_workspace.py \\\n"
              "  Cargo.toml \\\n"
              "  target/floor-proof/floors-selection.json \\\n"
              "  target/floor-proof/product-workspace-identity.json\n"
              "cat target/floor-proof/product-workspace-identity.json\n\n"
              "# 2. Build one simultaneous direct-floor candidate lock.",
          )
          replace_once(
              proof,
              'python3 scripts/floor_source_identity.py "$SOURCE_COMMIT" > target/floor-proof/source-identity.json',
              'python3 scripts/floor_source_identity.py "$SOURCE_COMMIT" \\\n'
              '  target/floor-proof/product-workspace-identity.json \\\n'
              '  > target/floor-proof/source-identity.json',
          )
          replace_once(
              proof,
              'subject = json.load(open("target/floor-proof/source-identity.json", encoding="utf-8"))\n',
              'subject = json.load(open("target/floor-proof/source-identity.json", encoding="utf-8"))\n'
              'projection = json.load(open("target/floor-proof/product-workspace-identity.json", encoding="utf-8"))\n',
          )
          replace_once(
              proof,
              'subject_posture = (\n'
              '    "reuses the unchanged source commit"\n'
              '    if subject["derived_commit"] == subject["source_commit"]\n'
              '    else "only Cargo.lock differs from source; this local derived candidate is not an upstream commit"\n'
              ')\n'
              'limitations.append(\n'
              '    f"local floor subject: source {subject[\'source_commit\']}; "\n'
              '    f"executed commit {subject[\'derived_commit\']}; tree {subject[\'derived_tree\']}; "\n'
              '    f"{subject_posture}"\n'
              ')',
              'limitations.append(\n'
              '    f"product workspace projection: {projection[\'schema_id\']}; "\n'
              '    f"manifest {projection[\'projected_manifest_digest\']}; certified members "\n'
              '    f"{\', \'.join(projection[\'certified_member_paths\'])}; execution members "\n'
              '    f"{\', \'.join(projection[\'execution_member_paths\'])}"\n'
              ')\n'
              'limitations.append(\n'
              '    f"local floor subject: source {subject[\'source_commit\']}; "\n'
              '    f"executed commit {subject[\'derived_commit\']}; tree {subject[\'derived_tree\']}; "\n'
              '    "only the deterministic root workspace projection and floor lock differ; "\n'
              '    "this local derived candidate is not an upstream commit"\n'
              ')',
          )
          replace_once(
              proof,
              'subject = json.loads(Path("target/floor-proof/source-identity.json").read_text(encoding="utf-8"))\n',
              'subject = json.loads(Path("target/floor-proof/source-identity.json").read_text(encoding="utf-8"))\n'
              'projection = json.loads(Path("target/floor-proof/product-workspace-identity.json").read_text(encoding="utf-8"))\n',
          )
          replace_once(
              proof,
              '    f"- Starting source commit: {cell(sys.argv[3])}",\n'
              '    f"- Executed floor commit: {cell(subject[\'derived_commit\'])}",',
              '    f"- Starting source commit: {cell(sys.argv[3])}",\n'
              '    f"- Workspace projection: {cell(projection[\'schema_id\'])}",\n'
              '    f"- Projected manifest digest: {cell(projection[\'projected_manifest_digest\'])}",\n'
              '    f"- Certified member paths: {cell(\', \'.join(projection[\'certified_member_paths\']))}",\n'
              '    f"- Execution member paths: {cell(\', \'.join(projection[\'execution_member_paths\']))}",\n'
              '    f"- Executed floor commit: {cell(subject[\'derived_commit\'])}",',
          )

          protocol = "scripts/test_floor_protocol.py"
          replace_once(
              protocol,
              '            "floor_pin_settlement.py",\n            "floor_execution_identity.py",',
              '            "floor_pin_settlement.py",\n            "floor_product_workspace.py",\n            "floor_execution_identity.py",',
          )
          replace_once(
              protocol,
              '        if arguments == ["ls-files", "-v", "-z"]:\n'
              '            return 0, "H Cargo.lock\\0", ""\n',
              '        if arguments == ["ls-files", "-v", "-z"]:\n'
              '            return 0, "H Cargo.lock\\0H Cargo.toml\\0", ""\n',
          )
          replace_once(
              protocol,
              '        if arguments == ["status", "--porcelain=v1", "--untracked-files=all", "-z"]:\n'
              '            if case.get("dirty_source"):\n'
              '                return 0, " M source.rs\\0", ""\n'
              '            derived = Path("target/floor-proof/fixture-derived").exists()\n'
              '            unchanged = Path("Cargo.lock").read_bytes() == (Path(case["fixture"]) / "Cargo.lock").read_bytes()\n'
              '            return 0, "" if derived or unchanged else " M Cargo.lock\\0", ""\n'
              '        if arguments == ["add", "--", "Cargo.lock"]:\n'
              '            return 0, "", ""\n'
              '        if arguments == ["-c", "core.hooksPath=", "-c", "commit.gpgSign=false",\n'
              '                         "-c", "user.name=cargo-allow floor proof",\n'
              '                         "-c", "user.email=floor-proof@example.invalid", "commit",\n'
              '                         "-m", "chore(proof): derive local direct-floor lock"]:\n',
              '        if arguments == ["status", "--porcelain=v1", "--untracked-files=all", "-z"]:\n'
              '            if case.get("dirty_source"):\n'
              '                return 0, " M source.rs\\0", ""\n'
              '            if Path("target/floor-proof/fixture-derived").exists():\n'
              '                return 0, "", ""\n'
              '            fixture = Path(case["fixture"])\n'
              '            changed = []\n'
              '            for relative in ("Cargo.lock", "Cargo.toml"):\n'
              '                if Path(relative).read_bytes() != (fixture / relative).read_bytes():\n'
              '                    changed.append(" M " + relative)\n'
              '            return 0, "\\0".join(changed) + ("\\0" if changed else ""), ""\n'
              '        if arguments[:2] == ["add", "--"] and set(arguments[2:]).issubset({"Cargo.lock", "Cargo.toml"}):\n'
              '            return 0, "", ""\n'
              '        if arguments == ["-c", "core.hooksPath=", "-c", "commit.gpgSign=false",\n'
              '                         "-c", "user.name=cargo-allow floor proof",\n'
              '                         "-c", "user.email=floor-proof@example.invalid", "commit",\n'
              '                         "-m", "chore(proof): derive product-scoped direct-floor subject"]:\n',
          )
          replace_once(
              protocol,
              '        if arguments == ["diff", "--name-only", "-z", "1" * 40, "2" * 40]:\n'
              '            return 0, "Cargo.lock\\0", ""\n',
              '        if arguments == ["diff", "--name-only", "-z", "1" * 40, "2" * 40]:\n'
              '            fixture = Path(case["fixture"])\n'
              '            changed = [relative for relative in ("Cargo.lock", "Cargo.toml")\n'
              '                       if Path(relative).read_bytes() != (fixture / relative).read_bytes()]\n'
              '            return 0, "\\0".join(changed) + ("\\0" if changed else ""), ""\n',
          )
          replace_once(
              protocol,
              '    def test_receipt_distinguishes_reused_source_from_local_derived_commit(self):\n'
              '        for floor, reused in (("0.1", True), ("0.2", False)):\n'
              '            with self.subTest(floor=floor):\n'
              '                result, calls, receipt, _ = self.run_producer(floor=floor)\n'
              '                self.assertEqual(result.returncode, 0, result.stderr)\n'
              '                subject = next(text for text in receipt["limitations"]\n'
              '                               if text.startswith("local floor subject:"))\n'
              '                self.assertIn("source " + "1" * 40, subject)\n'
              '                self.assertIn("executed commit " + ("1" if reused else "2") * 40, subject)\n'
              '                self.assertEqual("reuses the unchanged source commit" in subject, reused)\n'
              '                self.assertEqual("not an upstream commit" in subject, not reused)\n'
              '                commits = [call for call in calls if call["program"] == "git"\n'
              '                           and "commit" in call["arguments"]]\n'
              '                self.assertEqual(len(commits), 0 if reused else 1)\n',
              '    def test_receipt_binds_the_product_projected_derived_commit(self):\n'
              '        for floor in ("0.1", "0.2"):\n'
              '            with self.subTest(floor=floor):\n'
              '                result, calls, receipt, _ = self.run_producer(floor=floor)\n'
              '                self.assertEqual(result.returncode, 0, result.stderr)\n'
              '                subject = next(text for text in receipt["limitations"]\n'
              '                               if text.startswith("local floor subject:"))\n'
              '                projection = next(text for text in receipt["limitations"]\n'
              '                                  if text.startswith("product workspace projection:"))\n'
              '                self.assertIn("source " + "1" * 40, subject)\n'
              '                self.assertIn("executed commit " + "2" * 40, subject)\n'
              '                self.assertIn("not an upstream commit", subject)\n'
              '                self.assertIn("cargo-allow.direct-floor-product-workspace.v1", projection)\n'
              '                commits = [call for call in calls if call["program"] == "git"\n'
              '                           and "commit" in call["arguments"]]\n'
              '                self.assertEqual(len(commits), 1)\n',
          )
          replace_once(
              protocol,
              '            "dirty_source": "floor derivation permits only an unstaged Cargo.lock change",',
              '            "dirty_source": "floor derivation permits only unstaged Cargo.toml and Cargo.lock changes",',
          )
          replace_once(
              protocol,
              '        self.assertIn("Starting source commit: " + "1" * 40, companion)\n',
              '        self.assertIn("Starting source commit: " + "1" * 40, companion)\n'
              '        self.assertIn("Workspace projection: cargo-allow.direct-floor-product-workspace.v1", companion)\n'
              '        self.assertIn("Execution member paths:", companion)\n',
          )

          drift = "crates/cargo-allow/src/minimum_direct_version_drift_tests.rs"
          marker = '#[test]\nfn minimum_direct_version_drift_retained_receipts_are_current_with_the_live_tree() {'
          insertion = '''#[test]
          fn minimum_direct_version_drift_non_clean_advisory_is_visible_but_not_blocking() {
              let failing = receipt(
                  "cargo-intent",
                  vec![row("serde", MinimumFloorResultV1::UnsupportedCombination)],
              );
              let evaluation = evaluate_minimum_version_drift(
                  &observation("cargo-intent"),
                  Some(&failing),
              );
              assert_eq!(evaluation.verdict, MinimumVersionDriftVerdictV1::Incomplete);
              assert!(!evaluation.blocking, "report-only product rows never block cargo-allow");
              assert!(evaluation
                  .reasons
                  .iter()
                  .any(|reason| reason.contains("non-clean dispositions: serde")));
          }

          #[test]
          fn minimum_direct_version_drift_retained_receipts_are_current_with_the_live_tree() {'''
          insertion = '\n'.join(line.removeprefix('          ') for line in insertion.splitlines())
          replace_once(drift, marker, insertion)

          docs = "docs/ci/direct-floor-proof.md"
          text = Path(docs).read_text(encoding="utf-8")
          text = text.replace(
              "This reproduces the original four root scratch files plus modified lock,\n"
              "requires their rejection, and then requires admission of the derived subject.",
              "This reproduces the original scratch files plus the projected root manifest and\n"
              "floor lock, requires their rejection, and then admits only the bounded derived subject.",
          )
          Path(docs).write_text(text, encoding="utf-8", newline="\n")
          PY
          git diff --check

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Run focused projection and protocol controls
        run: |
          set -euo pipefail
          python3 scripts/test_floor_product_workspace.py
          python3 scripts/test_floor_source_identity.py --rehearsal-script scripts/release-rehearsal.py
          bash scripts/test-proof-direct-floors.sh
          cargo test -p cargo-allow --locked minimum_direct_version_drift_non_clean_advisory_is_visible_but_not_blocking

      - name: Prove exact cargo-intent isolation on the live workspace
        run: |
          set -euo pipefail
          mkdir -p target/issue-4283
          CI_PROOF_PRODUCT=cargo-intent \
          CI_PROOF_MSRV=1.95 \
          CI_PROOF_ADVISORY=true \
          CI_PROOF_CLASSES=check \
          CI_PROOF_OUT="$PWD/target/issue-4283/cargo-intent.json" \
            bash scripts/proof-direct-floors.sh
          jq -e 'all(.rows[]; .result == "proven")' target/issue-4283/cargo-intent.json
          jq -e '.limitations | any(startswith("product workspace projection:"))' \
            target/issue-4283/cargo-intent.json

      - name: Run source guard and commit integration
        run: |
          set -euo pipefail
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown \
            --output target/issue-4283/no-new.md
          git diff --check
          git config user.name 'cargo-allow automation'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git add \
            scripts/proof-direct-floors.sh \
            scripts/test_floor_protocol.py \
            crates/cargo-allow/src/minimum_direct_version_drift_tests.rs \
            docs/ci/direct-floor-proof.md
          git diff --cached --check
          git commit -m 'fix(ci): isolate direct-floor product workspaces (#4283)'
          git push origin HEAD:fix/4283-product-floor-isolation
