name: Repair PR 4305 prebuilt authority

on:
  push:
    branches:
      - fix/package-byte-authority

permissions:
  contents: write

concurrency:
  group: repair-pr-4305-prebuilt-authority
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/package-byte-authority
          fetch-depth: 2
          persist-credentials: true

      - name: Guard and stage the exact prebuilt-authority repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "70aedd1c26008794f17e6df88ded1425cd0c731f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr4305-prebuilt-authority.yml"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}: {old[:100]!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_once(
              ".github/workflows/ci.yml",
              '''      - name: Exact candidate package set (#2372)\n        run: |\n          mkdir -p target/exact-candidate-package-set/packages\n          cp target/package-candidate-smoke/packages/*.crate \\\n            target/exact-candidate-package-set/packages/\n          SKIP_PACKAGE=1 bash scripts/exact-candidate-package-set.sh\n''',
              '''      - name: Exact candidate package set (#2372)\n        run: bash scripts/exact-candidate-package-set.sh\n''',
          )

          replace_once(
              "scripts/exact-candidate-package-set.sh",
              '''# Optional:\n#   PACKAGE_INPUT_DIR=<path>  prebuilt .crate input for SKIP_PACKAGE=1\n#   SKIP_PACKAGE=1            reuse PACKAGE_INPUT_DIR without re-packing\n#   SKIP_NEGATIVES=1          skip negative controls (debug only)\n''',
              '''# Optional:\n#   PACKAGE_INPUT_DIR=<path>  snapshot-probe fixture input only\n#   SKIP_PACKAGE=1            snapshot-probe characterization only; never authority\n#   SKIP_NEGATIVES=1          skip negative controls (debug only)\n''',
          )
          replace_once(
              "scripts/exact-candidate-package-set.sh",
              '''set -euo pipefail\n\n# Child JSON helpers can emit CRLF line endings on Windows; a trailing CR\n''',
              '''set -euo pipefail\n\n# Archive-embedded VCS metadata is not independent authority over supplied\n# bytes. The exact candidate must always be packaged from its selected detached\n# worktree. Retained prebuilt staging exists only for the explicitly injected\n# snapshot-probe characterization, which exits before candidate production.\nif [[ "${SKIP_PACKAGE:-0}" == "1" ]] \\\n  && { [[ "${CANDIDATE_HARNESS_SNAPSHOT_PROBE:-0}" != "1" ]] \\\n    || [[ "${CANDIDATE_HARNESS_TEST_INJECTION:-0}" != "1" ]]; }; then\n  printf '%s\\n' \\\n    'exact-candidate-package-set: error: SKIP_PACKAGE=1 is snapshot-probe-only; exact-subject authority packages from the selected worktree' >&2\n  exit 1\nfi\n\n# Child JSON helpers can emit CRLF line endings on Windows; a trailing CR\n''',
          )

          replace_once(
              "scripts/test-package-byte-authority.py",
              '''import argparse\nimport json\nimport shutil\n''',
              '''import argparse\nimport json\nimport os\nimport shutil\n''',
          )
          replace_once(
              "scripts/test-package-byte-authority.py",
              '''def sole_crate(target_dir):\n''',
              '''def rewrite_source_member(archive, prefix, output):\n    \"\"\"Change source bytes while retaining the archive's VCS assertion.\"\"\"\n    member_name = f\"{prefix}/src/lib.rs\"\n    rewritten = 0\n    with tarfile.open(archive, mode=\"r:gz\") as source, tarfile.open(\n        output, mode=\"w:gz\"\n    ) as target:\n        for member in source.getmembers():\n            data = None\n            if member.isfile():\n                payload = source.extractfile(member)\n                if payload is None:\n                    raise AssertionError(f\"could not read archive member {member.name}\")\n                data = payload.read()\n            if member.name == member_name:\n                data += b\"\\n// tampered prebuilt source with retained VCS metadata\\n\"\n                member.size = len(data)\n                rewritten += 1\n            target.addfile(member, BytesIO(data) if data is not None else None)\n    if rewritten != 1:\n        raise AssertionError(\n            f\"expected one source member to rewrite, found {rewritten}\"\n        )\n\n\ndef sole_crate(target_dir):\n''',
          )
          replace_once(
              "scripts/test-package-byte-authority.py",
              '''                self.assertIn(\n                    \"git.dirty must be a JSON boolean when present\",\n                    rejected.stderr,\n                )\n\n    def test_dirty_worktree_package_is_rejected(self):\n''',
              '''                self.assertIn(\n                    \"git.dirty must be a JSON boolean when present\",\n                    rejected.stderr,\n                )\n\n        # Embedded VCS metadata is self-reported archive content. Prove that a\n        # non-VCS source mutation can retain an apparently clean exact SHA, then\n        # prove the exact-set authority refuses the prebuilt route entirely.\n        tampered = root / \"tampered-source-with-clean-vcs.crate\"\n        rewrite_source_member(archive, prefix, tampered)\n        metadata_only = verifier_process(tampered, prefix, head)\n        self.assertEqual(\n            metadata_only.returncode,\n            0,\n            \"the discriminator requires intact VCS metadata on changed source bytes\",\n        )\n        prebuilt = root / \"prebuilt-input\"\n        prebuilt.mkdir()\n        shutil.copyfile(tampered, prebuilt / archive.name)\n        rejected_prebuilt = subprocess.run(\n            [\"bash\", str(REPO / \"scripts\" / \"exact-candidate-package-set.sh\")],\n            cwd=str(REPO),\n            env={\n                **os.environ,\n                \"SKIP_PACKAGE\": \"1\",\n                \"PACKAGE_INPUT_DIR\": str(prebuilt),\n            },\n            capture_output=True,\n            text=True,\n            check=False,\n        )\n        self.assertNotEqual(rejected_prebuilt.returncode, 0)\n        self.assertIn(\n            \"SKIP_PACKAGE=1 is snapshot-probe-only\", rejected_prebuilt.stderr\n        )\n\n    def test_dirty_worktree_package_is_rejected(self):\n''',
          )

          replace_once(
              ".changes/Added-20260919-package-byte-authority.yaml",
              '''  and the shared verifier rejects dirty or malformed package metadata on both\n  fresh and restored inputs. Cargo's canonical clean encoding omits\n''',
              '''  and the shared verifier rejects dirty or malformed package metadata. Exact\n  authority always packages from that worktree; self-attested prebuilt archives\n  are refused. Cargo's canonical clean encoding omits\n''',
          )
          PY
          git rm .github/workflows/repair-pr4305-prebuilt-authority.yml

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision

      - name: Prove the bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/candidate-harness-owned-dir.py \
            scripts/test-candidate-harness-lifecycle.py \
            scripts/test-package-byte-authority.py
          bash -n scripts/exact-candidate-package-set.sh
          python3 scripts/test-package-byte-authority.py
          python3 scripts/test-candidate-harness-lifecycle.py
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit the bounded source-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "70aedd1c26008794f17e6df88ded1425cd0c731f"
          python3 - <<'PY'
          import subprocess

          expected = {
              ".changes/Added-20260919-package-byte-authority.yaml",
              ".github/workflows/ci.yml",
              ".github/workflows/repair-pr4305-prebuilt-authority.yml",
              "scripts/exact-candidate-package-set.sh",
              "scripts/test-package-byte-authority.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True)
              .splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected repair paths: {sorted(actual)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(package): reject self-attested prebuilt archives"
          git push origin HEAD:fix/package-byte-authority
