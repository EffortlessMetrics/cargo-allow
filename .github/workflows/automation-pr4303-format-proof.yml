name: PR 4303 format and focused proof

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-format-focused-proof
  cancel-in-progress: false

jobs:
  proof:
    if: contains(github.event.head_commit.message, '[format-proof-4303]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact parent, repair Clippy, and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8df65f185f0d1fb5040746d2702503f22dbac54d"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/allow-report/src/artifacts/release_operation_authority_v1.rs")
          text = path.read_text(encoding="utf-8")
          old = '''    if !unresolved.is_empty() && init.event_class != Event::IncidentRecorded {
              if unresolved.len() != 1
                  || !init_resolves_unknown(events, init, unresolved[0].event_class)
              {
                  return Err("unresolved response-unknown blocks unrelated progression");
              }
          }
          '''
          new = '''    if !unresolved.is_empty()
              && init.event_class != Event::IncidentRecorded
              && (unresolved.len() != 1
                  || !init_resolves_unknown(events, init, unresolved[0].event_class))
          {
              return Err("unresolved response-unknown blocks unrelated progression");
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("exact unresolved-response guard was not found once")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          git rm .github/workflows/automation-pr4303-format-proof.yml

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format and prove focused authority
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit validated formatting and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git commit -m "style(release): format and prove operation authority (#3940)"
          git push origin HEAD:release/3940-operation-authority-v1
