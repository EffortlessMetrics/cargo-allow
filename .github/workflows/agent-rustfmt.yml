name: Agent rustfmt

on:
  push:
    branches:
      - agent/harden-git-revision-boundary

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/allow-diff/src/revision_git.rs \
            crates/allow-diff/src/tests/revision_git_parser.rs \
            crates/cargo-allow/src/diff_args.rs \
            crates/cargo-allow/tests/diff_revision_boundary.rs
          git commit -m "style: apply rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
