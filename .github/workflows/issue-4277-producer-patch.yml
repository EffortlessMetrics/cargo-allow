name: Apply issue 4277 producer patch

on:
  push:
    branches:
      - fix/4277-floor-pin-settlement

permissions:
  contents: write

concurrency:
  group: issue-4277-producer-patch
  cancel-in-progress: false

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(ci): retry issue 4277 producer patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/4277-floor-pin-settlement
          fetch-depth: 0
      - name: Replace the one-pass pin loop and update protocol fixture
        shell: bash
        env:
          OLD_BLOCK_B64: 
          NEW_BLOCK_B64: 
          OLD_FIXTURE_B64: ICAgICAgICBmb3IgbmFtZSBpbiAoInByb29mLWRpcmVjdC1mbG9vcnMuc2giLCAiZmxvb3JfZXhlY3V0aW9uX2lkZW50aXR5LnB5IiwgImZsb29yX3NvdXJjZV9pZGVudGl0eS5weSIpOgogICAgICAgICAgICBzaHV0aWwuY29weWZpbGUoUkVQTyAvICJzY3JpcHRzIiAvIG5hbWUsIHNjcmlwdHMgLyBuYW1lKQo=
          NEW_FIXTURE_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          replacements = (
              (
                  Path("scripts/proof-direct-floors.sh"),
                  "OLD_BLOCK_B64",
                  "NEW_BLOCK_B64",
                  "reviewed one-pass pin block",
              ),
              (
                  Path("scripts/test_floor_protocol.py"),
                  "OLD_FIXTURE_B64",
                  "NEW_FIXTURE_B64",
                  "protocol fixture script-copy block",
              ),
          )
          for path, old_key, new_key, label in replacements:
              source = path.read_bytes()
              old = base64.b64decode(os.environ[old_key])
              new = base64.b64decode(os.environ[new_key])
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one {label}")
              path.write_bytes(source.replace(old, new))
          PY
          git diff --check
      - name: Run focused settlement and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_floor_pin_settlement.py
          bash scripts/test-proof-direct-floors-protocol.sh
      - name: Commit the producer repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/proof-direct-floors.sh scripts/test_floor_protocol.py
          git diff --cached --check
          git commit -m 'fix(ci): settle direct floors to a fixed point (#4277)'
          git push origin HEAD:fix/4277-floor-pin-settlement
