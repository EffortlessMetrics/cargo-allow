name: Temporary clippy minimal graph

on:
  push:
    branches:
      - agent/spec-system-minimal-graph

permissions:
  contents: write

jobs:
  clippy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/spec-system-minimal-graph
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Replace direct ToString implementations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/allow-policy/src/spec_system/compiled_graph.rs")
          text = path.read_text(encoding="utf-8")
          if "use std::fmt;" not in text:
              text = text.replace("use std::collections", "use std::fmt;\nuse std::collections", 1)

          types = [
              "ImplementationSliceId",
              "RequirementId",
              "ImplementationSeamId",
              "EvidenceClaimId",
              "RustTestSubjectId",
              "ProofCommandId",
          ]
          for name in types:
              old = f'''impl ToString for {name} {{
              fn to_string(&self) -> String {{
                  self.as_str().to_string()
              }}
          }}'''
              new = f'''impl fmt::Display for {name} {{
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {{
                  formatter.write_str(self.as_str())
              }}
          }}'''
              if old not in text:
                  raise SystemExit(f"expected ToString implementation for {name} was not found")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit source repairs
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/allow-policy/src/spec_system/compiled_graph.rs
          git commit -m "fix(spec-system): implement graph ID display"
          git push origin HEAD:agent/spec-system-minimal-graph
