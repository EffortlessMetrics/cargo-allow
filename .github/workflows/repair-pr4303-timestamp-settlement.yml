name: Repair PR 4303 timestamp and settlement

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: repair-pr-4303-timestamp-settlement
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 2
          persist-credentials: true

      - name: Guard and stage the exact authority repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f6d690dacab283cead8ed91e2e37a938f9c8d135"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/repair-pr4303-timestamp-settlement.yml"
          python3 - <<'PY'
          from pathlib import Path

          def replace_count(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} replacements, found {count}: {old[:120]!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          authority = "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          replace_count(
              authority,
              '''pub enum CargoAllowReleaseOperationResponsePostureV1 {\n    NotApplicable,\n    ResponseKnown,\n    ResponseUnknown,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n''',
              '''pub enum CargoAllowReleaseOperationResponsePostureV1 {\n    NotApplicable,\n    ResponseKnown,\n    ResponseUnknown,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = "snake_case")]\npub enum CargoAllowReleaseOperationTimestampSourceV1 {\n    WorkflowRuntime,\n    ProviderMetadata,\n    RepositoryMetadata,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n''',
          )
          replace_count(
              authority,
              '''    pub semantic_result: CargoAllowReleaseOperationSemanticResultV1,\n    pub artifact_digest: Option<String>,\n    pub observed_at_unix_seconds: u64,\n''',
              '''    pub semantic_result: CargoAllowReleaseOperationSemanticResultV1,\n    pub artifact_digest: Option<String>,\n    pub timestamp_source: CargoAllowReleaseOperationTimestampSourceV1,\n    pub observed_at_unix_seconds: u64,\n''',
              2,
          )
          replace_count(
              authority,
              '''    PublicReleaseObserved,\n    RepositoryReconciliationRequired,\n    CompleteClean,\n''',
              '''    PublicReleaseObserved,\n    RepositoryReconciliationRequired,\n    SettlementRequired,\n    CompleteClean,\n''',
          )
          replace_count(
              authority,
              '''    semantic_result: CargoAllowReleaseOperationSemanticResultV1,\n    artifact_digest: &'a Option<String>,\n    observed_at_unix_seconds: u64,\n''',
              '''    semantic_result: CargoAllowReleaseOperationSemanticResultV1,\n    artifact_digest: &'a Option<String>,\n    timestamp_source: CargoAllowReleaseOperationTimestampSourceV1,\n    observed_at_unix_seconds: u64,\n''',
          )
          replace_count(
              authority,
              '''        semantic_result: event.semantic_result,\n        artifact_digest: &event.artifact_digest,\n        observed_at_unix_seconds: event.observed_at_unix_seconds,\n''',
              '''        semantic_result: event.semantic_result,\n        artifact_digest: &event.artifact_digest,\n        timestamp_source: event.timestamp_source,\n        observed_at_unix_seconds: event.observed_at_unix_seconds,\n''',
          )
          replace_count(
              authority,
              '''fn validate_event_envelope_fields(\n''',
              '''fn expected_timestamp_source(\n    event_class: CargoAllowReleaseOperationEventClassV1,\n) -> CargoAllowReleaseOperationTimestampSourceV1 {\n    use CargoAllowReleaseOperationEventClassV1 as Event;\n    use CargoAllowReleaseOperationTimestampSourceV1 as Source;\n    match event_class {\n        Event::TagObservedExact\n        | Event::PackageRowObservedExact\n        | Event::GitHubDraftObservedExact\n        | Event::AssetObservedExact\n        | Event::PublicReleaseObservedExact\n        | Event::ContainmentObservedExact => Source::ProviderMetadata,\n        Event::RepositoryReconciled => Source::RepositoryMetadata,\n        _ => Source::WorkflowRuntime,\n    }\n}\n\nfn validate_event_envelope_fields(\n''',
          )
          replace_count(
              authority,
              '''    if event.authority_class != identity.authority_kind {\n        return Err("operation event authority class does not match the immutable operation");\n    }\n    match event.event_class {\n''',
              '''    if event.authority_class != identity.authority_kind {\n        return Err("operation event authority class does not match the immutable operation");\n    }\n    if event.timestamp_source != expected_timestamp_source(event.event_class) {\n        return Err("operation event timestamp source does not match its event class");\n    }\n    match event.event_class {\n''',
          )
          replace_count(
              authority,
              '''        semantic_result: init.semantic_result,\n        artifact_digest: init.artifact_digest.clone(),\n        observed_at_unix_seconds: init.observed_at_unix_seconds,\n''',
              '''        semantic_result: init.semantic_result,\n        artifact_digest: init.artifact_digest.clone(),\n        timestamp_source: init.timestamp_source,\n        observed_at_unix_seconds: init.observed_at_unix_seconds,\n''',
          )
          replace_count(
              authority,
              '''        semantic_result: init.semantic_result,\n        artifact_digest: init.artifact_digest,\n        observed_at_unix_seconds: init.observed_at_unix_seconds,\n''',
              '''        semantic_result: init.semantic_result,\n        artifact_digest: init.artifact_digest,\n        timestamp_source: init.timestamp_source,\n        observed_at_unix_seconds: init.observed_at_unix_seconds,\n''',
          )
          replace_count(
              authority,
              '''            semantic_result: event.semantic_result,\n            artifact_digest: event.artifact_digest.clone(),\n            observed_at_unix_seconds: event.observed_at_unix_seconds,\n''',
              '''            semantic_result: event.semantic_result,\n            artifact_digest: event.artifact_digest.clone(),\n            timestamp_source: event.timestamp_source,\n            observed_at_unix_seconds: event.observed_at_unix_seconds,\n''',
          )
          replace_count(
              authority,
              '''    if identity.operation_class == Class::Containment {\n        if has_exact_event(events, Event::OperationSettled) {\n            return State::CompleteWithIncidentLineage;\n        }\n        if has_exact_event(events, Event::ContainmentObservedExact) {\n            return State::RepositoryReconciliationRequired;\n        }\n''',
              '''    if identity.operation_class == Class::Containment {\n        if has_exact_event(events, Event::OperationSettled) {\n            return State::CompleteWithIncidentLineage;\n        }\n        if has_exact_event(events, Event::RepositoryReconciled) {\n            return State::SettlementRequired;\n        }\n        if has_exact_event(events, Event::ContainmentObservedExact) {\n            return State::RepositoryReconciliationRequired;\n        }\n''',
          )
          replace_count(
              authority,
              '''    if !has_exact_event(events, Event::OperationSettled) {\n        return State::RepositoryReconciliationRequired;\n    }\n''',
              '''    if !has_exact_event(events, Event::OperationSettled) {\n        return State::SettlementRequired;\n    }\n''',
          )

          for path in ["crates/allow-report/src/artifacts.rs", "crates/allow-report/src/lib.rs"]:
              replace_count(
                  path,
                  '''    CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,\n    CargoAllowReleaseOperationStateV1, RELEASE_OPERATION_ASSET_SELECTION,\n''',
                  '''    CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,\n    CargoAllowReleaseOperationStateV1, CargoAllowReleaseOperationTimestampSourceV1,\n    RELEASE_OPERATION_ASSET_SELECTION,\n''',
              )

          contract = "crates/allow-report/tests/release_operation_authority_contract.rs"
          replace_count(
              contract,
              '''    CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,\n    RELEASE_AUTHORIZATION_SELECTION, RELEASE_OPERATION_ASSET_SELECTION,\n''',
              '''    CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,\n    CargoAllowReleaseOperationTimestampSourceV1, RELEASE_AUTHORIZATION_SELECTION,\n    RELEASE_OPERATION_ASSET_SELECTION,\n''',
          )
          replace_count(
              contract,
              '''fn event_init(\n''',
              '''fn timestamp_source(\n    class: CargoAllowReleaseOperationEventClassV1,\n) -> CargoAllowReleaseOperationTimestampSourceV1 {\n    use CargoAllowReleaseOperationEventClassV1 as Event;\n    use CargoAllowReleaseOperationTimestampSourceV1 as Source;\n    match class {\n        Event::TagObservedExact\n        | Event::PackageRowObservedExact\n        | Event::GitHubDraftObservedExact\n        | Event::AssetObservedExact\n        | Event::PublicReleaseObservedExact\n        | Event::ContainmentObservedExact => Source::ProviderMetadata,\n        Event::RepositoryReconciled => Source::RepositoryMetadata,\n        _ => Source::WorkflowRuntime,\n    }\n}\n\nfn event_init(\n''',
          )
          replace_count(
              contract,
              '''        semantic_result: CargoAllowReleaseOperationSemanticResultV1::Exact,\n        artifact_digest: Some(digest(2000 + sequence_hint)),\n        observed_at_unix_seconds: 1_790_000_000 + sequence_hint,\n''',
              '''        semantic_result: CargoAllowReleaseOperationSemanticResultV1::Exact,\n        artifact_digest: Some(digest(2000 + sequence_hint)),\n        timestamp_source: timestamp_source(class),\n        observed_at_unix_seconds: 1_790_000_000 + sequence_hint,\n''',
          )
          replace_count(
              contract,
              '''    require(\n        validate_release_operation_history_v1(&loaded_identity, &foreign_authorization).is_err(),\n        "a recomputed event digest must not let a foreign authorization payload replay",\n    )?;\n\n    let head = compile_release_operation_head_v1(&identity, &events, EVALUATED_AT_UNIX_SECONDS)\n''',
              '''    require(\n        validate_release_operation_history_v1(&loaded_identity, &foreign_authorization).is_err(),\n        "a recomputed event digest must not let a foreign authorization payload replay",\n    )?;\n\n    let mut foreign_timestamp = loaded_events.clone();\n    let authorization = foreign_timestamp\n        .get_mut(1)\n        .ok_or_else(|| io::Error::other("authorization event fixture should exist"))?;\n    authorization.timestamp_source = CargoAllowReleaseOperationTimestampSourceV1::ProviderMetadata;\n    authorization.event_digest = release_operation_event_digest_v1(authorization)?;\n    require(\n        validate_release_operation_history_v1(&loaded_identity, &foreign_timestamp).is_err(),\n        "a recomputed digest must not authenticate the wrong timestamp source",\n    )?;\n\n    let head = compile_release_operation_head_v1(&identity, &events, EVALUATED_AT_UNIX_SECONDS)\n''',
          )

          cargo_test = "crates/cargo-allow/tests/release_operation_authority.rs"
          replace_count(
              cargo_test,
              '''    CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,\n    CargoAllowReleaseOperationStateV1, RELEASE_AUTHORIZATION_SELECTION,\n''',
              '''    CargoAllowReleaseOperationResponsePostureV1, CargoAllowReleaseOperationSemanticResultV1,\n    CargoAllowReleaseOperationStateV1, CargoAllowReleaseOperationTimestampSourceV1,\n    RELEASE_AUTHORIZATION_SELECTION,\n''',
          )
          replace_count(
              cargo_test,
              '''    evaluate_release_operation_v1, evaluate_release_operation_with_predecessor_v1,\n    release_operation_identity_digest_v1, render_release_operation_evaluation_v1,\n''',
              '''    evaluate_release_operation_v1, evaluate_release_operation_with_predecessor_v1,\n    release_operation_event_digest_v1, release_operation_identity_digest_v1,\n    render_release_operation_evaluation_v1,\n''',
          )
          replace_count(
              cargo_test,
              '''fn event_init(\n''',
              '''fn timestamp_source(\n    class: CargoAllowReleaseOperationEventClassV1,\n) -> CargoAllowReleaseOperationTimestampSourceV1 {\n    use CargoAllowReleaseOperationEventClassV1 as Event;\n    use CargoAllowReleaseOperationTimestampSourceV1 as Source;\n    match class {\n        Event::TagObservedExact\n        | Event::PackageRowObservedExact\n        | Event::GitHubDraftObservedExact\n        | Event::AssetObservedExact\n        | Event::PublicReleaseObservedExact\n        | Event::ContainmentObservedExact => Source::ProviderMetadata,\n        Event::RepositoryReconciled => Source::RepositoryMetadata,\n        _ => Source::WorkflowRuntime,\n    }\n}\n\nfn event_init(\n''',
          )
          replace_count(
              cargo_test,
              '''        semantic_result: result,\n        artifact_digest,\n        observed_at_unix_seconds: 1_790_000_000 + ordinal,\n''',
              '''        semantic_result: result,\n        artifact_digest,\n        timestamp_source: timestamp_source(class),\n        observed_at_unix_seconds: 1_790_000_000 + ordinal,\n''',
          )
          replace_count(
              cargo_test,
              '''    append_preamble(&identity, &mut events)?;\n\n    let package_ids = identity\n''',
              '''    append_preamble(&identity, &mut events)?;\n\n    let mut wrong_provider_timestamp = events.clone();\n    let provider_observation = wrong_provider_timestamp\n        .last_mut()\n        .ok_or_else(|| io::Error::other("tag observation fixture should exist"))?;\n    provider_observation.timestamp_source =\n        CargoAllowReleaseOperationTimestampSourceV1::WorkflowRuntime;\n    provider_observation.event_digest = release_operation_event_digest_v1(provider_observation)?;\n    require(\n        validate_release_operation_history_v1(&identity, &wrong_provider_timestamp).is_err(),\n        "provider observations must retain provider timestamp provenance",\n    )?;\n\n    let package_ids = identity\n''',
          )
          replace_count(
              cargo_test,
              '''    append(\n        &identity,\n        &mut events,\n        Event::RepositoryReconciled,\n        Operation,\n        102,\n    )?;\n    append(\n        &identity,\n        &mut events,\n        Event::OperationSettled,\n''',
              '''    let mut wrong_repository_timestamp = event_init(\n        &identity,\n        Event::RepositoryReconciled,\n        Operation,\n        CargoAllowReleaseOperationSemanticResultV1::Exact,\n        102,\n    );\n    wrong_repository_timestamp.timestamp_source =\n        CargoAllowReleaseOperationTimestampSourceV1::WorkflowRuntime;\n    require(\n        append_release_operation_event_v1(&identity, &events, wrong_repository_timestamp).is_err(),\n        "repository reconciliation must retain repository timestamp provenance",\n    )?;\n    append(\n        &identity,\n        &mut events,\n        Event::RepositoryReconciled,\n        Operation,\n        102,\n    )?;\n    let settlement_pending =\n        evaluate_release_operation_v1(&identity, &events, EVALUATED_AT_UNIX_SECONDS)\n            .map_err(io::Error::other)?;\n    require(\n        settlement_pending.state == State::SettlementRequired,\n        "reconciled provider state must require settlement, not reconciliation",\n    )?;\n    append(\n        &identity,\n        &mut events,\n        Event::OperationSettled,\n''',
          )
          replace_count(
              cargo_test,
              '''    append_with_proof(\n        &containment,\n        &containment_proof,\n        &mut containment_events,\n        Event::OperationSettled,\n        Operation,\n        28,\n    )?;\n''',
              '''    let containment_pending = evaluate_release_operation_with_predecessor_v1(\n        &containment,\n        &containment_events,\n        EVALUATED_AT_UNIX_SECONDS,\n        &containment_proof,\n    )\n    .map_err(io::Error::other)?;\n    require(\n        containment_pending.state == State::SettlementRequired,\n        "reconciled containment must require settlement",\n    )?;\n    append_with_proof(\n        &containment,\n        &containment_proof,\n        &mut containment_events,\n        Event::OperationSettled,\n        Operation,\n        28,\n    )?;\n''',
          )

          schema = "docs/schemas/cargo-allow.release-operation-authority.v1.schema.json"
          replace_count(
              schema,
              '''    "authority_kind": {\n      "enum": ["clean", "recovery", "containment"]\n    },\n    "event_class": {\n''',
              '''    "authority_kind": {\n      "enum": ["clean", "recovery", "containment"]\n    },\n    "timestamp_source": {\n      "enum": ["workflow_runtime", "provider_metadata", "repository_metadata"]\n    },\n    "event_class": {\n''',
          )
          replace_count(
              schema,
              '''        "repository_reconciliation_required",\n        "complete_clean",\n''',
              '''        "repository_reconciliation_required",\n        "settlement_required",\n        "complete_clean",\n''',
          )
          replace_count(
              schema,
              '''        "request_boundary", "response_posture", "semantic_result", "artifact_digest",\n        "observed_at_unix_seconds", "claim_boundary"\n''',
              '''        "request_boundary", "response_posture", "semantic_result", "artifact_digest",\n        "timestamp_source", "observed_at_unix_seconds", "claim_boundary"\n''',
          )
          replace_count(
              schema,
              '''        "artifact_digest": {\n          "oneOf": [{ "type": "null" }, { "$ref": "#/$defs/digest" }]\n        },\n        "observed_at_unix_seconds": { "type": "integer", "minimum": 1 },\n''',
              '''        "artifact_digest": {\n          "oneOf": [{ "type": "null" }, { "$ref": "#/$defs/digest" }]\n        },\n        "timestamp_source": { "$ref": "#/$defs/timestamp_source" },\n        "observed_at_unix_seconds": { "type": "integer", "minimum": 1 },\n''',
          )

          docs = "docs/release/release-operation-authority-v1.md"
          replace_count(
              docs,
              '''Event time is monotonic and no event may be appended after operation expiry.\nAggregate evaluation carries its own explicit evaluation timestamp; evaluation\nafter expiry is Stale, so a historically complete chain cannot be reused as a\ncurrent clean verdict.\n''',
              '''Event time is monotonic and no event may be appended after operation expiry.\nThe authenticated envelope also retains one closed timestamp-source class:\nworkflow runtime for local decisions and request starts, provider metadata for\nexact external observations, and repository metadata for reconciliation. A\ncaller cannot relabel one class as another. PR B adapters remain responsible\nfor proving the underlying provider or repository observation; PR A authenticates\nthe source class in the event digest. Aggregate evaluation carries its own\nexplicit evaluation timestamp; evaluation after expiry is Stale, so a\nhistorically complete chain cannot be reused as a current clean verdict.\n''',
          )
          replace_count(
              docs,
              '''OperationSettled additionally requires public observation and repository\nreconciliation.\n''',
              '''OperationSettled additionally requires public observation and repository\nreconciliation. Before reconciliation the aggregate is\nRepositoryReconciliationRequired; after reconciliation and before the terminal\nevent it is SettlementRequired. The model therefore cannot report that\nreconciliation is still missing after it has already been retained.\n''',
          )

          change = ".changes/Added-20260919-release-operation-authority-v1.yaml"
          replace_count(
              change,
              '''  append-only event envelope, typed predecessor and containment/recovery law,\n  explicit irreversible-request correlation, time-bound current head, and\n''',
              '''  append-only event envelope, authenticated timestamp-source provenance,\n  typed predecessor and containment/recovery law, explicit irreversible-request\n  correlation, distinct reconciliation/settlement states, time-bound current head, and\n''',
          )
          PY
          git rm .github/workflows/repair-pr4303-timestamp-settlement.yml
          cargo fmt --all

      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0 action revision

      - name: Prove the bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
          cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
          cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          git diff --check

      - name: Commit the bounded source-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f6d690dacab283cead8ed91e2e37a938f9c8d135"
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            .changes/Added-20260919-release-operation-authority-v1.yaml
            .github/workflows/repair-pr4303-timestamp-settlement.yml
            crates/allow-report/src/artifacts.rs
            crates/allow-report/src/artifacts/release_operation_authority_v1.rs
            crates/allow-report/src/lib.rs
            crates/allow-report/tests/release_operation_authority_contract.rs
            crates/cargo-allow/tests/release_operation_authority.rs
            docs/release/release-operation-authority-v1.md
            docs/schemas/cargo-allow.release-operation-authority.v1.schema.json
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): authenticate event time and settlement state"
          git push origin HEAD:release/3940-operation-authority-v1
