name: one-shot-format-compiled-graph-2385

on:
  push:
    branches:
      - agent/compile-minimal-spec-graph-2216

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'EffortlessMetrics/cargo-allow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/compile-minimal-spec-graph-2216
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and verify minimal claim graph
        run: |
          cargo fmt --all
          cargo test -p allow-policy compiled_graph --locked -- --nocapture
          cargo clippy -p allow-policy --all-targets --locked -- -D warnings
      - name: Remove one-shot workflow and prove no-new
        run: |
          rm .github/workflows/one-shot-format-compiled-graph-2385.yml
          cargo run -p cargo-allow -- check --mode no-new --format markdown --output target/cargo-allow/compiled-graph-no-new.md
      - name: Commit verified graph formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(spec-system): format minimal claim graph'
          git push origin HEAD:agent/compile-minimal-spec-graph-2216
