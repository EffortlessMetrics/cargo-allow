name: Temporary clippy RIPR dialect

on:
  push:
    branches:
      - agent/ripr-spec-v2-dialect

permissions:
  contents: write

jobs:
  clippy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/ripr-spec-v2-dialect
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply Clippy fixes and capture diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings 2>&1 | tee clippy-ripr-dialect.log
          status=${PIPESTATUS[0]}
          cargo fmt --all
          echo "CLIPPY_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Commit automatic fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/allow-policy/src/spec_system
          git commit -m "fix(spec-system): apply clippy suggestions"
          git push origin HEAD:agent/ripr-spec-v2-dialect
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: clippy-ripr-dialect
          path: clippy-ripr-dialect.log
      - name: Preserve Clippy result
        shell: bash
        run: exit "$CLIPPY_STATUS"
