name: One-shot 4023 relative lifecycle fixtures

on:
  push:
    branches:
      - fix/4023-relative-fixture-dates

permissions:
  contents: write

concurrency:
  group: one-shot-4023-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/4023-relative-fixture-dates

      - name: Convert live lifecycle fixtures and add the recurrence guard
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path(".")

          CREATED_TOKEN = "__CARGO_ALLOW_FIXTURE_CREATED__"
          REVIEW_TOKEN = "__CARGO_ALLOW_FIXTURE_REVIEW_AFTER__"
          EXPIRES_TOKEN = "__CARGO_ALLOW_FIXTURE_EXPIRES__"

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace_exact(text: str, old: str, new: str, *, count: int, label: str) -> str:
              observed = text.count(old)
              if observed != count:
                  raise SystemExit(
                      f"{label}: expected {count} exact matches, observed {observed}"
                  )
              return text.replace(old, new)

          def function_slice(text: str, name: str) -> tuple[int, int]:
              pattern = re.compile(rf"(?m)^fn {re.escape(name)}\b")
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(
                      f"function {name}: expected one top-level definition, observed {len(matches)}"
                  )
              start = matches[0].start()
              next_match = re.search(r"(?m)^fn [A-Za-z_][A-Za-z0-9_]*\b", text[matches[0].end():])
              end = (
                  matches[0].end() + next_match.start()
                  if next_match is not None
                  else len(text)
              )
              return start, end

          def rewrite_function(text: str, name: str, transform) -> str:
              start, end = function_slice(text, name)
              original = text[start:end]
              updated = transform(original)
              if updated == original:
                  raise SystemExit(f"function {name}: transform made no change")
              return text[:start] + updated + text[end:]

          fixture_path = "crates/cargo-allow/tests/saved_artifact_outputs/fixture.rs"
          fixture = read(fixture_path)
          old_dated = '''/// Map the authored fixture calendar dates to today-relative ones so the
          /// entries stay live: fixtures hardcoded `2026-05-29`/`2026-08-29` the
          /// calendar eventually catches up with, flipping advisory diffs into
          /// blocking failures and review-due rows into shifted advisory counts.
          /// baseline_debt expiry is validated against the 120-day window from
          /// creation, so the mapped creation date moves with the mapped expiry.
          fn dated(policy: &str) -> String {
              let created = allow_core::SimpleDate::today_utc_approx()
                  .add_days(-30)
                  .to_string();
              let review_after = allow_core::SimpleDate::today_utc_approx()
                  .add_days(30)
                  .to_string();
              let expires = allow_core::SimpleDate::today_utc_approx()
                  .add_days(60)
                  .to_string();
              policy
                  .replace(
                      "created = \"2026-05-29\"",
                      &format!("created = \"{created}\""),
                  )
                  .replace(
                      "review_after = \"2026-08-29\"",
                      &format!("review_after = \"{review_after}\""),
                  )
                  .replace(
                      "expires = \"2026-08-29\"",
                      &format!("expires = \"{expires}\""),
                  )
          }
          '''
          new_dated = f'''const FIXTURE_CREATED_TOKEN: &str = "{CREATED_TOKEN}";
          const FIXTURE_REVIEW_AFTER_TOKEN: &str = "{REVIEW_TOKEN}";
          const FIXTURE_EXPIRES_TOKEN: &str = "{EXPIRES_TOKEN}";

          pub(super) fn fixture_created() -> String {{
              allow_core::SimpleDate::today_utc_approx()
                  .add_days(-30)
                  .to_string()
          }}

          pub(super) fn fixture_review_after() -> String {{
              allow_core::SimpleDate::today_utc_approx()
                  .add_days(30)
                  .to_string()
          }}

          pub(super) fn fixture_expires() -> String {{
              allow_core::SimpleDate::today_utc_approx()
                  .add_days(60)
                  .to_string()
          }}

          /// Resolve authored fixture tokens at the point where the policy text is
          /// materialized. Keeping tokens in source prevents the calendar from
          /// silently changing a live fixture's lifecycle posture.
          pub(super) fn dated(policy: &str) -> String {{
              policy
                  .replace(FIXTURE_CREATED_TOKEN, &fixture_created())
                  .replace(FIXTURE_REVIEW_AFTER_TOKEN, &fixture_review_after())
                  .replace(FIXTURE_EXPIRES_TOKEN, &fixture_expires())
          }}

          #[test]
          fn dated_resolves_every_live_fixture_token_relative_to_today() {{
              let rendered = dated(
                  "created = \"{CREATED_TOKEN}\"\n\
          review_after = \"{REVIEW_TOKEN}\"\n\
          expires = \"{EXPIRES_TOKEN}\"\n",
              );
              assert!(rendered.contains(&format!("created = \"{{}}\"", fixture_created())));
              assert!(rendered.contains(&format!(
                  "review_after = \"{{}}\"",
                  fixture_review_after()
              )));
              assert!(rendered.contains(&format!("expires = \"{{}}\"", fixture_expires())));
              assert!(!rendered.contains("__CARGO_ALLOW_FIXTURE_"));
          }}
          '''
          fixture = replace_exact(
              fixture,
              old_dated,
              new_dated,
              count=1,
              label="saved fixture date adapter",
          )
          fixture_replacements = {
              'created = "2026-05-29"': f'created = "{CREATED_TOKEN}"',
              'review_after = "2026-08-29"': f'review_after = "{REVIEW_TOKEN}"',
              'expires = "2026-08-29"': f'expires = "{EXPIRES_TOKEN}"',
          }
          for old, new in fixture_replacements.items():
              if old not in fixture:
                  raise SystemExit(f"saved fixture template: expected {old}")
              fixture = fixture.replace(old, new)
          write(fixture_path, fixture)

          root_module_path = "crates/cargo-allow/tests/saved_artifact_outputs.rs"
          root_module = read(root_module_path)
          root_module = replace_exact(
              root_module,
              "use fixture::{SourceTreeFixture, commit_fixture_base};",
              "use fixture::{\n"
              "    SourceTreeFixture, commit_fixture_base, dated, fixture_created,\n"
              "    fixture_review_after,\n"
              "};",
              count=1,
              label="saved artifact fixture imports",
          )
          write(root_module_path, root_module)

          diff_path = "crates/cargo-allow/tests/saved_artifact_outputs/diff.rs"
          diff = read(diff_path)
          diff_helpers = (
              "write_policy_with_occurrence_limit",
              "write_policy_with_optional_created",
              "write_policy_with_reviewed_allow",
              "write_policy_with_optional_policy_owner",
              "write_policy_with_policy_status",
              "write_policy_with_owner_required",
              "write_policy_with_workspace_ignored",
              "write_policy_with_workspace_generated",
              "write_policy_with_optional_owner",
              "write_policy_with_optional_reason",
              "write_policy_with_optional_classification",
              "write_policy_with_optional_evidence_inner",
              "append_evidence_doc_allow",
              "write_policy_with_evidence_references",
              "write_policy_with_traceability_links_inner",
              "write_policy_with_selector_container",
              "write_policy_with_selector_receiver",
              "write_policy_with_exception_identity",
              "write_policy_with_scope",
          )

          def rewrite_diff_helper(segment: str) -> str:
              changed = 0
              replacements = (
                  ('created = "2026-05-29"', f'created = "{CREATED_TOKEN}"'),
                  ('review_after = "2026-08-29"', f'review_after = "{REVIEW_TOKEN}"'),
                  ('expires = "2026-08-29"', f'expires = "{EXPIRES_TOKEN}"'),
              )
              for old, new in replacements:
                  count = segment.count(old)
                  if count:
                      segment = segment.replace(old, new)
                      changed += count
              if changed == 0:
                  raise SystemExit("targeted saved diff helper had no live date literal")
              write_call = '    fs::write(fixture.root.join("policy/allow.toml"), policy)'
              if segment.count(write_call) != 1:
                  raise SystemExit("targeted saved diff helper must write one policy")
              segment = segment.replace(
                  write_call,
                  "    policy = dated(&policy);\n" + write_call,
                  1,
              )
              return segment

          for helper in diff_helpers:
              diff = rewrite_function(diff, helper, rewrite_diff_helper)
          write(diff_path, diff)

          migrate_path = "crates/cargo-allow/tests/saved_artifact_outputs/migrate.rs"
          migrate = read(migrate_path)

          def rewrite_static_saved_fixture(segment: str) -> str:
              segment = segment.replace("-> &'static str", "-> String", 1)
              created_count = segment.count('created = "2026-05-09"')
              review_count = segment.count('review_after = "2026-09-09"')
              if created_count == 0 or review_count == 0:
                  raise SystemExit(
                      "targeted legacy fixture must carry both created and review_after"
                  )
              segment = segment.replace(
                  'created = "2026-05-09"',
                  f'created = "{CREATED_TOKEN}"',
              ).replace(
                  'review_after = "2026-09-09"',
                  f'review_after = "{REVIEW_TOKEN}"',
              )
              if segment.count('    r#"') != 1:
                  raise SystemExit("static legacy fixture must return one raw string")
              segment = segment.replace('    r#"', '    dated(r#"', 1)
              closing = '\n"#\n}'
              if segment.count(closing) != 1:
                  raise SystemExit("static legacy fixture raw-string closing changed")
              return segment.replace(closing, '\n"#)\n}', 1)

          for helper in (
              "non_rust_policy_with_evidence_fixture_text",
              "clippy_policy_with_evidence_fixture_text",
              "no_panic_allowlist_with_covered_by_fixture_text",
              "unsafe_policy_with_evidence_fixture_text",
          ):
              migrate = rewrite_function(migrate, helper, rewrite_static_saved_fixture)

          def rewrite_equal_specificity(segment: str) -> str:
              if segment.count('created = "2026-05-09"') != 4:
                  raise SystemExit("equal-specificity fixture created-date denominator changed")
              if segment.count('review_after = "2026-09-09"') != 4:
                  raise SystemExit("equal-specificity fixture review-date denominator changed")
              segment = segment.replace(
                  'created = "2026-05-09"',
                  f'created = "{CREATED_TOKEN}"',
              ).replace(
                  'review_after = "2026-09-09"',
                  f'review_after = "{REVIEW_TOKEN}"',
              )
              marker = "    format!(\n"
              position = segment.rfind(marker)
              if position < 0:
                  raise SystemExit("equal-specificity fixture formatter changed")
              segment = (
                  segment[:position]
                  + "    dated(&format!(\n"
                  + segment[position + len(marker):]
              )
              closing = "    )\n}"
              position = segment.rfind(closing)
              if position < 0:
                  raise SystemExit("equal-specificity fixture formatter closing changed")
              return segment[:position] + "    ))\n}" + segment[position + len(closing):]

          migrate = rewrite_function(
              migrate,
              "non_rust_policy_with_equal_specificity_rows_fixture_text",
              rewrite_equal_specificity,
          )
          expected_pair = '''Some("2026-05-09"),
                  Some("2026-09-09"),'''
          replacement_pair = '''Some(fixture_created().as_str()),
                  Some(fixture_review_after().as_str()),'''
          migrate = replace_exact(
              migrate,
              expected_pair,
              replacement_pair,
              count=4,
              label="migrate live lifecycle assertions",
          )
          workflow_marker = 'let workflow = migrated_entry_by_path(&cfg, Path::new(".github/workflows/ci.yml"));'
          marker_position = migrate.find(workflow_marker)
          if marker_position < 0:
              raise SystemExit("workflow migration assertion marker missing")
          test_start = migrate.rfind("\n#[test]\nfn ", 0, marker_position)
          test_end = migrate.find("\n#[test]\nfn ", marker_position)
          if test_start < 0 or test_end < 0:
              raise SystemExit("workflow migration assertion test boundary missing")
          test_segment = migrate[test_start:test_end]
          workflow_dates = '''Some("2026-05-09"),
                  Some("2026-05-09"),
                  Some("never"),'''
          workflow_replacement = '''Some(fixture_created().as_str()),
                  Some(fixture_created().as_str()),
                  Some("never"),'''
          test_segment = replace_exact(
              test_segment,
              workflow_dates,
              workflow_replacement,
              count=1,
              label="workflow migration lifecycle assertion",
          )
          migrate = migrate[:test_start] + test_segment + migrate[test_end:]
          write(migrate_path, migrate)

          summary_path = "crates/cargo-allow/tests/summary_output.rs"
          summary = read(summary_path)

          def rewrite_summary_fixture(segment: str) -> str:
              segment = replace_exact(
                  segment,
                  "fn process_policy_fixture_text() -> &'static str {",
                  "fn process_policy_fixture_text() -> String {\n"
                  "    let created = allow_core::SimpleDate::today_utc_approx().add_days(-30);\n"
                  "    let review_after = allow_core::SimpleDate::today_utc_approx().add_days(30);",
                  count=1,
                  label="summary process fixture signature",
              )
              segment = replace_exact(
                  segment,
                  '    r#"schema_version = 1',
                  '    format!(r#"schema_version = 1',
                  count=1,
                  label="summary process fixture formatter",
              )
              segment = replace_exact(
                  segment,
                  'created = "2026-05-09"',
                  'created = "{created}"',
                  count=1,
                  label="summary process fixture created",
              )
              segment = replace_exact(
                  segment,
                  'review_after = "2026-09-09"',
                  'review_after = "{review_after}"',
                  count=1,
                  label="summary process fixture review",
              )
              segment = replace_exact(
                  segment,
                  '\n"#\n}',
                  '\n"#)\n}',
                  count=1,
                  label="summary process fixture closing",
              )
              return segment

          summary = rewrite_function(summary, "process_policy_fixture_text", rewrite_summary_fixture)
          write(summary_path, summary)

          audit_path = "crates/cargo-allow/tests/audit_output.rs"
          audit = read(audit_path)

          def rewrite_audit_baseline(segment: str) -> str:
              segment = replace_exact(
                  segment,
                  "fn policy_with_baseline_debt() -> &'static str {",
                  "fn policy_with_baseline_debt() -> String {\n"
                  "    // The policy-file row is intentionally review-due; only the\n"
                  "    // baseline-debt row must remain live for this count fixture.\n"
                  "    let created = allow_core::SimpleDate::today_utc_approx().add_days(-30);\n"
                  "    let expires = allow_core::SimpleDate::today_utc_approx().add_days(30);",
                  count=1,
                  label="audit baseline fixture signature",
              )
              segment = replace_exact(
                  segment,
                  '    r#"policy = "cargo-allow"',
                  '    format!(r#"policy = "cargo-allow"',
                  count=1,
                  label="audit baseline fixture formatter",
              )
              segment = replace_exact(
                  segment,
                  'created = "2026-05-29"',
                  'created = "{created}"',
                  count=1,
                  label="audit baseline created",
              )
              segment = replace_exact(
                  segment,
                  'expires = "2026-08-29"',
                  'expires = "{expires}"',
                  count=1,
                  label="audit baseline expires",
              )
              segment = replace_exact(
                  segment,
                  '\n"#\n}',
                  '\n"#)\n}',
                  count=1,
                  label="audit baseline fixture closing",
              )
              return segment

          audit = rewrite_function(audit, "policy_with_baseline_debt", rewrite_audit_baseline)
          write(audit_path, audit)

          ratchet_path = "crates/cargo-allow/tests/add_glob_ratchet.rs"
          ratchet = read(ratchet_path)

          def rewrite_ratchet_base(segment: str) -> str:
              signature = "fn base_policy(root: &std::path::Path) {"
              segment = replace_exact(
                  segment,
                  signature,
                  signature
                  + "\n    let created = allow_core::SimpleDate::today_utc_approx().add_days(-30);"
                  + "\n    let review_after = allow_core::SimpleDate::today_utc_approx().add_days(30);",
                  count=1,
                  label="add-glob base fixture signature",
              )
              segment = replace_exact(
                  segment,
                  '        r#"schema_version = "0.1"',
                  '        format!(r#"schema_version = "0.1"',
                  count=1,
                  label="add-glob base fixture formatter",
              )
              segment = replace_exact(
                  segment,
                  'created = "2026-01-01"',
                  'created = "{created}"',
                  count=1,
                  label="add-glob base fixture created",
              )
              segment = replace_exact(
                  segment,
                  'review_after = "2026-12-01"',
                  'review_after = "{review_after}"',
                  count=1,
                  label="add-glob base fixture review",
              )
              segment = replace_exact(
                  segment,
                  '\n"#,\n    )',
                  '\n"#),\n    )',
                  count=1,
                  label="add-glob base fixture closing",
              )
              return segment

          ratchet = rewrite_function(ratchet, "base_policy", rewrite_ratchet_base)
          write(ratchet_path, ratchet)

          concurrent_path = "crates/cargo-allow/tests/concurrent_mutation.rs"
          concurrent = read(concurrent_path)

          def rewrite_concurrent_base(segment: str) -> str:
              segment = replace_exact(
                  segment,
                  "fn base_policy() -> &'static str {",
                  "fn base_policy() -> String {\n"
                  "    let created = allow_core::SimpleDate::today_utc_approx().add_days(-30);\n"
                  "    let review_after = allow_core::SimpleDate::today_utc_approx().add_days(30);",
                  count=1,
                  label="concurrent base fixture signature",
              )
              segment = replace_exact(
                  segment,
                  '    r#"schema_version = "0.1"',
                  '    format!(r#"schema_version = "0.1"',
                  count=1,
                  label="concurrent base fixture formatter",
              )
              segment = replace_exact(
                  segment,
                  'created = "2026-01-01"',
                  'created = "{created}"',
                  count=1,
                  label="concurrent base fixture created",
              )
              segment = replace_exact(
                  segment,
                  'review_after = "2026-12-01"',
                  'review_after = "{review_after}"',
                  count=1,
                  label="concurrent base fixture review",
              )
              segment = replace_exact(
                  segment,
                  '\n"#\n}',
                  '\n"#)\n}',
                  count=1,
                  label="concurrent base fixture closing",
              )
              return segment

          concurrent = rewrite_function(concurrent, "base_policy", rewrite_concurrent_base)
          write(concurrent_path, concurrent)

          lifecycle_path = "crates/cargo-allow/tests/lifecycle_corpus.rs"
          lifecycle = read(lifecycle_path)

          def rewrite_lifecycle_policy(segment: str) -> str:
              signature = "fn policy(include_expired: bool) -> String {"
              segment = replace_exact(
                  segment,
                  signature,
                  signature
                  + "\n    let baseline_created = "
                  + "allow_core::SimpleDate::today_utc_approx().add_days(-30);"
                  + "\n    let baseline_expires = "
                  + "allow_core::SimpleDate::today_utc_approx().add_days(60);",
                  count=1,
                  label="lifecycle corpus policy signature",
              )
              segment = replace_exact(
                  segment,
                  'created = "2026-07-14"',
                  'created = "{baseline_created}"',
                  count=1,
                  label="lifecycle corpus baseline created",
              )
              segment = replace_exact(
                  segment,
                  'expires = "2026-10-01"',
                  'expires = "{baseline_expires}"',
                  count=1,
                  label="lifecycle corpus baseline expires",
              )
              return segment

          lifecycle = rewrite_function(lifecycle, "policy", rewrite_lifecycle_policy)

          def rewrite_baseline_policy(segment: str) -> str:
              signature = "fn baseline_debt_policy() -> String {"
              segment = replace_exact(
                  segment,
                  signature,
                  signature
                  + "\n    let baseline_created = "
                  + "allow_core::SimpleDate::today_utc_approx().add_days(-30);"
                  + "\n    let baseline_expires = "
                  + "allow_core::SimpleDate::today_utc_approx().add_days(60);",
                  count=1,
                  label="baseline debt fixture signature",
              )
              segment = replace_exact(
                  segment,
                  'created = "2026-07-14"',
                  'created = "{baseline_created}"',
                  count=1,
                  label="baseline debt fixture created",
              )
              segment = replace_exact(
                  segment,
                  'expires = "2026-10-01"',
                  'expires = "{baseline_expires}"',
                  count=1,
                  label="baseline debt fixture expires",
              )
              return segment

          lifecycle = rewrite_function(
              lifecycle,
              "baseline_debt_policy",
              rewrite_baseline_policy,
          )
          write(lifecycle_path, lifecycle)

          guard_path = ROOT / "crates/cargo-allow/tests/lifecycle_fixture_date_guard.rs"
          if guard_path.exists():
              raise SystemExit("lifecycle fixture date guard already exists")
          guard_path.write_text(
              r'''use std::fs;
          use std::path::{Path, PathBuf};

          use allow_core::SimpleDate;

          const HORIZON_DAYS: i32 = 120;
          const FIXED_DATE_MARKER: &str = "cargo-allow: fixed-lifecycle-date";

          #[test]
          fn live_lifecycle_fixture_dates_are_relative_or_explicitly_fixed()
          -> Result<(), Box<dyn std::error::Error>> {
              let tests_root = Path::new(env!("CARGO_MANIFEST_DIR")).join("tests");
              let today = SimpleDate::today_utc_approx().to_string();
              let horizon = SimpleDate::today_utc_approx()
                  .add_days(HORIZON_DAYS)
                  .to_string();
              let mut violations = Vec::new();

              for path in rust_files(&tests_root)? {
                  let source = fs::read_to_string(&path)?;
                  for (line_index, line) in source.lines().enumerate() {
                      if line.contains(FIXED_DATE_MARKER) {
                          continue;
                      }
                      for (field, value) in lifecycle_dates(line) {
                          if valid_iso_date(value)
                              && value >= today.as_str()
                              && value <= horizon.as_str()
                          {
                              let relative = path
                                  .strip_prefix(&tests_root)
                                  .unwrap_or(path.as_path());
                              violations.push(format!(
                                  "{}:{}: `{field}` uses near-term fixed date `{value}`",
                                  relative.display(),
                                  line_index + 1
                              ));
                          }
                      }
                  }
              }

              if violations.is_empty() {
                  return Ok(());
              }

              Err(format!(
                  "live lifecycle fixture dates must be computed from \
          SimpleDate::today_utc_approx(); use `{FIXED_DATE_MARKER}` only for \
          deliberate calendar-bound corpus:\n{}",
                  violations.join("\n")
              )
              .into())
          }

          fn rust_files(root: &Path) -> Result<Vec<PathBuf>, std::io::Error> {
              let mut files = Vec::new();
              collect_rust_files(root, &mut files)?;
              files.sort();
              Ok(files)
          }

          fn collect_rust_files(root: &Path, files: &mut Vec<PathBuf>) -> Result<(), std::io::Error> {
              for entry in fs::read_dir(root)? {
                  let entry = entry?;
                  let path = entry.path();
                  if path.is_dir() {
                      collect_rust_files(&path, files)?;
                  } else if path.extension().is_some_and(|extension| extension == "rs") {
                      files.push(path);
                  }
              }
              Ok(())
          }

          fn lifecycle_dates(line: &str) -> Vec<(&'static str, &str)> {
              let mut dates = Vec::new();
              for field in ["created", "review_after", "expires"] {
                  for prefix in [
                      format!("{field} = \""),
                      format!("{field} = \\\""),
                  ] {
                      let Some((_, tail)) = line.split_once(prefix.as_str()) else {
                          continue;
                      };
                      let terminator = if prefix.ends_with("\\\"") { "\\\"" } else { "\"" };
                      let Some((value, _)) = tail.split_once(terminator) else {
                          continue;
                      };
                      dates.push((field, value));
                  }
              }
              dates
          }

          fn valid_iso_date(value: &str) -> bool {
              let mut parts = value.split('-');
              let Some(year) = parts.next().and_then(|part| part.parse::<i32>().ok()) else {
                  return false;
              };
              let Some(month) = parts.next().and_then(|part| part.parse::<u32>().ok()) else {
                  return false;
              };
              let Some(day) = parts.next().and_then(|part| part.parse::<u32>().ok()) else {
                  return false;
              };
              if parts.next().is_some() || value.len() != 10 {
                  return false;
              }
              let Some(max_day) = days_in_month(year, month) else {
                  return false;
              };
              (1..=max_day).contains(&day)
          }

          fn days_in_month(year: i32, month: u32) -> Option<u32> {
              match month {
                  1 | 3 | 5 | 7 | 8 | 10 | 12 => Some(31),
                  4 | 6 | 9 | 11 => Some(30),
                  2 if leap_year(year) => Some(29),
                  2 => Some(28),
                  _ => None,
              }
          }

          fn leap_year(year: i32) -> bool {
              year % 4 == 0 && (year % 100 != 0 || year % 400 == 0)
          }

          #[test]
          fn date_validation_keeps_invalid_parser_corpus_out_of_the_guard() {
              assert!(valid_iso_date("2028-02-29"));
              assert!(!valid_iso_date("2026-02-29"));
              assert!(!valid_iso_date("2026-13-01"));
              assert!(!valid_iso_date("not-a-date"));
          }
