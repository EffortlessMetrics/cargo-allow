name: UB Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: ub-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail clearly if MINIMAX_API_KEY is missing
        env:
          _HAVE_MINIMAX: ${{ secrets.MINIMAX_API_KEY != '' && 'yes' || '' }}
        run: |
          if [ -z "${_HAVE_MINIMAX:-}" ]; then
            echo "::error::MINIMAX_API_KEY is empty or missing; ub-review requires it for model review lanes."
            exit 1
          fi
      - name: Run ub-review
        uses: EffortlessMetrics/ub-review@a1e64c65e39aadf341f4e5cb14094b9a87f592ad
        with:
          profile: gh-runner
          posting: review
          fail-on-gate: 'false'
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          base: origin/${{ github.base_ref }}
          head: HEAD
          out: target/ub-review
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ub-review-artifacts
          path: target/ub-review
          if-no-files-found: warn

  finalize-generation-2-support-projections:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/2882-generation-2-architecture-v2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/2882-generation-2-architecture-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: agent-2882-support-projections
      - name: Update cargo-allow support projection vocabulary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/cargo-allow/src/spec_system.rs")
          text = path.read_text(encoding="utf-8")
          old_header = '"add a support-tier table with Surface, Tier, Claim, Proof command, and Notes columns"'
          new_header = '"add a support-tier table with Surface, Tier, Claim, Proof command or Proof or evidence, and Notes columns"'
          if text.count(old_header) != 1:
              raise SystemExit(f"expected one old support table hint, found {text.count(old_header)}")
          text = text.replace(old_header, new_header)
          old_match = '''fn support_tier_level_name(tier: SupportTierLevel) -> &'static str {
              match tier {
                  SupportTierLevel::Stable => "stable",
                  SupportTierLevel::Stabilizing => "stabilizing",
                  SupportTierLevel::Advisory => "advisory",
              }
          }'''
          new_match = '''fn support_tier_level_name(tier: SupportTierLevel) -> &'static str {
              match tier {
                  SupportTierLevel::Stable => "stable",
                  SupportTierLevel::Stabilizing => "stabilizing",
                  SupportTierLevel::Experimental => "experimental",
                  SupportTierLevel::Compatibility => "compatibility",
                  SupportTierLevel::Advisory => "advisory",
                  SupportTierLevel::NotIncluded => "not included",
              }
          }'''
          if text.count(old_match) != 1:
              raise SystemExit(f"expected one old tier-name match, found {text.count(old_match)}")
          path.write_text(text.replace(old_match, new_match), encoding="utf-8")
          PY
      - name: Format and validate affected contracts
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p allow-policy -p intent-model -p cargo-allow --all-targets --locked -- -D warnings
          cargo test -p allow-policy spec_system_design_package --locked -- --nocapture
          cargo test -p allow-policy three_product_disposition_map_has_complete_required_set --locked -- --nocapture
          cargo test -p intent-model support_tier --locked -- --nocapture
          cargo test -p cargo-allow spec_system --locked -- --nocapture
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - name: Commit projection fixes and restore workflow
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/ub-review.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(architecture): align generation-2 support projections"
          git push origin HEAD:agent/2882-generation-2-architecture-v2
