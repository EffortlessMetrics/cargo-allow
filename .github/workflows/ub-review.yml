name: UB Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: ub-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail clearly if MINIMAX_API_KEY is missing
        env:
          _HAVE_MINIMAX: ${{ secrets.MINIMAX_API_KEY != '' && 'yes' || '' }}
        run: |
          if [ -z "${_HAVE_MINIMAX:-}" ]; then
            echo "::error::MINIMAX_API_KEY is empty or missing; ub-review requires it for model review lanes."
            exit 1
          fi
      - name: Run ub-review
        uses: EffortlessMetrics/ub-review@a1e64c65e39aadf341f4e5cb14094b9a87f592ad
        with:
          profile: gh-runner
          posting: review
          fail-on-gate: 'false'
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          base: origin/${{ github.base_ref }}
          head: HEAD
          out: target/ub-review
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ub-review-artifacts
          path: target/ub-review
          if-no-files-found: warn

  finalize-generation-2-compatibility-validators:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/2882-generation-2-architecture-v2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/2882-generation-2-architecture-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: agent-2882-compatibility-validators
      - name: Update cargo-allow support projection vocabulary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/cargo-allow/src/spec_system.rs")
          text = path.read_text(encoding="utf-8")
          old_header = '"add a support-tier table with Surface, Tier, Claim, Proof command, and Notes columns"'
          new_header = '"add a support-tier table with Surface, Tier, Claim, Proof command or Proof or evidence, and Notes columns"'
          if text.count(old_header) != 1:
              raise SystemExit(f"expected one old support table hint, found {text.count(old_header)}")
          text = text.replace(old_header, new_header)
          old_match = '''fn support_tier_level_name(tier: SupportTierLevel) -> &'static str {
              match tier {
                  SupportTierLevel::Stable => "stable",
                  SupportTierLevel::Stabilizing => "stabilizing",
                  SupportTierLevel::Advisory => "advisory",
              }
          }'''
          new_match = '''fn support_tier_level_name(tier: SupportTierLevel) -> &'static str {
              match tier {
                  SupportTierLevel::Stable => "stable",
                  SupportTierLevel::Stabilizing => "stabilizing",
                  SupportTierLevel::Experimental => "experimental",
                  SupportTierLevel::Compatibility => "compatibility",
                  SupportTierLevel::Advisory => "advisory",
                  SupportTierLevel::NotIncluded => "not included",
              }
          }'''
          if text.count(old_match) != 1:
              raise SystemExit(f"expected one old tier-name match, found {text.count(old_match)}")
          path.write_text(text.replace(old_match, new_match), encoding="utf-8")
          PY
      - name: Replace generation-1 design-package umbrella test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/allow-policy/src/spec_system/tests.rs")
          text = path.read_text(encoding="utf-8")
          marker = "#[derive(serde::Deserialize)]\nstruct ThreeProductDispositionEntry"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one design-package test marker, found {text.count(marker)}")
          prefix = text.split(marker, 1)[0]
          replacement = r'''#[derive(serde::Deserialize)]
          struct ThreeProductDispositionEntry {
              artifact: String,
              disposition: String,
          }

          #[derive(serde::Deserialize)]
          struct ThreeProductDispositionMap {
              schema_version: String,
              design_package_proposal: String,
              ownership_adr: String,
              package_identity_adr: String,
              historical_spec: String,
              current_spec: String,
              design_package_plan: String,
              crate_topology_owner_issue: u32,
              package_topology_owner_issue: u32,
              entry: Vec<ThreeProductDispositionEntry>,
          }

          #[test]
          fn spec_system_design_package() -> Result<(), String> {
              let root = repo_root();
              let fixture_readme = root.join("tests/fixtures/three-product-design/README.md");
              let disposition_map = root.join("tests/fixtures/three-product-design/disposition-map.toml");
              let proposal = root.join("docs/proposals/CARGO-ALLOW-PROP-0010-three-product-design.md");
              let ownership_adr = root.join("docs/adr/CARGO-ALLOW-ADR-0002-three-product-ownership.md");
              let package_adr = root.join("docs/adr/CARGO-ALLOW-ADR-0003-package-identity-and-versioning.md");
              let historical_spec = root.join("docs/specs/CARGO-ALLOW-SPEC-0010-three-product-boundaries.md");
              let current_spec = root.join("docs/specs/CARGO-ALLOW-SPEC-0011-three-product-convergence.md");
              let plan = root.join("plans/three-product-crate-extraction.md");

              for path in [
                  &fixture_readme,
                  &disposition_map,
                  &proposal,
                  &ownership_adr,
                  &package_adr,
                  &historical_spec,
                  &current_spec,
                  &plan,
              ] {
                  if !path.is_file() {
                      return Err(format!(
                          "three-product design artifact missing: {}",
                          path.display()
                      ));
                  }
              }

              let proposal_text = read_design_artifact(&proposal, "proposal")?;
              require_design_marker(&proposal_text, "CARGO-ALLOW-PROP-0010", "proposal")?;
              require_design_marker(
                  &proposal_text,
                  "cargo-allow   = source-exception ledger",
                  "proposal",
              )?;
              require_design_marker(
                  &proposal_text,
                  "cargo-intent  = durable authored intent",
                  "proposal",
              )?;
              require_design_marker(
                  &proposal_text,
                  "cargo-proof   = exact-snapshot evidence",
                  "proposal",
              )?;
              require_design_marker(
                  &proposal_text,
                  "installed cargo-intent process protocol",
                  "proposal",
              )?;
              require_design_marker(
                  &proposal_text,
                  "Physical repository extraction is not authorized",
                  "proposal",
              )?;

              let ownership_text = read_design_artifact(&ownership_adr, "ownership ADR")?;
              require_design_marker(
                  &ownership_text,
                  "cargo-allow product → intent-model",
                  "ownership ADR",
              )?;
              require_design_marker(&ownership_text, "CARGO-ALLOW-ADR-0003", "ownership ADR")?;

              let package_text = read_design_artifact(&package_adr, "package ADR")?;
              require_design_marker(
                  &package_text,
                  "effortless-repo-protocol",
                  "package ADR",
              )?;
              require_design_marker(&package_text, "RegistryTransitiveOnly", "package ADR")?;

              let historical_text = read_design_artifact(&historical_spec, "historical spec")?;
              require_design_marker(
                  &historical_text,
                  "superseded_by: CARGO-ALLOW-SPEC-0011",
                  "historical spec",
              )?;
              require_design_marker(
                  &historical_text,
                  "crate-topology-owned-by-2612",
                  "historical spec",
              )?;

              let current_text = read_design_artifact(&current_spec, "current spec")?;
              require_design_marker(
                  &current_text,
                  "identity-distinguishes-logical-package-lib",
                  "current spec",
              )?;
              require_design_marker(
                  &current_text,
                  "release-requires-evidence-backed-complete",
                  "current spec",
              )?;
              require_design_marker(&current_text, "Issue #2921", "current spec")?;

              let plan_text = read_design_artifact(&plan, "plan")?;
              require_design_marker(
                  &plan_text,
                  "Stage H — topology-selected exact cargo-allow candidate",
                  "plan",
              )?;
              require_design_marker(&plan_text, "#2501 exact candidate refreeze", "plan")?;

              let disposition_text = read_design_artifact(&disposition_map, "disposition map")?;
              let disposition = toml::from_str::<ThreeProductDispositionMap>(&disposition_text)
                  .map_err(|error| format!("disposition map should parse as TOML: {error}"))?;
              if disposition.schema_version != "2.0"
                  || disposition.design_package_proposal != "CARGO-ALLOW-PROP-0010"
                  || disposition.ownership_adr != "CARGO-ALLOW-ADR-0002"
                  || disposition.package_identity_adr != "CARGO-ALLOW-ADR-0003"
                  || disposition.historical_spec != "CARGO-ALLOW-SPEC-0010"
                  || disposition.current_spec != "CARGO-ALLOW-SPEC-0011"
                  || disposition.design_package_plan != "CARGO-ALLOW-PLAN-0010"
                  || disposition.crate_topology_owner_issue != 2612
                  || disposition.package_topology_owner_issue != 2604
              {
                  return Err("generation-2 disposition authority fields do not match".to_string());
              }
              for (artifact, expected) in [
                  ("CARGO-ALLOW-PROP-0010", "CurrentCanonical"),
                  ("CARGO-ALLOW-ADR-0003", "CurrentCanonical"),
                  ("CARGO-ALLOW-SPEC-0010", "HistoricalOnly"),
                  ("CARGO-ALLOW-SPEC-0011", "CurrentCanonical"),
              ] {
                  if !disposition.entry.iter().any(|entry| {
                      entry.artifact == artifact && entry.disposition == expected
                  }) {
                      return Err(format!(
                          "disposition map missing {artifact} = {expected}"
                      ));
                  }
              }

              let ledger = parse_doc_artifact_ledger(include_str!(
                  "../../../../.allow/artifacts/doc-artifacts.toml"
              ))
              .map_err(|error| error.to_string())?;
              for id in [
                  "CARGO-ALLOW-PROP-0010",
                  "CARGO-ALLOW-ADR-0002",
                  "CARGO-ALLOW-ADR-0003",
                  "CARGO-ALLOW-SPEC-0010",
                  "CARGO-ALLOW-SPEC-0011",
                  "CARGO-ALLOW-PLAN-0010",
              ] {
                  if !ledger.artifact.iter().any(|artifact| artifact.id == id) {
                      return Err(format!("ledger missing {id}"));
                  }
              }
              validate_doc_artifact_links(&ledger).map_err(|error| error.to_string())?;
              validate_doc_artifact_files(repo_root(), &ledger, &test_roots())
                  .map_err(|error| error.to_string())?;
              Ok(())
          }

          fn read_design_artifact(
              path: &std::path::Path,
              label: &str,
          ) -> Result<String, String> {
              std::fs::read_to_string(path)
                  .map_err(|error| format!("{label} should be readable: {error}"))
          }

          fn require_design_marker(text: &str, marker: &str, label: &str) -> Result<(), String> {
              if text.contains(marker) {
                  Ok(())
              } else {
                  Err(format!("{label} missing required marker {marker}"))
              }
          }
          '''
          path.write_text(prefix + replacement, encoding="utf-8")
          PY
      - name: Format and validate affected contracts
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p allow-policy -p intent-model -p cargo-allow --all-targets --locked -- -D warnings
          cargo test -p allow-policy spec_system_design_package --locked -- --nocapture
          cargo test -p allow-policy three_product_disposition_map_has_complete_required_set --locked -- --nocapture
          cargo test -p intent-model support_tier --locked -- --nocapture
          cargo test -p cargo-allow spec_system --locked -- --nocapture
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - name: Commit validator fixes and restore workflow
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git fetch origin main
          git checkout origin/main -- .github/workflows/ub-review.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(architecture): align generation-2 compatibility validators"
          git push origin HEAD:agent/2882-generation-2-architecture-v2
