name: UB Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ub-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  branch-repair:
    if: github.head_ref == 'fix/remove-stale-publish-order-allow-0517'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/remove-stale-publish-order-allow-0517
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Remove stale publish-order policy receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ub-review.yml
          git rm -f .github/workflows/one-shot-remove-stale-publish-order-allow.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("policy/allow.toml")
          text = path.read_text(encoding="utf-8")
          start_marker = '[[allow]]\nid = "allow-0517"\n'
          start = text.index(start_marker)
          try:
              end = text.index('\n[[allow]]\n', start + len(start_marker)) + 1
          except ValueError:
              end = len(text)
          block = text[start:end]
          expected_path = 'path = "crates/cargo-allow/src/publish_order_validation_tests.rs"'
          if expected_path not in block:
              raise SystemExit("allow-0517 no longer describes the stale publish-order test")
          path.write_text(text[:start] + text[end:], encoding="utf-8")
          PY
          cat > .changes/Fixed-20260811-stale-publish-order-allow.yaml <<'YAML'
          kind: Fixed
          body: >-
            Remove the stale publish-order lint receipt after its source test
            moved into the current V2 topology authority.
          YAML
          cargo fmt --all -- --check
          cargo test -p cargo-allow --bin cargo-allow --locked product_move_ledger -- --nocapture
          cargo test -p cargo-allow --bin cargo-allow --locked hooks::tests::run_executes_the_verified_closed_command -- --nocapture
          cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
          git add .github/workflows/ub-review.yml policy/allow.toml .changes/Fixed-20260811-stale-publish-order-allow.yaml
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "fix(policy): remove stale publish-order lint receipt"
          git push origin HEAD:fix/remove-stale-publish-order-allow-0517

  changie-contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install exact Changie module
        env:
          GOBIN: ${{ runner.temp }}/changie-bin
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = 'go1.25.0'
          mkdir -p "${GOBIN}"
          go install github.com/miniscruff/changie@v1.25.2
          go version -m "${GOBIN}/changie" | tee "${RUNNER_TEMP}/changie-module.txt"
          grep -Eq $'^\tmod\tgithub\.com/miniscruff/changie\tv1\.25\.2(\t|$)' \
            "${RUNNER_TEMP}/changie-module.txt"
      - name: Validate Changie config and fragments without mutation
        env:
          CHANGIE_BIN: ${{ runner.temp }}/changie-bin/changie
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          git status --porcelain=v1 --untracked-files=all > "${tmp}/before.status"
          git diff --binary --no-ext-diff HEAD -- > "${tmp}/before.worktree.diff"
          git diff --cached --binary --no-ext-diff HEAD -- > "${tmp}/before.index.diff"

          CI=true "${CHANGIE_BIN}" new \
            --dry-run \
            --interactive=false \
            --kind Fixed \
            --body 'Changie contract probe.' \
            > "${tmp}/new.yaml"
          grep -Eq '^kind: Fixed$' "${tmp}/new.yaml"
          grep -Eq '^body: Changie contract probe\.$' "${tmp}/new.yaml"

          if CI=true "${CHANGIE_BIN}" new \
            --dry-run \
            --interactive=false \
            --kind NotAConfiguredKind \
            --body 'This must be rejected.' \
            > "${tmp}/invalid-kind.out" 2>&1; then
            echo 'Changie accepted an unknown configured kind' >&2
            exit 1
          fi
          grep -Fq 'invalid kind: NotAConfiguredKind' "${tmp}/invalid-kind.out"

          "${CHANGIE_BIN}" batch v999.0.0 --dry-run > "${tmp}/batch.md"
          grep -Fq '## [999.0.0] - ' "${tmp}/batch.md"
          grep -Fq '### Fixed' "${tmp}/batch.md"
          grep -Fq \
            'Add an exact Go 1.25 and Changie 1.25.2 compatibility lane' \
            "${tmp}/batch.md"

          git status --porcelain=v1 --untracked-files=all > "${tmp}/after.status"
          git diff --binary --no-ext-diff HEAD -- > "${tmp}/after.worktree.diff"
          git diff --cached --binary --no-ext-diff HEAD -- > "${tmp}/after.index.diff"

          cmp "${tmp}/before.status" "${tmp}/after.status"
          cmp "${tmp}/before.worktree.diff" "${tmp}/after.worktree.diff"
          cmp "${tmp}/before.index.diff" "${tmp}/after.index.diff"

  changelog-hook-contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Characterize the staged changelog-fragment hook
        run: bash scripts/ensure-changelog-fragment.sh --self-test

  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      UB_REVIEW_AVAILABLE: ${{ secrets.MINIMAX_API_KEY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report unavailable review lane
        if: env.UB_REVIEW_AVAILABLE != 'yes'
        run: |
          echo "::notice::UB Review skipped: MINIMAX_API_KEY is unavailable in this event context (expected for Dependabot or fork pull requests)."
          mkdir -p target/ub-review
          cat > target/ub-review/status.md <<'EOF'
          # UB Review unavailable

          The model-backed review lane was skipped because `MINIMAX_API_KEY` is
          unavailable in this pull request event context. This is expected for
          Dependabot and fork pull requests. Deterministic repository checks
          remain authoritative for this lane.
          EOF
      - name: Run ub-review
        if: env.UB_REVIEW_AVAILABLE == 'yes'
        uses: EffortlessMetrics/ub-review@6b70acfffba9d6e818d7aac9a05a21c9d8c9d304
        with:
          profile: gh-runner
          posting: review
          fail-on-gate: 'false'
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          base: origin/${{ github.base_ref }}
          head: HEAD
          out: target/ub-review
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ub-review-artifacts
          path: target/ub-review
          if-no-files-found: warn
