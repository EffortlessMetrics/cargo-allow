name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    # Manual runs validate preflight and cargo publish --dry-run only unless
    # the separately guarded publish_recovery path is explicitly selected.
    inputs:
      publish_recovery:
        description: "Publish an exact tagged candidate after a partial release; requires all recovery identity inputs"
        required: false
        default: false
        type: boolean
      recovery_version:
        description: "The already-tagged version to recover (e.g. 0.2.0). Must match an existing v* tag."
        required: false
        type: string
      recovery_commit:
        description: "The exact commit currently tagged for the recovery version"
        required: false
        type: string
      recovery_tree:
        description: "The exact tree currently tagged for the recovery version"
        required: false
        type: string
      recovery_authorization:
        description: "Incident/recovery authorization reference for a publishing recovery"
        required: false
        type: string
      recovery_receipt_run_id:
        description: "The original GitHub Actions run containing the incomplete topology receipt"
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_context.outputs.version }}
      tag: ${{ steps.release_context.outputs.tag }}
      commit: ${{ steps.release_context.outputs.commit }}
      tree: ${{ steps.release_context.outputs.tree }}
      recovery: ${{ steps.release_context.outputs.recovery }}
      authorization: ${{ steps.release_context.outputs.authorization }}
      recovery_receipt_run_id: ${{ steps.release_context.outputs.recovery_receipt_run_id }}
      github_prerelease: ${{ steps.release_context.outputs.github_prerelease }}
      release_record_path: ${{ steps.release_context.outputs.release_record_path }}
      github_note_path: ${{ steps.release_context.outputs.github_note_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_recovery && inputs.recovery_version != '' && format('refs/tags/v{0}', inputs.recovery_version) || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Resolve exact release context
        id: release_context
        shell: bash
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          RECOVERY_COMMIT: ${{ inputs.recovery_commit }}
          RECOVERY_TREE: ${{ inputs.recovery_tree }}
          RECOVERY_AUTHORIZATION: ${{ inputs.recovery_authorization }}
          RECOVERY_RECEIPT_RUN_ID: ${{ inputs.recovery_receipt_run_id }}
        run: |
          set -euo pipefail
          recovery=false
          authorization=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            # #3786: the version is not stripped from the tag text here. The
            # observed tag feeds the typed release-identity check through the
            # preflight, and the validated projection below is this
            # workflow's version source.
            version=""
            tag="${GITHUB_REF_NAME}"
            # #3790: a pushed tag name is evidence of an attempted operation,
            # never authority. The authorize gate compiles the out-of-tree
            # authorization document and exports its digest; the publish job
            # selects that digest and refuses an empty authorization.
            authorization=""
          elif [ "${{ inputs.publish_recovery }}" = "true" ]; then
            recovery=true
            version="${RECOVERY_VERSION}"
            tag="v${version}"
            authorization="${RECOVERY_AUTHORIZATION}"
           if [ -z "${version}" ] || [ -z "${RECOVERY_COMMIT}" ] || [ -z "${RECOVERY_TREE}" ] || [ -z "${authorization}" ] || [ -z "${RECOVERY_RECEIPT_RUN_ID}" ]; then
             echo "::error::publish_recovery requires recovery_version, recovery_commit, recovery_tree, recovery_authorization, and recovery_receipt_run_id"
             exit 1
           fi
            if [[ ! "${RECOVERY_RECEIPT_RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "::error::recovery_receipt_run_id must be a numeric GitHub Actions run id"
              exit 1
            fi
            if [[ ! "${RECOVERY_COMMIT}" =~ ^[0-9a-fA-F]{40,64}$ ]] || [[ ! "${RECOVERY_TREE}" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
              echo "::error::recovery_commit and recovery_tree must be hexadecimal commit/tree identities"
              exit 1
            fi
            if [[ ! "${authorization}" =~ ^[A-Za-z0-9._:/#-]+$ ]]; then
              echo "::error::recovery_authorization must be a bounded reference token"
              exit 1
            fi
           if ! git rev-parse "${tag}^{commit}" >/dev/null 2>&1; then
              echo "::error::recovery_version ${tag} does not match an existing tag"
              exit 1
            fi
          else
            # #3786: the workspace version is read once, inside the preflight
            # script; the validated projection below is the version source.
            version=""
            tag=""
          fi
          commit="$(git rev-parse HEAD^{commit})"
          tree="$(git rev-parse HEAD^{tree})"
          if [ "${recovery}" = "true" ]; then
            tagged_commit="$(git rev-parse "${tag}^{commit}")"
            tagged_tree="$(git rev-parse "${tag}^{tree}")"
            if [ "${tagged_commit}" != "${RECOVERY_COMMIT}" ] || [ "${tagged_tree}" != "${RECOVERY_TREE}" ]; then
              echo "::error::recovery tag does not match the supplied commit/tree"
              exit 1
            fi
            if [ "${commit}" != "${tagged_commit}" ] || [ "${tree}" != "${tagged_tree}" ]; then
              echo "::error::recovery checkout is not the exact tagged commit/tree"
              exit 1
            fi
          fi
          RELEASE_IDENTITY_PROJECTION_FILE="target/cargo-allow/release-identity.json" \
            bash scripts/release-version-preflight.sh "${version}"
          # #3786: the canonical version comes from the validated typed
          # release-identity projection, never from re-parsing tag or
          # manifest text in this workflow.
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' target/cargo-allow/release-identity.json)"
          github_prerelease="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["github_prerelease"]).lower())' target/cargo-allow/release-identity.json)"
          # #3788: the exact release-record and GitHub-note paths are read
          # from the validated projection. Downstream jobs consume these
          # outputs; they never assemble release paths from raw version or
          # tag text, and a missing note file is a typed missing-input
          # error, not a locally synthesized fallback.
          release_record_path="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_record_path"])' target/cargo-allow/release-identity.json)"
          github_note_path="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["github_note_path"])' target/cargo-allow/release-identity.json)"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "commit=${commit}"
            echo "tree=${tree}"
            echo "recovery=${recovery}"
            echo "authorization=${authorization}"
            echo "recovery_receipt_run_id=${RECOVERY_RECEIPT_RUN_ID}"
            echo "github_prerelease=${github_prerelease}"
            echo "release_record_path=${release_record_path}"
            echo "github_note_path=${github_note_path}"
          } >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Qualify the topology-derived cargo-allow candidate
        run: |
          python3 scripts/release-topology-publisher.py \
            --mode cargo-allow \
            --receipt target/cargo-allow/topology-publish.receipt.json
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-preflight-receipts
          path: target/cargo-allow/

  authorize:
    # #3790: exact one-use authorization gate. This job runs before any
    # CARGO_REGISTRY_TOKEN access or upload step. Tag pushes and dispatches
    # are evidence of an attempted operation, never authority: only a
    # Complete compilation of the out-of-tree authorization document against
    # independently observed facts yields valid=true. Rehearsal dispatches
    # stay zero-token by construction.
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.authorize.outputs.valid }}
      rehearsal: ${{ steps.authorize.outputs.rehearsal }}
      recovery: ${{ steps.authorize.outputs.recovery }}
      authorization_digest: ${{ steps.authorize.outputs.authorization_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Validate release authorization before token access
        id: authorize
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          TREE: ${{ needs.preflight.outputs.tree }}
          RECOVERY: ${{ needs.preflight.outputs.recovery }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          valid=false
          rehearsal=false
          recovery=false
          authorization_digest=""
          if [ "${RECOVERY}" = "true" ]; then
            echo "Recovery path uses incident authorization owned outside this gate; clean authorization not applicable."
            recovery=true
          elif [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "Rehearsal dispatch performs no publication and reads no token; authorization gate not applicable."
            rehearsal=true
          else
            [ -n "${TAG}" ] || { echo "::error::tag-push run without a release tag cannot authorize"; exit 1; }
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" || { echo "::error::release tag ${TAG} is not observable"; exit 1; }
            [ "$(git rev-parse "${TAG}^{commit}")" = "${COMMIT}" ] || { echo "::error::release tag does not peel to the preflight commit"; exit 1; }
            [ "$(git rev-parse "${TAG}^{tree}")" = "${TREE}" ] || { echo "::error::release tag does not peel to the preflight tree"; exit 1; }
            # #3790: read the annotated tag object itself, never the peeled
            # commit message. A lightweight tag has no tag object and can
            # never carry authorization references.
            tag_obj="$(git rev-parse "refs/tags/${TAG}^{tag}")" || { echo "::error::release tag ${TAG} is not an annotated tag object; lightweight tags never authorize"; exit 1; }
            tag_message="$(git cat-file -p "${tag_obj}")"
            run_id="$(printf '%s' "${tag_message}" | sed -n 's/^authorization-run-id: \([0-9][0-9]*\)$/\1/p' | head -n 1)"
            [ -n "${run_id}" ] || { echo "::error::release tag carries no authorization-run-id; tag push is evidence of an attempt, never authority"; exit 1; }
            advertised="$(printf '%s' "${tag_message}" | sed -n 's/^authorization-digest: \(sha256:[0-9a-fA-F]\{64\}\)$/\1/p' | head -n 1)"
            mkdir -p target/cargo-allow/authorization
            gh run download "${run_id}" --name release-authorization --dir target/cargo-allow/authorization --repo "${GITHUB_REPOSITORY}"
            [ -f target/cargo-allow/authorization/authorization.json ] || { echo "::error::authorization run ${run_id} holds no authorization decision"; exit 1; }
            [ -f target/cargo-allow/authorization/expected-context.json ] || { echo "::error::authorization run ${run_id} holds no trusted expected context"; exit 1; }
            [ -f target/cargo-allow/authorization/freeze.receipt.json ] || { echo "::error::authorization run ${run_id} holds no freeze receipt"; exit 1; }
            compiled="$(cargo run -p cargo-allow --locked --quiet -- release-authorization validate \
              --document target/cargo-allow/authorization/authorization.json \
              --expected-context target/cargo-allow/authorization/expected-context.json \
              --expected-commit "${COMMIT}" \
              --expected-tree "${TREE}" \
              --expected-version "${VERSION}" \
              --expected-tag "${TAG}" \
              --freeze-receipt target/cargo-allow/authorization/freeze.receipt.json \
              --out-receipt target/cargo-allow/authorization.compiled.receipt.json \
              --transition-to selected-for-run \
              --transition-out target/cargo-allow/authorization.selected.json)"
            echo "${compiled}"
            authorization_digest="$(printf '%s' "${compiled}" | sed -n 's/^authorization \(sha256:[0-9a-f]*\) compiled complete.*/\1/p' | head -n 1)"
            [ -n "${authorization_digest}" ] || { echo "::error::authorization digest missing from validator output"; exit 1; }
            if [ -n "${advertised}" ] && [ "${advertised}" != "${authorization_digest}" ]; then
              echo "::error::tag-advertised authorization digest differs from the compiled document"; exit 1;
            fi
            valid=true
          fi
          {
            echo "valid=${valid}"
            echo "rehearsal=${rehearsal}"
            echo "recovery=${recovery}"
            echo "authorization_digest=${authorization_digest}"
          } >> "${GITHUB_OUTPUT}"
          # PR C: the authorize gate emits the single canonical operation
          # identity artifact for this run. Downstream jobs consume it and
          # verify agreement instead of reconstructing operation identity
          # from their own checkout, ref, or inputs.
          mkdir -p target/cargo-allow
          cat > target/cargo-allow/release-operation-identity.json <<EOF
          {
            "version": "${{ needs.preflight.outputs.version }}",
            "tag": "${{ needs.preflight.outputs.tag }}",
            "commit": "${{ needs.preflight.outputs.commit }}",
            "tree": "${{ needs.preflight.outputs.tree }}",
            "authorization_digest": "${authorization_digest}",
            "recovery": ${{ needs.preflight.outputs.recovery }},
            "workflow_run_id": ${{ github.run_id }}
          }
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-authorization-gate
          path: |
            target/cargo-allow/authorization.compiled.receipt.json
            target/cargo-allow/authorization.selected.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-operation-identity
          path: target/cargo-allow/release-operation-identity.json

  # #2267 pre-publication cross-platform SourceCandidateSmoke matrix. Every
  # required row reuses the landed #2256 Stage A packaging harness
  # (scripts/package-candidate-smoke.sh) and the #2266 installed first-hour
  # journey (scripts/source-candidate-smoke.sh) against the exact release
  # identity: the same commit/tree the preflight validated (the recovery tag
  # checkout on the publish_recovery path, so recovery can never prove a
  # different source candidate). Rows are read-only candidate proof: no
  # secret is read, nothing is published, no tag is touched. The selected
  # matrix follows #3737 — Linux and Windows x86_64 on Rust 1.95 are
  # required rows; macOS and the Rust 1.85 rollback-guidance lane are
  # explicitly NotIncluded (that classification is declared in the gate
  # script, never inferred from absent YAML). One auditable publication path
  # keeps its single workflow; this stage only adds proof before publish.
  source-candidate-smoke:
    needs: preflight
    strategy:
      # A failed or cancelled row must surface as itself; cancelling the
      # sibling row would hide a required result behind another failure.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            toolchain: "1.95.0"
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            toolchain: "1.95.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # rust-toolchain.toml pins the floating stable channel and outranks the
    # action's rustup default, so the versioned toolchain: input alone is inert.
    # The env var outranks the file and makes the 1.95.0 attestation true.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.recovery == 'true' && format('refs/tags/{0}', needs.preflight.outputs.tag) || github.sha }}
          # The smoke journeys run local git only (archive/worktree/rev-parse);
          # the checkout must not retain the runner token.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          # #3737 selects Rust 1.95 for every candidate row.
          toolchain: "1.95.0"
      - name: Package the exact candidate and smoke the install (Stage A)
        shell: bash
        run: bash scripts/package-candidate-smoke.sh
      - name: Run the installed first-hour source-candidate journey (#2266)
        shell: bash
        run: |
          set -euo pipefail
          bin="${PWD}/target/package-candidate-smoke/install/bin/cargo-allow"
          # Git Bash resolves the .exe sibling for -x/-f, so test it explicitly.
          if [[ -f "${bin}.exe" ]]; then bin="${bin}.exe"; fi
          CARGO_ALLOW_BIN="${bin}" bash scripts/source-candidate-smoke.sh
      - name: Record the platform smoke receipt
        if: always()
        shell: bash
        env:
          ROW_PLATFORM: ${{ matrix.platform }}
          ROW_TARGET: ${{ matrix.target }}
          ROW_TOOLCHAIN: ${{ matrix.toolchain }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          EXPECTED_TREE: ${{ needs.preflight.outputs.tree }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p target/cargo-allow
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          platform = os.environ["ROW_PLATFORM"]
          harness_path = Path("target/source-candidate-smoke/source-candidate-smoke.receipt.json")
          packaged_path = Path("target/package-candidate-smoke/package-candidate-smoke.receipt.txt")
          harness = None
          if harness_path.is_file():
              try:
                  harness = json.loads(harness_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  harness = None
          packaged = []
          if packaged_path.is_file():
              for line in packaged_path.read_text(encoding="utf-8").splitlines():
                  if line.startswith("packaged="):
                      packaged.append(line[len("packaged="):].rsplit("-", 1)[0])
          row = {
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "ref": os.environ["EXPECTED_REF"],
              "candidate_commit": os.environ["EXPECTED_COMMIT"],
              "candidate_tree": os.environ["EXPECTED_TREE"],
              "candidate_version": os.environ["EXPECTED_VERSION"],
              "tag": os.environ["EXPECTED_TAG"],
              "platform": platform,
              "target": os.environ["ROW_TARGET"],
              "toolchain": os.environ["ROW_TOOLCHAIN"],
              "required": True,
              "result": (harness or {}).get("result", "NotProven"),
              "packaged_crates": packaged,
              "harness_receipt_sha256": (
                  "sha256:" + hashlib.sha256(harness_path.read_bytes()).hexdigest()
                  if harness_path.is_file() else ""
              ),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
          }
          out = Path(f"target/cargo-allow/release-source-candidate-smoke-{platform}.receipt.json")
          out.write_bytes((json.dumps(row, indent=2) + "\n").encode("utf-8"))
          print(f"platform smoke receipt: {out} result={row['result']}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-candidate-smoke-receipt-${{ matrix.platform }}
          path: |
            target/cargo-allow/release-source-candidate-smoke-${{ matrix.platform }}.receipt.json
            target/source-candidate-smoke/source-candidate-smoke.receipt.json
            target/package-candidate-smoke/package-candidate-smoke.receipt.txt
          if-no-files-found: error

  # #2267 aggregate gate: publication may start only when every required
  # #3737 platform receipt is current, claimed, and Passed for this exact
  # run. The gate script refuses missing, skipped, cancelled, timed-out,
  # stale, partial-graph, unclaimed, and unexpected rows; NotApplicable is
  # valid only for the explicitly NotIncluded classifications it declares.
  # The job runs under !cancelled() (never always()) so a failed or skipped
  # matrix still produces a red gate instead of a silently skipped one, and
  # publication stays blocked through the publish job's needs below.
  source-candidate-smoke-aggregate:
    needs: [preflight, source-candidate-smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the Linux smoke row
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-candidate-smoke-receipt-linux
          path: target/cargo-allow/source-candidate-smoke-rows/linux
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Download the Windows smoke row
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-candidate-smoke-receipt-windows
          path: target/cargo-allow/source-candidate-smoke-rows/windows
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Flatten the downloaded rows
        shell: bash
        # upload-artifact roots each row at target/, so the receipt, harness and
        # package files land one directory deeper than the gate reads them.
        # Move them up into the row directory and drop the empty subdirectories,
        # otherwise the gate counts them as unexpected rows.
        run: |
          set -euo pipefail
          for row in target/cargo-allow/source-candidate-smoke-rows/*/; do
            find "${row}" -mindepth 2 -type f -exec mv {} "${row}" \;
            find "${row}" -mindepth 1 -type d -empty -delete
          done
      - name: Aggregate the platform smoke receipts
        env:
          SMOKE_NEEDS_RESULT: ${{ needs.source-candidate-smoke.result }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          EXPECTED_TREE: ${{ needs.preflight.outputs.tree }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release-source-candidate-smoke-gate.py aggregate \
            --rows-dir target/cargo-allow/source-candidate-smoke-rows \
            --fixture docs/dogfood/fixtures/release/candidate-crate-set.toml \
            --needs-result "${SMOKE_NEEDS_RESULT}" \
            --expected-repository "${EXPECTED_REPOSITORY}" \
            --expected-ref "${EXPECTED_REF}" \
            --expected-commit "${EXPECTED_COMMIT}" \
            --expected-tree "${EXPECTED_TREE}" \
            --expected-version "${EXPECTED_VERSION}" \
            --expected-tag "${EXPECTED_TAG}" \
            --expected-run-id "${EXPECTED_RUN_ID}" \
            --expected-run-attempt "${EXPECTED_RUN_ATTEMPT}" \
            --output target/cargo-allow/source-candidate-smoke-aggregate.receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-candidate-smoke-aggregate
          path: target/cargo-allow/source-candidate-smoke-aggregate.receipt.json
          if-no-files-found: error

  publish:
    needs: [preflight, authorize, source-candidate-smoke-aggregate]
    runs-on: ubuntu-latest
    outputs:
      auth_source: ${{ steps.registry_token.outputs.source }}
      authorization_digest: ${{ needs.authorize.outputs.authorization_digest }}
      version: ${{ needs.preflight.outputs.version }}
      github_prerelease: ${{ needs.preflight.outputs.github_prerelease }}
      github_note_path: ${{ needs.preflight.outputs.github_note_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.recovery == 'true' && format('refs/tags/{0}', needs.preflight.outputs.tag) || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Download original publication incident receipt
        if: needs.preflight.outputs.recovery == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-publish-receipt
          path: target/cargo-allow/recovery-receipt
          run-id: ${{ needs.preflight.outputs.recovery_receipt_run_id }}
          github-token: ${{ github.token }}
      - name: Download canonical operation identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-operation-identity
          path: target/cargo-allow/operation-identity
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      # #2267: the publication path consumes the smoke aggregate as evidence
      # and re-verifies its identity binding inside this job, so a stale,
      # foreign-run, or non-Passed gate receipt can never reach the upload
      # steps even if a needs edge were later edited.
      - name: Download the source-candidate smoke aggregate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-candidate-smoke-aggregate
          path: target/cargo-allow/smoke-aggregate
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Refuse publication without a current cross-platform smoke aggregate
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
          EXPECTED_TREE: ${{ needs.preflight.outputs.tree }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release-source-candidate-smoke-gate.py verify \
            --aggregate target/cargo-allow/smoke-aggregate/source-candidate-smoke-aggregate.receipt.json \
            --expected-repository "${EXPECTED_REPOSITORY}" \
            --expected-ref "${EXPECTED_REF}" \
            --expected-commit "${EXPECTED_COMMIT}" \
            --expected-tree "${EXPECTED_TREE}" \
            --expected-version "${EXPECTED_VERSION}" \
            --expected-tag "${EXPECTED_TAG}" \
            --expected-run-id "${EXPECTED_RUN_ID}" \
            --expected-run-attempt "${EXPECTED_RUN_ATTEMPT}" \
            --output target/cargo-allow/source-candidate-smoke-verify.receipt.json
      - name: Release version and artifact preflight
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery && 'true' || 'false' }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TREE: ${{ needs.preflight.outputs.tree }}
          RECOVERY: ${{ needs.preflight.outputs.recovery }}
          RECOVERY_RECEIPT: target/cargo-allow/recovery-receipt/topology-publish.receipt.json
          GATE_AUTHORIZATION_DIGEST: ${{ needs.authorize.outputs.authorization_digest }}
        run: |
          set -euo pipefail
          # PR C: the publish job consumes the authorize gate's canonical
          # operation identity artifact and verifies agreement instead of
          # reconstructing operation identity from its own checkout.
          identity="target/cargo-allow/operation-identity/release-operation-identity.json"
          [ -f "${identity}" ] || { echo "::error::canonical operation identity artifact is absent; refusing to reconstruct it"; exit 1; }
          identity_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "${identity}")"
          identity_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "${identity}")"
          identity_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tree"])' "${identity}")"
          identity_authorization="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["authorization_digest"])' "${identity}")"
          [ "${identity_version}" = "${RELEASE_VERSION}" ] || { echo "::error::operation identity version differs from preflight"; exit 1; }
          [ "${identity_commit}" = "${RELEASE_COMMIT}" ] || { echo "::error::operation identity commit differs from preflight"; exit 1; }
          [ "${identity_tree}" = "${RELEASE_TREE}" ] || { echo "::error::operation identity tree differs from preflight"; exit 1; }
          [ "${identity_authorization}" = "${GATE_AUTHORIZATION_DIGEST}" ] || { echo "::error::operation identity authorization differs from the gate digest"; exit 1; }
          version="${RELEASE_VERSION}"
          [ -n "${version}" ] || { echo "::error::preflight did not resolve a release version"; exit 1; }
          if [ "${RECOVERY}" = "true" ]; then
            [ "$(git rev-parse HEAD^{commit})" = "${RELEASE_COMMIT}" ] || { echo "::error::publish checkout commit differs from preflight"; exit 1; }
            [ "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}" ] || { echo "::error::publish checkout tree differs from preflight"; exit 1; }
          fi
          bash scripts/release-version-preflight.sh "${version}"
      - name: Resolve crates.io API token
        id: registry_token
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "source=crates_io_api_token" >> "${GITHUB_OUTPUT}"
            echo 'workflow_dispatch rehearsal: token lookup skipped; no upload will be attempted.'
            exit 0
          fi
          echo "source=crates_io_api_token" >> "${GITHUB_OUTPUT}"

      - name: Prove shared registry preflight before upload
        id: shared_registry_preflight
        env:
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TREE: ${{ needs.preflight.outputs.tree }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^{commit})" = "${RELEASE_COMMIT}" ] || { echo "::error::publish checkout commit differs from preflight"; exit 1; }
          [ "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}" ] || { echo "::error::publish checkout tree differs from preflight"; exit 1; }
          python3 scripts/release-topology-publisher.py \
            --mode cargo-allow \
            --registry-preflight \
            --receipt target/cargo-allow/shared-registry-preflight.receipt.json
      # #3922 checkpoint law, evidence-only wire-up. Before the package
      # upload begins, one durable pre-intent checkpoint is rendered from
      # settled workflow evidence per CargoAllowPublicationCheckpointV1,
      # stored on the selected GitHub Actions artifact surface, fetched
      # back, and verified by exact-byte independent readback. A failed
      # render, store, fetch, or readback verification stops this job so
      # the upload step cannot run. Field bindings (every digest is a real
      # sha256 over exact named evidence bytes, never a synthetic value):
      #   operation_identity_digest + custody_digest
      #     <- canonical release-operation-identity artifact bytes
      #   operation_head_digest + journal_head_digest + freeze_digest
      #     <- settled shared registry preflight receipt bytes
      #   authorization_digest <- the compiled gate digest when it is
      #     digest-shaped; otherwise the sha256 of the exact authorization
      #     evidence string the publisher consumes (raw evidence is never
      #     embedded)
      # The provider object_id binds the deterministic run-scoped artifact
      # identity; the provider-assigned numeric artifact id lands in the
      # readback receipt (provider completion remains #3922 open work).
      # No token is read, no tag is created, nothing is published, and
      # every authorization gate below stays byte-identical.
      - name: Write the pre-intent publication checkpoint
        id: write_pre_intent_checkpoint
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RECOVERY: ${{ needs.preflight.outputs.recovery }}
          GATE_AUTHORIZATION_DIGEST: ${{ needs.authorize.outputs.authorization_digest }}
          CHECKPOINT_NOTE: >-
            release.yml publish pre-intent checkpoint (#3922 evidence-only).
            Digests bind exact evidence: identity+custody=operation identity
            artifact; head+journal+freeze=preflight receipt. object_id is
            run-scoped; numeric artifact id lands in the readback receipt.
          PRODUCER_WORKFLOW: ${{ github.workflow }}
          PRODUCER_RUN: ${{ github.run_id }}
          PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_JOB: publish
          PRODUCER_GIT_REF: ${{ github.ref }}
          PRODUCER_COMMIT: ${{ github.sha }}
          CHECKPOINT_DIR: target/cargo-allow/checkpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import tomllib
          from pathlib import Path

          SCHEMA_ID = "cargo-allow.publication-checkpoint.v1"
          JOURNAL_SCHEMA_ID = "cargo-allow.publication-journal.v1"
          CLEAN_OPERATION = "publish_cargo_allow_final_0_2_0"
          RECOVERY_OPERATION = "recover_cargo_allow_final_publication"
          RETENTION_DAYS = 90
          CLAIM_BOUNDARY = (
              "This record owns one remotely durable, independently readable "
              "checkpoint per publication journal prefix: exact operation and "
              "journal-prefix identity, monotonic sequence linkage, immutable "
              "provider object identity, producer trust, retention, and "
              "readback classification. It does not upload packages, observe "
              "the registry, authorize the operation, or execute recovery."
          )
          LIMITATIONS = [
              "does_not_upload_packages",
              "does_not_observe_registry",
              "does_not_authorize_operation",
          ]

          def sha256_bytes(data: bytes) -> str:
              return "sha256:" + hashlib.sha256(data).hexdigest()

          def digest_file(path: Path) -> str:
              return sha256_bytes(path.read_bytes())

          def digest_text(text: str) -> str:
              return sha256_bytes(text.encode("utf-8"))

          def canonical(value) -> bytes:
              return json.dumps(
                  value, separators=(",", ":"), ensure_ascii=False
              ).encode("utf-8")

          def pretty(value) -> bytes:
              return json.dumps(value, indent=2, ensure_ascii=False).encode("utf-8")

          checkpoint_dir = Path(os.environ["CHECKPOINT_DIR"])
          checkpoint_dir.mkdir(parents=True, exist_ok=True)

          identity = Path(
              "target/cargo-allow/operation-identity/release-operation-identity.json"
          )
          preflight = Path(
              "target/cargo-allow/shared-registry-preflight.receipt.json"
          )
          topology = Path("policy/product-package-topology-v2.toml")
          for required in (identity, preflight, topology):
              if not required.is_file():
                  raise SystemExit(
                      f"publication checkpoint requires settled evidence {required}"
                  )

          # The first row this operation may render irreversible, selected
          # with the same V2 topology filters the publisher applies.
          with topology.open("rb") as handle:
              document = tomllib.load(handle)
          if (
              document.get("schema_version") != "2.0"
              or document.get("authority_generation") != 2
          ):
              raise SystemExit(
                  "publication checkpoint requires the selected V2 topology authority"
              )
          rows = []
          for raw in document.get("package", []):
              if raw.get("product_family") not in {"shared", "cargo-allow"}:
                  continue
              if raw.get("publish") is not True:
                  continue
              if raw.get("candidate_inclusion") is not True:
                  continue
              rows.append((int(raw["release_order"]), raw["cargo_package_name"]))
          if not rows:
              raise SystemExit("topology selected no rows for the checkpoint row")
          rows.sort()
          first_order, first_row = rows[0]

          recovery = os.environ.get("RECOVERY", "false") == "true"
          operation_class = (
              "incident_recovery" if recovery else "clean_final_publication"
          )
          operation_id = RECOVERY_OPERATION if recovery else CLEAN_OPERATION
          operation_identity_digest = digest_file(identity)
          head_evidence_digest = digest_file(preflight)
          gate_authorization = os.environ.get("GATE_AUTHORIZATION_DIGEST", "")
          if gate_authorization.startswith("sha256:") and len(gate_authorization) == 71:
              authorization_digest = gate_authorization
          else:
              authorization_digest = digest_text(gate_authorization)
          note = os.environ["CHECKPOINT_NOTE"]
          if not (1 <= len(note) <= 256):
              raise SystemExit("checkpoint note must be a bounded operator note")

          producer = {
              "workflow": os.environ["PRODUCER_WORKFLOW"],
              "run": os.environ["PRODUCER_RUN"],
              "attempt": os.environ["PRODUCER_ATTEMPT"],
              "job": os.environ["PRODUCER_JOB"],
              "git_ref": os.environ["PRODUCER_GIT_REF"],
              "commit": os.environ["PRODUCER_COMMIT"],
          }
          if len(producer["commit"]) not in (40, 64) or any(
              character not in "0123456789abcdef" for character in producer["commit"]
          ):
              raise SystemExit("checkpoint producer commit must be a canonical Git SHA")

          artifact_name = "publication-checkpoint-pre-intent"
          created_at = int(time.time())
          record = {
              "schema_id": SCHEMA_ID,
              "schema_version": 1,
              "checkpoint_id": "checkpoint-0-2-0-001",
              "operation_id": operation_id,
              "operation_identity_digest": operation_identity_digest,
              "operation_head_digest": head_evidence_digest,
              "operation_class": operation_class,
              "authorization_digest": authorization_digest,
              "custody_digest": operation_identity_digest,
              "freeze_digest": head_evidence_digest,
              "journal_schema_id": JOURNAL_SCHEMA_ID,
              "journal_head_sequence": 1,
              "journal_head_digest": head_evidence_digest,
              "checkpoint_sequence": 1,
              "prior_checkpoint_digest": None,
              "kind": "pre_intent_durable",
              "row": {
                  "package_name": first_row,
                  "row_order": first_order,
                  "state": "intent_durable",
              },
              "first_irreversible_row": None,
              "incident_recorded": False,
              "provider": {
                  "provider": "github_actions_artifact",
                  "object_id": f"run-{producer['run']}-{artifact_name}",
                  "object_name": artifact_name,
                  "object_digest": "",
                  "object_size_bytes": 0,
              },
              "producer": producer,
              "retention_days": RETENTION_DAYS,
              "created_at_unix_seconds": created_at,
              "expires_at_unix_seconds": created_at + RETENTION_DAYS * 86400,
              "note": note,
              "readback": "missing",
              "readback_at_unix_seconds": None,
              "claim_boundary": CLAIM_BOUNDARY,
              "limitations": list(LIMITATIONS),
          }
          body_fields = [
              key
              for key in record
              if key not in ("provider", "readback", "readback_at_unix_seconds")
          ]
          body_digest = sha256_bytes(
              canonical({key: record[key] for key in body_fields})
          )
          record["provider"]["object_digest"] = body_digest

          # The stored bytes use the model's canonical rendering shape
          # (render_publication_checkpoint_v1): pretty JSON, no trailing
          # newline. The payload carries its own converged size: render,
          # measure, rewrite the size field, and repeat until the record
          # is its own fixed point.
          size_guess = 0
          for _ in range(32):
              record["provider"]["object_size_bytes"] = size_guess
              payload = pretty(record)
              if record["provider"]["object_size_bytes"] == len(payload):
                  break
              size_guess = len(payload)
          else:
              raise SystemExit("checkpoint payload size did not converge")

          payload_path = checkpoint_dir / f"{artifact_name}.json"
          payload_path.write_bytes(payload)
          meta = {
              "checkpoint_id": record["checkpoint_id"],
              "operation_id": operation_id,
              "operation_class": operation_class,
              "checkpoint_kind": "pre_intent_durable",
              "checkpoint_sequence": 1,
              "artifact_name": artifact_name,
              "created_at_unix_seconds": created_at,
              "operation_identity_digest": operation_identity_digest,
              "operation_head_digest": head_evidence_digest,
              "authorization_digest": authorization_digest,
              "custody_digest": operation_identity_digest,
              "freeze_digest": head_evidence_digest,
              "expected_payload_sha256": sha256_bytes(payload),
              "expected_payload_size_bytes": len(payload),
              "body_digest": body_digest,
          }
          meta_path = checkpoint_dir / f"{artifact_name}.meta.json"
          meta_path.write_bytes(canonical(meta) + b"\n")
          print(
              f"pre-intent publication checkpoint rendered: {payload_path} "
              f"({len(payload)} bytes)"
          )
          PY
      - name: Store the pre-intent publication checkpoint
        id: store_pre_intent_checkpoint
        if: always() && steps.write_pre_intent_checkpoint.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-checkpoint-pre-intent
          path: target/cargo-allow/checkpoints/publication-checkpoint-pre-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Fetch the stored pre-intent checkpoint for independent readback
        id: fetch_pre_intent_checkpoint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-checkpoint-pre-intent
          path: target/cargo-allow/checkpoints/pre-intent-readback
      - name: Verify the independent pre-intent checkpoint readback
        id: verify_pre_intent_checkpoint
        env:
          STORED_ARTIFACT_ID: ${{ steps.store_pre_intent_checkpoint.outputs.artifact-id }}
          CHECKPOINT_ARTIFACT_NAME: publication-checkpoint-pre-intent
          CHECKPOINT_READBACK_DIR: pre-intent-readback
          PRODUCER_WORKFLOW: ${{ github.workflow }}
          PRODUCER_RUN: ${{ github.run_id }}
          PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_JOB: publish
          PRODUCER_GIT_REF: ${{ github.ref }}
          PRODUCER_COMMIT: ${{ github.sha }}
          CHECKPOINT_DIR: target/cargo-allow/checkpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # #3922 readback law: provider success without an independent
          # exact-byte readback is never clean. The stored payload is
          # fetched from the provider surface and compared by byte identity
          # against the rendered canonical bytes; a mismatch or absence
          # classifies non-clean and fails this job closed before the
          # upload step can run.
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          def sha256_bytes(data: bytes) -> str:
              return "sha256:" + hashlib.sha256(data).hexdigest()

          checkpoint_dir = Path(os.environ["CHECKPOINT_DIR"])
          artifact_name = os.environ["CHECKPOINT_ARTIFACT_NAME"]
          meta_path = checkpoint_dir / f"{artifact_name}.meta.json"
          stored_path = (
              checkpoint_dir
              / os.environ["CHECKPOINT_READBACK_DIR"]
              / f"{artifact_name}.json"
          )
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          observed_digest = None
          observed_size = None
          if stored_path.is_file():
              stored = stored_path.read_bytes()
              observed_digest = sha256_bytes(stored)
              observed_size = len(stored)
              result = (
                  "complete"
                  if observed_digest == meta["expected_payload_sha256"]
                  else "mismatch"
              )
          else:
              result = "missing"
          receipt = {
              "checkpoint_id": meta["checkpoint_id"],
              "operation_id": meta["operation_id"],
              "checkpoint_kind": meta["checkpoint_kind"],
              "checkpoint_sequence": meta["checkpoint_sequence"],
              "provider": {
                  "surface": "github_actions_artifact",
                  "artifact_name": artifact_name,
                  "artifact_id": os.environ.get("STORED_ARTIFACT_ID", ""),
              },
              "producer": {
                  "workflow": os.environ["PRODUCER_WORKFLOW"],
                  "run": os.environ["PRODUCER_RUN"],
                  "attempt": os.environ["PRODUCER_ATTEMPT"],
                  "job": os.environ["PRODUCER_JOB"],
                  "git_ref": os.environ["PRODUCER_GIT_REF"],
                  "commit": os.environ["PRODUCER_COMMIT"],
              },
              "expected_payload_sha256": meta["expected_payload_sha256"],
              "observed_payload_sha256": observed_digest,
              "expected_payload_size_bytes": meta["expected_payload_size_bytes"],
              "observed_payload_size_bytes": observed_size,
              "result": result,
              "readback_at_unix_seconds": int(time.time()),
          }
          receipt_path = checkpoint_dir / f"{artifact_name}.readback.json"
          receipt_path.write_bytes(
              json.dumps(receipt, indent=2, sort_keys=True).encode("utf-8") + b"\n"
          )
          if result != "complete":
              print(
                  f"::error::independent readback of {artifact_name} classified "
                  f"{result}; publication progress stays blocked"
              )
              raise SystemExit(1)
          print(
              f"independent readback of {artifact_name}: complete "
              f"({observed_size} bytes)"
          )
          PY
      - name: Require crates.io API token for publication
        # #3790: the runner evaluates env before if. Both secret expressions
        # require the job's currently visible successful status, successful
        # strict shared preflight and matching normal/recovery authority.
        # A skipped or failed authorize job still skips this job via needs.
        if: success() && steps.shared_registry_preflight.outcome == 'success' && (needs.authorize.outputs.valid == 'true' || needs.authorize.outputs.recovery == 'true')
        env:
          CARGO_REGISTRY_TOKEN: ${{ job.status == 'success' && steps.shared_registry_preflight.outcome == 'success' && ((github.event_name != 'workflow_dispatch' && needs.authorize.outputs.valid == 'true') || (inputs.publish_recovery && needs.authorize.outputs.recovery == 'true')) && secrets.CARGO_REGISTRY_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is absent; no upload was attempted." >&2
            exit 1
          fi
      - name: Publish cargo-allow topology rows in dependency order
        if: success() && steps.shared_registry_preflight.outcome == 'success'
        env:
          CARGO_REGISTRY_TOKEN: ${{ job.status == 'success' && steps.shared_registry_preflight.outcome == 'success' && ((github.event_name != 'workflow_dispatch' && needs.authorize.outputs.valid == 'true') || (inputs.publish_recovery && needs.authorize.outputs.recovery == 'true')) && secrets.CARGO_REGISTRY_TOKEN || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery && 'true' || 'false' }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TREE: ${{ needs.preflight.outputs.tree }}
          RECOVERY: ${{ needs.preflight.outputs.recovery }}
          RECOVERY_AUTHORIZATION: ${{ needs.preflight.outputs.authorization }}
          GATE_AUTHORIZATION_DIGEST: ${{ needs.authorize.outputs.authorization_digest }}
          RECOVERY_RECEIPT: target/cargo-allow/recovery-receipt/topology-publish.receipt.json
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          [ -n "${version}" ] || { echo "::error::preflight did not resolve a release version"; exit 1; }
          # A rehearsal deliberately carries no publication authority. It
          # qualifies candidate bytes without selecting the upload path.
          if [ "${DRY_RUN}" = "true" ]; then
            python3 scripts/release-topology-publisher.py \
              --mode cargo-allow \
              --receipt target/cargo-allow/topology-publish.receipt.json
            exit 0
          fi
          # #3790: the publish authorization is the compiled gate digest on
          # the clean path and the incident-owned recovery reference on the
          # recovery path. A tag name is never authority; an empty value
          # fails closed in the publisher before any upload.
          if [ "${RECOVERY}" = "true" ]; then
            AUTHORIZATION="${RECOVERY_AUTHORIZATION}"
          else
            AUTHORIZATION="${GATE_AUTHORIZATION_DIGEST}"
          fi
          [ -n "${AUTHORIZATION}" ] || { echo "::error::no compiled authorization for publication; tag pushes alone never authorize"; exit 1; }
          if [ "${RECOVERY}" = "true" ]; then
            [ "$(git rev-parse HEAD^{commit})" = "${RELEASE_COMMIT}" ] || { echo "::error::publish checkout commit differs from preflight"; exit 1; }
            [ "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}" ] || { echo "::error::publish checkout tree differs from preflight"; exit 1; }
          fi
          publisher_args=(
            --mode cargo-allow
            --publish
            --authorization "${AUTHORIZATION}"
            --receipt target/cargo-allow/topology-publish.receipt.json
          )
          if [ "${RECOVERY}" = "true" ]; then
            publisher_args+=(--recovery-receipt "${RECOVERY_RECEIPT}")
          fi
          python3 scripts/release-topology-publisher.py "${publisher_args[@]}"
      # #3922 checkpoint law, evidence-only wire-up. After the publication
      # step settles its receipt and before any dependant work begins, one
      # durable post-observation checkpoint is rendered from that settled
      # receipt, linked to the exact stored pre-intent bytes by their
      # SHA-256, stored on the artifact surface, fetched back, and verified
      # by exact-byte independent readback. Field bindings: the operation,
      # authorization, custody, freeze, and operation-head digests are the
      # pre-intent bindings (linkage never crosses operations or rewrites
      # its head); journal_head_sequence advances to 2 and
      # journal_head_digest binds the settled publish receipt bytes;
      # prior_checkpoint_digest binds the exact downloaded pre-intent
      # payload bytes; first_irreversible_row is the publisher receipt's
      # recorded first irreversible row. A failed render, store, fetch, or
      # readback verification stops this job so dependant jobs cannot run.
      # No token is read, no tag is created, nothing is published, and
      # every authorization gate above stays byte-identical.
      - name: Write the post-observation publication checkpoint
        id: write_post_observation_checkpoint
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          CHECKPOINT_NOTE: >-
            release.yml publish post-observation checkpoint (#3922
            evidence-only). Linked to the read-back pre-intent bytes;
            journal head binds the settled publish receipt. object_id is
            run-scoped; numeric artifact id lands in the readback receipt.
          PRODUCER_WORKFLOW: ${{ github.workflow }}
          PRODUCER_RUN: ${{ github.run_id }}
          PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_JOB: publish
          PRODUCER_GIT_REF: ${{ github.ref }}
          PRODUCER_COMMIT: ${{ github.sha }}
          CHECKPOINT_DIR: target/cargo-allow/checkpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          SCHEMA_ID = "cargo-allow.publication-checkpoint.v1"
          JOURNAL_SCHEMA_ID = "cargo-allow.publication-journal.v1"
          RETENTION_DAYS = 90
          CLAIM_BOUNDARY = (
              "This record owns one remotely durable, independently readable "
              "checkpoint per publication journal prefix: exact operation and "
              "journal-prefix identity, monotonic sequence linkage, immutable "
              "provider object identity, producer trust, retention, and "
              "readback classification. It does not upload packages, observe "
              "the registry, authorize the operation, or execute recovery."
          )
          LIMITATIONS = [
              "does_not_upload_packages",
              "does_not_observe_registry",
              "does_not_authorize_operation",
          ]
          ROW_STATES = {
              "published_verified": "visible_exact",
              "verified_existing": "visible_exact",
              "already_published_exact": "visible_exact",
              "recovered_already_published_exact": "visible_exact",
              "uploaded_waiting_for_registry": "waiting",
              "missing": "observed_absent",
              "checksum_conflict": "visible_conflict",
          }

          def sha256_bytes(data: bytes) -> str:
              return "sha256:" + hashlib.sha256(data).hexdigest()

          def digest_file(path: Path) -> str:
              return sha256_bytes(path.read_bytes())

          def canonical(value) -> bytes:
              return json.dumps(
                  value, separators=(",", ":"), ensure_ascii=False
              ).encode("utf-8")

          def pretty(value) -> bytes:
              return json.dumps(value, indent=2, ensure_ascii=False).encode("utf-8")

          checkpoint_dir = Path(os.environ["CHECKPOINT_DIR"])
          checkpoint_dir.mkdir(parents=True, exist_ok=True)

          publication = Path("target/cargo-allow/topology-publish.receipt.json")
          if not publication.is_file():
              raise SystemExit(
                  "post-observation checkpoint requires the settled publish receipt"
              )
          receipt_document = json.loads(publication.read_text(encoding="utf-8"))
          if receipt_document.get("schema_id") != (
              "cargo-allow.topology-publish-receipt.v1"
          ):
              raise SystemExit("publish receipt is not the typed topology receipt")
          if (
              receipt_document.get("complete") is not True
              or receipt_document.get("incident_state") is not None
          ):
              raise SystemExit(
                  "publish receipt is not a clean settled batch; refusing to "
                  "render a post-observation checkpoint"
              )
          receipt_rows = receipt_document.get("rows") or []
          if not receipt_rows:
              raise SystemExit("publish receipt selected no rows")
          ordered_rows = sorted(receipt_rows, key=lambda row: int(row["release_order"]))
          last = ordered_rows[-1]
          last_state = ROW_STATES.get(last.get("state"), "incident")

          first_name = None
          first_order = receipt_document.get("first_irreversible_row")
          if first_order is not None:
              matches = [
                  row["name"]
                  for row in receipt_rows
                  if int(row["release_order"]) == int(first_order)
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "publish receipt first irreversible row does not resolve "
                      "to exactly one row"
                  )
              first_name = matches[0]

          stored_pre = (
              checkpoint_dir
              / "pre-intent-readback"
              / "publication-checkpoint-pre-intent.json"
          )
          if not stored_pre.is_file():
              raise SystemExit(
                  "the read-back pre-intent checkpoint bytes are absent; "
                  "linkage refuses to advance"
              )
          prior_digest = sha256_bytes(stored_pre.read_bytes())
          pre_meta = json.loads(
              (checkpoint_dir / "publication-checkpoint-pre-intent.meta.json")
              .read_text(encoding="utf-8")
          )
          created_at = int(time.time())
          if created_at < int(pre_meta["created_at_unix_seconds"]):
              raise SystemExit("checkpoint construction time moved backward")
          note = os.environ["CHECKPOINT_NOTE"]
          if not (1 <= len(note) <= 256):
              raise SystemExit("checkpoint note must be a bounded operator note")

          producer = {
              "workflow": os.environ["PRODUCER_WORKFLOW"],
              "run": os.environ["PRODUCER_RUN"],
              "attempt": os.environ["PRODUCER_ATTEMPT"],
              "job": os.environ["PRODUCER_JOB"],
              "git_ref": os.environ["PRODUCER_GIT_REF"],
              "commit": os.environ["PRODUCER_COMMIT"],
          }
          if len(producer["commit"]) not in (40, 64) or any(
              character not in "0123456789abcdef" for character in producer["commit"]
          ):
              raise SystemExit("checkpoint producer commit must be a canonical Git SHA")

          artifact_name = "publication-checkpoint-post-observation"
          record = {
              "schema_id": SCHEMA_ID,
              "schema_version": 1,
              "checkpoint_id": "checkpoint-0-2-0-002",
              "operation_id": pre_meta["operation_id"],
              "operation_identity_digest": pre_meta["operation_identity_digest"],
              "operation_head_digest": pre_meta["operation_head_digest"],
              "operation_class": pre_meta["operation_class"],
              "authorization_digest": pre_meta["authorization_digest"],
              "custody_digest": pre_meta["custody_digest"],
              "freeze_digest": pre_meta["freeze_digest"],
              "journal_schema_id": JOURNAL_SCHEMA_ID,
              "journal_head_sequence": 2,
              "journal_head_digest": digest_file(publication),
              "checkpoint_sequence": 2,
              "prior_checkpoint_digest": prior_digest,
              "kind": "post_observation",
              "row": {
                  "package_name": last["name"],
                  "row_order": int(last["release_order"]),
                  "state": last_state,
              },
              "first_irreversible_row": first_name,
              "incident_recorded": False,
              "provider": {
                  "provider": "github_actions_artifact",
                  "object_id": f"run-{producer['run']}-{artifact_name}",
                  "object_name": artifact_name,
                  "object_digest": "",
                  "object_size_bytes": 0,
              },
              "producer": producer,
              "retention_days": RETENTION_DAYS,
              "created_at_unix_seconds": created_at,
              "expires_at_unix_seconds": created_at + RETENTION_DAYS * 86400,
              "note": note,
              "readback": "missing",
              "readback_at_unix_seconds": None,
              "claim_boundary": CLAIM_BOUNDARY,
              "limitations": list(LIMITATIONS),
          }
          body_fields = [
              key
              for key in record
              if key not in ("provider", "readback", "readback_at_unix_seconds")
          ]
          body_digest = sha256_bytes(
              canonical({key: record[key] for key in body_fields})
          )
          record["provider"]["object_digest"] = body_digest

          # The stored bytes use the model's canonical rendering shape
          # (render_publication_checkpoint_v1): pretty JSON, no trailing
          # newline. The payload carries its own converged size: render,
          # measure, rewrite the size field, and repeat until the record
          # is its own fixed point.
          size_guess = 0
          for _ in range(32):
              record["provider"]["object_size_bytes"] = size_guess
              payload = pretty(record)
              if record["provider"]["object_size_bytes"] == len(payload):
                  break
              size_guess = len(payload)
          else:
              raise SystemExit("checkpoint payload size did not converge")

          payload_path = checkpoint_dir / f"{artifact_name}.json"
          payload_path.write_bytes(payload)
          meta = {
              "checkpoint_id": record["checkpoint_id"],
              "operation_id": record["operation_id"],
              "operation_class": record["operation_class"],
              "checkpoint_kind": "post_observation",
              "checkpoint_sequence": 2,
              "artifact_name": artifact_name,
              "created_at_unix_seconds": created_at,
              "expected_payload_sha256": sha256_bytes(payload),
              "expected_payload_size_bytes": len(payload),
              "body_digest": body_digest,
          }
          meta_path = checkpoint_dir / f"{artifact_name}.meta.json"
          meta_path.write_bytes(canonical(meta) + b"\n")
          print(
              f"post-observation publication checkpoint rendered: {payload_path} "
              f"({len(payload)} bytes)"
          )
          PY
      - name: Store the post-observation publication checkpoint
        id: store_post_observation_checkpoint
        if: always() && steps.write_post_observation_checkpoint.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-checkpoint-post-observation
          path: target/cargo-allow/checkpoints/publication-checkpoint-post-observation.json
          if-no-files-found: error
          retention-days: 90
      - name: Fetch the stored post-observation checkpoint for independent readback
        id: fetch_post_observation_checkpoint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-checkpoint-post-observation
          path: target/cargo-allow/checkpoints/post-observation-readback
      - name: Verify the independent post-observation checkpoint readback
        id: verify_post_observation_checkpoint
        env:
          STORED_ARTIFACT_ID: ${{ steps.store_post_observation_checkpoint.outputs.artifact-id }}
          CHECKPOINT_ARTIFACT_NAME: publication-checkpoint-post-observation
          CHECKPOINT_READBACK_DIR: post-observation-readback
          PRODUCER_WORKFLOW: ${{ github.workflow }}
          PRODUCER_RUN: ${{ github.run_id }}
          PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_JOB: publish
          PRODUCER_GIT_REF: ${{ github.ref }}
          PRODUCER_COMMIT: ${{ github.sha }}
          CHECKPOINT_DIR: target/cargo-allow/checkpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # #3922 readback law: provider success without an independent
          # exact-byte readback is never clean. A mismatch or absence
          # classifies non-clean and fails this job closed so no dependant
          # job may begin.
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          def sha256_bytes(data: bytes) -> str:
              return "sha256:" + hashlib.sha256(data).hexdigest()

          checkpoint_dir = Path(os.environ["CHECKPOINT_DIR"])
          artifact_name = os.environ["CHECKPOINT_ARTIFACT_NAME"]
          meta_path = checkpoint_dir / f"{artifact_name}.meta.json"
          stored_path = (
              checkpoint_dir
              / os.environ["CHECKPOINT_READBACK_DIR"]
              / f"{artifact_name}.json"
          )
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          observed_digest = None
          observed_size = None
          if stored_path.is_file():
              stored = stored_path.read_bytes()
              observed_digest = sha256_bytes(stored)
              observed_size = len(stored)
              result = (
                  "complete"
                  if observed_digest == meta["expected_payload_sha256"]
                  else "mismatch"
              )
          else:
              result = "missing"
          receipt = {
              "checkpoint_id": meta["checkpoint_id"],
              "operation_id": meta["operation_id"],
              "checkpoint_kind": meta["checkpoint_kind"],
              "checkpoint_sequence": meta["checkpoint_sequence"],
              "provider": {
                  "surface": "github_actions_artifact",
                  "artifact_name": artifact_name,
                  "artifact_id": os.environ.get("STORED_ARTIFACT_ID", ""),
              },
              "producer": {
                  "workflow": os.environ["PRODUCER_WORKFLOW"],
                  "run": os.environ["PRODUCER_RUN"],
                  "attempt": os.environ["PRODUCER_ATTEMPT"],
                  "job": os.environ["PRODUCER_JOB"],
                  "git_ref": os.environ["PRODUCER_GIT_REF"],
                  "commit": os.environ["PRODUCER_COMMIT"],
              },
              "expected_payload_sha256": meta["expected_payload_sha256"],
              "observed_payload_sha256": observed_digest,
              "expected_payload_size_bytes": meta["expected_payload_size_bytes"],
              "observed_payload_size_bytes": observed_size,
              "result": result,
              "readback_at_unix_seconds": int(time.time()),
          }
          receipt_path = checkpoint_dir / f"{artifact_name}.readback.json"
          receipt_path.write_bytes(
              json.dumps(receipt, indent=2, sort_keys=True).encode("utf-8") + b"\n"
          )
          if result != "complete":
              print(
                  f"::error::independent readback of {artifact_name} classified "
                  f"{result}; dependant progress stays blocked"
              )
              raise SystemExit(1)
          print(
              f"independent readback of {artifact_name}: complete "
              f"({observed_size} bytes)"
          )
          PY
      - name: Record publish receipt
        if: always()
        run: |
          mkdir -p target/cargo-allow
          cat > target/cargo-allow/release-publish.receipt.json <<EOF
          {
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "version": "${{ needs.preflight.outputs.version }}",
            "tag": "${{ needs.preflight.outputs.tag }}",
            "candidate_commit": "${{ needs.preflight.outputs.commit }}",
            "candidate_tree": "${{ needs.preflight.outputs.tree }}",
            "recovery": ${{ needs.preflight.outputs.recovery }},
            "authorization": "${{ needs.preflight.outputs.authorization }}",
            "authorization_digest": "${{ needs.authorize.outputs.authorization_digest }}",
            "recovery_receipt_run_id": "${{ needs.preflight.outputs.recovery_receipt_run_id }}",
            "dry_run": ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery }},
            "workflow_run_id": ${{ github.run_id }},
            "auth": "${{ steps.registry_token.outputs.source }}"
          }
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-publish-receipt
          path: |
            target/cargo-allow/release-publish.receipt.json
            target/cargo-allow/topology-publish.receipt.json
            target/cargo-allow/shared-registry-preflight.receipt.json
            target/cargo-allow/source-candidate-smoke-verify.receipt.json
      - name: Retain publication checkpoint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-checkpoint-readbacks
          path: target/cargo-allow/checkpoints/
          if-no-files-found: warn

  install-smoke:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Verify published cargo-allow installs from crates.io
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          bash scripts/release-install-smoke.sh "${version}"
      - name: Record install-smoke receipt
        if: always()
        shell: bash
        run: |
          mkdir -p target/cargo-allow
          cat > target/cargo-allow/release-install-smoke.receipt.json <<EOF
          {
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "version": "${RELEASE_VERSION}",
            "os": "${{ matrix.os }}",
            "workflow_run_id": ${{ github.run_id }}
          }
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-install-smoke-receipt-${{ matrix.os }}
          path: target/cargo-allow/release-install-smoke.receipt.json

  github-release:
    needs: [install-smoke, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-publish-receipt
          path: target/cargo-allow
      - name: Verify publish receipt agrees with the publish outputs
        id: publication_receipt
        env:
          PUBLISH_VERSION: ${{ needs.publish.outputs.version }}
          PUBLISH_AUTHORIZATION_DIGEST: ${{ needs.publish.outputs.authorization_digest }}
        run: |
          set -euo pipefail
          # PR C: the GitHub Release job consumes the publish receipt and
          # verifies agreement instead of trusting job outputs alone.
          receipt="target/cargo-allow/release-publish.receipt.json"
          [ -f "${receipt}" ] || { echo "::error::publish receipt is absent; refusing to reconstruct release identity"; exit 1; }
          receipt_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "${receipt}")"
          receipt_authorization="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["authorization_digest"])' "${receipt}")"
          [ "${receipt_version}" = "${PUBLISH_VERSION}" ] || { echo "::error::publish receipt version differs from publish outputs"; exit 1; }
          [ "${receipt_authorization}" = "${PUBLISH_AUTHORIZATION_DIGEST}" ] || { echo "::error::publish receipt authorization differs from publish outputs"; exit 1; }
          # Preserve the downloaded row evidence across local repackaging.
          topology_receipt="target/cargo-allow/topology-publish.receipt.json"
          [ -f "${topology_receipt}" ] || { echo "::error::topology publication receipt is absent"; exit 1; }
          topology_authorization="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["authorization"])' "${topology_receipt}")"
          [ "${topology_authorization}" = "${PUBLISH_AUTHORIZATION_DIGEST}" ] || { echo "::error::topology publication authorization differs from publish outputs"; exit 1; }
          topology_sha256="$(python3 -c 'import hashlib,pathlib,sys; print("sha256:" + hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "${topology_receipt}")"
          printf 'topology_sha256=%s\n' "${topology_sha256}" >> "${GITHUB_OUTPUT}"
      - name: Package crates for manifest checksums
        env:
          PUBLICATION_RECEIPT_SHA256: ${{ steps.publication_receipt.outputs.topology_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/release-topology-publisher.py \
            --mode cargo-allow \
            --package-only \
            --receipt target/cargo-allow/topology-repackage.receipt.json \
            --publication-receipt target/cargo-allow/topology-publish.receipt.json \
            --publication-receipt-sha256 "${PUBLICATION_RECEIPT_SHA256}"
      - name: Build tagged Linux release binary
        run: cargo build -p cargo-allow --bin cargo-allow --release --locked --target x86_64-unknown-linux-gnu
      - name: Package tagged Linux executable archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          CARGO_ALLOW_BIN: target/x86_64-unknown-linux-gnu/release/cargo-allow
          OUTPUT_DIR: target/cargo-allow/release-assets
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          export RELEASE_TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          bash scripts/package-release-binary.sh --version "${version}" --target x86_64-unknown-linux-gnu --output-dir "${OUTPUT_DIR}"
      - name: Verify tagged Linux executable archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          OUTPUT_DIR: target/cargo-allow/release-assets
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          export RELEASE_TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          archive="${OUTPUT_DIR}/cargo-allow-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          bash scripts/verify-release-binary.sh --version "${version}" --receipt "${OUTPUT_DIR}/release-binary-install.receipt.json" "${archive}"
      - name: Attest tagged Linux executable archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/cargo-allow/release-assets/cargo-allow-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
      - name: Verify tagged Linux executable attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          OUTPUT_DIR: target/cargo-allow/release-assets
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          export RELEASE_TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          archive="${OUTPUT_DIR}/cargo-allow-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
          ATTESTATION_VERIFIED=true bash scripts/verify-release-binary.sh --version "${version}" --receipt "${OUTPUT_DIR}/release-binary-install.receipt.json" "${archive}"
      - name: Generate release manifest
        id: release_manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          AUTH_SOURCE: ${{ needs.publish.outputs.auth_source }}
          AUTHORIZATION_DIGEST: ${{ needs.publish.outputs.authorization_digest }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          # Retained as release evidence. Must equal Cargo.toml
          # `rust-version` (scripts/check-msrv-consistency.sh enforces this).
          MSRV: "1.95"
          PLATFORMS: "linux"
          BINARY_PACKAGE_RECEIPT: target/cargo-allow/release-assets/release-binary.receipt.json
          BINARY_INSTALL_RECEIPT: target/cargo-allow/release-assets/release-binary-install.receipt.json
          RUST_TOOLCHAIN: stable
          RUNNER: ubuntu-latest
          TOPOLOGY_RECEIPT: target/cargo-allow/topology-publish.receipt.json
          REQUIRE_PUBLISHED_TOPOLOGY: "true"
          EXPECTED_TOPOLOGY_RECEIPT_SHA256: ${{ steps.publication_receipt.outputs.topology_sha256 }}
        run: |
          set -euo pipefail
          # #2497: the manifest's semantic authority is the typed Rust
          # command. It validates the exact retained receipts, reconciles
          # every published row through the typed publication adapter,
          # assembles ReleaseManifestV2, re-validates the exact written
          # bytes, and fails closed on anything other than the required
          # typed result. Shell derives only the operation tree identity.
          TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          cargo run -p cargo-allow --locked --quiet -- release-manifest \
            --version "${RELEASE_VERSION}" \
            --repository "${REPOSITORY}" \
            --tag "${TAG}" \
            --commit "${COMMIT}" \
            --tree "${TREE}" \
            --auth-source "${AUTH_SOURCE}" \
            --authorization-digest "${AUTHORIZATION_DIGEST}" \
            --workflow-run-id "${WORKFLOW_RUN_ID}" \
            --platforms "${PLATFORMS}" \
            --rust-toolchain "${RUST_TOOLCHAIN}" \
            --runner "${RUNNER}" \
            --binary-package-receipt "${BINARY_PACKAGE_RECEIPT}" \
            --binary-install-receipt "${BINARY_INSTALL_RECEIPT}" \
            --topology-receipt "${TOPOLOGY_RECEIPT}" \
            --require-published-topology \
            --expected-topology-receipt-sha256 "${EXPECTED_TOPOLOGY_RECEIPT_SHA256}" \
            --require-result complete \
            --output target/cargo-allow/release-manifest-v2.json \
            --result-out target/cargo-allow/release-manifest-v2.result.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Retain typed manifest evidence
        # #2497: the failed reconciliation and its referenced diagnostics are
        # retained without changing the aggregate result.
        if: always() && steps.release_manifest.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-typed-evidence
          path: |
            target/cargo-allow/release-manifest-v2.result.json
            target/cargo-allow/release-manifest-v2.json
          if-no-files-found: warn
      - name: Require the typed Complete manifest before attestation
        # #2497: the exact manifest bytes are re-validated by the typed
        # authority immediately before attestation. An incomplete payload, a
        # stale result, or bytes that changed after generation fails this job
        # so no attestation or release step can run.
        run: |
          cargo run -p cargo-allow --locked --quiet -- release-manifest \
            --manifest target/cargo-allow/release-manifest-v2.json \
            --require-result complete \
            --result-out target/cargo-allow/release-manifest-v2.result.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Attest release manifest
        # #2497: attestation runs only on the typed Complete result.
        if: success() && steps.release_manifest.outputs.result == 'complete'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/cargo-allow/release-manifest-v2.json
      - name: Resolve release notes
        id: notes
        env:
          RELEASE_NOTE_PATH: ${{ needs.publish.outputs.github_note_path }}
        run: |
          set -euo pipefail
          # #3788: the note path is the typed release-identity projection's
          # exact selected path, relayed through preflight and publish. Its
          # absence is a typed missing-input error that fails this release
          # closed; a locally assembled or synthesized fallback note could
          # disagree with the validated identity and is deleted.
          [ -n "${RELEASE_NOTE_PATH}" ] || { echo "::error::typed release note input missing: the projection carried no github_note_path"; exit 1; }
          [ -f "${RELEASE_NOTE_PATH}" ] || { echo "::error::typed release note input missing: no release notes at the projected path ${RELEASE_NOTE_PATH}"; exit 1; }
          echo "body_path=${RELEASE_NOTE_PATH}" >> "${GITHUB_OUTPUT}"
      - name: Verify manifest checksum after attestation
        run: |
          cd target/cargo-allow
          sha256sum -c release-manifest-v2.sha256
      - name: Create GitHub Release (draft until manifest attached)
        # #2497: release creation runs only on the typed Complete result.
        if: success() && steps.release_manifest.outputs.result == 'complete'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: cargo-allow ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: true
          prerelease: ${{ needs.publish.outputs.github_prerelease == 'true' }}
      - name: Attach release manifest to GitHub Release
        # #2497: attachment runs only on the typed Complete result.
        if: success() && steps.release_manifest.outputs.result == 'complete'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            target/cargo-allow/release-manifest-v2.json
            target/cargo-allow/release-manifest-v2.sha256
            target/cargo-allow/release-assets/cargo-allow-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            target/cargo-allow/release-assets/cargo-allow-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256
            target/cargo-allow/release-assets/cargo-allow-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.executable.sha256
            target/cargo-allow/release-assets/release-binary.receipt.json
            target/cargo-allow/release-assets/release-binary-install.receipt.json
      - name: Publish release after manifest attached
        # #2497: public visibility runs only on the typed Complete result.
        if: success() && steps.release_manifest.outputs.result == 'complete'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.publish.outputs.github_prerelease == 'true' }}
