name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    # Manual runs validate preflight and cargo publish --dry-run only.
    # Real uploads happen only on version tag pushes.
    inputs:
      publish_recovery:
        description: "Publish missing crates for the current workspace version after a partial tag release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo package --workspace --locked
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: release-preflight-receipts
          path: target/cargo-allow/

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Release version and artifact preflight
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{if(f) exit} f && /^version = /{gsub(/version = "/,""); gsub(/".*/,""); print; exit}' Cargo.toml)"
          fi
          bash scripts/release-version-preflight.sh "${version}"
      - name: Authenticate with crates.io (Trusted Publishing)
        id: oidc
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Resolve crates.io token
        id: registry_token
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${OIDC_TOKEN}" ]; then
            echo "source=oidc" >> "${GITHUB_OUTPUT}"
            echo "token=${OIDC_TOKEN}" >> "${GITHUB_OUTPUT}"
          elif [ -n "${FALLBACK_TOKEN}" ]; then
            echo "source=secret" >> "${GITHUB_OUTPUT}"
            echo "token=${FALLBACK_TOKEN}" >> "${GITHUB_OUTPUT}"
          else
            echo "Configure crates.io Trusted Publishing for release.yml on all workspace crates, or add the CARGO_REGISTRY_TOKEN repository secret." >&2
            exit 1
          fi
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.registry_token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{if(f) exit} f && /^version = /{gsub(/version = "/,""); gsub(/".*/,""); print; exit}' Cargo.toml)"
          fi
          crates=(
            allow-core
            allow-policy
            allow-inventory
            allow-files
            allow-rust
            allow-match
            allow-policy-legacy
            allow-report
            allow-diff
            cargo-allow
          )
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run: preflight already validated all crates with cargo package --workspace --locked"
            echo "Dry-run: validating crates.io publish mechanics for leaf crate allow-core only"
            echo "=== allow-core (dry-run publish check) ==="
            cargo publish --dry-run -p allow-core --locked
            echo "Dry-run only; skipping upload and dependent publish --dry-run (requires index visibility)"
            exit 0
          fi
          is_published() {
            local crate="$1"
            bash scripts/verify-crate-registry-version.sh "${crate}" "${version}" >/dev/null 2>&1
          }
          publish_one() {
            local crate="$1"
            echo "=== ${crate} ==="
            if is_published "${crate}"; then
              echo "${crate} ${version} is already visible in crates.io; skipping upload"
              return 0
            fi
            cargo publish --dry-run -p "${crate}" --locked
            cargo publish -p "${crate}" --locked
            for attempt in $(seq 1 30); do
              if bash scripts/verify-crate-registry-version.sh "${crate}" "${version}"; then
                return 0
              fi
              echo "Waiting for ${crate} ${version} index visibility (attempt ${attempt}/30)..."
              sleep 10
            done
            echo "Timed out waiting for ${crate} ${version} in the crates.io index" >&2
            return 1
          }
          for crate in "${crates[@]}"; do
            publish_one "${crate}"
          done
      - name: Record publish receipt
        if: always()
        run: |
          mkdir -p target/cargo-allow
          cat > target/cargo-allow/release-publish.receipt.json <<EOF
          {
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "dry_run": ${{ github.event_name == 'workflow_dispatch' }},
            "workflow_run_id": ${{ github.run_id }},
            "auth": "${{ steps.registry_token.outputs.source }}"
          }
          EOF
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: release-publish-receipt
          path: target/cargo-allow/release-publish.receipt.json

  install-smoke:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify published cargo-allow installs from crates.io
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-install-smoke.sh "${version}"
      - name: Record install-smoke receipt
        if: always()
        run: |
          mkdir -p target/cargo-allow
          cat > target/cargo-allow/release-install-smoke.receipt.json <<EOF
          {
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "version": "${GITHUB_REF_NAME#v}",
            "workflow_run_id": ${{ github.run_id }}
          }
          EOF
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: release-install-smoke-receipt
          path: target/cargo-allow/release-install-smoke.receipt.json

  github-release:
    needs: install-smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Resolve release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_path="docs/release/github/v${version}.md"
          if [ -f "${notes_path}" ]; then
            echo "body_path=${notes_path}" >> "${GITHUB_OUTPUT}"
          else
            cat > "/tmp/release-notes.md" <<EOF
          # cargo-allow v${version}

          See [docs/release/${version}.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/release/${version}.md)
          for the full release record.
          EOF
            echo "body_path=/tmp/release-notes.md" >> "${GITHUB_OUTPUT}"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: cargo-allow ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: false
