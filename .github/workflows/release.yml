name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    # Manual runs validate preflight and cargo publish --dry-run only unless
    # the separately guarded publish_recovery path is explicitly selected.
    inputs:
      publish_recovery:
        description: "Publish an exact tagged candidate after a partial release; requires all recovery identity inputs"
        required: false
        default: false
        type: boolean
      recovery_version:
        description: "The already-tagged version to recover (e.g. 0.2.0). Must match an existing v* tag."
        required: false
        type: string
      recovery_commit:
        description: "The exact commit currently tagged for the recovery version"
        required: false
        type: string
      recovery_tree:
        description: "The exact tree currently tagged for the recovery version"
        required: false
        type: string
      recovery_authorization:
        description: "Incident/recovery authorization reference for a publishing recovery"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_context.outputs.version }}
      tag: ${{ steps.release_context.outputs.tag }}
      commit: ${{ steps.release_context.outputs.commit }}
      tree: ${{ steps.release_context.outputs.tree }}
      recovery: ${{ steps.release_context.outputs.recovery }}
      authorization: ${{ steps.release_context.outputs.authorization }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_recovery && inputs.recovery_version != '' && format('refs/tags/v{0}', inputs.recovery_version) || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Resolve exact release context
        id: release_context
        shell: bash
        env:
          RECOVERY_VERSION: ${{ inputs.recovery_version }}
          RECOVERY_COMMIT: ${{ inputs.recovery_commit }}
          RECOVERY_TREE: ${{ inputs.recovery_tree }}
          RECOVERY_AUTHORIZATION: ${{ inputs.recovery_authorization }}
        run: |
          set -euo pipefail
          recovery=false
          authorization=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
          elif [ "${{ inputs.publish_recovery }}" = "true" ]; then
            recovery=true
            version="${RECOVERY_VERSION}"
            tag="v${version}"
            authorization="${RECOVERY_AUTHORIZATION}"
           if [ -z "${version}" ] || [ -z "${RECOVERY_COMMIT}" ] || [ -z "${RECOVERY_TREE}" ] || [ -z "${authorization}" ]; then
             echo "::error::publish_recovery requires recovery_version, recovery_commit, recovery_tree, and recovery_authorization"
             exit 1
           fi
            if [[ ! "${RECOVERY_COMMIT}" =~ ^[0-9a-fA-F]{40,64}$ ]] || [[ ! "${RECOVERY_TREE}" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
              echo "::error::recovery_commit and recovery_tree must be hexadecimal commit/tree identities"
              exit 1
            fi
            if [[ ! "${authorization}" =~ ^[A-Za-z0-9._:/#-]+$ ]]; then
              echo "::error::recovery_authorization must be a bounded reference token"
              exit 1
            fi
           if ! git rev-parse "${tag}^{commit}" >/dev/null 2>&1; then
              echo "::error::recovery_version ${tag} does not match an existing tag"
              exit 1
            fi
          else
            version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{if(f) exit} f && /^version = /{gsub(/version = "/,""); gsub(/".*/,""); print; exit}' Cargo.toml)"
            tag=""
          fi
          commit="$(git rev-parse HEAD^{commit})"
          tree="$(git rev-parse HEAD^{tree})"
          if [ "${recovery}" = "true" ]; then
            tagged_commit="$(git rev-parse "${tag}^{commit}")"
            tagged_tree="$(git rev-parse "${tag}^{tree}")"
            if [ "${tagged_commit}" != "${RECOVERY_COMMIT}" ] || [ "${tagged_tree}" != "${RECOVERY_TREE}" ]; then
              echo "::error::recovery tag does not match the supplied commit/tree"
              exit 1
            fi
            if [ "${commit}" != "${tagged_commit}" ] || [ "${tree}" != "${tagged_tree}" ]; then
              echo "::error::recovery checkout is not the exact tagged commit/tree"
              exit 1
            fi
          fi
          bash scripts/release-version-preflight.sh "${version}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "commit=${commit}"
            echo "tree=${tree}"
            echo "recovery=${recovery}"
            echo "authorization=${authorization}"
          } >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Qualify the topology-derived cargo-allow candidate
        run: |
          python3 scripts/release-topology-publisher.py \
            --mode cargo-allow \
            --receipt target/cargo-allow/topology-publish.receipt.json
      - run: cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-preflight-receipts
          path: target/cargo-allow/

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      auth_source: ${{ steps.registry_token.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.recovery == 'true' && format('refs/tags/{0}', needs.preflight.outputs.tag) || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Release version and artifact preflight
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery && 'true' || 'false' }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TREE: ${{ needs.preflight.outputs.tree }}
          RECOVERY: ${{ needs.preflight.outputs.recovery }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          [ -n "${version}" ] || { echo "::error::preflight did not resolve a release version"; exit 1; }
          if [ "${RECOVERY}" = "true" ]; then
            [ "$(git rev-parse HEAD^{commit})" = "${RELEASE_COMMIT}" ] || { echo "::error::publish checkout commit differs from preflight"; exit 1; }
            [ "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}" ] || { echo "::error::publish checkout tree differs from preflight"; exit 1; }
          fi
          bash scripts/release-version-preflight.sh "${version}"
      - name: Resolve crates.io API token
        id: registry_token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is absent; no upload was attempted." >&2
            exit 1
          fi
          echo "source=crates_io_api_token" >> "${GITHUB_OUTPUT}"
      - name: Publish cargo-allow topology rows in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery && 'true' || 'false' }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_TREE: ${{ needs.preflight.outputs.tree }}
          RECOVERY: ${{ needs.preflight.outputs.recovery }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          [ -n "${version}" ] || { echo "::error::preflight did not resolve a release version"; exit 1; }
          if [ "${RECOVERY}" = "true" ]; then
            [ "$(git rev-parse HEAD^{commit})" = "${RELEASE_COMMIT}" ] || { echo "::error::publish checkout commit differs from preflight"; exit 1; }
            [ "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}" ] || { echo "::error::publish checkout tree differs from preflight"; exit 1; }
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            python3 scripts/release-topology-publisher.py \
              --mode cargo-allow \
              --receipt target/cargo-allow/topology-publish.receipt.json
            exit 0
          fi
          python3 scripts/release-topology-publisher.py \
            --mode cargo-allow \
            --publish \
            --receipt target/cargo-allow/topology-publish.receipt.json
      - name: Record publish receipt
        if: always()
        run: |
          mkdir -p target/cargo-allow
          cat > target/cargo-allow/release-publish.receipt.json <<EOF
          {
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "version": "${{ needs.preflight.outputs.version }}",
            "tag": "${{ needs.preflight.outputs.tag }}",
            "candidate_commit": "${{ needs.preflight.outputs.commit }}",
            "candidate_tree": "${{ needs.preflight.outputs.tree }}",
            "recovery": ${{ needs.preflight.outputs.recovery }},
            "authorization": "${{ needs.preflight.outputs.authorization }}",
            "dry_run": ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_recovery }},
            "workflow_run_id": ${{ github.run_id }},
            "auth": "${{ steps.registry_token.outputs.source }}"
          }
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-publish-receipt
          path: |
            target/cargo-allow/release-publish.receipt.json
            target/cargo-allow/topology-publish.receipt.json

  install-smoke:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Verify published cargo-allow installs from crates.io
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-install-smoke.sh "${version}"
      - name: Record install-smoke receipt
        if: always()
        shell: bash
        run: |
          mkdir -p target/cargo-allow
          cat > target/cargo-allow/release-install-smoke.receipt.json <<EOF
          {
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "version": "${GITHUB_REF_NAME#v}",
            "os": "${{ matrix.os }}",
            "workflow_run_id": ${{ github.run_id }}
          }
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-install-smoke-receipt-${{ matrix.os }}
          path: target/cargo-allow/release-install-smoke.receipt.json

  github-release:
    needs: [install-smoke, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-publish-receipt
          path: target/cargo-allow
      - name: Package crates for manifest checksums
        run: cargo package --workspace --locked
      - name: Build tagged Linux release binary
        run: cargo build -p cargo-allow --bin cargo-allow --release --locked --target x86_64-unknown-linux-gnu
      - name: Package tagged Linux executable archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          CARGO_ALLOW_BIN: target/x86_64-unknown-linux-gnu/release/cargo-allow
          OUTPUT_DIR: target/cargo-allow/release-assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          export RELEASE_TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          bash scripts/package-release-binary.sh --version "${version}" --target x86_64-unknown-linux-gnu --output-dir "${OUTPUT_DIR}"
      - name: Verify tagged Linux executable archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          OUTPUT_DIR: target/cargo-allow/release-assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          export RELEASE_TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          archive="${OUTPUT_DIR}/cargo-allow-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          bash scripts/verify-release-binary.sh --version "${version}" --receipt "${OUTPUT_DIR}/release-binary-install.receipt.json" "${archive}"
      - name: Attest tagged Linux executable archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/cargo-allow/release-assets/cargo-allow-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
      - name: Verify tagged Linux executable attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          OUTPUT_DIR: target/cargo-allow/release-assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          export RELEASE_TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          archive="${OUTPUT_DIR}/cargo-allow-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
          ATTESTATION_VERIFIED=true bash scripts/verify-release-binary.sh --version "${version}" --receipt "${OUTPUT_DIR}/release-binary-install.receipt.json" "${archive}"
      - name: Generate release manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          AUTH_SOURCE: ${{ needs.publish.outputs.auth_source }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          # Retained as release evidence. Must equal Cargo.toml
          # `rust-version` (scripts/check-msrv-consistency.sh enforces this).
          MSRV: "1.95"
          PLATFORMS: "linux"
          BINARY_PACKAGE_RECEIPT: target/cargo-allow/release-assets/release-binary.receipt.json
          BINARY_INSTALL_RECEIPT: target/cargo-allow/release-assets/release-binary-install.receipt.json
          RUST_TOOLCHAIN: stable
          RUNNER: ubuntu-latest
          TOPOLOGY_RECEIPT: target/cargo-allow/topology-publish.receipt.json
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          export TREE="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          bash scripts/generate-release-manifest.sh
      - name: Attest release manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/cargo-allow/release-manifest-v2.json
      - name: Resolve release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_path="docs/release/github/v${version}.md"
          if [ -f "${notes_path}" ]; then
            echo "body_path=${notes_path}" >> "${GITHUB_OUTPUT}"
          else
            cat > "/tmp/release-notes.md" <<EOF
          # cargo-allow v${version}

          See [docs/release/${version}.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/release/${version}.md)
          for the full release record.
          EOF
            echo "body_path=/tmp/release-notes.md" >> "${GITHUB_OUTPUT}"
          fi
      - name: Verify manifest checksum after attestation
        run: |
          cd target/cargo-allow
          echo "${{ hashFiles('target/cargo-allow/release-manifest-v2.sha256') }}" | cut -d' ' -f1 | xargs -I{} sh -c 'echo "{}  release-manifest-v2.json" | sha256sum -c -'
      - name: Create GitHub Release (draft until manifest attached)
        uses: softprops/action-gh-release@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: cargo-allow ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: true
          prerelease: false
      - name: Attach release manifest to GitHub Release
        uses: softprops/action-gh-release@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            target/cargo-allow/release-manifest-v2.json
            target/cargo-allow/release-manifest-v2.sha256
            target/cargo-allow/release-assets/cargo-allow-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            target/cargo-allow/release-assets/cargo-allow-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256
            target/cargo-allow/release-assets/cargo-allow-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.executable.sha256
            target/cargo-allow/release-assets/release-binary.receipt.json
            target/cargo-allow/release-assets/release-binary-install.receipt.json
      - name: Publish release after manifest attached
        uses: softprops/action-gh-release@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
