    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the bounded consumer patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64, os; source = base64.b64decode("".join(os.environ["PATCH_B64"].split())); exec(compile(source, "issue-4277-consumers", "exec"))'
          git diff --check

      - name: Run focused settlement and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_floor_pin_settlement.py
          bash scripts/test-proof-direct-floors-protocol.sh

      - name: Run source and change-note guards
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
          cargo run -p cargo-allow --locked -- diff \
            --base 2dc1b07e182935cc7c2654035e2fef8b1199ad1a \
            --require-change-note --format json \
            --output target/issue-4277-consumer-identity-diff.json

      - name: Commit the consumer repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-4277-consumer-identity-repair.yml
          git add scripts/proof-direct-floors.sh scripts/test_floor_protocol.py
          git diff --cached --check
          git commit -m 'fix(ci): unify direct-floor package identity consumers (#4277)'
          git push origin HEAD:fix/4277-floor-pin-settlement
