name: Apply 3915 second flush regression

on:
  push:
    branches:
      - fix/3915-root-bound-cache-target
    paths:
      - .github/workflows/apply-3915-second-flush-test.yml

permissions:
  contents: write

concurrency:
  group: apply-3915-second-flush-test
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/3915-root-bound-cache-target
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Add and validate existing-destination replacement regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/allow-rust/src/tests/cache_root_alias.rs")
          text = path.read_text(encoding="utf-8")
          marker = "#[test]\nfn injected_temp_artifact_is_a_destination_change_not_an_instrument_failure()"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one insertion marker, found {text.count(marker)}")
          test = r'''#[test]
          fn root_bound_store_replaces_an_existing_destination_on_second_dirty_flush(
          ) -> Result<(), String> {
              let fixture = TempRoot::new("second-dirty-flush")?;
              let files = prepare_source(&fixture.0)?;
              let generation = scan_cache_generation();
              let mut store = RootBoundScanCacheStore::open(&fixture.0, &generation)
                  .map_err(|disposition| disposition.as_str().to_string())?;
              let mut memory = ScanCache::new();

              scan_rust_files_cached_with_root_bound_store(
                  &fixture.0,
                  &files,
                  &mut memory,
                  &mut store,
              )
              .map_err(|error| error.to_string())?;
              store
                  .flush_with_disposition()
                  .map_err(|disposition| disposition.as_str().to_string())?;
              let store_path = ScanCacheStore::default_dir(&fixture.0).join("scan-cache.v2.bin");
              let first_bytes = fs::read(&store_path).map_err(|error| error.to_string())?;

              fs::write(
                  fixture.0.join("src/lib.rs"),
                  "fn load(value: Result<(), ()>) { value.expect(\"changed\"); }\n",
              )
              .map_err(|error| error.to_string())?;
              let mut expected_memory = ScanCache::new();
              let expected = scan_rust_files_cached(&fixture.0, &files, &mut expected_memory)
                  .map_err(|error| error.to_string())?;
              let second = scan_rust_files_cached_with_root_bound_store(
                  &fixture.0,
                  &files,
                  &mut memory,
                  &mut store,
              )
              .map_err(|error| error.to_string())?;
              assert_scan_parity(&expected, &second);
              store
                  .flush_with_disposition()
                  .map_err(|disposition| disposition.as_str().to_string())?;
              let second_bytes = fs::read(&store_path).map_err(|error| error.to_string())?;
              assert_ne!(first_bytes, second_bytes, "second dirty flush must replace bytes");
              drop(store);

              let mut reopened = RootBoundScanCacheStore::open(&fixture.0, &generation)
                  .map_err(|disposition| disposition.as_str().to_string())?;
              let mut reopened_memory = ScanCache::new();
              let persisted = scan_rust_files_cached_with_root_bound_store(
                  &fixture.0,
                  &files,
                  &mut reopened_memory,
                  &mut reopened,
              )
              .map_err(|error| error.to_string())?;
              assert_scan_parity(&expected, &persisted);
              Ok(())
          }

          '''
          test = "\n".join(line.removeprefix("          ") for line in test.splitlines()) + "\n"
          path.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")
          Path(".github/workflows/apply-3915-second-flush-test.yml").unlink()
          PY
          cargo fmt -p allow-rust
          cargo test -p allow-rust root_bound_store_replaces_an_existing_destination_on_second_dirty_flush --locked -- --nocapture
          cargo test -p allow-rust cache_root_alias --locked -- --nocapture
          cargo clippy -p allow-rust --all-targets --locked -- -D warnings
          git diff --check
      - name: Commit product regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          git commit -m "test(cache): prove repeated root-bound replacement (#3915)"
          git push origin HEAD:fix/3915-root-bound-cache-target
