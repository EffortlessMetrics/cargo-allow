name: Temporary PR 4131 integrate main

on:
  push:
    branches:
      - codex/2567-provider-contract

permissions:
  contents: write

concurrency:
  group: temporary-pr-4131-integrate-main
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.repository == 'EffortlessMetrics/cargo-allow' &&
      github.ref == 'refs/heads/codex/2567-provider-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Merge current main, resolve bounded overlaps, verify, and push
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          EXPECTED_MAIN: 1e980deb9a2268e74493e9ce31ca6e2b454481f7
          TARGET_BRANCH: codex/2567-provider-contract
        run: |
          set -euo pipefail

          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"

          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if test "${merge_status}" -ne 0; then
            conflicts=$(git diff --name-only --diff-filter=U | LC_ALL=C sort)
            test -n "${conflicts}"
            while IFS= read -r conflict; do
              case "${conflict}" in
                crates/cargo-allow/src/main.rs|policy/allow.toml) ;;
                *)
                  echo "unexpected merge conflict: ${conflict}" >&2
                  exit 1
                  ;;
              esac
            done <<< "${conflicts}"
          fi

          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import textwrap
          import tomllib
          from pathlib import Path

          expected_main = os.environ["EXPECTED_MAIN"]

          def git_show(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{expected_main}:{path}"])

          main_path = Path("crates/cargo-allow/src/main.rs")
          main_text = git_show(str(main_path)).decode("utf-8")
          anchor = "mod propose;\n"
          if "mod provider_contract;" not in main_text:
              if anchor not in main_text:
                  raise SystemExit("main.rs provider insertion anchor moved")
              main_text = main_text.replace(anchor, anchor + "mod provider_contract;\n", 1)
          main_path.write_text(main_text, encoding="utf-8")

          policy_path = Path("policy/allow.toml")
          policy_bytes = git_show(str(policy_path))
          newline = b"\r\n" if b"\r\n" in policy_bytes else b"\n"
          policy_text = policy_bytes.decode("utf-8")
          identities = [
              "allow-11231",
              "allow-11232",
              "docs/schemas/cargo-allow-provider-contract-v1.schema.json",
              ".allow/revisions/4131-provider-contract-schema.toml",
          ]
          for identity in identities:
              if identity in policy_text:
                  raise SystemExit(f"current main policy already contains {identity}")

          block = textwrap.dedent(r'''
              [[allow]]
              id = "allow-11231"
              kind = "non_rust_file"
              family = "documentation"
              path = "docs/schemas/cargo-allow-provider-contract-v1.schema.json"
              owner = "proof/provider"
              classification = "provider_contract_schema"
              reason = "Published closed JSON Schema for the discovery-only cargo-allow provider descriptor introduced by PR #4131; it does not define or authorize request execution or analysis receipts."
              evidence = [
                  "issue:2567",
                  "issue:4144",
                  "doc:docs/schemas/README.md",
                  "test:provider_descriptor_stdout_conforms_without_repository_or_policy",
              ]
              created = "2026-09-06"
              review_after = "2027-03-06"

              [allow.selector]
              ast_kind = "tracked_file"
              symbol = "docs/schemas/cargo-allow-provider-contract-v1.schema.json"
              target_fingerprint = "json"
              glob = "docs/schemas/cargo-allow-provider-contract-v1.schema.json"

              [allow.last_seen]
              line = 1
              column = 1

              [[allow]]
              id = "allow-11232"
              kind = "non_rust_file"
              family = "configuration"
              path = ".allow/revisions/4131-provider-contract-schema.toml"
              owner = "core/policy"
              classification = "ledger_change_note"
              reason = "Revision note authorizing the two bounded policy additions required to receipt the provider descriptor schema and this note itself for PR #4131."
              evidence = [
                  "pr:4131",
                  "issue:2567",
                  "doc:docs/how-to/manage-an-exception.md",
              ]
              created = "2026-09-06"
              review_after = "2027-03-06"

              [allow.selector]
              ast_kind = "tracked_file"
              symbol = ".allow/revisions/4131-provider-contract-schema.toml"
              target_fingerprint = "toml"
              glob = ".allow/revisions/4131-provider-contract-schema.toml"

              [allow.last_seen]
              line = 1
              column = 1
          ''').strip("\n")
          if any(line.rstrip(" \t") != line for line in block.splitlines()):
              raise SystemExit("generated policy block contains trailing horizontal whitespace")
          policy_path.write_bytes(
              policy_bytes.rstrip(b"\r\n")
              + newline
              + newline
              + block.encode("utf-8").replace(b"\n", newline)
              + newline
          )
          tomllib.loads(policy_path.read_text(encoding="utf-8"))

          Path(".github/workflows/zz-temporary-4131-merge-main.yml").unlink()
          PY

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

          expected_paths=$(printf '%s\n' \
            '.allow/revisions/4131-provider-contract-schema.toml' \
            '.changes/Added-20260903-cargo-allow-provider-contract.yaml' \
            'crates/cargo-allow/src/artifact_schema_index_tests.rs' \
            'crates/cargo-allow/src/capabilities.rs' \
            'crates/cargo-allow/src/main.rs' \
            'crates/cargo-allow/src/provider_contract.rs' \
            'crates/cargo-allow/tests/provider_descriptor.rs' \
            'docs/architecture/proof-adapter-cargo-allow.md' \
            'docs/schemas/README.md' \
            'docs/schemas/cargo-allow-provider-contract-v1.schema.json' \
            'policy/allow.toml' | LC_ALL=C sort)
          actual_paths=$(git diff --cached --name-only origin/main | LC_ALL=C sort)
          test "${actual_paths}" = "${expected_paths}"

          cargo fmt --all -- --check
          cargo test -p cargo-allow --test provider_descriptor --locked
          cargo test -p cargo-allow --bin cargo-allow artifact_schema_index_tests --locked
          cargo run -q -p cargo-allow --locked -- \
            check --mode no-new --format markdown \
            --receipt target/cargo-allow/provider-merge-check.receipt.json \
            --output target/cargo-allow/provider-merge-check.md
          cargo run -q -p cargo-allow --locked -- \
            diff --base origin/main --require-change-note --format json \
            --output target/cargo-allow/provider-merge-diff.json

          git commit -m "Merge main into provider contract"

          git fetch --no-tags origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_MAIN}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
