name: One-shot writer-surface reconnaissance

on:
  push:
    branches:
      - fix/writer-inventory-3692
    paths:
      - .github/workflows/one-shot-writer-inventory.yml
      - scripts/one-shot-writer-inventory.py

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/writer-inventory-3692
          fetch-depth: 0
      - name: Generate exact-source writer reconnaissance
        run: python3 scripts/one-shot-writer-inventory.py
      - name: Remove temporary generator
        run: |
          git rm .github/workflows/one-shot-writer-inventory.yml
          git rm scripts/one-shot-writer-inventory.py
      - name: Commit the bounded investigation artifact
        run: |
          set -euo pipefail
          git add docs/release/writer-surface-inventory.generated.md
          git diff --cached --check
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git commit -m "audit(atomicity): inventory production writer surfaces"
          git push origin HEAD:fix/writer-inventory-3692
