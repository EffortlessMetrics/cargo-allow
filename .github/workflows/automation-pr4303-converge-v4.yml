name: PR 4303 convergent source repair v4

on:
  push:
    branches:
      - release/3940-operation-authority-v1

permissions:
  contents: write

concurrency:
  group: pr-4303-convergent-source-repair-v4
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-4303-v4]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/3940-operation-authority-v1
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Repair, prove, and publish a stable remote head
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply-pr4303.py <<'PY'
          from pathlib import Path

          artifacts_path = Path("crates/allow-report/src/artifacts.rs")
          lib_path = Path("crates/allow-report/src/lib.rs")
          authority_path = Path(
              "crates/allow-report/src/artifacts/release_operation_authority_v1.rs"
          )
          test_path = Path("crates/cargo-allow/tests/release_operation_authority.rs")

          artifacts = artifacts_path.read_text(encoding="utf-8")
          export_start_marker = "pub use release_operation_authority_v1::{"
          export_start = artifacts.index(export_start_marker)
          export_end = artifacts.index("\n};", export_start) + len("\n};")
          public_export = artifacts[export_start:export_end].replace(
              export_start_marker,
              "pub use artifacts::{",
              1,
          )

          lib = lib_path.read_text(encoding="utf-8")
          section_start_marker = (
              "// Canonical shared release-operation authority (#3940 PR A).\n"
          )
          section_end_marker = (
              "\n\n// Root re-exports for the durable operation lease (#3925)."
          )
          section_start = lib.index(section_start_marker) + len(section_start_marker)
          section_end = lib.index(section_end_marker, section_start)
          lib_path.write_text(
              lib[:section_start] + public_export + lib[section_end:],
              encoding="utf-8",
              newline="\n",
          )

          authority = authority_path.read_text(encoding="utf-8")
          helper_marker = "fn init_resolves_unknown("
          if helper_marker in authority:
              helper_start = authority.index(helper_marker)
              helper_end = authority.index("fn exact_package_subjects(", helper_start)
              authority = authority[:helper_start] + authority[helper_end:]

          old_guard = '''            if let Some(expected) = expected_subject_artifact_digest(identity, &init.subject) {
              if init.artifact_digest.as_deref() != Some(expected) {
                  return Err("provider request bytes do not match the immutable denominator");
              }
          }
          '''
          new_guard = '''            if let Some(expected) = expected_subject_artifact_digest(identity, &init.subject)
              && init.artifact_digest.as_deref() != Some(expected)
          {
              return Err("provider request bytes do not match the immutable denominator");
          }
          '''
          if old_guard in authority:
              authority = authority.replace(old_guard, new_guard, 1)
          elif new_guard not in authority:
              raise SystemExit("provider request byte guard has an unexpected semantic shape")
          authority_path.write_text(authority, encoding="utf-8", newline="\n")

          tests = test_path.read_text(encoding="utf-8")
          stale_fixture = '''    let recovery = build_release_operation_identity_v1(identity_init(
              CargoAllowReleaseOperationClassV1::IncidentRecovery,
          ))
          .map_err(io::Error::other)?;
          require(
              recovery.incident_predecessor_operation_digest.is_some()
                  && recovery.authority_kind == CargoAllowReleaseOperationAuthorityKindV1::Recovery,
              "recovery identity must retain distinct incident lineage and authority",
          )
          '''
          repaired_fixture = '''    require(
              build_release_operation_identity_v1(identity_init(
                  CargoAllowReleaseOperationClassV1::IncidentRecovery,
              ))
              .is_err(),
              "recovery identity must require the typed predecessor builder",
          )
          '''
          if stale_fixture in tests:
              tests = tests.replace(stale_fixture, repaired_fixture, 1)
          elif repaired_fixture not in tests:
              raise SystemExit("recovery fixture has an unexpected semantic shape")
          test_path.write_text(tests, encoding="utf-8", newline="\n")
          PY

          apply_repair() {
            python3 /tmp/apply-pr4303.py
            find .github/workflows -maxdepth 1 -type f \
              \( -name 'automation-pr4303-*.yml' -o -name 'pr4303-*.yml' \) \
              -print -delete
            cargo fmt --all
          }

          prove_repair() {
            cargo fmt --all -- --check
            cargo test -p allow-report --test release_operation_authority_contract --locked -- --nocapture
            cargo test -p cargo-allow --test release_operation_authority --locked -- --nocapture
            cargo clippy -p allow-report -p cargo-allow --all-targets --locked -- -D warnings
            cargo run -p cargo-allow --locked -- check --mode no-new --format markdown
            git diff --check
          }

          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin release/3940-operation-authority-v1
            base="$(git rev-parse origin/release/3940-operation-authority-v1)"
            git reset --hard "$base"

            apply_repair
            prove_repair

            git fetch origin release/3940-operation-authority-v1
            latest="$(git rev-parse origin/release/3940-operation-authority-v1)"
            if [ "$latest" != "$base" ]; then
              echo "remote advanced during proof; retrying from $latest"
              continue
            fi

            git add -A
            git diff --cached --check
            git commit -m "fix(release,#3940): publish and prove canonical operation authority"

            git fetch origin release/3940-operation-authority-v1
            latest="$(git rev-parse origin/release/3940-operation-authority-v1)"
            if [ "$latest" != "$base" ]; then
              echo "remote advanced before push; retrying from $latest"
              continue
            fi

            git push origin HEAD:release/3940-operation-authority-v1
            exit 0
          done

          echo "branch did not stabilize within the bounded retry set" >&2
          exit 1
