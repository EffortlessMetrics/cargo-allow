name: Frozen subject lock

# #3928: after the #2501 final freeze, load-bearing movement without an
# explicit invalidation must not merge. Read-only: evaluation only.

on:
  pull_request:
  # Same required context on a merge queue. The job checks out the
  # event SHA, which for merge_group is the queue commit. No skip path
  # is added. This trigger does not enable a queue.
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  frozen-subject-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo run -p cargo-allow --locked -- frozen-subject-lock check --receipt docs/dogfood/receipts/final-freeze/final-freeze.receipt.json
