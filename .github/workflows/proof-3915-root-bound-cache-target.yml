name: Proof 3915 root-bound cache target

on:
  push:
    branches:
      - proof/3915-root-bound-cache-target

permissions:
  contents: read

concurrency:
  group: proof-3915-root-bound-cache-target
  cancel-in-progress: true

jobs:
  cache-matrix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 587c0515a810688cbc16ec6b0a4904c5adf977e3
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Root-bound target fixtures
        run: cargo test -p allow-rust cache_root_alias --locked -- --nocapture
      - name: Persistent scan-cache fixtures
        run: cargo test -p allow-rust persistent_scan_cache --locked -- --nocapture
      - name: Strict store and subprocess fixtures
        run: cargo test -p allow-rust scan_cache_store --locked -- --nocapture

  linux-product-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 587c0515a810688cbc16ec6b0a4904c5adf977e3
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Changed-source formatting
        shell: bash
        run: |
          cargo fmt -p allow-rust -- --check
          rustfmt --edition 2024 --config skip_children=true --check crates/cargo-allow/src/world.rs
      - name: Default and minimal feature surfaces
        shell: bash
        run: |
          cargo check -p allow-rust --locked
          cargo check -p allow-rust --no-default-features --locked
          cargo test -p allow-rust --no-default-features scan_cache_store --locked -- --nocapture
      - name: Product clippy
        run: cargo clippy -p allow-rust -p cargo-allow --all-targets --locked -- -D warnings
      - name: Full allow-rust suite
        run: cargo test -p allow-rust --all-targets --locked
      - name: Cargo-allow production tests
        run: cargo test -p cargo-allow --bin cargo-allow --locked
      - name: Bounded diff hygiene
        shell: bash
        run: |
          git diff --check 664bbbb6310ac52df817c91939b5703ef08d05a8...HEAD -- . ':(exclude)crates/cargo-allow/src/world.rs'
          stat=$(git diff --numstat 664bbbb6310ac52df817c91939b5703ef08d05a8...HEAD -- crates/cargo-allow/src/world.rs)
          echo "world.rs numstat: $stat"
          additions=$(printf '%s' "$stat" | awk '{print $1}')
          deletions=$(printf '%s' "$stat" | awk '{print $2}')
          test "$additions" -le 100
          test "$deletions" -le 100

  exact-head-no-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 587c0515a810688cbc16ec6b0a4904c5adf977e3
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Exact-head no-new gate
        run: cargo run -p cargo-allow --locked -- check --mode no-new

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 587c0515a810688cbc16ec6b0a4904c5adf977e3
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
