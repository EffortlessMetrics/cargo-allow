name: Temporary rustfmt minimal graph

on:
  push:
    branches:
      - agent/spec-system-minimal-graph

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: agent/spec-system-minimal-graph
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        shell: bash
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/allow-policy/src/spec_system
          git commit -m "style(spec-system): apply rustfmt"
          git push origin HEAD:agent/spec-system-minimal-graph
