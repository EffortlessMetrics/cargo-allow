kind: Documentation
body: >-
  State the worklist filter/payload/latency relationship in the agent
  worklist guide: every filter pays the full-tree scan before filtering,
  so a filter narrows the emitted payload but never the scan cost. The
  guide now cites the retained #4374 observation in which the zero-item
  `--item-kind baseline_debt` variant was the slowest measured while
  `--status new` stayed a cheap targeted read, and points at
  `--limit`/`--offset` paging plus the budgets doc for the payload table.
  The performance budgets doc also records the retained NonBlocking
  diagnostic follow-up that an explicit exception type for missing
  instrument fields would improve triage (#4374).
