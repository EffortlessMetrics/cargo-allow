kind: Added
body: >-
  Retain the first executed C-family mutation evidence slice (#4725): a
  transport harness (`scripts/command-mutation-evidence.py`) that runs the 20
  accepted `C.init.*`, `C.propose.*`, `C.add.*`, and `C.add_from_plan.*`
  obligations plus adversarial route controls against disposable Git fixtures
  outside any checkout, an admission reader
  (`scripts/verify-command-mutation-evidence.py`) that recomputes retained
  bytes, snapshot diffs, and declared-write reconciliation against a
  caller-pinned expected context, hermetic negative controls
  (`scripts/test-command-mutation-evidence.py`), and the committed
  `docs/release/evidence/command-mutation-1/manifest.v1.json` record of one
  real run against the public `0.2.0-rc.1` installed candidate. The manifest
  retains observed installed-candidate contract gaps and defects as-is; no
  case approves an exception or qualifies a release.
