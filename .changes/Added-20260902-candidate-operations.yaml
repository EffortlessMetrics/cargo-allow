kind: Added
body: >-
  Compile the complete file-operation and decision plan for the
  candidate-preparation transaction (#3832 evidence law for #3750). The
  hidden prep-candidate plan result now embeds an operations plan: one
  exact ordered operation (create/replace/remove/no_op/
  decision_required/conflict) per authority-derived surface across ten
  required owner classes, each with semantic owner and role, current and
  prospective digests, producer, generated-versus-judgment split,
  collision result resolved through the shared mutation-target authority
  (escape, duplicate, alias, case, symlink), rollback source, and
  validation obligations. Generated bytes are deterministic token-level
  rewrites of the workspace manifest, topology version rows, support
  matrix candidate fields, and declared version-derived references;
  judgment-bearing surfaces (Cargo.lock regeneration, Changie framing,
  release record, GitHub note, policy plan) become typed
  DecisionRequired rows naming owner and affected operations. The
  denominator is generated from current authorities with an omission
  check; nothing is applied.
