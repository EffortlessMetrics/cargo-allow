kind: Changed
body: >-
  Shell and Python release consumers now read the typed release identity
  once: the version preflight consumes the canonical projection through a
  shared bounded reader (schema generation, validated result, exact field
  types, and expected-value bindings, failing closed with no fallback), the
  residual tag-to-version strip is deleted in favor of binding the observed
  tag to the projected canonical tag, and release-record paths derive from
  the projected identity; archive verification now requires the exact
  projected release identity and compares the constructed canonical archive
  name instead of deriving a version from the filename; the install smoke
  invokes the installed binary by absolute path and requires it to
  self-report exactly the installed identity (#3787).
time: 2026-11-04T10:15:47-05:00
