kind: Added
body: >-
  Add the exact staged outside-workspace packaging producer for the
  topology-selected mixed-version candidate (#2886): it derives every and
  only candidate row from the V2 package topology, stages the selected
  closure in an isolated tree with workspace inheritance resolved and
  internal path dependencies rewritten to exact topology version
  requirements, packages one crate per row in release order fully offline
  against a staged local registry (crates.io source-replaced, so an
  unpublished requirement can only resolve from a previously packaged row),
  re-packages every row under --locked and requires byte-identical
  archives, and fails closed on digest mismatch, missing packages,
  membership drift, packaged-manifest drift, registry checksum drift, and
  lockfile membership drift. The characterization suite proves the
  mixed-version law on a fixture workspace with two deliberately different
  package versions, including the offline verification build ceiling; no
  upload occurs and no crates.io lookup is reachable from the producer.
time: 2026-11-04T10:42:00Z
