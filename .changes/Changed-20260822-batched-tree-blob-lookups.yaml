kind: Changed
body: >-
  Partial implementation of #2515: batch the exact-path tree lookups behind
  repository snapshot identities. Selected-path blob resolution now issues
  bounded git ls-tree -z --full-tree processes with count and encoded-byte
  caps, maps results back in request order, and rejects duplicate, unrequested,
  malformed, or oversized records. Classification remains identical to the
  per-path lookup for absent paths, non-regular modes, and unsupported platform
  paths. Cat-file batching and revision-OID memoization remain open follow-up
  work for #2515. The implementation is index-free, so it introduces no new
  panic-family findings against the ledger.
