kind: Added
body: >-
  Connect the retained native command-case admission to the final
  release-experience admission (#4705): two optional freeze evidence roles
  carry the original admission projection and its expected context, and the
  composer checks their accepted catalogue, exact context bytes, declared
  executable and freeze-subject bindings. Coverage remains a projection's
  claim, never replayed execution proof: even a matching 107-case installed
  projection keeps the #3149/#4705 hold NotProven until native bundle/member
  readback and candidate/install authority are implemented. Foreign, malformed
  and duplicate bindings retain their named failures and original bytes.
