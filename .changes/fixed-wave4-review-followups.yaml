kind: Fixed
body: >-
  Review follow-ups on the wave-4 repair lanes. The `check` and `diff`
  `--emit` help lists now actually name `html` (the earlier doc-lane edit
  added only the `md` alias), and the missing-default-policy comparison
  for the capabilities init remedy survives Windows UNC roots: the
  canonicalized root collapses to one leading slash while a user-spelled
  UNC path keeps two, so the normalized comparison now compares past the
  leading slashes, pinned by a spelling-law unit test.
