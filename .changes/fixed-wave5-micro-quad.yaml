kind: Fixed
body: >-
  Three wave-5 follow-ups. Compat kind spellings are normalized once
  (trim + lowercase) so `--kind UNSAFE`/`PANIC`/`NETWORK` dispatch to
  the same legacy policies as their lowercase forms instead of failing
  with a usage error that lists the lowercase spelling as supported
  (#4589). The artifact-dir collision guard runs before the report and
  receipt writes on `diff` (and before the report on `audit`), so a
  refusal does not write new outputs beside the live policy; the
  `--emit` parse rides the same pre-write gate, so an unknown token's
  usage refusal leaves no outputs either (#4592). A partial inventory
  (a tracked file missing from the worktree walk) now fails
  `check --mode no-new` exactly as the staged path already did, instead
  of exiting 0 behind a `Outcome: partial_data (blocking)` summary
  (#4594).
