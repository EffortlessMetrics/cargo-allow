kind: Added
body: >-
  Execute the five uncovered A presentation obligations read-only (#4724): the
  command-case transport gains actual human, JSON, quiet, file, receipt-only
  and pseudo-terminal invocation routes with per-invocation snapshots, and the
  native reader checks typed sidecar parity, native human-summary prefixes,
  required file reports, exit agreement, receipt-only stdout suppression and
  receipt/detail correspondence. Unparsed human detail and terminal semantics
  stay incomplete rather than marking the 107-case denominator complete.
  Correct the ConPTY handle ABI and resource lifetime, and bound console
  capture before member admission.
