kind: Added
body: >-
  Execute the five uncovered A presentation obligations read-only (#4724): the
  command-case transport gains actual human, JSON, quiet, file, receipt-only
  and pseudo-terminal invocation routes with per-invocation snapshots, and the
  native reader admits per-route typed parity, exit agreement, receipt-only
  stdout suppression, receipt/detail correspondence and unproven terminal
  relays as incomplete observations without marking the 107-case denominator
  complete.
