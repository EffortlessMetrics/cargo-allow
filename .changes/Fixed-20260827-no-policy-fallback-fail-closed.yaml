kind: Fixed
body: >-
  Commands that tolerate a missing policy (`audit`, `propose`, and the
  adoption inspection scan) no longer fall back to an empty policy when a
  source-exception ledger is present but cannot be selected. The fallback
  exists for first-run adoption; entering it for an unreadable ledger was
  fail-open, so `audit` reported an advisory pass over receipts it never read
  and `propose --write` replaced every one of them with a freshly generated
  policy. These trees now fail closed with the discovery diagnostic that
  names the rejected candidate, and a tree with no ledger at all still scans
  as before.
