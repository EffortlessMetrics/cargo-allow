kind: Changed
body: >-
  Re-baseline the advisory performance budgets against the hosted
  22-sample matrix (#4495/#4496): every advisory target the loaded-debug
  observations missed is met on the hosted release reference (agent-loop
  composite 10,660 ms against the restated ≤ 15,000 ms; worklist in-loop
  4,817 ms; warm check 4,509 ms against the < 5,000 ms CI-gate target),
  targets are restated from the hosted numbers, the `why` fast-path
  aspiration is re-baselined from < 500 ms to < 2,000 ms, and #4496's
  spurious catastrophic-ceiling trip predates the matrix: the unchanged
  60,000 ms per-command blocking gate still fails a new sample above it,
  while the retained-run methodology preserves UTC-rollover evidence for
  comparison.
