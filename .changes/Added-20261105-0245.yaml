kind: Added
body: >-
  Retain the first real installed-prerelease command-case observation records
  for the 29 accepted first-family cases (#4723): the public 0.2.0-rc.1
  binary installed from crates.io into a throwaway CARGO_HOME executed every
  case exactly once through the existing collector, and the current-source
  native reader admitted the retained bundle. The records keep the honest
  negative verdict verbatim - 1 valid, 13 incomplete with no fresh summary
  member emitted, 15 invalid against current typed expectations, 78
  accepted-catalogue cases outstanding - and bind the executed bytes to the
  public registry checksum row, the installed executable digest, and the
  provider-observed publication run head. No release surface was mutated and
  no release authority is claimed.
time: 2026-11-05T02:45:00Z
