kind: Fixed
body: >-
  Docs: docs/getting-started.md now matches reality in two places
  (#4529, #4531). The §2b capabilities block states its prerequisite:
  the policy-scoped `capabilities --config policy/allow.toml` variant
  reads the ledger that §4's `init` creates, so running it before
  adoption fails with `error[E0003_INVALID_POLICY]` (exit 1) and the
  remedy is to continue with §4 — not to repair a policy entry. The §3
  audit excerpts note that on any real Cargo repository the tracked
  `Cargo.toml` is itself reported as a
  `non_rust_file.package_metadata` finding, so a first audit typically
  shows at least that row rather than the clean zero-finding excerpt
  (which occurs only on trees with no tracked non-Rust files).
  Regression tests pin both documented behaviors.
