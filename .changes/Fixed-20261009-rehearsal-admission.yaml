kind: Fixed
body: >-
  Reject incomplete or contradictory rehearsal evidence before it can qualify
  a Complete final freeze. The existing receipt schema now requires the exact
  canonical phase set, successful reversible outcomes, an explicit unconsumed
  authorization boundary, a consistent aggregate, and all seven zero-mutation
  proofs; duplicate JSON keys fail before decoding can discard a failed result.
  Current characterization receipts retain their false proof flags and remain
  non-Complete through the production graph, readiness, and replay.
  Init test fixtures use exclusive bounded allocation so equal timestamps cannot
  delete or share another active fixture during native release validation.
