kind: Added
body: >-
  Add real sentinel plants to the exact-candidate interop harness (#2605
  final hardening increment). Decoy product binaries that print a
  sentinel version and exit non-zero are planted in a dedicated
  subdirectory of the monorepo target tree (real build outputs
  untouched), and marker files are planted in the target and crates
  trees. The PATH-poison control proves the strongest form of the
  no-leak guarantee: even when a decoy IS discoverable — the delegation
  config carries no executable, the provider override is scrubbed, and
  the poisoned directory is prepended to PATH — the real protocol
  handshake rejects it (wrong_protocol, malformed provider output,
  instrument failure, or discovery failure), so a workspace binary
  cannot impersonate a provider. After every journey, a marker-leak
  scan greps all retained artifacts and consumer outputs for the
  planted marker text, proving no undeclared source-checkout read
  surfaced in anything the harness retains. Together with the
  already-real workspace-leak control, this closes the harness audit's
  sentinel gap.
