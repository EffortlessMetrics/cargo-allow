kind: Fixed
body: >-
  Make the Windows source-candidate smoke run end to end. Git Bash resolves
  the `.exe` sibling for `-x`/`-f`, so the release step now tests
  `${bin}.exe` explicitly. The owned-directory tool gains a symlink- and
  reparse-point-refusing walker for platforms where
  `shutil.rmtree.avoids_symlink_attacks` is false. The shell harnesses strip
  the trailing CR that native Windows Python adds to `token`, `head`, and
  `git_head` before comparing them, using the existing `strip_cr` helper.
  The lifecycle test now exercises matching removal on Windows instead of
  the old refusal design. The journey characterization harness carries the
  same `strip_cr` definition into the clean-path fragment it executes, so
  the extracted cleanup still runs standalone.
