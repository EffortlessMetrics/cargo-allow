kind: Changed
body: >-
  Pin the required release-set `test` and `package-smoke` lanes to one declared
  `LINT_TOOLCHAIN` value (1.100.0) instead of the floating `stable` channel.
  The value drives `RUSTUP_TOOLCHAIN` and both the toolchain action and cache
  inputs, and `scripts/check-msrv-consistency.sh` enforces that those uses stay
  equal and that the versioned pins and toolchain inputs it scans stay on the
  declared MSRV. `scripts/check-ci-environment-profiles.py` now resolves a
  job-level `${{ env.VAR }}` and requires the manifest to match the resolved
  toolchain, not the inert action tag. The profiles manifest records both
  lanes as `ExactToolchainQualification` at 1.100.0 and inventories the new
  advisory `clippy-stable` lane as a `MovingStableCompatibilityCanary`.
  After this pin no ruleset context runs moving stable: the canary is advisory
  in `test-core-platforms`, `compat-delegation` and `clippy-stable`, its
  failure is attributable to a Rust release rather than the PR, and it does
  not gate a merge. Known risk recorded, not fixed here: `test` format-checks
  at rustfmt 1.100.0 while `pregate` format-checks at 1.95.0, both required
  contexts, so divergent rustfmt output would make the two required contexts
  contradict each other. Advance the pin by bumping `LINT_TOOLCHAIN` and
  rerunning the release-set clippy.
