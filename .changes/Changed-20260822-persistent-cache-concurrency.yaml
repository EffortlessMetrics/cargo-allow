kind: Changed
body: >-
  Harden the trusted-local persistent scan-cache write path for same-process
  concurrent writers: unique temporary files, bounded OS-backed writer locking,
  stale-artifact cleanup, rename-first replacement, and Windows reparse-point
  confinement. Cache corruption or write races remain advisory cold-scan
  fallbacks. Cross-process/interrupted-CLI proof remains outside this slice;
  this does not add telemetry, a global cache, or an evaluation result cache.
