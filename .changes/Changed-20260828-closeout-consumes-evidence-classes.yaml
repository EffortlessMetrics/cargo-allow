kind: Changed
body: >-
  The campaign closeout guard now consumes the checked evidence-surface
  inventory (#3810 criterion 7, completing #4000's declared remainder).
  A Complete closeout must declare the inventory surfaces that back its
  acceptance rows; the guard rejects closure when a declared surface is
  unknown, the list is missing, empty, duplicated, or contains blank or
  non-string entries, or when every declared surface carries an
  insufficient evidence class (LexicalProjectionOnly,
  HistoricalFixtureOnly, DeferredWithNamedOwner,
  UnsupportedOrMisclassified) — the negative control 12 shape where
  issue completion would otherwise be manufactured by a lexical
  projection test alone. Sufficient backing remains any of the honest
  evidence classes (StructuredShapeValidation, TypedModelValidation,
  ProductionBehaviorValidation, ExternalObservationValidation,
  LiveControlReadback). A malformed inventory fails the closure as
  instrument failure instead of silently passing. The closeout
  contract docs and the negative-control test suite cover the new
  shapes; non-Complete results are unchanged and read no inventory.
