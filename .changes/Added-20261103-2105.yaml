kind: Added
body: Add the additive execution_provenance section on MinimumVersionProofReceiptV1, binding direct-floor receipts to the executed source subject (#4214): executed source commit/tree, a non-circular selected-source projection digest with explicit scope and exclusions, the observed compiler identity and build profile, and executable-identity fields named for #4225's fill. The drift evaluator grades a source-projection mismatch as stale even with equal manifest and lock digests, names present-but-invalid provenance rows incomplete, and keeps receipts predating the section decodable historical evidence graded on their carried fields. scripts/proof-direct-floors.sh records the provenance and exports CARGO_ALLOW_BUILD_COMMIT, CARGO_ALLOW_BUILD_PROFILE, and CARGO_ALLOW_RUSTC_IDENTITY while the proof classes compile.
time: 2026-11-03T21:05:00Z
