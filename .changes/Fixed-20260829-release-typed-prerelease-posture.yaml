kind: Fixed
body: >-
  Route the release workflow's GitHub prerelease posture through the typed
  release-identity projection (#3752 slice B). Both softprops GitHub release
  steps hard-coded prerelease: false, so an -rc.N tag would have shipped as a
  stable release — the exact incident class the rehearsal corpus records as
  RcReleasePrereleaseFlagMismatch. The preflight now validates identity
  through cargo-allow release-identity, writes its typed projection file,
  and exports github_prerelease as a job output; publish relays it, and both
  GitHub release steps render prerelease from that typed value. Downstream
  jobs (install-smoke, package/verify/attest, manifest, release notes)
  consume the preflight-projected version via RELEASE_VERSION instead of
  re-stripping the tag, leaving only the tag-channel source derivation as a
  local strip. The same lane fixes a latent preflight defect surfaced by its
  characterization suite: the workspace dependency-version comparison now
  strips the exact-pin requirement operator the awk reader captures
  (=X.Y.Z versus X.Y.Z), which has failed the local suite since the
  allow-* dependency pinning. The release-identity consumer denominator,
  the release_prep typed-posture contract test, the preflight
  characterization fixture, and docs/ci.md were updated atomically; no
  receipts changed.
