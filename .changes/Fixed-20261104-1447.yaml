kind: Fixed
body: >-
  Bind release-workflow channel and note behavior to the typed
  release-identity projection (#3788): the projection now carries the exact
  release-record and GitHub-note paths, the preflight job exports them, and
  the GitHub Release note step consumes the projected path and fails closed
  with a typed missing-input error. The workflow-local note-path assembly
  and the /tmp fallback note synthesized by file existence are deleted, and
  the release-identity denominator guard gains the negative proving a newly
  introduced semantic tag parser trips a marker class.
time: 2026-11-04T14:47:00Z
