kind: Added
body: >-
  Gate release publication on the cross-platform SourceCandidateSmoke matrix
  (#2267): release.yml runs the landed #2256 Stage A packaging harness and the
  #2266 installed first-hour journey per selected #3737 platform row (Linux and
  Windows x86_64 on Rust 1.95) against the exact preflight commit/tree, emits
  per-platform receipts, and a fail-closed aggregate refuses missing, skipped,
  cancelled, timed-out, stale, partial-graph, unclaimed, or unexpected rows
  before the publish job may start; publish re-verifies the aggregate binding
  inline. macOS and the Rust 1.85 rollback-guidance lane are declared
  NotIncluded in the gate script rather than inferred from absent YAML.
