kind: Changed
body: >-
  Publication checkpoints now recompile the canonical release-operation head
  from the supplied event history instead of trusting a caller-supplied head
  struct, so a fabricated sequence, event digest, state, or aggregate field
  can never advertise a nonexistent canonical replay point, and a later
  checkpoint records the advanced canonical head instead of being forced to
  reuse a stale predecessor digest. Authorization custody selection now also
  requires the operation's exact freeze, replay, and candidate-custody
  evidence, so authority retained for one frozen operation cannot be attached
  to a sibling operation that merely shares the authorization digest (#3940).
