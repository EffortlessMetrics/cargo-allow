kind: Fixed
body: >-
  Adoption and doctor command summaries retain evaluated invalid-policy and
  partial-inventory outcomes when those outcomes cause a nonzero exit, while
  later output failures still receive typed error summaries. Human receipt-only
  checks now write a requested command-summary sidecar without changing their
  quiet stdout or receipt behavior.
  Invalid check --emit formats now return the standard usage exit code 2.
  Late artifact-write failures return exit code 1 with a typed error summary,
  replace the evaluated receipt with an error receipt, and remove stale reports.
  Check emission retains every comma-separated renderer request and reports
  failed renderers through the same typed error path, preserving the manifest's
  original policy result and any successfully completed artifacts.
  Typed error summaries no longer claim that scanning was incomplete when
  an output failure occurred after evaluation.
