kind: Added
body: >-
  Add reversible quarantine drills for the seven zero-mutation families in the
  release rehearsal. Each family is attempted through the selected invocation
  boundary and again on a direct route against a disposable canary, and the
  receipt derives its prevention flags from those executed results instead of
  literals. This generation measures one family end to end: on Linux a
  supervisor applies the read-only bind mount, drops all capabilities, and only
  then execs the tag worker, so the worker is powerless to remount. The flag is
  true only when the worker's own remount attempt and the direct Git metadata
  write are both denied. On hosts without unshare/mount/setpriv the flag stays
  false with a recorded reason. The token, Cargo publication, registry, GitHub
  Release, live setting and external-repository direct routes remain
  unconfined, so those six flags stay false.
