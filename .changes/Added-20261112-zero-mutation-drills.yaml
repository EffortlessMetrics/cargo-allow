kind: Added
body: >-
  Add reversible quarantine drills for the seven zero-mutation families in the
  release rehearsal. Each family is attempted through the selected invocation
  boundary and again on a direct route against a disposable canary, and the
  receipt derives its prevention flags from those executed results instead of
  literals. No flag is measured as prevented in this generation: on Linux a
  supervisor applies the read-only bind mount, drops all capabilities, and only
  then execs the tag worker, so the worker observes the denial of its own
  remount attempt and of the direct Git metadata write, but the drill
  supervisor's own confinement is not the rehearsal boundary, so
  tag_mutation_prevented is never claimed true. On hosts without
  unshare/mount/setpriv the observation is simply unavailable. The token, Cargo
  publication, registry, GitHub Release, live setting and external-repository
  direct routes remain unconfined, so all seven flags stay false.
