kind: Added
body: >-
  A versioned core-command migration catalogue, an explicit-binary first-family
  evidence collector, and a hidden native retained-evidence reader reconcile
  command details, summaries, check receipts, fixture bytes, and observed
  effects. The complete command denominator and missing runtime bindings stay
  explicit; valid selected observations remain Partial release qualification
  and do not establish installation or publication authority. Readback refuses
  blocking special-file inputs, unrequested receipts, and coherently rehashed
  advisory, action-route, or receipt-posture claims that contradict the selected
  literal fixture and existing native projections (#3149).
