kind: Fixed
body: >-
  Admit a review disposition's own revision note to the review-readiness
  ledger bootstrap. A disposition committed inside the PR it covers moves the
  head it binds, and its revision note pins the disposition's content
  fingerprint, so a rebind necessarily updates both. The bootstrap now admits
  exactly one disposition record plus at most that PR's own
  `<pr>-review-disposition.toml` note; any other revision note, a second
  disposition record, policy, or source edit still stales, and base movement
  still stales. This unblocks #4778 and any other PR that ships a new
  disposition file.
