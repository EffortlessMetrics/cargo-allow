kind: Fixed
body: >-
  Complete the #2491 lock-law slice for umbrella #2487. The pre-replace
  identity recheck that lived inline in apply_single_target is now the
  exported assert_target_identity_for_replace authority on the
  mutation-target module, with byte-identical #2491 diagnostics and new
  unit coverage for symlink substitution and disappeared targets.
  init (both the spec-system profile path and the main policy path) and
  migrate --out now resolve their mutation targets through the canonical
  MutationTarget authority and acquire alias-convergent locks via
  acquire_for_target, matching add/propose/refresh/prune; every product
  mutation command now derives its lock key from canonical target
  identity instead of raw argv spelling, so relative/absolute/dot-dot/
  symlink spellings of one ledger serialize against a single lock file.
  Containment now precedes locking on the init policy path to match the
  add-command ordering.
