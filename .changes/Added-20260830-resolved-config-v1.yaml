kind: Added
body: >-
  Add the reusable ResolvedCargoAllowConfigV1 contract for cargo-allow's
  source-exception configuration selection (#3875). The read-only adapter
  preserves representable contained winners, typed source and precedence, anchored portable
  policy identity and digest, candidate dispositions, explicit legacy fallback,
  federation/profile participation, diagnostics, completeness, and limitations.
  External CLI identities are reported as unsupported without exposing private
  paths. External or dangling discovered link targets are skipped before probing,
  allowing a contained fallback to win. Its canonical JSON component schema
  excludes private checkout paths and marks
  the current multi-pass observation as partial. This slice does not change
  precedence, migrate command consumers, approve policy contents, authorize
  writes, or merge profile and federation semantics; #3876 owns consumer cutover
  and #3877 owns the future precedence decision.
