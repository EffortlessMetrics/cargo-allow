# yaml-language-server: $schema=https://raw.githubusercontent.com/miniscruff/changie/v1.25.2/docs/schema.json
changesDir: .changes
unreleasedDir: .
changelogPath: CHANGELOG.md
versionExt: md
versionFileFormat: '{{.Version}}.md'
fragmentFileFormat: '{{.Kind}}-{{.Time.Format "20060102-150405"}}'
versionFormat: '## [{{.VersionNoPrefix}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
body:
  minLength: 1
kinds:
  - label: Added
  - label: Changed
  - label: Deprecated
  - label: Removed
  - label: Fixed
  - label: Security
  - label: Documentation
newlines:
  beforeKind: 1
  afterKind: 1
  endOfVersion: 1
