# cargo-deny configuration for cargo-allow.
#
# Runs `cargo deny check` in CI to catch advisories, license violations,
# banned crates, and disallowed source registries. This is both a governance
# practice (cargo-allow is a governance tool) and a supply-chain hardening
# measure (#1786).

[graph]
# No targets specified — cargo-deny checks all platforms by default.

[advisories]
# Fail on any advisory with a known fix available.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
# Allow common permissive licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same crate when they can be avoided.
multiple-versions = "warn"
# Wildcard dependency requirements stay warning-only for now: flipping to
# "deny" requires versioned path edges, which the exact-candidate packaging
# contracts (#2372/#2925) do not accept yet (#3908).
wildcards = "warn"
# Exact exceptions to the wildcard denial: these five workspace members
# are consumed as bare path dependencies (no version requirement), which
# cargo-deny classifies as wildcards. The packaging contracts (#2372/#2925)
# require them to stay version-less path edges, so each is skipped by name
# rather than weakening the rule globally. Revisit if the packaging
# contracts accept versioned path edges (#3908).
skip = [
    { crate = "effortless-rust-source-index", reason = "workspace path dep, version-less by packaging contract (#3908, reviewed 2026-08-30)" },
    { crate = "intent-model", reason = "workspace path dep, version-less by packaging contract (#3908, reviewed 2026-08-30)" },
    { crate = "intent-protocol", reason = "workspace path dep, version-less by packaging contract (#3908, reviewed 2026-08-30)" },
    { crate = "intent-engine", reason = "workspace path dep (consumed as intent-compiler), version-less by packaging contract (#3908, reviewed 2026-08-30)" },
    { crate = "effortless-repo-protocol", reason = "workspace path dep, version-less by packaging contract (#3908, reviewed 2026-08-30)" },
]

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
