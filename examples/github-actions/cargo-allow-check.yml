name: cargo-allow check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-allow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-allow
        run: cargo install cargo-allow --version 0.1.11 --locked
      - name: Run cargo-allow check (single evaluation, multi-format)
        run: |
          mkdir -p target/cargo-allow
          cargo-allow check \
            --mode no-new \
            --artifact-dir target/cargo-allow \
            --emit markdown,json,sarif,receipt
      - name: Publish cargo-allow summary
        if: always()
        shell: bash
        run: |
          if [ -f target/cargo-allow/check-markdown.md ]; then
            cat target/cargo-allow/check-markdown.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-reports
          path: target/cargo-allow/
