name: cargo-allow check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-allow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-allow
        run: cargo install cargo-allow --version 0.1.9 --locked
      - name: Run cargo-allow mainline check
        run: |
          mkdir -p target/cargo-allow
          cargo-allow audit \
            --format json \
            --output target/cargo-allow/audit.json
          cargo-allow audit \
            --format html \
            --output target/cargo-allow/audit.html
          cargo-allow check \
            --mode no-new \
            --format markdown \
            --receipt target/cargo-allow/check.receipt.json \
            --output target/cargo-allow/check.md
          cargo-allow check \
            --mode no-new \
            --format sarif \
            --output target/cargo-allow/check.sarif
      - name: Publish cargo-allow summary
        if: always()
        shell: bash
        run: |
          if [ -f target/cargo-allow/check.md ]; then
            cat target/cargo-allow/check.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-reports
          path: target/cargo-allow/
