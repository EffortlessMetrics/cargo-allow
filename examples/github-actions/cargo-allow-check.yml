name: cargo-allow check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-allow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      # #4567: --artifact-dir/--emit are 0.2 artifact emission; no published
      # build carries them yet (0.2.0-rc.1 predates the surface), so this
      # lane fails loudly in the guard below until the 0.2.0 release
      # publishes. Bump this pin together with the guard when it does.
      - name: Install cargo-allow
        run: cargo install cargo-allow --version 0.2.0-rc.1 --locked
      - name: Verify the installed binary has 0.2 artifact emission
        run: |
          cargo-allow check --help | grep -q -- '--artifact-dir' || {
            echo "::error::the pinned cargo-allow build lacks 0.2 artifact emission (--artifact-dir/--emit)."
            echo "::error::No published version includes it yet; see docs/getting-started.md's version table."
            exit 1
          }
      - name: Run cargo-allow check (single evaluation, multi-format)
        run: |
          mkdir -p target/cargo-allow
          cargo-allow check \
            --mode no-new \
            --artifact-dir target/cargo-allow \
            --emit markdown,json,sarif,receipt
      - name: Publish cargo-allow summary
        if: always()
        shell: bash
        run: |
          if [ -f target/cargo-allow/check-markdown.md ]; then
            cat target/cargo-allow/check-markdown.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-reports
          path: target/cargo-allow/
