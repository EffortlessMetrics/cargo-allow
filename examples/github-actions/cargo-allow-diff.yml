name: cargo-allow diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-allow-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-allow
        run: cargo install cargo-allow --version 0.1.11 --locked
      - name: Run cargo-allow PR posture diff
        shell: bash
        run: |
          base_ref="origin/${GITHUB_BASE_REF:-main}"
          mkdir -p target/cargo-allow
          set +e
          cargo-allow diff \
            --base "$base_ref" \
            --format markdown \
            --receipt target/cargo-allow/diff.receipt.json \
            --output target/cargo-allow/pr-summary.md
          markdown_status=$?
          cargo-allow diff \
            --base "$base_ref" \
            --format json \
            --output target/cargo-allow/diff.json
          json_status=$?
          cargo-allow diff \
            --base "$base_ref" \
            --format sarif \
            --output target/cargo-allow/diff.sarif
          sarif_status=$?
          set -e
          final_status=$markdown_status
          if (( final_status == 0 && json_status != 0 )); then final_status=$json_status; fi
          if (( final_status == 0 && sarif_status != 0 )); then final_status=$sarif_status; fi
          if (( final_status != 0 )); then
            echo "cargo-allow diff remained non-clean; uploading partial evidence" >&2
            exit "$final_status"
          fi
      - name: Publish cargo-allow summary
        if: always()
        shell: bash
        run: |
          if [ -f target/cargo-allow/pr-summary.md ]; then
            cat target/cargo-allow/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-pr-summary
          path: target/cargo-allow/
