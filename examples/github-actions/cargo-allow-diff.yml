name: cargo-allow diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-allow-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-allow
        run: cargo install cargo-allow --version 0.1.11 --locked
      - name: Run cargo-allow PR posture diff (single evaluation, multi-format)
        shell: bash
        run: |
          base_ref="origin/${GITHUB_BASE_REF:-main}"
          mkdir -p target/cargo-allow
          cargo-allow diff \
            --base "$base_ref" \
            --artifact-dir target/cargo-allow \
            --emit markdown,json,sarif,receipt
      - name: Publish cargo-allow summary
        if: always()
        shell: bash
        run: |
          if [ -f target/cargo-allow/diff-markdown.md ]; then
            cat target/cargo-allow/diff-markdown.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-pr-summary
          path: target/cargo-allow/
