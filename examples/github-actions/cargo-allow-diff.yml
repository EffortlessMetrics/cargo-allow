name: cargo-allow diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-allow-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # #4567: --artifact-dir/--emit are 0.2 artifact emission; no published
      # build carries them yet (0.2.0-rc.1 predates the surface), so this
      # example installs a pinned source-candidate commit that has the
      # surface. When the 0.2.0 release publishes, switch this step to the
      # published 0.2.0 crates.io pin.
      - name: Install cargo-allow (source candidate; no published build has 0.2 artifact emission yet)
        run: |
          cargo install cargo-allow \
            --git https://github.com/EffortlessMetrics/cargo-allow \
            --rev 65d76b1494656904c8ce30cf518f2e5bf85a6911 \
            --locked
      - name: Verify the installed binary has 0.2 artifact emission
        run: |
          cargo-allow diff --help | grep -q -- '--artifact-dir' || {
            echo "::error::the pinned cargo-allow build lacks 0.2 artifact emission (--artifact-dir/--emit)."
            echo "::error::No published version includes it yet; see docs/getting-started.md's version table."
            exit 1
          }
      - name: Run cargo-allow PR posture diff (single evaluation, multi-format)
        shell: bash
        run: |
          base_ref="origin/${GITHUB_BASE_REF:-main}"
          mkdir -p target/cargo-allow
          cargo-allow diff \
            --base "$base_ref" \
            --artifact-dir target/cargo-allow \
            --emit markdown,json,sarif,receipt
          cp target/cargo-allow/diff-markdown.md target/cargo-allow/pr-summary.md
      - name: Publish cargo-allow summary
        if: always()
        shell: bash
        run: |
          if [ -f target/cargo-allow/diff-markdown.md ]; then
            cat target/cargo-allow/diff-markdown.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cargo-allow-pr-summary
          path: target/cargo-allow/
