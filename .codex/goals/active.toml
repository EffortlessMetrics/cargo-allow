claim_boundary = """
This manifest is agent execution state. It does not implement migration lanes,
prove side-by-side parity, execute proof commands, or replace the proposal,
spec, support-tier map, implementation plan, policy ledgers, or closeouts.
"""

[[work_item]]
id = "migration-parity-pr-001"
status = "ready"
title = "Register migration parity goal and sequence first parity lanes"
linked_proposal = "CARGO-ALLOW-PROP-0002"
linked_spec = "CARGO-ALLOW-SPEC-0002"
linked_plan = "plans/migration-parity/implementation-plan.md"
proof_commands = [
  "rtk cargo run -p cargo-allow -- doctor --profile spec-system --format json",
  "rtk cargo run -p cargo-allow -- check --profile spec-system --mode audit --format json --output target/cargo-allow/spec-system.json",
  "rtk cargo run -p cargo-allow -- worklist --profile spec-system --format json --output target/cargo-allow/spec-system-worklist.json",
  "rtk cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md",
]
evidence_notes = [
  "Archive the completed spec-system goal manifest and register the 0.2.0 migration parity execution lane.",
  "Keep default cargo-allow behavior unchanged; migration work uses compat lanes and documentation only until parity proof exists.",
  "Do not bump workspace version or publish release records without explicit cut authorization.",
]
