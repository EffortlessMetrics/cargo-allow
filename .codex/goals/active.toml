schema_version = "1.0"

id = "CARGO-ALLOW-GOAL-0001"
title = "Spec-system profile"
status = "active"
owner = "codex"
created = "2026-06-12"

objective = """
Build an opt-in spec-system profile into cargo-allow so repositories can govern
their proposal, spec, ADR, implementation-plan, active-goal, support-tier,
policy-ledger, and closeout graph without changing default source-exception
behavior.
"""

linked_proposal = "CARGO-ALLOW-PROP-0001"
linked_spec = "CARGO-ALLOW-SPEC-0001"
linked_support_tier = "CARGO-ALLOW-SUPPORT-0001"
linked_plan = "plans/spec-system/implementation-plan.md"
linked_plan_status = "active"

claim_boundary = """
This manifest is agent execution state. It does not implement spec-system
linting, prove claims, execute proof commands, or replace the proposal, spec,
support-tier map, implementation plan, policy ledgers, or closeouts.
"""

[[work_item]]
id = "spec-system-pr-024"
status = "ready"
title = "Implement blocking behavior for safe structural lints"
linked_proposal = "CARGO-ALLOW-PROP-0001"
linked_spec = "CARGO-ALLOW-SPEC-0001"
linked_plan = "plans/spec-system/implementation-plan.md"
proof_commands = [
  "rtk cargo test -p allow-policy spec_system",
  "rtk cargo test -p cargo-allow spec_system_profile",
  "rtk cargo test -p cargo-allow spec_system_worklist",
  "rtk cargo test -p cargo-allow spec_system_doctor",
  "rtk cargo run -p cargo-allow -- doctor --profile spec-system --format json",
  "rtk cargo run -p cargo-allow -- check --profile spec-system --mode audit --format json --output target/cargo-allow/spec-system.json",
  "rtk cargo run -p cargo-allow -- worklist --profile spec-system --format json --output target/cargo-allow/spec-system-worklist.json",
  "rtk git diff --cached --check",
  "rtk cargo fmt --all --check",
  "rtk cargo clippy --workspace --all-targets -- -D warnings",
  "rtk cargo test --workspace",
  "rtk cargo run -p cargo-allow -- check --mode no-new --format markdown --receipt target/cargo-allow/check.receipt.json --output target/cargo-allow/check.md",
]
evidence_notes = [
  "Keep policy/spec-system.toml in shadow while implementing blocking behavior.",
  "Limit the first blocking behavior to safe structural failures: duplicate IDs, missing artifact files, invalid statuses or kinds, and unknown links.",
  "Do not make nuanced checks such as stale active goals, missing closeouts, support-tier completeness, or README claim coverage command-blocking yet.",
]
