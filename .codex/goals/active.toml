objective = """
Strengthen cargo-allow migration and evidence parity so repositories can replace
bespoke AST/TOML allowlist xtasks with side-by-side proof, durable receipts, and
documented deltas on the path to the 0.2.0 milestone claim.
"""

linked_proposal = "CARGO-ALLOW-PROP-0002"
linked_spec = "CARGO-ALLOW-SPEC-0002"
linked_support_tier = "CARGO-ALLOW-SUPPORT-0001"
linked_plan = "plans/migration-parity/implementation-plan.md"
