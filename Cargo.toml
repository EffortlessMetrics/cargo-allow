[workspace]
resolver = "3"
members = [
  "crates/cargo-allow",
  "crates/allow-core",
  "crates/allow-policy",
  "crates/allow-inventory",
  "crates/allow-files",
  "crates/allow-rust",
  "crates/allow-match",
  "crates/allow-report",
  "crates/allow-diff",
  "crates/allow-policy-legacy",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.6"
rust-version = "1.85"
repository = "https://github.com/EffortlessMetrics/cargo-allow"
homepage = "https://github.com/EffortlessMetrics/cargo-allow"
readme = "README.md"
keywords = ["rust", "policy", "audit", "governance", "scanner"]
categories = ["development-tools"]

[workspace.dependencies]
allow-core = { path = "crates/allow-core", version = "0.1.6" }
allow-policy = { path = "crates/allow-policy", version = "0.1.6" }
allow-policy-legacy = { path = "crates/allow-policy-legacy", version = "0.1.6" }
allow-inventory = { path = "crates/allow-inventory", version = "0.1.6" }
allow-files = { path = "crates/allow-files", version = "0.1.6" }
allow-rust = { path = "crates/allow-rust", version = "0.1.6" }
allow-match = { path = "crates/allow-match", version = "0.1.6" }
allow-report = { path = "crates/allow-report", version = "0.1.6" }
allow-diff = { path = "crates/allow-diff", version = "0.1.6" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
clap = { version = "4.6.1", features = ["derive"] }
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.2"
