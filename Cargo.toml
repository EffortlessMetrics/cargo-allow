[workspace]
resolver = "3"
members = [
  "crates/cargo-allow",
  "crates/allow-core",
  "crates/allow-policy",
  "crates/allow-inventory",
  "crates/allow-files",
  "crates/allow-rust",
  "crates/allow-match",
  "crates/allow-report",
  "crates/allow-diff",
  "crates/allow-policy-legacy",
  "crates/repo-protocol",
  "crates/repo-snapshot",
  "crates/repo-edit",
  "crates/rust-source-index",
  "crates/intent-model",
  "crates/intent-protocol",
  "crates/intent-engine",
  "crates/intent-edit",
  "crates/cargo-intent",
  "crates/proof-protocol",
  "crates/proof-provider-api",
  "crates/proof-adapter-command",
  "crates/proof-adapter-cargo-allow",
  "crates/proof-adapter-ripr",
  "crates/proof-adapter-hawk",
  "crates/proof-engine",
  "crates/cargo-proof",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.2.0"
rust-version = "1.95"
repository = "https://github.com/EffortlessMetrics/cargo-allow"
homepage = "https://github.com/EffortlessMetrics/cargo-allow"
readme = "README.md"
keywords = ["rust", "policy", "audit", "governance", "scanner"]
categories = ["development-tools"]

[workspace.dependencies]
allow-core = { path = "crates/allow-core", version = "0.2.0" }
allow-policy = { path = "crates/allow-policy", version = "0.2.0" }
allow-policy-legacy = { path = "crates/allow-policy-legacy", version = "0.2.0" }
allow-inventory = { path = "crates/allow-inventory", version = "0.2.0" }
allow-files = { path = "crates/allow-files", version = "0.2.0" }
allow-rust = { path = "crates/allow-rust", version = "0.2.0" }
allow-match = { path = "crates/allow-match", version = "0.2.0" }
allow-report = { path = "crates/allow-report", version = "0.2.0" }
allow-diff = { path = "crates/allow-diff", version = "0.2.0" }
repo-protocol = { path = "crates/repo-protocol", version = "0.2.0" }
repo-snapshot = { path = "crates/repo-snapshot", version = "0.2.0" }
repo-edit = { path = "crates/repo-edit", version = "0.2.0" }
rust-source-index = { path = "crates/rust-source-index", version = "0.2.0" }
intent-model = { path = "crates/intent-model", version = "0.2.0" }
intent-protocol = { path = "crates/intent-protocol", version = "0.2.0" }
intent-engine = { path = "crates/intent-engine", version = "0.2.0" }
intent-edit = { path = "crates/intent-edit", version = "0.2.0" }
cargo-intent = { path = "crates/cargo-intent", version = "0.2.0" }
proof-protocol = { path = "crates/proof-protocol", version = "0.2.0" }
proof-provider-api = { path = "crates/proof-provider-api", version = "0.2.0" }
proof-adapter-command = { path = "crates/proof-adapter-command", version = "0.2.0" }
proof-adapter-cargo-allow = { path = "crates/proof-adapter-cargo-allow", version = "0.2.0" }
proof-adapter-ripr = { path = "crates/proof-adapter-ripr", version = "0.2.0" }
proof-adapter-hawk = { path = "crates/proof-adapter-hawk", version = "0.2.0" }
proof-engine = { path = "crates/proof-engine", version = "0.2.0" }
cargo-proof = { path = "crates/cargo-proof", version = "0.2.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
toml = "1.1.2"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.8"
rayon = "1.12.0"
terminal_size = "0.4.4"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Speed up dev/test builds: opt-level=1 makes tree-sitter C compilation
# and the large binary crate faster to compile and run, while
# line-tables-only reduces debuginfo size for faster linking (#2839).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.test]
opt-level = 1
debug = "line-tables-only"
