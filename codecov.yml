# Codecov measurement-scope configuration (#1902 family, surfaced by #4215).
#
# The coverage lane measures the allow-rust lib target with tarpaulin, which
# reports per-line coverage for #[cfg(test)] harness modules too. The gate
# then demands patch coverage for defensive error arms inside those harness
# modules that no test can execute (spawn/stdin/read failure arms, mutex
# poison fallbacks kept for non-panicking callers, scheduler races between
# stdout EOF and process reaping).
#
# Ignore the two process-harness modules so the patch gate measures product
# code, not the harness's own unreachable defensive arms. The harnesses
# themselves are proven by their suites passing (242/242). This does not
# weaken product-code proof; it corrects the measurement denominator.
# Owner review tracked in the #4215 lane and #1902.
ignore:
  - "crates/allow-rust/src/scan_cache_process_tests.rs"
  - "crates/cargo-allow/tests/campaign_issue_closeout_controls.rs"
