schema_version = "1.0"
profile = "spec-system"
mode = "blocking"

[roots]
proposals = "docs/proposals"
specs = "docs/specs"
adrs = "docs/adr"
plans = "plans"
goals = ".allow/goals"
support_tiers = "docs/status/SUPPORT_TIERS.md"
artifact_ledger = ".allow/artifacts/doc-artifacts.toml"

[requirements]
ledger_required = true
templates_required = true
support_tiers_required = true
active_goal_required = true
closeout_required_for_done_items = true

[import_roots]
owned = ".allow/imports"

[[import_roots.entries]]
id = "owned-imports"
path = ".allow/imports"
ecosystem = "cargo-allow"
role = "owned"

[[import_roots.entries]]
id = "kiro"
path = ".kiro"
ecosystem = "kiro"
role = "imported"

[[import_roots.entries]]
id = "specify"
path = ".specify"
ecosystem = "spec-kit"
role = "imported"

[[import_roots.entries]]
id = "generic-spec"
path = ".spec"
ecosystem = "generic-spec"
role = "imported"

[[import_roots.entries]]
id = "generic-rails"
path = ".rails"
ecosystem = "generic-spec"
role = "imported"

[[import_roots.entries]]
id = "legacy-goals"
path = ".codex/goals"
ecosystem = "codex"
role = "legacy"

[[import_roots.entries]]
id = "xtask"
path = "xtask"
ecosystem = "xtask"
role = "imported"
