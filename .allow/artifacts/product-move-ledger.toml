# Canonical machine-readable denominator for the cargo-allow / cargo-intent /
# cargo-proof monorepo extraction. Owned by issue #2598; target topology is #2612.

schema_id = "cargo-allow.three-product-move-ledger.v1"
schema_version = 1
owner_issue = 2598
topology_issue = 2612
architecture_issue = 2580
package_issue = 2604
parity_issue = 2606
shim_issue = 2607
projection = "docs/architecture/product-move-map.md"
plan = "plans/three-product-crate-extraction.md"
claim_boundary = "Inventory and reviewed ownership dispositions for current repository sources; this ledger does not move code, prove parity, or authorize repository extraction."

[discovery]
  recursive_roots = ["crates/allow-policy/src/spec_system", ".allow/spec-system"]
  token_scan_roots = ["crates/cargo-allow/src", "docs/schemas"]
  selected_files = [
    "crates/allow-report/src/contracts.rs",
    "crates/allow-diff/src/revision.rs",
    "crates/allow-diff/src/revision_git.rs",
    "crates/allow-diff/src/revision_identity.rs",
    "crates/allow-diff/src/staged_index.rs",
    "crates/allow-rust/src/test_subjects.rs",
    ".allow/profiles/spec-system.toml",
