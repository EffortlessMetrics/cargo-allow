# Revision note for the #3831 candidate-preparation plan slice.

# This diff adds the typed candidate-preparation model (allow-report), the
# hidden read-only `prep-candidate plan` command, its 12 negative controls
# plus acceptance tests, the candidate-preparation-plan-v1 schema, and the
# changie fragment. The source-exception additions receipt only the
# syntax-visible panicking constructs the new files introduce:
# allow-0712/allow-0713 are glob-ratcheted expect baselines for the model's
# fixture/invariant-guarded expects and the test module's negative-control
# expects; allow-0714..allow-0719 receipt the per-occurrence panic constructs
# in the model, the tests, and the command's bounded manifest parsers;
# allow-0720 receipts the schema contract document. No existing exception is
# weakened, no expiry is extended, and no scope is broadened: every record
# below is an addition. policy/allow.toml keeps its CRLF line-ending
# contract; the net transition is append-only.

