# Revision note for #2496: typed crates.io release receipt contracts.

# This diff adds four source-exception entries, all in service of typing the
# three crates.io release receipt families issue #2496 found untyped on main.
# allow-1214 through allow-1216 receipt the three new JSON schemas under
# docs/schemas/ for CratesIoTrustedPublishingReceiptV1 (#2282),
# CratesIoRegistryInstallJourneyReceiptV1, and
# CratesIoFirstPublicationBootstrapReceiptV1 (#3145): retained evidence
# contracts registered through the schema-index classification, the README
# catalog, and the cargo-allow house title law, each backed by a fail-closed
# allow-report validator and rejection-path tests. allow-1217 is the
# self-receipt for this revision note, following the ledger_change_note
# precedent. The receipts were generated by cargo-allow add --update; their
# fingerprints below are the gate-printed values. No existing exception is
# weakened, no expiry is extended, and no scope is broadened: every record
# below is an addition that makes release-evidence ingestion more typed, not
# less. policy/allow.toml keeps its mixed line-ending contract; the net
# transition is append-only (66 inserted lines, 0 deletions at the time of
# this note). No release-authorization surface is created or modified.

