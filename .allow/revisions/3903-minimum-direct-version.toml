# Revision note for the #3903 PR A direct minimum version contract.

# This diff adds the typed direct minimum version contract:
# DirectMinimumVersionSetV1 / ProductDependencySetV1 /
# DirectRequirementRowV1 / MinimumVersionProofRequestV1 /
# MinimumVersionProofReceiptV1 / MinimumVersionRowResultV1 in
# allow-report, with evaluate_minimum_version_proof encoding the
# negative controls (the current lock is never floor proof; compatible
# newer versions cannot substitute for the declared floor; a newer
# toolchain fails loudly; identity movement stales the receipt; zero
# selected rows is an instrument failure; unavailable and
# compile-incompatible dispositions stay distinct; one product's proof
# never satisfies another's request). The fixture corpus covers a
# valid floor, a too-low floor, an unavailable version, a target-only
# edge, and an incompatible transitive combination; the live
# workspace inventory is report-only and changes no dependency
# requirement. The source-exception additions receipt only the
# syntax-visible constructs the new law and fixture tests introduce:
# allow-11241 and allow-11242 are glob-ratcheted expect baselines, and
# the allow-11243 record receipts this revision-note file itself per
# the per-note receipt law. No existing exception is weakened, no
# expiry is extended, and no scope is broadened: the records below are
# additions. policy/allow.toml keeps its CRLF line-ending contract;
# the net transition is append-only.

