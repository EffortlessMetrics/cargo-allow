# Revision note for the #4173 performance source provenance lane.

# The CI performance collector now derives each historical run's
# source pair from immutable evidence of the executed run: a
# pull_request run's synthetic merge commit parents are the executed
# base and head, push and other events use the head's first parent,
# and contradictory or parentless shapes fail as unavailable instead
# of silently substituting current PR metadata. The fixture harness
# scripts/test-collect-ci-performance.sh proves a moved association
# still yields the executed pair, repeated collection is stable, and
# malformed provider output writes no receipt. The source-exception
# additions receipt only the new harness surface: allow-9261 receipts
# the harness script and allow-9262 receipts this revision-note file
# itself per the per-note receipt law. No existing exception is
# weakened, no expiry is extended, and no scope is broadened.
# policy/allow.toml keeps its CRLF line-ending contract; the net
# transition is append-only.

