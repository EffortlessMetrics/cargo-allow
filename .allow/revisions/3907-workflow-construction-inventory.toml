# Revision note for the #3907 PR A workflow construction inventory.

# This diff lands the workflow construction denominator: a typed
# WorkflowConstructionInventoryV1 in allow-report walks every current
# workflow, local composite action (repository-level and nested), and
# checked example, classifies the documented dogfood construction
# fixtures as intentionally-invalid surfaces, records the local
# `uses: ./.` reference edges that bind nested actions to their
# callers, and names the YAML-adjacent configuration surfaces that
# were considered and excluded. The report-only inventory also selects
# the pinned syntax analyzer (actionlint 1.7.7 with its release-asset
# digest, matching the pregate workflow's pin) and records the
# security construction analyzer as a candidate pending fixture
# qualification, with the fixture corpus — eleven finding families,
# each carrying positive and negative fragments for interpolation,
# permissions, privileged triggers, credential persistence, secret
# exposure, checkout/ref selection, nested actions, shell
# construction, expression validity, action references, and
# unsupported-expression honesty — embedded as typed vocabulary
# evidence. The source-exception additions receipt only the
# syntax-visible constructs the new surfaces introduce: allow-11260 is
# the expect ratchet for the live inventory tests, allow-11261 the
# fixture law tests' expect ratchet, and no existing exception is
# weakened, no expiry is extended, and no scope is broadened: the
# records below are additions. policy/allow.toml keeps its CRLF
# line-ending contract; the net transition is append-only.

