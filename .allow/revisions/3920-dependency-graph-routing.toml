# Revision note for the #3920 PR D dependency graph routing lane.

# This diff lands the review surface for the dependency graph delta:
# a hidden dependency-graph-delta compile CLI that binds the exact
# input digests and compiles one base/head pair, and the
# check-dependency-graph-delta lane that synthesizes per-side merged
# member manifests (workspace-inherited requirements resolved from
# each side's own workspace table), runs the compiler and the
# evidence enrichment, and retains both artifacts. The lane exits
# early when no manifest, lockfile, or dependency-policy input
# changed, fails immediately on malformed or empty required inputs,
# and stays advisory for ordinary movement until the owning policy
# selects blocking consequences. The compiler gained a
# workspace-aware entry point so inherited requirement movement is
# visible without changing the existing signature's behavior. The
# source-exception changes receipt only the syntax-visible constructs
# the new surfaces introduce: allow-11278's expect ratchet rises by
# the one merged-manifest law test expect, allow-11289 receipts the
# lane script, allow-11290 is the compile CLI test expect ratchet,
# and allow-11291 receipts this revision-note file itself per the
# per-note receipt law. No existing exception is weakened, no expiry
# is extended, and no scope is broadened beyond the recorded ratchet
# rise. policy/allow.toml keeps its CRLF line-ending contract; the
# net transition is append-only.

