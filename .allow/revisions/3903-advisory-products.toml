# Revision note for the #3903 PR C advisory product rows.

# This diff adds the advisory product-scoped direct-floor proofs: the
# shared, cargo-intent, and cargo-proof products each proved check-only
# at the claimed 1.95 MSRV, report-only per their experimental and
# independent support postures. Review repairs made the proof genuinely
# product-scoped: scripts/proof-direct-floors.sh now derives each
# product's package closure and that closure's own declared external
# direct dependency floors from the checked-in manifests (normal and
# build dependencies; dev-dependencies and optional dependencies stay
# outside the certified set), runs the bounded proof classes against
# the product's own packages, hashes the detached worktree's own
# inputs, records the package roots in the receipt contract
# (receipt.package_roots with an evaluator package_roots_mismatch law),
# and emits commands and claim boundaries that cover only what actually
# ran for the named product. The isolation tests now compare each
# retained receipt's rows and roots against the authoritative
# manifest-derived inventory, reject a foreign product receipt, and pin
# the advisory collector's per-product identity. The
# source-exception additions receipt only the syntax-visible constructs
# the new surfaces introduce: allow-11247 is the glob-ratcheted expect
# baseline for the product isolation and derivation-mirror tests
# (loosened 4 -> 21 when the tests grew the manifest-derived mirror),
# allow-11248 is the panic_macro ratchet for the derivation-mirror
# diagnostics (loosened 1 -> 6; its selector names macro_name now that
# the sites are macro_call findings), allow-11249/11250/11251 receipt
# the three retained advisory receipt files, allow-11252 receipts the
# advisory collector script, and the allow-11253 record receipts this
# revision-note file itself per the per-note receipt law. No existing
# exception is weakened beyond these reviewed ratchets, no expiry is
# extended, and no scope is broadened: the records below are additions.
# policy/allow.toml keeps its CRLF line-ending contract; the net
# transition is append-only.

