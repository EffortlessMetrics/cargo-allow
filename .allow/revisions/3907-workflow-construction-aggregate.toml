# Revision note for the #3907 PR D workflow construction aggregate.

# This diff lands the stable semantic aggregate: a typed
# WorkflowConstructionAggregateV1 in allow-report combines the pinned
# syntax lane report and the qualified security lane report over the
# same denominator digest into one report whose result is clean only
# when both lanes are clean; an instrument failure in either lane
# dominates findings, findings stay visible with their dispositions
# (open and exception-accepted are counted separately), and
# denominator drift between the lanes fails closed. The hidden
# workflow-construction aggregate CLI emits the report; the aggregate
# runner script drives both lane scripts in fetch-only mode and
# retains the aggregate artifact even under instrument failure; the
# advisory workflow-construction CI job uploads the artifact with
# if-always retention so the evidence is never masked by the exit.
# Enforcement selection is the #2283/#2284 authority and remains
# unwired here. The source-exception additions receipt only the
# syntax-visible constructs the new surfaces introduce: allow-11272 is
# the expect ratchet for the aggregate tests, allow-11273 the
# aggregate command tests' expect ratchet, allow-11274 receipts the
# aggregate runner script, and allow-11275 receipts this revision-note
# file itself per the per-note receipt law. No existing exception is
# weakened, no expiry is extended, and no scope is broadened: the
# records below are additions. policy/allow.toml keeps its CRLF
# line-ending contract; the net transition is append-only.

