# Revision note for the #4181 freeze-subject hidden-index hardening.

# The release-freeze subject collector now rejects hidden worktree
# inputs before pairing committed identity with working bytes:
# assume-unchanged and skip-worktree index states fail admission
# conservatively, each admitted input (workspace manifest, Cargo.lock,
# topology) is byte-verified against its HEAD blob modulo line
# endings, and the subject is re-checked for movement before the
# receipt is returned. The expect ratchet for the composition module
# rises by the new acceptance tests' invariant-guarded expects. No
# existing exception is weakened beyond the recorded ratchet rise, no
# receipt law, allow-9260 receipts this revision-note file itself.
# Review also bounded the receipt digests to the byte-verified
# inputs (no unguarded second read), narrowed normalization to
# CRLF, and added the CRLF-framing acceptance test. No expiry is
# extended, and no scope is broadened. policy/allow.toml
# keeps its CRLF line-ending contract; the net transition is the
# recorded ratchet rise only.

