# Revision note for the #4175 rehearsal subject-binding lane.

# The release-freeze rehearsal evidence role now binds the producer's
# documented subject fields: commit_sha, subject_lockfile_digest, and
# subject_topology_digest are required and compared against the exact
# selected freeze subject (digest payloads modulo the typed prefix
# spelling), so a same-version rehearsal receipt from another source
# subject fails admission instead of reading as current. A rejected
# rehearsal stays a Mismatch node in the evidence graph even though
# node_for stamps the current subject on every node. The expect
# ratchet for the composition module rises by the new acceptance
# controls' invariant-guarded expects. No existing exception is
# weakened beyond the recorded ratchet rise, no expiry is extended,
# and no scope is broadened. policy/allow.toml keeps its CRLF
# line-ending contract.

