# expect baselines for retained-file reads and known-good fixture
# serialization, and the allow-11228 record receipts this
# revision-note file itself per the per-note receipt law. No existing
# exception is weakened, no expiry is extended, and no scope is
# broadened: the records below are additions. policy/allow.toml keeps
# its CRLF line-ending contract; the net transition is append-only.

