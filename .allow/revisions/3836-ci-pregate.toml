# This diff adds the typed Stage 1 pre-gate: CiPreGateResultV1 /
# CiPreGateStateV1 in allow-report, the hidden read-only
# 'cargo-allow ci-pregate evaluate' command, and the pregate job in
# .github/workflows/ci.yml (actionlint with a pinned checksum, cargo
# fmt, the no-new source-exception guard, typed result emission and
# evaluation, always-diagnostic upload) with explicit `needs:` edges
# from every measured-heavy proof job. Result law: only Complete — or
# an explicitly reasoned NotApplicable — permits the heavy jobs;
# stale heads, empty selections, unexplained waivers, skipped,
# cancelled, timed-out, and instrument-failed checks are never green;
# diagnostics never strengthen the aggregate. Routing law: the gate
# changes workflow reachability only — #2569 stays the routing
# authority, release-sensitive routing stays #3794, Clippy stays in
# Stage 2, and no secrets are read. The source-exception additions
# receipt only the syntax-visible constructs the new test fixtures
