# Revision note for the #3843 review-disposition contract.

# This diff adds the typed exact-head review disposition and readiness
# transition authority in allow-report: ReviewDispositionV1 /
# ReviewFindingV1 / ReviewCurrentnessV1 / ReviewReadinessTransitionV1
# implementing the currentness law (head, base, merge-base, full-diff,
# protocol, scope, and repository/PR identity movement stale a prior
# review deterministically; reviewer identity and equal prose cannot
# preserve currentness), the finding law (blocking findings require a
# stable id, owned seam, exact source basis, and repair route;
# same-maintainer review is process evidence, never independent-human
# approval; sought-but-unavailable independent review is NotProven and
# downgrades a claimed clean verdict), and the readiness law
# (ReviewClean and current may permit Draft -> Ready only after
# separately declared terminal-Passed conditions; ReviewBlocked permits
# Ready -> Draft; Stale/Partial/Unsupported/InstrumentFailure never
# restore Ready) with the twelve hostile negative controls as unit
# tests. The hidden read-only 'cargo-allow review-disposition check'
# command evaluates a disposition against a live source snapshot and a
# transition request; instrument failures and non-permitted readiness
# moves fail closed. The source-exception additions receipt only the
# syntax-visible constructs the new test fixtures introduce:
# allow-11207/allow-11208 are glob-ratcheted expect baselines for
# fixture serialization in the CLI and contract test modules, and
# allow-11209 receipts this revision-note file itself per the per-note
# receipt law. No existing exception is weakened, no expiry is
# extended, and no scope is broadened: the records below are
# additions. policy/allow.toml keeps its CRLF line-ending contract;
# the net transition is append-only.

