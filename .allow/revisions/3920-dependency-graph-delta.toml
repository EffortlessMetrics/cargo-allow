# Revision note for the #3920 PR A dependency graph delta contract.

# This diff lands the typed dependency graph delta contract: a
# DependencyGraphDeltaReceiptV1 in allow-report with 18 delta kinds
# covering direct requirement movement, lock-only resolution changes,
# package addition/removal, source/checksum changes, feature
# activation, duplicate version movement, target/dependency class
# changes, manifest/lock mismatch, and unsupported/instrument failure.
# The receipt preserves native Cargo identity (package name, version,
# source, checksum) and the delta kind. A falsifying fixture corpus
# covers lock-only movement, manifest downgrade, source/checksum
# change, range narrowing, feature activation, and transitive
# replacement. The source-exception additions receipt only the
# syntax-visible constructs the new surfaces introduce: allow-11276 is
# the expect ratchet for the delta contract tests, allow-11278 is the
# compiler-test expect ratchet (raised to the shipped occurrence count
# while this PR was in review), allow-11279 receipts the contract-test
# indexing, and allow-11280 receipts the parser coverage-test indexing.
# allow-11277 receipts this revision-note file itself per the per-note
# receipt law. No existing exception is weakened, no expiry is
# extended, and no scope is broadened: the records below are additions.
# policy/allow.toml keeps its CRLF line-ending contract; the net
# transition is append-only.

