# Revision note for the #3907 PR C workflow security lane.

# This diff lands the qualified security construction lane: a typed
# WorkflowSecurityLaneReportV1 in allow-report grades the qualified
# zizmor release's machine-readable findings over the construction
# denominator — every current workflow and local composite action —
# preserving the native rule identity alongside the
# construction-family mapping (template-injection, dangerous-triggers,
# artipacked, unpinned-uses, excessive-permissions, self-repository,
# and superfluous-actions map to declared families; unknown idents
# land in unsupported_or_instrument_failure). Exact reviewed
# exceptions at (path, rule) granularity reduce the advisory signal
# without broadening anything: the release workflows' deliberate
# tag-payload and authorization-input interpolations are
# exception-accepted by core/release, every other finding stays open,
# and the result remains findings so the signal stays visible until
# the aggregate lane selects enforcement. The inventory's zizmor tool
# selection is promoted from candidate-pending-qualification to
# selected at version 1.30.0 with the offline-audits pin, completing
# the fixture qualification this lane's laws consume. The
# source-exception additions receipt only the syntax-visible
# constructs the new surfaces introduce: allow-11267 is the expect
# ratchet for the workflow security command tests, allow-11268 the
# lane law tests' expect ratchet, allow-11269 receipts the security
# lane runner script, allow-11270 receipts the exact exceptions file,
# and allow-11271 receipts this revision-note file itself per the
# per-note receipt law. No existing exception is weakened, no expiry
# is extended, and no scope is broadened: the records below are
# additions. policy/allow.toml keeps its CRLF line-ending contract;
# the net transition is append-only.

