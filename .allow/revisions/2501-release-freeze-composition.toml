# Revision note for the #2501 final freeze composition driver.

# This diff adds the hidden read-only `cargo-allow release-freeze compose`
# command: the fail-closed composition of CargoAllowFinalFreezeReceiptV1 from
# bounded retained producer receipts (candidate-preparation no-op parity or
# final receipt, exact-candidate package set, package-docs audit, the
# eight-phase zero-upload rehearsal aggregate, install journey, upgrade /
# rollback journey, live release-control observation), the typed final
# support selection verified through its single digest implementation, and
# the read-only replay of the composed retained set. It also adds
# scripts/observe-live-release-controls.sh (read-only ruleset observation)
# and repairs two Windows-portability defects the dogfood surfaced in the
# release producers: CRLF output from the child JSON helpers corrupted
# git-head and token comparisons (exact-candidate-package-set.sh,
# source-candidate-smoke.sh), and the upgrade/rollback journey assumed a
# non-.exe candidate binary. The source-exception additions receipt only the
# syntax-visible constructs the new files introduce: allow-0862 is a
# glob-ratcheted expect baseline (occurrence_limit=19) for the composition
# module, its fixture helpers, and the full-path fixture repository test
# (re-minted from the in-diff allow-0859 after the fixture test landed),
# and allow-0860 receipts the new
# observation script. No existing exception is weakened, no expiry is
# extended, and no scope is broadened: the records below are additions.
# policy/allow.toml keeps its CRLF line-ending contract; the net transition
# is append-only.

