schema_version = 1
# Revision note for the #3844 review-readiness check.

# This diff adds the stable review-readiness check projection in
# allow-report: ReviewReadinessProjectionV1 consumes only structured
# inputs (a retained ReviewDispositionV1 or its explicit absence, a
# live source snapshot, the PR Draft/Ready posture, and the triggering
# event class) and projects them onto the one stable `review-readiness`
# check context. Conclusion law: a current clean disposition succeeds;
# blocked, stale, partial, unsupported, and malformed states fail (a
# Ready PR must become/remain Draft); a missing disposition stays
# neutral with required posture Draft and the live required-control
# posture remains #2284's. Freshness law: every pair-moving event
# recomputes and a retained green observation whose source-pair
# binding no longer equals the live pair is a stale green. CI
# aggregate state, approval counts, comments, and labels are not
# inputs and are rejected by the bounded schemas. The hidden read-only
# 'cargo-allow review-readiness project' command and the minimal
# pull-request workflow with the exact checked adapter
# (scripts/project-review-readiness.sh, retained dispositions under
# .allow/review-dispositions/) complete the lane. The
# source-exception additions receipt only the syntax-visible
# constructs the new test fixtures and declarative surfaces
# introduce: allow-11210/allow-11211/allow-11212 are glob-ratcheted
# expect baselines for fixture serialization and retained-file reads,
# allow-11213/allow-11214 receipt the declarative workflow and adapter
# files, and allow-11215 receipts this revision-note file itself per
# the per-note receipt law. No existing exception is weakened, no
# expiry is extended, and no scope is broadened: the records below are
# additions. policy/allow.toml keeps its CRLF line-ending contract;
# the net transition is append-only.

