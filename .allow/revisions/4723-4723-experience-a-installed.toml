# The lane executed the public 0.2.0-rc.1 prerelease binary as installed from
# crates.io (isolated throwaway CARGO_HOME, no source build) across all 29
# accepted first-family command cases with the existing collector, then drove
# the retained bundle through the current-source native reader
# (command-migration-evidence). The honest negative verdict (1 valid, 13
# incomplete, 15 invalid, 78 outstanding catalogue cases) is retained verbatim
# in docs/release/evidence/rc1-command-case-observation.v1.json and its
# sibling context/bundle/admission/member records. Each new scanned evidence
# surface is receipted additively as a reviewed_exception non_rust_file entry;
# serials were renumbered past the concurrently landed main tail
# (origin/main already carried allow-11385 from another lane). The note file
# is self-covered by its own added_allow record, matching the
# #3793/#4214/#4716/#2267 precedents. The lane's changie changelog fragment
# is already covered by the repository-wide .changes/*.yaml glob entry
# allow-0312, so no duplicate fragment receipt exists here. No release
# surface was mutated and no release authority is claimed.

