# Revision note for the #3903 PR D direct-floor drift guard.

# This diff lands the drift guard over the retained direct-floor
# proofs: a typed MinimumVersionDriftObservationV1 /
# MinimumVersionDriftEvaluationV1 contract grades each product's
# retained receipt against a live-tree observation (package roots,
# claimed MSRV, manifest-set and lock digests, and the closure-derived
# floor inventory from the shared Rust selection module), so
# dependency, feature, target, MSRV, package-set, or manifest movement
# reruns or stales the affected request instead of silently passing on
# old evidence. Identity movement is `stale`, a missing or
# wrong-product receipt is `unproven`, coverage gaps and non-clean
# dispositions are `incomplete`, only a fully aligned all-Proven
# receipt is `current`, and only release-set (cargo-allow) drift
# blocks — advisory products report the same verdicts without blocking
# (negative control 10). The hidden `min-version-drift
# evaluate|check` CLI exposes the guard with that exit contract, and
# the live grading test pins every retained receipt to the current
# tree. The source-exception additions receipt only the
# syntax-visible constructs the new surfaces introduce: allow-11254 is
# the expect ratchet for the selection module's own tests (including
# the synthetic fixture workspace that pins the optional-dependency
# default-feature rule and the line-ending-independent digest),
# allow-11255 the drift command tests' expect ratchet, allow-11256 the
# drift law and live grading tests' expect ratchet, allow-11257 the
# live grading test's macro_name-scoped panic ratchet, allow-11259
# receipts the shell characterization guard for the proof lane's
# scripts, and the
# allow-11258 record receipts this revision-note file itself per the
# per-note receipt law. No existing exception is weakened, no expiry
# is extended, and no scope is broadened: the records below are
# additions. policy/allow.toml keeps its CRLF line-ending contract;
# the net transition is append-only.

