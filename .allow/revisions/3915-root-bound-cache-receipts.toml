# Revision note for #3915 PR B (#3939): receipts for the root-bound scan-cache unsafe surface.

# The root-bound scan-cache module introduces the only unsafe code in the
# persistent cache path: a Unix openat/mkdirat component walk that creates and
# binds cache path components without symlink traversal, plus the safety
# analysis document that receipts it. Each record below is a new receipt for
# source this PR itself adds; no existing entry is widened, no expiry is
# extended, and no baseline_debt is created. Owners, classifications, and
# evidence were applied through the documented why --plan / add --from-plan
# route; the evidence arrays cite the safety analysis, #3915, and the
# exercising tests by name. IDs are bound to the merged main ledger tail
# (after #4014 took allow-0632 for its own revision-note receipt).

