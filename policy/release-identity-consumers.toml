  "expected_archive_name=\"cargo-allow-v${version}-x86_64-unknown-linux-gnu.tar.gz\"",
]
claim_boundary = "The caller-supplied exact release identity is required (--version) and the canonical archive name is constructed from it and compared for exact equality; the former filename-derived version strips are deleted (#3787). No channel or prerelease semantics are decided here."

