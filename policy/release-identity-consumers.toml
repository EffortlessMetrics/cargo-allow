# Checked denominator of release-identity consumers (#3752).
#
# One Rust authority owns release-version channel semantics:
# crates/allow-report/src/artifacts/release_identity_v1.rs projected by the
# hidden `cargo-allow release-identity` command. Every non-Rust surface below
# was surveyed for release-version parsing, channel inference, tag stripping,
# prerelease posture, and workspace-version reading. The guard test
# (crates/cargo-allow/src/release_identity_denominator_tests.rs) fails when:
#   - a scanned surface gains release-semantic constructs matching a marker
#     class without a row (the six classes are a tripwire for the established
#     parsing shapes, not a parser detector; the manual survey behind the rows
#     is the completeness evidence),
#   - a declared row no longer matches the detected constructs or anchors,
#   - an exact count drifts, or
#   - any scanned surface infers a channel from an `-rc` marker.
# The scan covers .sh/.py/.yml/.yaml files under the declared scan_roots;
# new surface directories or extensions must be added to scan_roots to come
# under the guard.
# Dispositions use the #3752 vocabulary: typed-producer, typed-consumer,
# exact-value-pass-through, historical-fixture-only, non-semantic-formatting,
# superseded-parser-to-delete, deferred-with-named-owner.
schema = "cargo-allow.release-identity-consumers.v1"
schema_version = 1
controlling_issue = 3752
guard = "crates/cargo-allow/src/release_identity_denominator_tests.rs"
scan_roots = ["scripts", ".github/workflows", "action.yml", ".changie.yaml"]

[[consumers]]
id = "linux-gnu-candidate-abi-version"
path = "scripts/linux-gnu-candidate.py"
role = "numeric GNU libc ABI requirement comparison for the unpublished installed candidate"
disposition = "exact-value-pass-through"
owner = "#3151"
marker_classes = ["version-regex"]
exact_counts = [{ class = "version-regex", count = 1 }]
sites = ["def version(value: str)", "unsupported GLIBC version label"]
claim_boundary = "The numeric parser orders GLIBC ABI version needs against the declared host baseline. Product versions are passed unchanged from the bound package-candidate artifact and compared for exact equality with installed stdout; this surface decides no release channel, tag or prerelease posture."

[[consumers]]
id = "release-workflow-tag-channel"
path = ".github/workflows/release.yml"
role = "tag-triggered release orchestrator"
disposition = "typed-consumer"
marker_classes = ["prerelease-posture"]
exact_counts = [
  { class = "prerelease-posture", count = 6 },
]
sites = [
  "bash scripts/release-version-preflight.sh \"${version}\"",
  "print(json.load(open(sys.argv[1]))[\"version\"])' target/cargo-allow/release-identity.json",
  "prerelease: ${{ needs.publish.outputs.github_prerelease == 'true' }}",
]
claim_boundary = "Every release-version value in this workflow is consumed from the typed projection: the preflight job resolves the selected identity through scripts/release-version-preflight.sh (the observed tag is passed to `cargo-allow release-identity` on tag pushes, the explicit recovery version on the recovery path, the workspace version otherwise) and reads the canonical version and github_prerelease back from the validated target/cargo-allow/release-identity.json projection; publish relays github_prerelease so both GitHub release steps render `prerelease: ${{ needs.publish.outputs.github_prerelease == 'true' }}`; an -rc tag can no longer ship as a stable release. The former tag-text strip (`${GITHUB_REF_NAME#v}`) and the duplicated awk reader of the workspace version were deleted with the #3786 cutover; the residual `GITHUB_REF_NAME` uses are observed-ref pass-through (the tag value itself and the `v*` event-routing glob), not version parsing. Downstream jobs consume preflight outputs; no job reconstructs identity from tag or manifest text."

[[consumers]]
id = "release-version-preflight"
path = "scripts/release-version-preflight.sh"
role = "release version/artifact preflight"
disposition = "typed-consumer"
marker_classes = ["workspace-reader", "prerelease-posture"]
exact_counts = [
  { class = "workspace-reader", count = 3 },
  { class = "prerelease-posture", count = 6 },
]
sites = [
  "release-identity --version",
  "release_identity_projection.py",
  "projected_version=\"${value}\"",
]
claim_boundary = "Version grammar, channel, and tag decisions are delegated to `cargo-allow release-identity`, whose canonical JSON projection the script consumes once through the shared bounded reader (scripts/release_identity_projection.py): the raw caller input is only bound to the projected canonical version with --expect, the observed tag ref is only bound to the projected canonical tag, and every downstream comparison, changelog heading, and release-record path derives from the projected identity. The #3786 residual tag strip (reconstructing a version from GITHUB_REF_NAME) is deleted; the workspace-version reader remains only as the source-controlled equality input, not channel inference. No fallback identity exists."

[[consumers]]
id = "release-identity-projection-reader"
path = "scripts/release_identity_projection.py"
role = "shared bounded reader for the typed release-identity projection"
disposition = "typed-consumer"
marker_classes = ["prerelease-posture"]
exact_counts = [{ class = "prerelease-posture", count = 3 }]
sites = [
  "SCHEMA_ID = \"cargo-allow.release-identity.v1\"",
  "def load_projection",
]
claim_boundary = "Extracts exact fields from one `cargo-allow release-identity` JSON projection and binds caller-supplied expected values for exact equality. It validates the projection envelope (schema generation and validated result), checks JSON field types, and prints the requested fields as KEY=VALUE lines. It owns no release grammar, channel inference, tag reconstruction, or path selection; unreadable, malformed, foreign-schema, non-validated, incomplete, or mistyped projections fail closed with no default or fallback."

[[consumers]]
