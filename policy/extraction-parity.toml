[[stage_receipt]]
stage = "ArchitectureInventory"
required_fields = [
  "stage",
  "move_ledger_generation",
  "architecture_manifest_digest",
  "result_class",
  "claim_boundary",
]

[[stage_receipt]]
stage = "RepoSnapshot"
