# Per-operation removal-window policy for legacy spec-system surfaces (#3368 / #2601 step 10).
#
# Every legacy spec-system compatibility operation receives a removal-window
# record: introduced release, earliest deprecation, latest supported
# release/generation, migration docs, removal issue/condition, and rollback
# route. Aliases are removed INDEPENDENTLY where their value differs; the
# command tree is not retained until the last historical reader is gone.
#
# Each operation_id mirrors the command/surface string in
# policy/legacy-spec-system-inventory.toml so coverage is machine-checkable.

schema_id = "cargo-allow.removal-window-policy.v1"
schema_version = 1
controlling_issue = 2601
generated_by = "#3368"

# Disposition vocabulary (mirrors legacy-spec-system-inventory.toml):
#   DelegateToIntentOperation — delegates to cargo-intent when available
#   RenderMigrationOnly — renders migration guidance, never executes
#   HistoricalReadOnly — readable for migration audit, never current authority
#   UnsupportedAndRemoved — removed, no compatibility path
#   AliasUntilGeneration — retained as alias until V2 cutover

# ---------------------------------------------------------------------------
# DelegateToIntentOperation (9 surfaces)
# ---------------------------------------------------------------------------
# These share the staged-precommit delegation family. Introduced at 0.2.0
# alongside the one-way delegation contract. Earliest deprecation is 0.3.0
# (posture weakening + migration parity). Latest supported release 1.0.0 /
# generation 2 — the embedded evaluator is deleted at #2970. Each may be
# retired independently once its parity case is receipted; rollback is always
# disable the delegation flag, not dual authority.

[[operation]]
operation_id = "check --profile spec-system"
disposition = "DelegateToIntentOperation"
introduced_release = "0.2.0"
earliest_deprecation_release = "0.3.0"
latest_supported_release = "1.0.0"
latest_supported_generation = 2
migration_docs = "docs/migration/spec-system-to-cargo-intent.md"
removal_issue = "#2970"
removal_condition = "issue:#2970 delete embedded spec-system evaluator; cargo-intent check parity receipt"
rollback_route = "disable delegate_spec_system in .allow/compatibility/intent-delegation.toml"
independent_removal = true

