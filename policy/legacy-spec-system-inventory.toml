# Legacy spec-system command/input/output inventory and disposition map (#3370 / #2601 step 1).
#
# Every legacy spec-system surface is listed with an explicit disposition.
# No alias remains merely because it is easy to preserve.

schema_id = "cargo-allow.legacy-spec-system-inventory.v1"
schema_version = 1
controlling_issue = 2601
generated_by = "#3370"

# Each entry maps a legacy command surface to its disposition.
# Dispositions:
#   DelegateToIntentOperation — will delegate to cargo-intent when available
#   RenderMigrationOnly — renders migration guidance, does not execute
#   HistoricalReadOnly — readable for migration audit, not for production
#   UnsupportedAndRemoved — removed, no compatibility path
#   AliasUntilGeneration — retained as alias until V2 cutover

[[surface]]
command = "check --profile spec-system"
input = "spec-system profile config + source-tree scan"
output = "spec-system check report (human/JSON/markdown)"
disposition = "DelegateToIntentOperation"
move_ledger_entry = "move-cargo-allow-spec-system-app"
rationale = "Core scan check delegates to intent-engine spec-system evaluation when installed"

[[surface]]
command = "audit --profile spec-system"
input = "spec-system profile config + source-tree inventory"
output = "spec-system audit report (human/JSON)"
disposition = "DelegateToIntentOperation"
move_ledger_entry = "move-cargo-allow-spec-system-app"
rationale = "Audit delegates to intent-engine for compiled-graph-aware evaluation"

[[surface]]
command = "doctor --profile spec-system"
input = "spec-system profile config + workspace state"
output = "spec-system doctor report + support bundle"
disposition = "DelegateToIntentOperation"
move_ledger_entry = "move-cargo-allow-spec-system-app"
rationale = "Doctor delegates configuration and evidence health checks to intent-engine"

[[surface]]
command = "explain --profile spec-system"
input = "spec-system finding or allow ID"
output = "spec-system explain report (human/JSON)"
disposition = "DelegateToIntentOperation"
move_ledger_entry = "move-cargo-allow-spec-system-app"
rationale = "Explain delegates to intent-engine for graph-contextualized diagnostics"

[[surface]]
command = "worklist --profile spec-system"
