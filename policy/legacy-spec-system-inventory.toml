output = "spec-system worklist (human/JSON)"
disposition = "DelegateToIntentOperation"
move_ledger_entry = "move-cargo-allow-spec-system-app"
rationale = "Worklist delegates to intent-engine for obligation-aware work item generation"

[[surface]]
command = "init --profile spec-system"
input = "spec-system profile config paths"
output = "spec-system bootstrap (.allow/ directory structure)"
disposition = "AliasUntilGeneration"
move_ledger_entry = "move-cargo-allow-spec-system-app"
rationale = "Init retained until V2 cutover to bootstrap owned config layout"

[[surface]]
command = "list --profile spec-system"
input = "spec-system profile config"
output = "spec-system allow entry listing"
disposition = "DelegateToIntentOperation"
move_ledger_entry = "move-cargo-allow-spec-system-app"
rationale = "List delegates to intent-engine for compiled-graph-aware entry display"

[[surface]]
command = "why --profile spec-system"
input = "spec-system finding path/line"
output = "spec-system diagnostic explanation"
disposition = "DelegateToIntentOperation"
move_ledger_entry = "move-cargo-allow-spec-system-app"
rationale = "Why delegates to intent-engine for requirement-bound explanation"

[[surface]]
command = "precommit --profile spec-system --phase staged"
input = "staged source diff + spec-system profile"
output = "staged precommit gate result + delegated intent receipt"
disposition = "DelegateToIntentOperation"
move_ledger_entry = "MOVE-SPEC-PRECOMMIT-DELEGATION"
rationale = "Staged precommit delegates to cargo-intent change-status operation"

[[surface]]
command = "tool (spec-system subcommand)"
input = "spec-system tool registry and profile config"
output = "tool compatibility report"
disposition = "RenderMigrationOnly"
move_ledger_entry = "move-spec-system-profile-command"
rationale = "Tool command renders migration guidance only; tool selection delegates to intent-engine"

[[surface]]
surface = "policy/spec-system.toml (legacy config)"
