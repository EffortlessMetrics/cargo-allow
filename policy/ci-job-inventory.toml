# Checked proof-class inventory for cargo-allow CI jobs (#3835).
# Every current Actions job classifies as one purpose bound to one
# routing owner and one blocking posture, taken from the routing
# sources (the workflow files), never inferred from the job name at
# collection time. This file is measurement metadata only; it is not a
# second impact classifier beside #2569 and does not change routing.

