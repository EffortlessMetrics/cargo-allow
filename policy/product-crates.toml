schema_version = "1.0"
manifest_id = "CARGO-ALLOW-ARCH-0001"
controlling_issue = 2580
linked_move_ledger = "CARGO-ALLOW-MOVE-LEDGER-0001"

# ProductCrateArchitectureV1 — full family inventory with denominator cross-checks (#2580 PR3).

[[product]]
id = "cargo-allow"
binary = "cargo-allow"
owned_crates = [
  "allow-core",
  "allow-policy",
  "allow-inventory",
  "allow-files",
  "allow-rust",
  "allow-match",
  "allow-report",
  "allow-diff",
  "allow-policy-legacy",
  "cargo-allow",
]
forbid_product_dependencies = ["cargo-intent", "cargo-proof"]

[[product]]
id = "cargo-intent"
binary = "cargo-intent"
owned_crates = [
  "intent-model",
  "intent-protocol",
  "intent-engine",
  "intent-edit",
  "cargo-intent",
]
forbid_product_dependencies = ["cargo-proof"]

[[product]]
id = "cargo-proof"
binary = "cargo-proof"
owned_crates = [
  "proof-protocol",
  "proof-engine",
  "cargo-proof",
]
# cargo-proof may link only shared protocols/adapters, never cargo-allow
# application internals (#3356). This is the reverse-edge rule: cargo-proof
# must not reach back into the cargo-allow product family.
forbid_product_dependencies = [
  "cargo-allow",
  "allow-core",
  "allow-policy",
  "allow-inventory",
  "allow-files",
  "allow-rust",
  "allow-match",
  "allow-report",
  "allow-diff",
  "allow-policy-legacy",
]

[[shared_crate]]
name = "effortless-repo-protocol"
role = "SharedProtocol"
allowed_domain_dependencies = []

[[shared_crate]]
name = "effortless-repo-snapshot"
role = "SharedSnapshot"
allowed_domain_dependencies = ["effortless-repo-protocol"]

[[shared_crate]]
name = "effortless-repo-edit"
role = "SharedSnapshot"
allowed_domain_dependencies = ["effortless-repo-protocol", "effortless-repo-snapshot"]

[[shared_crate]]
name = "effortless-rust-source-index"
role = "SharedProtocol"
allowed_domain_dependencies = ["effortless-repo-protocol"]

[[forbidden_crate_dependency]]
from = "proof-engine"
to = "intent-engine"
repair_hint = "intent-protocol"

# Converged obligation-input dependency path (#2936 / #3317): intent-protocol
# is the sole obligation input authority for proof-engine. The proof-owned
# duplicate obligation model (ChangeObligationPlanV1) was deleted in #3314
# and must not be reintroduced.
[[required_crate_dependency]]
from = "proof-engine"
from_package = "proof-orchestrator"
to = "intent-protocol"
rationale_issue = 2936

# Shared substrate manifests currently have no allow-core dependency or
# allow-core-interop feature. Product adapters own conversion into cargo-allow
# error and finding types. The source-index package test and the workspace
# dependency-boundary matrix fail if a shared crate regains a default product
# dependency (#3356 / #3147).
