schema_version = "1.0"
manifest_id = "CARGO-ALLOW-ARCH-0001"
controlling_issue = 2580
linked_move_ledger = "CARGO-ALLOW-MOVE-LEDGER-0001"

# ProductCrateArchitectureV1 — full family inventory with denominator cross-checks (#2580 PR3).

[[product]]
id = "cargo-allow"
binary = "cargo-allow"
owned_crates = [
  "allow-core",
  "allow-policy",
  "allow-inventory",
  "allow-files",
  "allow-rust",
  "allow-match",
  "allow-report",
  "allow-diff",
  "allow-policy-legacy",
  "cargo-allow",
]
forbid_product_dependencies = ["cargo-intent", "cargo-proof"]

[[product]]
id = "cargo-intent"
binary = "cargo-intent"
owned_crates = [
  "intent-model",
  "intent-protocol",
  "intent-engine",
  "intent-edit",
  "cargo-intent",
]
forbid_product_dependencies = ["cargo-proof"]

[[product]]
id = "cargo-proof"
binary = "cargo-proof"
owned_crates = [
  "proof-protocol",
  "proof-engine",
  "cargo-proof",
]
# cargo-proof may link only shared protocols/adapters, never cargo-allow
# application internals (#3356). This is the reverse-edge rule: cargo-proof
# must not reach back into the cargo-allow product family.
forbid_product_dependencies = [
  "cargo-allow",
  "allow-core",
  "allow-policy",
  "allow-inventory",
  "allow-files",
  "allow-rust",
  "allow-match",
  "allow-report",
  "allow-diff",
  "allow-policy-legacy",
]

[[shared_crate]]
name = "effortless-repo-protocol"
role = "SharedProtocol"
allowed_domain_dependencies = []

[[shared_crate]]
name = "effortless-repo-snapshot"
role = "SharedSnapshot"
allowed_domain_dependencies = ["effortless-repo-protocol"]

[[shared_crate]]
name = "effortless-repo-edit"
role = "SharedSnapshot"
allowed_domain_dependencies = ["effortless-repo-protocol", "effortless-repo-snapshot"]

[[shared_crate]]
name = "effortless-rust-source-index"
role = "SharedProtocol"
allowed_domain_dependencies = ["effortless-repo-protocol"]

[[forbidden_crate_dependency]]
from = "proof-engine"
to = "intent-engine"
repair_hint = "intent-protocol"

# Note: shared substrate crates (effortless-repo-edit, effortless-rust-source-index)
# declare an opt-in `allow-core-interop` feature that pulls allow-core as an
# OPTIONAL dependency. The V1 dependency-graph loader records all [dependencies]
# keys regardless of `optional = true`, so this intended optional edge cannot be
# expressed as a [[forbidden_crate_dependency]] here without a false positive.
# The rule "shared protocols must not DEFAULT-depend on a product ontology" is
# enforced by product_crate_architecture_tests.rs::shared_protocols_do_not_default_depend_on_allow_core,
# which parses the optional flag directly (#3356).
