[package]
name = "effortless-repo-edit"
description = "Repository-safe target identity, containment, and mutation locking for three-product extraction."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
sha2.workspace = true
allow-core = { workspace = true, optional = true }

[features]
default = []
# Enable allow-core error conversion for product consumers (#2969).
allow-core-interop = ["dep:allow-core"]
