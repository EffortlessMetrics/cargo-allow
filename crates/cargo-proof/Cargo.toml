[package]
name = "cargo-proof"
description = "Exact-snapshot evidence orchestration shell for Rust repositories."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "cargo_proof"
path = "src/lib.rs"

[[bin]]
name = "cargo-proof"
path = "src/main.rs"

[dependencies]
clap.workspace = true
proof-orchestrator.workspace = true
proof-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
effortless-repo-protocol.workspace = true
effortless-rust-source-index.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
provider-cargo-allow = []
provider-hawk = []
provider-ripr = []
all-providers = ["provider-cargo-allow", "provider-hawk", "provider-ripr"]
