[package]
name = "allow-files"
description = "Non-Rust and generated-file scanners for cargo-allow source-tree policy."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
allow-core.workspace = true
yaml-rust2 = { version = "0.12", optional = true }

[features]
# Embeddable Changie source sensor (#3587/#3588). Feature-disabled
# consumers keep the current dependency and behavior surface.
changie = ["dep:yaml-rust2"]
