[package]
name = "cargo-intent"
description = "Durable authored intent and obligation compiler for Rust repositories."
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "cargo-intent"
path = "src/main.rs"

[dependencies]
clap.workspace = true
intent-compiler.workspace = true
intent-protocol.workspace = true
effortless-repo-protocol.workspace = true
effortless-repo-snapshot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
