[package]
name = "cargo-allow"
description = "Source-tree exception ledger and policy scanner for Rust repositories."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]

[package.metadata.cargo-allow.reference]
# Package-facing projection of docs/support-matrix.toml. The reference tests
# require these values to stay exactly synchronized with the repository source.
schema = "cargo-allow.support-matrix.v1"
published_version = "0.1.11"
candidate_version = "0.2.0"

[[package.metadata.cargo-allow.reference.channel]]
name = "crates.io"
available = true
command = "cargo install cargo-allow --version 0.1.11 --locked"
evidence = "release.yml publishes with the GitHub Actions CARGO_REGISTRY_TOKEN secret; scripts/release-install-smoke.sh verifies the published crate installs"

[[package.metadata.cargo-allow.reference.channel]]
name = "prebuilt-binary-archive"
available = false
evidence = "release.yml attaches the topology-derived ReleaseManifestV2, its attestation, and the Linux binary archive/checksum artifacts"

[[package.metadata.cargo-allow.reference.channel]]
name = "cargo-binstall"
available = false
evidence = "no binstall metadata exists in Cargo.toml"

[dependencies]
allow-core.workspace = true
allow-policy.workspace = true
allow-inventory.workspace = true
# The Changie sensor projection (#3623) makes the sensor facade a
# first-party cargo-allow surface: the feature is enabled unconditionally
# so `changie lint` always exists. yaml-rust2 is pure Rust.
allow-files = { workspace = true, features = ["changie"] }
allow-rust.workspace = true
allow-match.workspace = true
allow-report.workspace = true
allow-diff.workspace = true
allow-policy-legacy.workspace = true
effortless-repo-protocol.workspace = true
effortless-repo-edit.workspace = true
effortless-repo-snapshot.workspace = true
clap.workspace = true
clap_complete.workspace = true
terminal_size.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jsonschema = { version = "0.49.2", default-features = false }
effortless-rust-source-index = { path = "../effortless-rust-source-index" }
intent-model = { path = "../intent-model" }
intent-protocol = { path = "../intent-protocol" }
intent-compiler = { path = "../intent-engine" }
regex = "1.13"
