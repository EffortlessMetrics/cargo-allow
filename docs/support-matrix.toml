# Machine-readable support matrix for cargo-allow (#2478).
#
# Every row states a claim AND the evidence that proves it. A claim with no
# executed evidence is recorded as `not_proven` rather than omitted, so the
# absence of a platform is visible instead of implied.
#
# Consumed by crates/cargo-allow/tests/support_matrix.rs, which fails closed
# when a row drifts from the repository it describes (MSRV, schema ids, and
# the CI runners behind each platform claim).
#
# SCOPE (deliberate): this file records what the repository currently proves.
# It does NOT state a support *policy* — how long a release receives fixes,
# which platforms are committed versus best-effort, or backport rules. Those
# are maintainer decisions and are marked `undecided` below rather than
# invented here.

schema_id = "cargo-allow.support-matrix.v1"
schema_version = 1

[tool]
name = "cargo-allow"
# Latest version published to crates.io. Must match the published command
# registry snapshot used by the first-hour docs contract.
published_version = "0.1.11"
published_evidence = "docs/dogfood/fixtures/getting-started/published-command-registry.toml"
# Workspace version on main. Deliberately unpublished pending the 0.2.0
# blocker set; see docs/release/0.2.0.md and issue #2501.
candidate_version = "0.2.0"
candidate_published = false
candidate_evidence = "docs/release/0.2.0.md"

# The installed capability command is a source-tree claim catalog, not an
# artifact schema or a release qualification result. Keep its support contract
# visible here so release/docs projections cannot omit or rename it silently.
[capabilities]
schema = "cargo-allow.sensor-capabilities.v1"
generation = 1
command = "cargo-allow capabilities --format json"
support = "source-candidate"
evidence = "crates/cargo-allow/src/capabilities.rs tests and docs/getting-started.md"
claim_boundary = "Source-tree observations only; no compilation, type, macro, MIR, runtime, or test-adequacy claim."

[rust]
# Source of truth is `rust-version` under [workspace.package] in Cargo.toml.
# scripts/check-msrv-consistency.sh proves the CI pin, the cache key, the
# attested release-manifest MSRV, and the msrv job's RUSTUP_TOOLCHAIN all still
# agree with it. scripts/check-msrv-resolved.sh separately proves the compiler
# the job resolved is that MSRV, because rust-toolchain.toml outranks the
# `rustup default` the workflow toolchain tag applies.
msrv = "1.95"
# Scoped to the cargo-allow release set rather than the whole workspace
# (#3358): cargo-intent and cargo-proof claim no toolchain yet and are proven
# on stable only, so the MSRV claim does not cover them.
msrv_evidence = "ci.yml job `msrv` pins dtolnay/rust-toolchain@1.95.0, sets RUSTUP_TOOLCHAIN=1.95.0 so rust-toolchain.toml cannot override it, verifies the resolved compiler with scripts/check-msrv-resolved.sh, and runs `cargo check --locked --all-targets` over the thirteen-package cargo-allow release set plus `cargo test -p cargo-allow --bins --locked`"
msrv_scope = "cargo-allow-release-set"
stable_evidence = "ci.yml job `test` runs the full suite on dtolnay/rust-toolchain@stable"

# Platform rows. `tier` is descriptive of executed evidence, not a promise:
#   ci_proven   the full workspace test suite runs on this runner every PR
#   ci_proven_bounded  the release-set suite runs, with a named fixture exclusion
#   install_proven  a published release was installed and smoke-tested here
#   not_proven  no CI job executes here; absence is stated, not implied

[[platform]]
runner = "ubuntu-latest"
target = "x86_64-unknown-linux-gnu"
tier = "ci_proven"
evidence = "ci.yml jobs `test`, `msrv`, `package-smoke`, `shallow-diff-smoke` run on ubuntu-latest"
install_evidence = "release.yml `install-smoke` matrix includes ubuntu-latest against the published crate on tag push"

[[platform]]
runner = "windows-latest"
target = "x86_64-pc-windows-msvc"
tier = "ci_proven"
evidence = "ci.yml job `test-core-platforms` runs the release set on windows-latest"
install_evidence = "release.yml `install-smoke` matrix includes windows-latest against the published crate on tag push"

[[platform]]
runner = "macos-14"
target = "aarch64-apple-darwin"
tier = "ci_proven_bounded"
evidence = "ci.yml job `test-core-platforms` runs the release set and semantic fixture on macos-14"
note = "allow-rust persistent scan-cache fixture is excluded because the hosted runner exposes /var as /private/var."

[[platform]]
runner = "macos-15-intel"
target = "x86_64-apple-darwin"
tier = "ci_proven_bounded"
evidence = "ci.yml job `test-core-platforms` runs the release set and semantic fixture on macos-15-intel"
note = "allow-rust persistent scan-cache fixture is excluded because the hosted runner exposes /var as /private/var."

# Distribution channels actually available today.

[[channel]]
name = "crates.io"
available = true
command = "cargo install cargo-allow --version 0.1.11 --locked"
evidence = "release.yml publishes with the GitHub Actions CARGO_REGISTRY_TOKEN secret; scripts/release-install-smoke.sh verifies the published crate installs"

[[channel]]
name = "prebuilt-binary-archive"
available = false
evidence = "release.yml attaches the topology-derived ReleaseManifestV2, its attestation, and the Linux binary archive/checksum artifacts"
note = "The channel remains unavailable until the installed archive experience is separately qualified; tracked by #2464 (Linux) and #2474 (Windows)."

[[channel]]
name = "cargo-binstall"
available = false
evidence = "no binstall metadata exists in Cargo.toml"
note = "Tracked by #2481; depends on the archives above."

# Stable artifact schemas. Every id below is asserted against
# allow_report::ARTIFACT_CONTRACTS by the drift test, so this list cannot
# silently fall behind the code that emits them.

[schemas]
generation = 1
ids = [
  "cargo-allow.add.v1",
  "cargo-allow.add-finding-plan.v1",
  "cargo-allow.add-plan-application.v1",
  "cargo-allow.core-adoption-plan.v1",
  "cargo-allow.doctor.v1",
  "cargo-allow.explain.v1",
  "cargo-allow.list.v1",
  "cargo-allow.migrate.v1",
  "cargo-allow.propose.v1",
  "cargo-allow.prune.v1",
  "cargo-allow.receipt.v1",
  "cargo-allow.refresh.v1",
  "cargo-allow.report.v1",
  "cargo-allow.spec-system.v1",
  "cargo-allow.why.v1",
  "cargo-allow.worklist.v1",
]

# Security reporting is documented; the response commitments around it are not
# yet decided.

[security]
policy_document = "SECURITY.md"
policy_document_exists = true

# ---------------------------------------------------------------------------
# UNDECIDED — maintainer input required (#2478)
#
# These are support *policy* claims. They are recorded as undecided rather
# than given plausible-looking defaults, because publishing a support promise
# the project has not agreed to is worse than publishing none.
# ---------------------------------------------------------------------------

[undecided]
supported_release_window = "TODO: how many published releases receive fixes?"
security_response_target = "TODO: acknowledgement/patch timeframe for a reported vulnerability"
backport_policy = "TODO: are fixes backported to the previous minor, or fix-forward only?"
platform_commitment = "TODO: which ci_proven platforms are *committed* support versus best-effort?"
msrv_bump_policy = "TODO: does raising the MSRV require a minor bump, and with what notice?"

# ---------------------------------------------------------------------------
# FINAL SELECTION (#3737) — the 0.2.0 release proof denominator.
#
# This section records which claims the prospective 0.2.0 final release
# makes and explicitly declines. It is keyed to the typed release identity:
# a version, tag, channel, or prerelease change stales the selection. The
# two digests are recomputed from the typed model in
# crates/allow-report/src/artifacts/final_support_selection_v1.rs — the one
# implementation. Consumers (#2501, #3761, #3726, #3151, #2267) validate
# these digests; they never restate the selected lists.
#
# This is the release *proof* denominator. Support *policy* tenure (how long
# a release receives fixes, committed versus best-effort platforms,
# backport rules) stays in [undecided] above and with #3777.
# ---------------------------------------------------------------------------

[final_selection]
schema_id = "cargo-allow.final-support-selection.v1"
schema_version = 1
controlling_issue = 3737
release_version = "0.2.0"
release_tag = "v0.2.0"
channel = "stable"
github_prerelease = false
identity_digest = "sha256:v1:bcdc6652a4f090df10bb8d5e251054b0c3767a05ec5172272a812627d8d28d02"
selection_digest = "sha256:v1:e175c5da7aab215d335b42e054dfe46f98478a1511307e8ccde90f0502d94cd5"
claim_boundary = "The machine-readable final-selection freeze for the 0.2.0 release proof denominator. It records which support, platform, channel, asset, sibling-product, pilot, and upgrade claims the final release makes and explicitly declines, bound to one typed release identity by recomputed digests. It is not a support policy, a channel-truth projection, installed-experience proof, or a publication authorization; unselected and not-proven rows narrow the release claims and never inherit success."

[[final_selection.rows]]
dimension = "rust"
subject = "1.95"
disposition = "selected"
proof_owner = "ci.yml job `msrv`"
required_evidence = "release-set `cargo check --locked --all-targets` plus `cargo test -p cargo-allow --bins --locked` pinned to Rust 1.95.0 with the resolved compiler verified"
evidence_reference = ".github/workflows/ci.yml"
claim_effect = "the final release claims Rust 1.95 compatibility for the cargo-allow release set only; sibling products claim no toolchain"
staleness_inputs = ["workspace rust-version", "msrv cache key", "attested release-manifest MSRV"]

[[final_selection.rows]]
dimension = "platform"
subject = "x86_64-unknown-linux-gnu"
disposition = "selected"
proof_owner = "ci.yml jobs `test`, `msrv`, and `test-core-platforms`"
required_evidence = "full workspace suite on ubuntu-latest for every PR, plus the selected-candidate install/journey rows for the frozen candidate"
evidence_reference = ".github/workflows/ci.yml"
claim_effect = "the final release claims Linux x86_64 GNU support at the proven tier"
staleness_inputs = ["runner inventory in ci.yml", "selected-candidate platform receipts"]

[[final_selection.rows]]
dimension = "platform"
subject = "x86_64-pc-windows-msvc"
disposition = "selected"
proof_owner = "ci.yml job `test-core-platforms`"
required_evidence = "release-set suite on windows-latest, plus the selected-candidate install/journey rows for the frozen candidate"
evidence_reference = ".github/workflows/ci.yml"
claim_effect = "the final release claims Windows x86_64 MSVC support at the proven tier"
staleness_inputs = ["runner inventory in ci.yml", "selected-candidate platform receipts"]

[[final_selection.rows]]
dimension = "platform"
subject = "aarch64-apple-darwin"
disposition = "not_included"
proof_owner = "ci.yml job `test-core-platforms` (bounded evidence only)"
required_evidence = "bounded release-set suite on macos-14; bounded CI provenness is support evidence, never a selected final claim"
evidence_reference = ".github/workflows/ci.yml"
claim_effect = "the final release makes no macOS ARM support claim; the platform remains outside the selected denominator"
staleness_inputs = ["runner inventory in ci.yml"]

[[final_selection.rows]]
dimension = "platform"
subject = "x86_64-apple-darwin"
disposition = "not_included"
proof_owner = "ci.yml job `test-core-platforms` (bounded evidence only)"
required_evidence = "bounded release-set suite on macos-15-intel; bounded CI provenness is support evidence, never a selected final claim"
evidence_reference = ".github/workflows/ci.yml"
claim_effect = "the final release makes no macOS Intel support claim; the platform remains outside the selected denominator"
staleness_inputs = ["runner inventory in ci.yml"]

[[final_selection.rows]]
dimension = "channel"
subject = "crates.io-exact-version-install"
disposition = "selected"
proof_owner = "release.yml `install-smoke` at tag push; registry observation before execution"
required_evidence = "post-publication exact-version install smoke on the selected platforms, plus a current registry version/ownership observation (#3774) at execution"
evidence_reference = ".github/workflows/release.yml"
claim_effect = "the exact-version install command becomes a valid claim only after publication and observation succeed; it is never claimed for an unpublished candidate"
staleness_inputs = ["registry version/owner observation", "published checksum equality"]

[[final_selection.rows]]
dimension = "channel"
subject = "ordinary-latest-install"
disposition = "selected"
proof_owner = "registry version observation before execution"
required_evidence = "the registry latest version observation agrees with the published final release at execution time"
evidence_reference = "scripts/verify-crate-registry-version.sh"
claim_effect = "the plain install command resolves to the final release only while the registry observation agrees; an observation mismatch blocks the claim"
staleness_inputs = ["registry version/owner observation", "new upstream publication"]

[[final_selection.rows]]
dimension = "channel"
subject = "prebuilt-binary-archive"
disposition = "not_included"
proof_owner = "#2464 (Linux archive) and #2474 (Windows archive)"
required_evidence = "an installed archive experience qualification; release.yml may attach archive assets without any archive-install claim"
evidence_reference = ".github/workflows/release.yml"
claim_effect = "the final release claims no archive installation channel; attached assets are convenience artifacts only"
staleness_inputs = ["#2464/#2474 qualification receipts"]

[[final_selection.rows]]
dimension = "channel"
subject = "cargo-binstall"
disposition = "not_included"
proof_owner = "#2481"
required_evidence = "binstall metadata plus an installed binstall experience qualification"
evidence_reference = "Cargo.toml"
claim_effect = "the final release claims no cargo-binstall channel; no binstall metadata exists"
staleness_inputs = ["binstall metadata introduction"]

[[final_selection.rows]]
dimension = "sibling-product"
subject = "cargo-intent-and-cargo-proof"
disposition = "not_included"
proof_owner = "policy/product-support-matrix.toml (per-product postures)"
required_evidence = "the per-product support matrix: both siblings are opt-in experimental and outside the cargo-allow final closure"
evidence_reference = "policy/product-support-matrix.toml"
claim_effect = "installing cargo-allow never implies cargo-intent or cargo-proof are installed, supported, or stable"
staleness_inputs = ["product-package topology rows", "per-product posture changes"]

[[final_selection.rows]]
dimension = "pilot"
subject = "clean-repository"
disposition = "not_proven"
proof_owner = "#2466 (blocked on explicit target selection)"
required_evidence = "a completed installed clean-repository adoption pilot receipt; until then the disposition stays not_proven"
evidence_reference = "docs/dogfood"
claim_effect = "the final release makes no clean-repository adoption claim and no low-friction adoption claim; NotProven is recorded, never rendered as proven"
staleness_inputs = ["#2466 pilot receipt landing"]

[[final_selection.rows]]
dimension = "pilot"
subject = "brownfield-repository"
disposition = "not_included"
proof_owner = "#2467 (NotIncludedBeforeFirstFinal posture)"
required_evidence = "an explicit post-first-final brownfield pilot decision; the current posture excludes brownfield pilots from the first-final denominator"
evidence_reference = "docs/dogfood"
claim_effect = "the final release makes no brownfield migration claim; brownfield pilots are excluded before the first final, not failed"
staleness_inputs = ["#2467 posture decision"]

[[final_selection.rows]]
dimension = "upgrade-rollback"
subject = "0.1.11-to-final-to-0.1.11"
disposition = "selected"
proof_owner = "#2485 via the exact upgrade/rollback journey (#3853 successor)"
required_evidence = "an UpgradeRollbackReceiptV1 current for the frozen candidate: exact 0.1.11 binary, exact final candidate binary, representative state, and owned write/restore sets"
evidence_reference = "scripts/exact-upgrade-rollback-journey.sh"
claim_effect = "the final release claims exact 0.1.11 upgrade and rollback only while the upgrade/rollback receipt is current for the frozen candidate; a stale receipt withdraws the claim"
staleness_inputs = ["UpgradeRollbackReceiptV1 currentness", "frozen candidate identity"]
