# Machine-readable support matrix for cargo-allow (#2478).
#
# Every row states a claim AND the evidence that proves it. A claim with no
# executed evidence is recorded as `not_proven` rather than omitted, so the
# absence of a platform is visible instead of implied.
#
# Consumed by crates/cargo-allow/tests/support_matrix.rs, which fails closed
# when a row drifts from the repository it describes (MSRV, schema ids, and
# the CI runners behind each platform claim).
#
# SCOPE (deliberate): this file records what the repository currently proves.
# It does NOT state a support *policy* — how long a release receives fixes,
# which platforms are committed versus best-effort, or backport rules. Those
# are maintainer decisions and are marked `undecided` below rather than
# invented here.

schema_id = "cargo-allow.support-matrix.v1"
schema_version = 1

[tool]
name = "cargo-allow"
# Latest version published to crates.io. Must match the published command
# registry snapshot used by the first-hour docs contract.
published_version = "0.1.11"
published_evidence = "docs/dogfood/fixtures/getting-started/published-command-registry.toml"
# Workspace version on main. Deliberately unpublished pending the 0.2.0
# blocker set; see docs/release/0.2.0.md and issue #2501.
candidate_version = "0.2.0"
candidate_published = false
candidate_evidence = "docs/release/0.2.0.md"

# The installed capability command is a source-tree claim catalog, not an
# artifact schema or a release qualification result. Keep its support contract
# visible here so release/docs projections cannot omit or rename it silently.
[capabilities]
schema = "cargo-allow.sensor-capabilities.v1"
generation = 1
command = "cargo-allow capabilities --format json"
support = "source-candidate"
evidence = "crates/cargo-allow/src/capabilities.rs tests and docs/getting-started.md"
claim_boundary = "Source-tree observations only; no compilation, type, macro, MIR, runtime, or test-adequacy claim."

[rust]
# Source of truth is `rust-version` under [workspace.package] in Cargo.toml.
# scripts/check-msrv-consistency.sh proves the CI pin, the cache key, the
# attested release-manifest MSRV, and the msrv job's RUSTUP_TOOLCHAIN all still
# agree with it. scripts/check-msrv-resolved.sh separately proves the compiler
# the job resolved is that MSRV, because rust-toolchain.toml outranks the
# `rustup default` the workflow toolchain tag applies.
msrv = "1.95"
# Scoped to the cargo-allow release set rather than the whole workspace
# (#3358): cargo-intent and cargo-proof claim no toolchain yet and are proven
# on stable only, so the MSRV claim does not cover them.
msrv_evidence = "ci.yml job `msrv` pins dtolnay/rust-toolchain@1.95.0, sets RUSTUP_TOOLCHAIN=1.95.0 so rust-toolchain.toml cannot override it, verifies the resolved compiler with scripts/check-msrv-resolved.sh, and runs `cargo check --locked --all-targets` over the thirteen-package cargo-allow release set plus `cargo test -p cargo-allow --bins --locked`"
msrv_scope = "cargo-allow-release-set"
stable_evidence = "ci.yml job `test` runs the full suite on dtolnay/rust-toolchain@stable"

# Platform rows. `tier` is descriptive of executed evidence, not a promise:
#   ci_proven   the full workspace test suite runs on this runner every PR
#   ci_proven_bounded  the release-set suite runs, with a named fixture exclusion
#   install_proven  a published release was installed and smoke-tested here
#   not_proven  no CI job executes here; absence is stated, not implied

[[platform]]
runner = "ubuntu-latest"
target = "x86_64-unknown-linux-gnu"
tier = "ci_proven"
evidence = "ci.yml jobs `test`, `msrv`, `package-smoke`, `shallow-diff-smoke` run on ubuntu-latest"
install_evidence = "release.yml `install-smoke` matrix includes ubuntu-latest against the published crate on tag push"

[[platform]]
runner = "windows-latest"
target = "x86_64-pc-windows-msvc"
tier = "ci_proven"
evidence = "ci.yml job `test-core-platforms` runs the release set on windows-latest"
install_evidence = "release.yml `install-smoke` matrix includes windows-latest against the published crate on tag push"

[[platform]]
runner = "macos-14"
target = "aarch64-apple-darwin"
tier = "ci_proven_bounded"
evidence = "ci.yml job `test-core-platforms` runs the release set and semantic fixture on macos-14"
note = "allow-rust persistent scan-cache fixture is excluded because the hosted runner exposes /var as /private/var."

[[platform]]
runner = "macos-15-intel"
target = "x86_64-apple-darwin"
tier = "ci_proven_bounded"
evidence = "ci.yml job `test-core-platforms` runs the release set and semantic fixture on macos-15-intel"
note = "allow-rust persistent scan-cache fixture is excluded because the hosted runner exposes /var as /private/var."

# Distribution channels actually available today.

[[channel]]
name = "crates.io"
available = true
command = "cargo install cargo-allow --version 0.1.11 --locked"
evidence = "release.yml publishes with the GitHub Actions CARGO_REGISTRY_TOKEN secret; scripts/release-install-smoke.sh verifies the published crate installs"

[[channel]]
name = "prebuilt-binary-archive"
available = false
evidence = "release.yml attaches the topology-derived ReleaseManifestV2, its attestation, and the Linux binary archive/checksum artifacts"
note = "The channel remains unavailable until the installed archive experience is separately qualified; tracked by #2464 (Linux) and #2474 (Windows)."

[[channel]]
name = "cargo-binstall"
available = false
evidence = "no binstall metadata exists in Cargo.toml"
note = "Tracked by #2481; depends on the archives above."

# Stable artifact schemas. Every id below is asserted against
# allow_report::ARTIFACT_CONTRACTS by the drift test, so this list cannot
# silently fall behind the code that emits them.

[schemas]
generation = 1
ids = [
  "cargo-allow.add.v1",
  "cargo-allow.add-finding-plan.v1",
  "cargo-allow.add-plan-application.v1",
  "cargo-allow.core-adoption-plan.v1",
  "cargo-allow.doctor.v1",
  "cargo-allow.explain.v1",
  "cargo-allow.list.v1",
  "cargo-allow.migrate.v1",
  "cargo-allow.propose.v1",
  "cargo-allow.prune.v1",
  "cargo-allow.receipt.v1",
  "cargo-allow.refresh.v1",
  "cargo-allow.report.v1",
  "cargo-allow.spec-system.v1",
  "cargo-allow.why.v1",
  "cargo-allow.worklist.v1",
]

# Security reporting is documented; the response commitments around it are not
# yet decided.

[security]
policy_document = "SECURITY.md"
policy_document_exists = true

